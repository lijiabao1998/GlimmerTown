<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>T652 · 英式高街第一波</title><style>
*{box-sizing:border-box}body{margin:0;background:#e9e4d8;color:#263e42;font-family:system-ui,sans-serif}header{padding:30px 5vw 22px;border-bottom:1px solid #b8b4a7;background:#263e42;color:#f4efdf}small{letter-spacing:.2em;color:#c5ba99}h1{margin:10px 0;font-size:30px;font-weight:600}p{line-height:1.7;margin:5px 0;font-size:14px}.notice{color:#dcc79f}nav{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:16px 5vw;background:#f6f1e6}label{font-size:13px}select,button{padding:7px 11px;border:1px solid #b5b4a5;border-radius:3px;background:#fffdf4;color:#263e42}main{display:grid;grid-template-columns:repeat(5,minmax(170px,1fr));gap:16px;padding:22px 4vw}article{background:#f8f4e9;border:1px solid #c9c4b4;padding:10px 9px 15px;overflow:hidden}canvas{display:block;width:100%;image-rendering:pixelated;aspect-ratio:100/112}h2{font-size:16px;margin:4px 2px}article p{font-size:11px;color:#697573;margin:0 2px}.id{color:#8a6f4c;letter-spacing:.14em;font-size:10px}footer{padding:0 5vw 30px;font-size:12px;line-height:1.8;color:#596761}body.far canvas{width:50%;margin:27% auto}body.dark{background:#27353d}body.dark article{background:#344650;border-color:#51616a;color:#eee6d4}body.dark article p{color:#c0cbc7}@media(max-width:800px){main{grid-template-columns:repeat(2,minmax(140px,1fr))}h1{font-size:24px}}
</style><header><small>GLIMMER TOWN · WAVE 01 / 20</small><h1>英式高街 · 十間新店屋</h1><p>獨立 Canvas 結構樣張｜對應商業 k2 · lv1 · 1×1 原足跡</p><p class="notice">未接入遊戲 · 未獲圖審批准 · 不是遊戲實拍。這份樣張不代表20波已完成。</p></header><nav><label>季節 <select id="season"><option value="spring">春</option><option value="summer" selected>夏</option><option value="autumn">秋</option><option value="winter">冬</option></select></label><label><input id="snow" type="checkbox">積雪</label><label><input id="night" type="checkbox">夜景</label><label>視角 <select id="rot"><option value="0">南</option><option value="1">西</option><option value="2">北</option><option value="3">東</option></select></label><label><input id="far" type="checkbox">遠景</label><button id="reset">回到夏日南向</button></nav><main id="sheet"></main><footer>每棟100×112原生畫布，地塊採用64×32等角投影。以量體、屋頂和附屋差異區分款式，並非只換顏色。<br>施工、懸停、倒影、行人、煙和真遊戲招牌層尚未接線驗收；以這張樣張宣稱遊戲驗收通過是不正確的。</footer><script src="designs652.js"></script><script>
'use strict';
const controls=['season','snow','night','rot','far'].map(id=>document.getElementById(id)),sheet=document.getElementById('sheet');
for(const d of Wave652.designs){const card=document.createElement('article');card.innerHTML='<div class="id">'+d.id+'</div><canvas aria-label="'+d.name+'"></canvas><h2>'+d.name+'</h2><p>'+d.label+' · '+d.m.length+' 個量體 · '+d.m.map(m=>m[6]).join(' + ')+'</p>';sheet.append(card);}
function draw(){const[sea,sn,ng,rot,far]=controls;if(sn.checked)sea.value='winter';document.body.classList.toggle('dark',ng.checked);document.body.classList.toggle('far',far.checked);const state={season:sea.value,snow:sn.checked,night:ng.checked,rot:+rot.value};sheet.querySelectorAll('canvas').forEach((c,i)=>Wave652.render(c,Wave652.designs[i],state));window.previewState652=state;}
controls.forEach(c=>c.addEventListener('change',draw));document.getElementById('reset').onclick=()=>{controls[0].value='summer';controls[1].checked=controls[2].checked=controls[4].checked=false;controls[3].value='0';draw();};Wave652.validate();draw();window.previewReady652=true;
</script></html>
