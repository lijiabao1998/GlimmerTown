name: Town T614 single rectangle native retention proof
on:
  push:
    branches: [gpt/town-single-rect-retention-614]
permissions:
  contents: read
concurrency:
  group: town614-retained-${{ github.ref }}
  cancel-in-progress: false
jobs:
  direct-writer:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify unchanged product and direct-writer contracts
        run: |
          set -o pipefail
          mkdir -p evidence
          git rev-parse HEAD > evidence/source-commit.txt
          git fetch --depth=1 origin a26fceaea8c8a42be4322e52f13ea1bbe7dced04
          git diff --exit-code a26fceaea8c8a42be4322e52f13ea1bbe7dced04 -- index.html sw.js renderers/
          node docs/tasks/t604-canvaskit/source-contract.cjs > evidence/source-contract.json
          node tools/vendor/fetch-canvaskit604.mjs
          node docs/tasks/t604-canvaskit/run614.cjs --check-overlay
          node docs/tasks/t604-canvaskit/direct-writer604.test.cjs | tee evidence/direct-contracts.log
          node docs/tasks/t604-canvaskit/native606.test.cjs | tee evidence/native606-contracts.log
          node docs/tasks/t604-canvaskit/native609.test.cjs | tee evidence/native609-contracts.log
          node docs/tasks/t604-canvaskit/native610.test.cjs | tee evidence/native610-contracts.log
          node --test docs/tasks/t604-canvaskit/source-revision612.test.cjs docs/tasks/t604-canvaskit/retained614.test.cjs | tee evidence/retained612-contracts.log
      - name: One bounded retained native pixel and eligibility proof
        env:
          CHROME_PATH: /Applications/Google Chrome.app/Contents/MacOS/Google Chrome
        run: |
          set -o pipefail
          node docs/tasks/t604-canvaskit/run614.cjs --port=8766 --out=evidence/native | tee evidence/direct-writer.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Town-T614-Single-Rect-Proof-${{ github.sha }}
          path: evidence/
          if-no-files-found: error
          retention-days: 14
