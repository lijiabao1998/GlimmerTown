name: Town T604 vector bridge transfer budget
on:
  push:
    branches: [gpt/town-gpu-transfer-audit-604]
permissions:
  contents: read
jobs:
  native-mac:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Original backend and diagnostic syntax
        run: |
          set -o pipefail
          mkdir -p evidence
          git rev-parse HEAD | tee evidence/source-commit.txt
          node docs/tasks/t604-gpu/ordered-gpu.test.js | tee evidence/contracts.log
          node docs/tasks/t604-gpu/transfer.test.js | tee evidence/transfer-contracts.log
          node docs/tasks/t604-gpu/transfer-run.js --check-overlay | tee evidence/overlay.log
      - name: Measure vector batches and bounded dirty-source transport
        env:
          CHROME_PATH: /Applications/Google Chrome.app/Contents/MacOS/Google Chrome
        run: |
          set -o pipefail
          node docs/tasks/t604-gpu/transfer-run.js --port=8763 --out=evidence/native | tee evidence/transfer.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Town-T604-vector-transfer-${{ github.sha }}
          path: evidence/
          retention-days: 14
