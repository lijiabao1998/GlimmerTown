name: Town T604 GPU pixel attribution
on:
  push:
    branches: [gpt/town-gpu-pixel-audit-604]
permissions:
  contents: read
jobs:
  native-mac:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source and audit contracts
        run: |
          set -o pipefail
          mkdir -p evidence
          git rev-parse HEAD | tee evidence/source-commit.txt
          node docs/tasks/t604-gpu/ordered-gpu.test.js | tee evidence/contracts.log
          node docs/tasks/t604-gpu/pixel-audit.js --check-overlay | tee evidence/overlay.log
      - name: Attribute new renderer pixels without repeating performance windows
        env:
          CHROME_PATH: /Applications/Google Chrome.app/Contents/MacOS/Google Chrome
        run: |
          set -o pipefail
          node docs/tasks/t604-gpu/pixel-audit.js --port=8763 --out=evidence/native | tee evidence/audit.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Town-T604-GPU-pixel-attribution-${{ github.sha }}
          path: evidence/
          retention-days: 14
