name: Town main SW navigation lifetime validation
on:
  push:
    branches: [gpt/town-sw-main-603]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: town603-sw-main-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Match original PWA PNG compression environment
        run: |
          python -m pip install Pillow==12.2.0
          source tools/setup_t602_zlib.sh "$RUNNER_TEMP/town602-zlib"
          echo "LD_LIBRARY_PATH=$LD_LIBRARY_PATH" >> "$GITHUB_ENV"
          echo "PYTHONPATH=$PYTHONPATH" >> "$GITHUB_ENV"
          mkdir -p evidence
      - name: Full original regression and exact six sentinels
        run: |
          set -o pipefail
          python tools/verify.py --min-pass 12513 | tee evidence/verify.log
      - name: Toolchain regression
        if: always()
        run: |
          set -o pipefail
          python -B -m unittest tools.test_toolchain 2>&1 | tee evidence/toolchain.log
      - name: New art focused pixel behavior
        if: always()
        run: |
          set -o pipefail
          node docs/tasks/t602-shots/test602.js | tee evidence/art-pixel.log
      - name: Prior-version seeded save and simulation compatibility
        if: always()
        run: |
          set -o pipefail
          node docs/tasks/t602-shots/oldsave602.js . | tee evidence/oldsave.log
      - name: Preserve full candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Town-T602-regression-${{ github.sha }}
          path: evidence/
          if-no-files-found: error
          retention-days: 14
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chinese UI fonts for faithful screenshots
        run: sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
      - name: Real Chromium day night seasons rotations and PNG evidence
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          set -o pipefail
          mkdir -p evidence
          node docs/tasks/t602-shots/scene602.js --port=8762 --out=evidence/chrome | tee evidence/chrome.log
      - name: Preserve real Chromium evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Town-T602-Chrome-${{ github.sha }}
          path: evidence/
          if-no-files-found: error
          retention-days: 14
  sw-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Immutable main and 37 navigation lifetime contracts
        run: |
          set -o pipefail
          mkdir -p evidence
          node docs/tasks/sw-main603/browser-main.mjs --check
          node --test --test-reporter=tap docs/tasks/sw-main603/sw-main.test.mjs | tee evidence/sw-main-contracts.tap
      - name: Preserve SW contracts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Town-main-SW-contracts-${{ github.sha }}
          path: evidence/
          if-no-files-found: error
          retention-days: 14
  sw-navigation:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Record source and native browser identity
        run: |
          mkdir -p evidence
          git rev-parse HEAD | tee evidence/source-commit.txt
          shasum -a 256 index.html sw.js test_fixde.js | tee evidence/source-sha256.txt
          '/Applications/Google Chrome.app/Contents/MacOS/Google Chrome' --version | tee evidence/chrome-version.txt
      - name: Controlled PWA navigation on byte-exact main v11.211
        env:
          CHROME_PATH: /Applications/Google Chrome.app/Contents/MacOS/Google Chrome
        run: |
          set -o pipefail
          node docs/tasks/sw-main603/browser-main.mjs --port=8873 --out=evidence/sw-main | tee evidence/sw-main-browser.log
      - name: Preserve controlled navigation evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Town-main-SW-navigation-${{ github.sha }}
          path: evidence/
          if-no-files-found: error
          retention-days: 14
