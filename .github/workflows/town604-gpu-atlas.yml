name: Town T604 native vector atlas feasibility
on:
  push:
    branches: [gpt/town-gpu-vector-atlas-604]
permissions:
  contents: read
jobs:
  native-mac:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Original source and atlas contracts
        run: |
          set -o pipefail
          mkdir -p evidence
          git rev-parse HEAD | tee evidence/source-commit.txt
          node docs/tasks/t604-gpu/ordered-gpu.test.js | tee evidence/source-contracts.log
          node docs/tasks/t604-gpu/transfer.test.js | tee evidence/observer-contracts.log
          node docs/tasks/t604-gpu/atlas.test.js | tee evidence/atlas-contracts.log
          node docs/tasks/t604-gpu/atlas-run.js --check-overlay | tee evidence/overlay.log
      - name: Measure native vector raster and few-atlas transport in painter order
        env:
          CHROME_PATH: /Applications/Google Chrome.app/Contents/MacOS/Google Chrome
        run: |
          set -o pipefail
          node docs/tasks/t604-gpu/atlas-run.js --port=8763 --out=evidence/native | tee evidence/atlas.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Town-T604-vector-atlas-${{ github.sha }}
          path: evidence/
          retention-days: 14
