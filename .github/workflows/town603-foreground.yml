name: Town T603 bounded foreground diagnostic
on:
  push:
    branches: [gpt/town-civic-art-603]
    paths:
      - docs/tasks/t603-shots/foreground603.js
      - .github/workflows/town603-foreground.yml
permissions:
  contents: read
jobs:
  foreground:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Standard runner and source identity
        run: |
          mkdir -p evidence
          git rev-parse HEAD | tee evidence/source-commit.txt
          shasum -a 256 index.html sw.js docs/tasks/t603-shots/scene603.js docs/tasks/t603-shots/foreground603.js | tee evidence/source-sha256.txt
          sw_vers | tee evidence/macos-version.txt
          uname -a | tee evidence/runner-system.txt
          /usr/sbin/system_profiler SPDisplaysDataType > evidence/displays.txt
          '/Applications/Google Chrome.app/Contents/MacOS/Google Chrome' --version | tee evidence/chrome-version.txt
          node docs/tasks/t603-shots/foreground603.js --check-overlay
      - name: Qualify real foreground and measure unchanged dense day and night
        env:
          CHROME_PATH: /Applications/Google Chrome.app/Contents/MacOS/Google Chrome
        run: |
          set -o pipefail
          node docs/tasks/t603-shots/foreground603.js --port=8763 --out=evidence/chrome | tee evidence/foreground.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Town-T603-foreground-${{ github.sha }}
          path: evidence/
          if-no-files-found: error
          retention-days: 14
