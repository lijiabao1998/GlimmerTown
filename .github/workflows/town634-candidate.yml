name: Town T634 British whole-batch candidate validation (no deployment)
on:
  push:
    branches: [gpt/town-british-whole-batch-634]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: town634-candidate-${{ github.ref }}
  cancel-in-progress: false
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Isolated original PNG compression environment
        run: |
          source tools/setup_t602_zlib.sh "$RUNNER_TEMP/town634-zlib"
          echo "LD_LIBRARY_PATH=$LD_LIBRARY_PATH" >> "$GITHUB_ENV"
          echo "PYTHONPATH=$PYTHONPATH" >> "$GITHUB_ENV"
          mkdir -p evidence
      - name: Original complete regression and six sentinels
        run: |
          set -o pipefail
          python tools/verify.py --min-pass 12534 | tee evidence/verify.log
      - name: Original toolchain regression
        if: always()
        run: |
          set -o pipefail
          python -B -m unittest tools.test_toolchain 2>&1 | tee evidence/toolchain.log
      - name: Preserve regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Town-T634-regression-${{ github.sha }}
          path: evidence/
          retention-days: 14
  chrome-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare browser driver and fonts
        run: |
          npm install --prefix "$RUNNER_TEMP/town634-browser" playwright
          echo "NODE_PATH=$RUNNER_TEMP/town634-browser/node_modules" >> "$GITHUB_ENV"
          sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
      - name: Real Chrome current defaults and old-save contact sheets
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: node docs/tasks/t634-shots/baseline634.cjs
      - name: Preserve original baseline contact sheets and pins
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Town-T634-baseline-Chrome-${{ github.sha }}
          path: evidence/
          retention-days: 14
