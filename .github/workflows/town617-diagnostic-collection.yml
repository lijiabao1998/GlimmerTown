name: Town T617 diagnostic collection without release acceptance
on:
  push:
    branches: [gpt/town-diagnostic-collection-617]
permissions:
  contents: read
  actions: read
concurrency:
  group: town617-diagnostic-collection-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preserve exact prior correctness and unchanged measurement protocol
        run: |
          mkdir -p evidence
          git fetch --depth=1 origin 9535ea58eb0c4b254981f3ca76ff3ddd8e0a0ec5
          git diff --name-only 9535ea58eb0c4b254981f3ca76ff3ddd8e0a0ec5 HEAD > evidence/changed-files.txt
          node -e "const fs=require('fs'),allowed=new Set(['.github/workflows/town617-diagnostic-collection.yml','docs/tasks/t604-canvaskit/active617-diagnostic.cjs','docs/tasks/t604-canvaskit/active617-diagnostic-observation.cjs','docs/tasks/t604-canvaskit/active617-diagnostic.test.cjs','docs/tasks/t604-canvaskit/DIAGNOSTIC617.md','docs/tasks/t604-canvaskit/active617-experiment.js']);for(const p of fs.readFileSync('evidence/changed-files.txt','utf8').trim().split('\n'))if(!allowed.has(p))throw Error('Unexpected source change: '+p)"
          curl --fail --silent --show-error --location 'https://api.github.com/repos/lijiabao1998/GlimmerTown/actions/runs/37922910690' > evidence/prior-run.json
          curl --fail --silent --show-error --location 'https://api.github.com/repos/lijiabao1998/GlimmerTown/actions/runs/37922910690/jobs?per_page=100' > evidence/prior-jobs.json
          node -e "const r=require('./evidence/prior-run.json'),j=require('./evidence/prior-jobs.json').jobs;if(r.head_sha!=='7e5b4a44e14a03fd7b50786913d1c6e51c2f62f3'||r.status!=='completed')throw Error('Wrong prior source/run');for(const n of ['contracts','regression (core)','regression (world)','regression (neighbors)'])if(!j.some(x=>x.name===n&&x.status==='completed'&&x.conclusion==='success'))throw Error('Prior correctness gate absent: '+n)"
      - name: Exercise exact emitted compiler and unchanged active protocol
        run: |
          set -o pipefail
          node --test docs/tasks/t604-canvaskit/active617.test.cjs docs/tasks/t604-canvaskit/active617-display.test.cjs docs/tasks/t604-canvaskit/active617-diagnostic.test.cjs | tee evidence/active-tests.log
          node docs/tasks/t604-canvaskit/active617-run.cjs --check-overlay | tee evidence/overlay.log
          node docs/tasks/t604-canvaskit/source-contract.cjs > evidence/source-contract.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Town-T617-Diagnostic-Contracts-${{ github.sha }}
          path: evidence/
          retention-days: 14
  gameplay:
    needs: source-gate
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Record machine and source identity
        run: |
          mkdir -p evidence/gameplay
          git rev-parse HEAD > evidence/gameplay/source-commit.txt
          sw_vers > evidence/gameplay/macos-version.txt
          /usr/sbin/system_profiler SPDisplaysDataType > evidence/gameplay/displays.txt
          '/Applications/Google Chrome.app/Contents/MacOS/Google Chrome' --version > evidence/gameplay/chrome-version.txt
      - name: One six-child diagnostic collection preserving failed acceptance
        env:
          CHROME_PATH: /Applications/Google Chrome.app/Contents/MacOS/Google Chrome
        run: |
          set -o pipefail
          node docs/tasks/t604-canvaskit/active617-diagnostic.cjs --out=evidence/gameplay | tee evidence/gameplay/run.log
          node -e "const r=require('./evidence/gameplay/active617-diagnostic-summary.json');if(!r.completed||r.accepted||r.releaseGatePassed||r.views.length!==2||r.views.some(v=>v.children.length!==3))process.exit(1)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Town-T617-Diagnostic-Gameplay-${{ github.sha }}
          path: evidence/
          retention-days: 14
