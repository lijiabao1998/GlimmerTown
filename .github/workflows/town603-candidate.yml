name: Town T603 civic art validation
on:
  push:
    branches: [gpt/town-civic-art-603]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: town603-candidate-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Match original PWA PNG compression environment
        run: |
          python -m pip install Pillow==12.2.0
          source tools/setup_t602_zlib.sh "$RUNNER_TEMP/town603-zlib"
          echo "LD_LIBRARY_PATH=$LD_LIBRARY_PATH" >> "$GITHUB_ENV"
          echo "PYTHONPATH=$PYTHONPATH" >> "$GITHUB_ENV"
          mkdir -p evidence
      - name: Full original regression and exact six sentinels
        run: |
          set -o pipefail
          python tools/verify.py --min-pass 12525 | tee evidence/verify.log
      - name: All 63 toolchain cases
        if: always()
        run: |
          set -o pipefail
          python -B -m unittest tools.test_toolchain 2>&1 | tee evidence/toolchain.log
      - name: Civic art pixels and projected actor clearance
        if: always()
        run: |
          set -o pipefail
          node docs/tasks/t603-shots/test603.js | tee evidence/civic-pixels.log
          node docs/tasks/t603-shots/clearance603.js index.html - 1 | tee evidence/actor-clearance.log
          node docs/tasks/t603-shots/oldsave603.js --json=evidence/oldsave.json | tee evidence/oldsave.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Town-T603-regression-${{ github.sha }}
          path: evidence/
          if-no-files-found: error
          retention-days: 14
  browser:
    strategy:
      fail-fast: false
      matrix:
        phase: [core, world, neighbors]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Chinese UI fonts
        run: sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
      - name: Real Chrome civic art, interactions, saves and performance
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          set -o pipefail
          mkdir -p evidence
          node docs/tasks/t603-shots/scene603.js --phase=${{ matrix.phase }} --port=8763 --out=evidence/chrome | tee evidence/chrome.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Town-T603-Chrome-${{ matrix.phase }}-${{ github.sha }}
          path: evidence/
          if-no-files-found: error
          retention-days: 14
