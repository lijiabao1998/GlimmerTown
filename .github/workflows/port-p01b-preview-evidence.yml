name: P01-B isolated preview evidence only
on:
  push:
    branches: [gpt/port-p01b-browser-evidence]
    paths:
      - docs/previews/port-p01b/**
      - .github/workflows/port-p01b-preview-evidence.yml
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Record source and official runner browser
        run: |
          git rev-parse HEAD
          /usr/bin/google-chrome --version
      - name: Install official Ubuntu CJK fonts for native labels
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - name: Install declared test-only dependencies
        working-directory: docs/previews/port-p01b
        run: npm ci --ignore-scripts
      - name: Native isolated preview in real Chromium
        working-directory: docs/previews/port-p01b
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          node freight-contract.cjs
          node build.cjs
          node chromium.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: P01B-native-chromium-${{ github.sha }}
          path: |
            docs/previews/port-p01b/chromium/
            docs/previews/port-p01b/evidence/
          retention-days: 30
          if-no-files-found: error
