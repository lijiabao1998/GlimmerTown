name: Town main Pages validation and publication
on:
  # T640：PR 一開就自動跑（含轉 ready 重跑一輪，讓 Codex 審查先到）；推 main 跑部署；不再把分支名寫進來，也不要為 PR 手動 dispatch。
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # T640：同一個 PR 新推送取消舊的那一輪；推 main 不取消。
  group: town-main-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  scope:
    # T641：判道別（全部 .md＝docs，否則 full）、卡頭機讀欄、gpt/ 越道、守衛程式新寫死的提交 SHA。scope.py 取自 base（PR 改它要合併後才生效）。
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      lane: ${{ steps.scope.outputs.lane }}
      ok: ${{ steps.scope.outputs.ok }}
      removed_asserts: ${{ steps.scope.outputs.removed_asserts }}
      ratchet_base: ${{ steps.scope.outputs.ratchet_base }}
      base: ${{ steps.base.outputs.base }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Resolve base commit
        id: base
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          # T642：PR 的 base.sha 會過期（main 前進後不更新），而 checkout 的是 GitHub 的測試合併提交；
          # 用過期 base 會把 main 上別人的改動算成這個 PR 的（#29 被 #30 的 T641 卡改動判成一 PR 兩卡）。
          # 測試合併提交的第一父就是建立它時 main 的 tip，用它當基準。
          if [ "$EVENT" = "pull_request" ] && [ "$(git rev-list --parents -n 1 HEAD | wc -w)" = "3" ]; then BASE=$(git rev-parse HEAD^1)
          elif [ "$EVENT" = "pull_request" ]; then BASE="$PR_BASE"
          elif [ "$EVENT" = "push" ] && [ -n "$BEFORE" ] && ! printf '%s' "$BEFORE" | grep -qE '^0+$'; then BASE="$BEFORE"
          else git fetch -q origin main && BASE=$(git merge-base origin/main HEAD); fi
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "base=$BASE"
      - name: Scope (lane, card header, gpt lane, hardcoded SHA)
        id: scope
        env:
          BASE: ${{ steps.base.outputs.base }}
          HEAD_REF: ${{ github.head_ref || github.ref_name }}  # T642：手動 dispatch 沒有 head_ref，用 ref_name，gpt/ 越道規則照查
        run: |
          mkdir -p evidence
          if git cat-file -e "$BASE:tools/scope.py" 2>/dev/null; then git show "$BASE:tools/scope.py" > "$RUNNER_TEMP/scope.py"; else cp tools/scope.py "$RUNNER_TEMP/scope.py"; fi
          python "$RUNNER_TEMP/scope.py" --base "$BASE" --head HEAD --head-ref "$HEAD_REF" > evidence/scope.json
      - name: Ledger gates (CHANGELOG sign-off, only grows, keeps every entry)
        # T644：原本只在本機 merge_bay 收件時跑，搬到合併前。文件道與 full 道都跑（CHANGELOG 是 .md）；工具取自 base。
        if: ${{ !cancelled() }}
        env:
          BASE: ${{ steps.base.outputs.base }}
        run: |
          set -o pipefail  # 預設 shell 是 bash -e、沒有 pipefail：沒有這行，| tee 會吃掉紅（紅源第一輪實踩）
          if git cat-file -e "$BASE:tools/landing_gates.py" 2>/dev/null; then git show "$BASE:tools/landing_gates.py" > "$RUNNER_TEMP/landing_gates.py"; else cp tools/landing_gates.py "$RUNNER_TEMP/landing_gates.py"; fi
          python "$RUNNER_TEMP/landing_gates.py" --base "$BASE" --head HEAD | tee evidence/ledger.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Town-main-scope-${{ github.sha }}
          path: evidence/
          retention-days: 90
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      pass: ${{ steps.verify.outputs.pass }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # T640：check634 要讀凍結歷史提交（T634 之前的基準）
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Match original PWA PNG compression environment
        run: |
          python -m pip install Pillow==12.2.0
          source tools/setup_t602_zlib.sh "$RUNNER_TEMP/town602-zlib"
          echo "LD_LIBRARY_PATH=$LD_LIBRARY_PATH" >> "$GITHUB_ENV"
          echo "PYTHONPATH=$PYTHONPATH" >> "$GITHUB_ENV"
          mkdir -p evidence
      - name: Full original regression and exact six sentinels
        id: verify
        run: |
          set -o pipefail
          python tools/verify.py --min-pass 12534 | tee evidence/verify.log
          echo "pass=$(grep -oE 'PASS=[0-9]+' evidence/verify.log | tail -1 | cut -d= -f2)" >> "$GITHUB_OUTPUT"
      - name: Toolchain regression
        if: always()
        run: |
          set -o pipefail
          python -B -m unittest tools.test_toolchain 2>&1 | tee evidence/toolchain.log
      - name: New art focused pixel behavior
        if: always()
        run: |
          set -o pipefail
          node docs/tasks/t602-shots/test602.js | tee evidence/art-pixel602.log
          node docs/tasks/t603-shots/test603.js | tee evidence/art-pixel603.log
          node docs/tasks/t603-shots/clearance603.js index.html - 1 | tee evidence/clearance603.log
          node tools/pages/native-correctness.cjs --self-test | tee evidence/native-correctness-contracts.log
          node tools/pages/release-correctness.cjs --self-test | tee evidence/release-correctness-contracts.log
          node --test tools/pages/native-mac-diagnostic.test.cjs tools/pages/native-portability-diagnostic.test.cjs | tee evidence/native-acceptance-contracts.log
          node --test tools/approved_art.test.cjs | tee evidence/approved-art-contracts.log
          node tools/approved_art.cjs --check-all | tee evidence/approved-art-registry.log
          node tools/pages/frame-compare.cjs --self-test | tee evidence/frame-compare-contracts.log
      - name: Prior-version seeded save and simulation compatibility
        if: always()
        run: |
          set -o pipefail
          node docs/tasks/t602-shots/oldsave602.js . | tee evidence/oldsave602.log
      - name: T634 independent art contracts and targeted negative controls (T640 moved from candidate workflow)
        if: always()
        run: |
          npm install --prefix "$RUNNER_TEMP/town634-canvas" @napi-rs/canvas@1.0.11
          set -o pipefail
          NODE_PATH="$RUNNER_TEMP/town634-canvas/node_modules" node docs/tasks/t634-shots/check634.cjs | tee evidence/check634.log
          node docs/tasks/t603-shots/oldsave603.js --json=evidence/oldsave603.json | tee evidence/oldsave603.log
      - name: Preserve full candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Town-main-Pages-T603-regression-${{ github.sha }}
          path: evidence/
          if-no-files-found: error
          retention-days: 90  # T640：小檔留 90 天
  browser:
    needs: [scope]
    if: ${{ !cancelled() && needs.scope.outputs.lane == 'full' }}
    strategy:
      fail-fast: false
      matrix:
        phase: [core, world, neighbors]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chinese UI fonts for faithful screenshots
        run: sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
      - name: Complete Linux Chromium art state and PNG correctness evidence
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          set -o pipefail
          mkdir -p evidence
          node tools/pages/release-correctness.cjs --phase=${{ matrix.phase }} --port=8762 --out=evidence/chrome | tee evidence/chrome.log
      - name: Compact complete world summary and pixel controls
        if: always() && matrix.phase == 'world'
        run: |
          cp evidence/chrome/release-correctness-summary.json evidence/chrome/scene603-summary.json
          node docs/tasks/t603-shots/package-world-evidence603.js --source=evidence/chrome --out=evidence/world-review
      - uses: actions/upload-artifact@v4
        if: always() && matrix.phase == 'world'
        with:
          name: Town-main-Pages-T603-world-review-${{ github.sha }}
          path: evidence/world-review/
          if-no-files-found: error
          retention-days: 14
      - name: Preserve real Chromium evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Town-main-Pages-T603-Chrome-${{ matrix.phase }}-${{ github.sha }}
          path: evidence/
          if-no-files-found: error
          retention-days: 14
  package:
    needs: [scope]
    if: ${{ !cancelled() && needs.scope.outputs.lane == 'full' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build only verified main runtime with cloud-owned storage
        run: |
          mkdir -p evidence
          node tools/pages/build-main.mjs _site/main > evidence/package-manifest.json
      - name: Namespace, actual game storage and SW lifetime contracts
        run: |
          set -o pipefail
          PAGES_SITE="$PWD/_site/main" node --test --test-reporter=tap tools/pages/*.test.mjs | tee evidence/pages-contracts.tap
          node tools/pages/browser-main.mjs --site=_site/main --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Town-main-Pages-package-evidence-${{ github.sha }}
          path: evidence/
          if-no-files-found: error
          retention-days: 90  # T640：小檔留 90 天
      - uses: actions/upload-artifact@v4
        with:
          name: Town-main-Pages-runtime-${{ github.sha }}
          path: _site/main/
          if-no-files-found: error
          retention-days: 14
      - name: Package the exact verified runtime for Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site/main/
  pages-browser:
    needs: [scope]
    if: ${{ !cancelled() && needs.scope.outputs.lane == 'full' }}
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build pinned package and record native browser identity
        run: |
          set -o pipefail
          mkdir -p evidence
          git rev-parse HEAD | tee evidence/source-commit.txt
          node tools/pages/build-main.mjs _site/main > evidence/package-manifest.json
          shasum -a 256 index.html sw.js _site/main/index.html _site/main/sw.js | tee evidence/source-sha256.txt
          '/Applications/Google Chrome.app/Contents/MacOS/Google Chrome' --version | tee evidence/chrome-version.txt
      - name: Genuine first visit, save isolation and PWA offline navigation
        env:
          CHROME_PATH: /Applications/Google Chrome.app/Contents/MacOS/Google Chrome
        run: |
          set -o pipefail
          node tools/pages/browser-main.mjs --site=_site/main --port=8893 --out=evidence/pages-browser | tee evidence/pages-browser.log
      - name: Exact T602 to T603 worker and save upgrade then full outage reopen
        env:
          CHROME_PATH: /Applications/Google Chrome.app/Contents/MacOS/Google Chrome
        run: |
          set -o pipefail
          node tools/pages/published-main.mjs --site=_site/main --upgrade-from-main --out=evidence/pages-reopen | tee evidence/pages-reopen.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Town-main-Pages-browser-${{ github.sha }}
          path: evidence/
          if-no-files-found: error
          retention-days: 90  # T640：小檔留 90 天
  native-acceptance:
    runs-on: macos-15
    timeout-minutes: 45
    # T630：GitHub macOS 跑機的原生計時同一輪相鄰重畫差到 10 倍、同一份程式一過一不過，改為紀錄、不擋部署（證據照存）
    # T640：只在手動觸發時跑（動繪製迴圈或宣稱效能的卡自己跑一次）；不再每次推送佔 10 分鐘 macOS
    if: github.event_name == 'workflow_dispatch'
    continue-on-error: true
    steps:
      - name: Start total native acceptance resource clock
        run: echo "T619_JOB_START_MS=$(node -p 'Date.now()')" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Native original timing and independent same-browser controls
        env:
          CHROME_PATH: /Applications/Google Chrome.app/Contents/MacOS/Google Chrome
        run: |
          set -o pipefail
          mkdir -p evidence/native-acceptance
          node tools/pages/release-native-acceptance.cjs --out=evidence/native-acceptance | tee evidence/native-acceptance.log
      - name: Preserve native acceptance and all historical failed fields
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Town-main-Pages-native-acceptance-${{ github.sha }}
          path: evidence/
          if-no-files-found: error
          retention-days: 14
  approved-art-release:
    needs: [scope]
    if: ${{ !cancelled() && needs.scope.outputs.lane == 'full' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare genuine Chrome driver and fonts
        run: |
          npm install --prefix "$RUNNER_TEMP/town634-browser" playwright@1.64.0
          echo "NODE_PATH=$RUNNER_TEMP/town634-browser/node_modules" >> "$GITHUB_ENV"
          sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
      - name: Required normal-URL simulation, saves and immutable owner-approved art
        env:
          CHROME_PATH: /usr/bin/google-chrome
        # T647：批准提交改讀 docs/APPROVED_ART.json 與 approved/* 標籤（fetch-depth 0 會帶標籤），不再寫死在工作流
        run: node docs/tasks/t634-shots/release634.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Town-main-approved-art-release-${{ github.sha }}
          path: evidence/
          if-no-files-found: error
          retention-days: 14
  approved-fire-release:
    needs: [scope]
    if: ${{ !cancelled() && needs.scope.outputs.lane == 'full' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare genuine Chrome driver and fonts
        run: |
          npm install --prefix "$RUNNER_TEMP/town635-browser" playwright@1.64.0
          echo "NODE_PATH=$RUNNER_TEMP/town635-browser/node_modules" >> "$GITHUB_ENV"
          sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
      - name: Required default fire art, inherited atlas and real behavior acceptance
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: node docs/tasks/t635-shots/release635.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Town-main-approved-fire-release-${{ github.sha }}
          path: evidence/
          if-no-files-found: error
          retention-days: 14
  scene602:
    needs: [scope]
    if: ${{ !cancelled() && needs.scope.outputs.lane == 'full' }}
    # T640：由 town602-candidate.yml 原樣搬入並升為部署閘。T643：v11.210 凍結夾具斷言退役，全量 SPR 指紋改由 fp job 實算＋fp_diff；
    # 這裡留「候選檔等於這顆 Chromium」與其餘（舊存檔、手機 UI、遮擋）。scene603 在 browser job 也比全量 SPR（凍結鎖，T643b 解）。
    runs-on: ubuntu-latest
    timeout-minutes: 40  # T714：runner 偶爾分到很慢的 apt 鏡像，光裝字型就要 12～22 分鐘（原本 20）
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chinese UI fonts for faithful screenshots
        run: sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
      - name: Real Chromium day night seasons rotations and PNG evidence
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          set -o pipefail
          mkdir -p evidence
          node docs/tasks/t602-shots/scene602.js --port=8762 --out=evidence/chrome | tee evidence/chrome.log
      - name: Preserve real Chromium evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Town-T602-Chrome-${{ github.sha }}
          path: evidence/
          if-no-files-found: error
          retention-days: 14
  fp:
    # T643：像素指紋在 CI 實算，這裡是正本。釘版 Playwright Chromium 實算全部 SPR 鍵（冷啟兩次逐鍵恆等），
    # fp_diff 要求實算等於提交的 docs/SPR_PINS.json、動到的家族是卡頭 families 的子集且 owner_ok 有字。
    # 量測（PR #31，run 38671312400）：釘版 Chromium 156／跑機 google-chrome 155／Windows Chrome 與倉庫 1586 鍵零差且恆等，rebake 與倉庫檔逐位元組相同。
    # T646：同一次冷啟也實算 GV.artAtlas646（SPR 之外按需烘焙的新美術，docs/ART_PINS.json），規則相同；本機一次冷啟約 70 秒，逾時放寬到 25 分。
    needs: [scope]
    if: ${{ !cancelled() && needs.scope.outputs.lane == 'full' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45  # T714：runner 偶爾分到很慢的 apt 鏡像，光裝字型就要 12～22 分鐘（原本 25）
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chinese UI fonts (same environment as scene602)
        run: sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
      - name: Install pinned Playwright Chromium
        id: pw
        run: |
          npm install --silent --prefix "$RUNNER_TEMP/town643-pw" playwright@1.64.0
          (cd "$RUNNER_TEMP/town643-pw" && npx playwright install --with-deps chromium)
          P=$(node -e "console.log(require(process.argv[1]).chromium.executablePath())" "$RUNNER_TEMP/town643-pw/node_modules/playwright")
          echo "path=$P" >> "$GITHUB_OUTPUT"
          "$P" --version
      - name: Take fp tools from base when it has them (a PR must not rewrite its own check)
        env:
          BASE: ${{ needs.scope.outputs.base }}
        run: |
          mkdir -p "$RUNNER_TEMP/fp-tools" evidence
          # T646：base 的工具還不會 ART_PINS（只有 T646 自己的 PR）就用 head 的，同 T643 的起步；之後 base 一定會。
          SRC=head
          if git cat-file -e "$BASE:tools/fp_diff.py" 2>/dev/null && git show "$BASE:tools/fp_diff.py" | grep -q -- '--art-computed'; then SRC=base; fi
          echo "fp tools from $SRC"
          for f in fp_snapshot.py fp_diff.py scope.py; do
            if [ "$SRC" = base ]; then git show "$BASE:tools/$f" > "$RUNNER_TEMP/fp-tools/$f"; else cp "tools/$f" "$RUNNER_TEMP/fp-tools/$f"; fi
          done
      - name: Recompute every SPR and ART pin (two cold boots must agree) and write the rebake
        env:
          CHROME_PATH: ${{ steps.pw.outputs.path }}
        run: python "$RUNNER_TEMP/fp-tools/fp_snapshot.py" --out evidence/SPR_PINS.json --art-out evidence/ART_PINS.json --report evidence/report.json
      - name: fp_diff (rebake equals committed file; touched families vs card header)
        env:
          BASE: ${{ needs.scope.outputs.base }}
        run: python "$RUNNER_TEMP/fp-tools/fp_diff.py" --base "$BASE" --computed evidence/SPR_PINS.json --art-computed evidence/ART_PINS.json
      - name: Preserve the rebake (an art PR commits these exact docs/SPR_PINS.json and docs/ART_PINS.json, never a hand edit)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Town-main-fp-${{ github.event.pull_request.head.sha || github.sha }}
          path: evidence/
          retention-days: 90
  frame:
    # T648：整幀比對。base 與 head 在同一個釘版 Chromium 裡逐幀比畫布 RGBA（存檔城市兩座＋新美術陣列四張，每頁 67 幀）：
    # 非美術卡畫面零變；卡頭寫了逃生閥時閥關後整幀等於 base；畫面變了就出接觸表（base｜head｜head+閥｜差異），業主看了點頭＝owner_ok。
    needs: [scope]
    if: ${{ !cancelled() && needs.scope.outputs.lane == 'full' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45  # T714：runner 偶爾分到很慢的 apt 鏡像，光裝字型就要 12～22 分鐘（原本 30）
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chinese UI fonts (same environment as scene602)
        run: sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
      - name: Install pinned Playwright Chromium
        id: pw
        run: |
          npm install --silent --prefix "$RUNNER_TEMP/town648-pw" playwright@1.64.0
          (cd "$RUNNER_TEMP/town648-pw" && npx playwright install --with-deps chromium)
          P=$(node -e "console.log(require(process.argv[1]).chromium.executablePath())" "$RUNNER_TEMP/town648-pw/node_modules/playwright")
          echo "path=$P" >> "$GITHUB_OUTPUT"
          echo "NODE_PATH=$RUNNER_TEMP/town648-pw/node_modules" >> "$GITHUB_ENV"
      - name: Take frame tools from base when it has them (a PR must not rewrite its own check)
        env:
          BASE: ${{ needs.scope.outputs.base }}
        run: |
          mkdir -p "$RUNNER_TEMP/frame-tools" evidence/frame
          # 只有 T648 自己的 PR 的 base 還沒有 frame-compare.cjs，那一次用 head 的（同 T643／T646 的起步）
          if git cat-file -e "$BASE:tools/pages/frame-compare.cjs" 2>/dev/null; then
            echo "frame tools from base"
            git show "$BASE:tools/pages/frame-compare.cjs" > "$RUNNER_TEMP/frame-tools/frame-compare.cjs"
            git show "$BASE:tools/scope.py" > "$RUNNER_TEMP/frame-tools/scope.py"
          else
            echo "frame tools from head"
            cp tools/pages/frame-compare.cjs tools/scope.py "$RUNNER_TEMP/frame-tools/"
          fi
      - name: Card header of this PR (scope.py from the same source as the tool)
        env:
          BASE: ${{ needs.scope.outputs.base }}
          HEAD_REF: ${{ github.head_ref || github.ref_name }}
