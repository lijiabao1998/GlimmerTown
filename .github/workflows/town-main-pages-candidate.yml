name: Town main Pages validation and publication
on:
  push:
    branches: [gpt/town-main-pages, gpt/town-native-release-618, main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: town-main-pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Match original PWA PNG compression environment
        run: |
          python -m pip install Pillow==12.2.0
          source tools/setup_t602_zlib.sh "$RUNNER_TEMP/town602-zlib"
          echo "LD_LIBRARY_PATH=$LD_LIBRARY_PATH" >> "$GITHUB_ENV"
          echo "PYTHONPATH=$PYTHONPATH" >> "$GITHUB_ENV"
          mkdir -p evidence
      - name: Full original regression and exact six sentinels
        run: |
          set -o pipefail
          python tools/verify.py --min-pass 12534 | tee evidence/verify.log
      - name: Toolchain regression
        if: always()
        run: |
          set -o pipefail
          python -B -m unittest tools.test_toolchain 2>&1 | tee evidence/toolchain.log
      - name: New art focused pixel behavior
        if: always()
        run: |
          set -o pipefail
          node docs/tasks/t602-shots/test602.js | tee evidence/art-pixel602.log
          node docs/tasks/t603-shots/test603.js | tee evidence/art-pixel603.log
          node docs/tasks/t603-shots/clearance603.js index.html - 1 | tee evidence/clearance603.log
          node tools/pages/native-correctness.cjs --self-test | tee evidence/native-correctness-contracts.log
          node tools/pages/release-correctness.cjs --self-test | tee evidence/release-correctness-contracts.log
          node --test tools/pages/native-mac-diagnostic.test.cjs tools/pages/native-portability-diagnostic.test.cjs | tee evidence/native-acceptance-contracts.log
      - name: Prior-version seeded save and simulation compatibility
        if: always()
        run: |
          set -o pipefail
          node docs/tasks/t602-shots/oldsave602.js . | tee evidence/oldsave602.log
          node docs/tasks/t603-shots/oldsave603.js --json=evidence/oldsave603.json | tee evidence/oldsave603.log
      - name: Preserve full candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Town-main-Pages-T603-regression-${{ github.sha }}
          path: evidence/
          if-no-files-found: error
          retention-days: 14
  browser:
    strategy:
      fail-fast: false
      matrix:
        phase: [core, world, neighbors]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chinese UI fonts for faithful screenshots
        run: sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
      - name: Complete Linux Chromium art state and PNG correctness evidence
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          set -o pipefail
          mkdir -p evidence
          node tools/pages/release-correctness.cjs --phase=${{ matrix.phase }} --port=8762 --out=evidence/chrome | tee evidence/chrome.log
      - name: Compact complete world summary and pixel controls
        if: always() && matrix.phase == 'world'
        run: |
          cp evidence/chrome/release-correctness-summary.json evidence/chrome/scene603-summary.json
          node docs/tasks/t603-shots/package-world-evidence603.js --source=evidence/chrome --out=evidence/world-review
      - uses: actions/upload-artifact@v4
        if: always() && matrix.phase == 'world'
        with:
          name: Town-main-Pages-T603-world-review-${{ github.sha }}
          path: evidence/world-review/
          if-no-files-found: error
          retention-days: 14
      - name: Preserve real Chromium evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Town-main-Pages-T603-Chrome-${{ matrix.phase }}-${{ github.sha }}
          path: evidence/
          if-no-files-found: error
          retention-days: 14
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build only verified main runtime with cloud-owned storage
        run: |
          mkdir -p evidence
          node tools/pages/build-main.mjs _site/main > evidence/package-manifest.json
      - name: Namespace, actual game storage and SW lifetime contracts
        run: |
          set -o pipefail
          PAGES_SITE="$PWD/_site/main" node --test --test-reporter=tap tools/pages/*.test.mjs | tee evidence/pages-contracts.tap
          node tools/pages/browser-main.mjs --site=_site/main --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Town-main-Pages-package-evidence-${{ github.sha }}
          path: evidence/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: Town-main-Pages-runtime-${{ github.sha }}
          path: _site/main/
          if-no-files-found: error
          retention-days: 14
      - name: Package the exact verified runtime for Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site/main/
  pages-browser:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build pinned package and record native browser identity
        run: |
          mkdir -p evidence
          git rev-parse HEAD | tee evidence/source-commit.txt
          node tools/pages/build-main.mjs _site/main > evidence/package-manifest.json
          shasum -a 256 index.html sw.js _site/main/index.html _site/main/sw.js | tee evidence/source-sha256.txt
          '/Applications/Google Chrome.app/Contents/MacOS/Google Chrome' --version | tee evidence/chrome-version.txt
      - name: Genuine first visit, save isolation and PWA offline navigation
        env:
          CHROME_PATH: /Applications/Google Chrome.app/Contents/MacOS/Google Chrome
        run: |
          set -o pipefail
          node tools/pages/browser-main.mjs --site=_site/main --port=8893 --out=evidence/pages-browser | tee evidence/pages-browser.log
      - name: Exact T602 to T603 worker and save upgrade then full outage reopen
        env:
          CHROME_PATH: /Applications/Google Chrome.app/Contents/MacOS/Google Chrome
        run: |
          set -o pipefail
          node tools/pages/published-main.mjs --site=_site/main --upgrade-from-main --out=evidence/pages-reopen | tee evidence/pages-reopen.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Town-main-Pages-browser-${{ github.sha }}
          path: evidence/
          if-no-files-found: error
          retention-days: 14
  native-acceptance:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Start total native acceptance resource clock
        run: echo "T619_JOB_START_MS=$(node -p 'Date.now()')" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Native original timing and independent same-browser controls
        env:
          CHROME_PATH: /Applications/Google Chrome.app/Contents/MacOS/Google Chrome
        run: |
          set -o pipefail
          mkdir -p evidence/native-acceptance
          node tools/pages/release-native-acceptance.cjs --out=evidence/native-acceptance | tee evidence/native-acceptance.log
      - name: Preserve native acceptance and all historical failed fields
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Town-main-Pages-native-acceptance-${{ github.sha }}
          path: evidence/
          if-no-files-found: error
          retention-days: 14
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [validate, browser, package, pages-browser, native-acceptance]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Read existing Pages configuration without enabling it
        uses: actions/configure-pages@v5
        with:
          enablement: false
      - name: Publish only after every original and package check succeeds
        id: deployment
        uses: actions/deploy-pages@v4
  verify-published:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: deploy
    runs-on: macos-15
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify actual HTTPS assets, first visit and offline saved-city reopen
        env:
          CHROME_PATH: /Applications/Google Chrome.app/Contents/MacOS/Google Chrome
          PAGES_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          set -o pipefail
          mkdir -p evidence
          node tools/pages/build-main.mjs _site/main > evidence/package-manifest.json
          node tools/pages/published-main.mjs --site=_site/main --url="$PAGES_URL" --out=evidence/pages-published | tee evidence/pages-published.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Town-main-Pages-published-${{ github.sha }}
          path: evidence/
          if-no-files-found: error
          retention-days: 14
