name: Town T604 ordered GPU component prototype
on:
  push:
    branches: [gpt/town-gpu-command-prototype-604]
permissions:
  contents: read
concurrency:
  group: town604-gpu-prototype
  cancel-in-progress: false
jobs:
  native-mac:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source and geometry contracts
        run: |
          set -o pipefail
          mkdir -p evidence
          git rev-parse HEAD | tee evidence/source-commit.txt
          shasum -a 256 index.html sw.js docs/tasks/t604-gpu/*.js | tee evidence/source-sha256.txt
          node docs/tasks/t603-shots/native603.test.js | tee evidence/native-source.log
          node docs/tasks/t604-gpu/ordered-gpu.test.js | tee evidence/gpu-contracts.log
          node docs/tasks/t604-gpu/run.js --check-overlay | tee evidence/overlay-syntax.log
          sw_vers | tee evidence/macos-version.txt
      - name: Bounded ordered image stream benchmark and full pixel comparison
        env:
          CHROME_PATH: /Applications/Google Chrome.app/Contents/MacOS/Google Chrome
        run: |
          set -o pipefail
          node docs/tasks/t604-gpu/run.js --port=8763 --out=evidence/native | tee evidence/gpu.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Town-T604-GPU-component-${{ github.sha }}
          path: evidence/
          if-no-files-found: error
          retention-days: 14
