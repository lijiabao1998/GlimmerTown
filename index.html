    ctx.restore();
  }
  if(win&&b<.45&&!lodMini&&!window.__noAurora){ // T174 冬季極光（Opus 親手）——僅冬季(win)深夜(b<.45)非遠景時，畫面上方 3 條綠青紫波動極光帶（screen 疊加、垂直漸層淡出），visT 決定性漂移；非冬/日間/黃昏/遠景 不繪＝該場景零改動；不消耗 R()、同 visT 重繪恆等
    const af=clamp((.45-b)/.11,0,1);
    const AH=['90,222,150','80,196,214','150,120,224'];
    ctx.save();ctx.globalCompositeOperation='screen';
    for(let band=0;band<3;band++){
      const cy=H*(.05+band*.055), hue=AH[band];
      ctx.beginPath();ctx.moveTo(0,cy-30);
      for(let px=0;px<=W;px+=16){const wy=cy+Math.sin(px*.006+visT*.5+band*2.1)*20+Math.sin(px*.015+visT*.85)*9;ctx.lineTo(px,wy);}
      for(let px=W;px>=0;px-=16){const wy=cy+36+Math.sin(px*.006+visT*.5+band*2.1)*20+Math.sin(px*.015+visT*.85)*9;ctx.lineTo(px,wy);}
      ctx.closePath();
      const grad=ctx.createLinearGradient(0,cy-30,0,cy+66);
      grad.addColorStop(0,`rgba(${hue},0)`);grad.addColorStop(.5,`rgba(${hue},${(af*.11).toFixed(3)})`);grad.addColorStop(1,`rgba(${hue},0)`);
      ctx.fillStyle=grad;ctx.fill();
    }
    ctx.restore();
  }
  if(!lodMini&&!window.__noFog){ // T182 晨霧（Opus 親手）——黎明(ph≈0.25 日出)時分畫面下半低伏白霧帶：3 條垂直漸層霧帶＋波動頂緣＋visT 決定性橫向漂移，強度隨 |ph-0.25| 峰態衰減（日出最濃、正午與深夜為 0）；遠景(lodMini)不繪；純讀既有 ph/visT、無新狀態、不消耗 R()、同 visT 重繪恆等
    const fog=clamp(1-Math.abs(ph-.25)/.11,0,1);
    if(fog>.01){
      ctx.save();
      for(let band=0;band<3;band++){
        const cy=H*(.54+band*.14), ga=fog*(.14-band*.03), drift=visT*5+band*130;
        const grad=ctx.createLinearGradient(0,cy-38,0,cy+58);
        grad.addColorStop(0,'rgba(226,232,239,0)');grad.addColorStop(.5,`rgba(226,232,239,${ga.toFixed(3)})`);grad.addColorStop(1,'rgba(226,232,239,0)');
        ctx.fillStyle=grad;
        ctx.beginPath();ctx.moveTo(0,cy-38);
        for(let px=0;px<=W;px+=20){const wy=cy-38+Math.sin(px*.008+drift*.02+band*1.7)*13+Math.sin(px*.02+drift*.033)*6;ctx.lineTo(px,wy);}
        ctx.lineTo(W,cy+58);ctx.lineTo(0,cy+58);ctx.closePath();ctx.fill();
      }
      ctx.restore();
    }
  }
  if(blizzard){ // T137：暴風雪/沙暴全屏色調（獨立於既有天氣系統，冬雪白藍／夏沙土黃）
    ctx.fillStyle=blizzard.type==='snow'?'rgba(230,238,250,.35)':'rgba(196,164,110,.35)';
    ctx.fillRect(0,0,W,H);
  }
  /* ===== T154 積雪漸進疊加＋霧＋暴風雪橫向雪流線條：與上方既有天氣/暴風雪色調同一時機（晝夜 multiply 之
     前）疊加，皆為每幀動態層、不烘進 groundCache；wxUp 為假時整段跳過＝退回既有簡單版本（上方既有天氣/暴風
     雪色調完全不受影響，原樣繼續運作）。晴天基準（weather=0、無雪無霧）時 snowLvl 恆 0、fog 恆 null、
     blizzard 恆 null，三段皆不進入，逐像素與改動前一致 ===== */
  if(wxUp&&snowLvl>0){ // 積雪：0→SNOW_MAX_A 隨連續雪天數（snowLvl，見上方衍生）推進，停雪後隨 rainDays 遞減同步緩降；不改任何冬季 sprite，純疊色
    ctx.fillStyle=`rgba(255,255,255,${(snowLvl*SNOW_MAX_A).toFixed(3)})`;
    ctx.fillRect(0,0,W,H);
  }
  if(wxUp&&fog){ // 霧：全屏低對比白霧＋遠處（螢幕上方 y=0）更濃的線性漸層，模擬近實遠虛的縱深感（fog 觸發見 tick()）
    const fg=ctx.createLinearGradient(0,0,0,H);
    fg.addColorStop(0,'rgba(230,234,238,.32)');
    fg.addColorStop(1,'rgba(230,234,238,.09)');
    ctx.fillStyle=fg;
    ctx.fillRect(0,0,W,H);
  }
  if(wxUp&&blizzard){ // 暴風雪：既有全屏疊色之上加橫向雪流線條，純 screen 空間＋visT 位移公式決定性驅動，不消耗 R()/ri()
    ctx.save();
    ctx.globalAlpha=.22;
    ctx.strokeStyle=blizzard.type==='snow'?'rgba(255,255,255,.6)':'rgba(120,92,52,.6)';
    ctx.lineWidth=Math.max(1,1.4*z);
    for(let i=0;i<14;i++){
      const yy=((i*(H/14)+visT*150)%(H+40))-20;
      const xx=(((i*97-visT*230)%(W+200))+(W+200))%(W+200)-100; // JS % 對負被除數保留負號，須加一輪 +m 再取模才能正確落在 [0,W+200) 區間
      const len=44+(i%5)*9;
      ctx.beginPath();ctx.moveTo(xx,yy);ctx.lineTo(xx+len,yy+len*.22);ctx.stroke();
    }
    ctx.restore();
  }
  // ---- 晝夜色調 ----
  if(b<1){
    ctx.globalCompositeOperation='multiply';
    const nc=[110,125,190];
    const col=[0,1,2].map(i=>Math.round(lerp(nc[i],255,b)));
    ctx.fillStyle=`rgb(${col[0]},${col[1]},${col[2]})`;
    ctx.fillRect(0,0,W,H);
    ctx.globalCompositeOperation='source-over';
  }
  if(dusk>0){
    // T149：晨昏兩檔——ph<.5（日出前半段）冷藍、ph>=.5（日落後半段）沿用既有暖橙；dusk 強度公式完全不變，
    // 僅色相依方向分流，ph===.5（正午）時 dusk 恆為 0 不會進入本區塊，__noLight 時強制退回單一橙色（改動前行為）
    const morn=!window.__noLight&&ph<.5;
    ctx.fillStyle=morn?`rgba(80,140,255,${(dusk*.14).toFixed(3)})`:`rgba(255,145,60,${(dusk*.16).toFixed(3)})`;
    ctx.fillRect(0,0,W,H);
  }
  // ---- 夜間燈光 ----
  if(b<.72){
    const a=clamp((0.72-b)/.5,0,1);
    ctx.globalAlpha=a;
    ctx.globalCompositeOperation='screen';
    for(const nsp of nightSprites){
      if(nsp.img)ctx.drawImage(nsp.img,nsp.x,nsp.y,nsp.w,nsp.h);
      else if(nsp.rect){ctx.fillStyle=nsp.col||'#ffe9a0';ctx.fillRect(...nsp.rect);} // T165：nsp.col 可選（車尾燈紅等），缺省沿用既有暖白＝零位移
    }
    ctx.globalCompositeOperation='source-over';
    ctx.globalAlpha=1;
  }
  /* ===== T152 鳥群：3 幀振翅，天空層隨機飛過（screen 空間直接畫，不隨相機縮放位移，僅隨 z 縮放個體大小）。
     位置/出現時機皆由固定索引相位（bi*常數）＋visT 決定，不消耗 R()/ri()，同 visT 下重繪結果恆等。z<0.5
     （lodMini，已含在 animOn）與 z<1（lodFar）皆整段跳過而非「靜態首幀」——鳥群本質是位移動畫，凍結位置
     會呈現「懸浮不動的鳥」比直接不畫更違和，故此處二檔 LOD 一律跳過（卡面 LOD 條款於此按視覺合理性詮釋，
     已於卡面驗收確認），較常見的 z<1 遠景視角本就不利辨識飛鳥細節，不畫不影響觀感 ===== */
  if(animOn&&!lodFar){
    const BIRD_N=3;
    for(let bi=0;bi<BIRD_N;bi++){
      const cyc=8+bi*2.3;
      const prog=((visT/cyc)+bi*0.618)%1;
      if(prog>.42)continue; // 每輪僅約 42% 時間段落在畫面內飛行，其餘時間不在場
      const bx2=-40*z+(prog/.42)*(W+80*z);
      const by2=40*z+((bi*53)%70)*z*.6+Math.sin(prog*Math.PI*6)*6*z;
      const bfr=Math.floor(visT*9+bi)%3;
      const bs=SPR.bird[bfr];
      ctx.drawImage(bs.img,bx2,by2,bs.w*z,bs.h*z);
    }
  }
  if(b<.45&&!lodMini&&!window.__noShootStar){ // T173 夜間流星（Opus 親手）——深夜偶爾一顆流星劃過畫面上方帶漸淡尾跡＋亮頭；週期 cyc、每輪僅前 10% 時段可見（短暫），位置由 phase 雜湊決定；日間/黃昏(b>=.45)/遠景(lodMini)不繪；純 visT 決定性、不消耗 R()、同 visT 重繪恆等
    const cyc=13, prog=(visT/cyc)%1, phase=Math.floor(visT/cyc);
    if(prog<.1){
      const sp=streetHash(phase,7,321), sp2=streetHash(phase,9,322);
      const sx0=(.12+sp*.58)*W, sy0=(.04+sp2*.16)*H, t2=prog/.1;
      const dlen=150*z, dx=dlen*.88, dy=dlen*.48, hx=sx0+dx*t2, hy=sy0+dy*t2;
      const nf=clamp((.45-b)/.11,0,1)*(1-t2*.4);
      ctx.save();ctx.globalCompositeOperation='lighter';ctx.lineCap='round';
      const g=ctx.createLinearGradient(hx,hy,hx-dx*.55,hy-dy*.55);
      g.addColorStop(0,`rgba(255,255,238,${(.95*nf).toFixed(3)})`);g.addColorStop(1,'rgba(255,255,238,0)');
      ctx.strokeStyle=g;ctx.lineWidth=Math.max(1,1.7*z);
      ctx.beginPath();ctx.moveTo(hx,hy);ctx.lineTo(hx-dx*.55,hy-dy*.55);ctx.stroke();
      ctx.fillStyle=`rgba(255,255,245,${(.95*nf).toFixed(3)})`;
      ctx.beginPath();ctx.arc(hx,hy,1.8*z,0,6.283);ctx.fill();
      ctx.restore();
    }
  }
  /* ===== T163 水鳥：複用 T152 鳥群技法（screen 空間、固定索引相位＋visT 驅動、不消耗 R()/ri()），另開一批
     飛行帶次較低、反方向飛行的個體代表水岸水鳥，直接沿用既有 SPR.bird 三幀圖（未新增鳥類 SPR 鍵）。oceanOn
     已含 z<0.5／quality===0／__noOcean 短路，同 T152 慣例額外要求 !lodFar（凍結位置比不畫更違和，同 T152
     卡面驗收確認的詮釋，此處比照辦理） ===== */
  if(oceanOn&&!lodFar&&SPR.bird){
    const WBIRD_N=2;
    for(let bi=0;bi<WBIRD_N;bi++){
      const cyc=11+bi*3.1;
      const prog=((visT/cyc)+bi*0.382+.25)%1;
      if(prog>.5)continue;
      const bx2=W+40*z-(prog/.5)*(W+80*z);
      const by2=H*.62+((bi*37)%40)*z*.5+Math.sin(prog*Math.PI*5)*4*z;
      const bfr=Math.floor(visT*7+bi)%3;
      const bs2=SPR.bird[bfr];
      ctx.drawImage(bs2.img,bx2,by2,bs2.w*z*1.15,bs2.h*z*1.15);
    }
  }
  // ---- 天氣：雨絲＋閃電（螢幕空間，夜燈之後、游標之前；T17）----
  if(weather&&!lodFar)drawRain(z); // T107：z<1 不畫雨雪個體，全屏色調已由前段天氣色調段落涵蓋
  if(confetti.length&&!lodMini)drawConfetti(); // T159：達成彩帶，畫面空間疊加，z<0.5（lodMini）時跳過（沿用 T107 LOD 慣例）
  if(flashT>0){
    const flashA=Math.min(.85,flashT*2);
    ctx.fillStyle=`rgba(255,255,255,${flashA.toFixed(3)})`;
    ctx.fillRect(0,0,W,H);
    if(fxOn&&wxUp){ // T154：沿用 T149 光影層 'lighter' 疊加手法，閃電瞬間額外疊一層暖白全域補光（一幀高亮，隨 flashT 同步衰減）；fxOn／wxUp 任一為假（z<0.5／quality===0／__noLight／__noWx）時維持改動前純白閃光，退回既有簡單版本
      ctx.save();
      ctx.globalCompositeOperation='lighter';
      ctx.fillStyle=`rgba(255,250,225,${(flashA*.45).toFixed(3)})`;
      ctx.fillRect(0,0,W,H);
      ctx.restore();
    }
    flashT=Math.max(0,flashT-dt);
  }
  // ---- T143：因果追溯疊圖（inspect 面板點擊負向因子後高亮貢獻來源格；traceOverlay 為 null 或空陣列時零迭代，逐像素與改動前一致）----
  if(traceOverlay&&traceOverlay.tiles.length){
    const trR=.55+.25*Math.sin(visT*4);
    ctx.globalAlpha=trR;
    ctx.fillStyle='#ff4d6d';
    ctx.strokeStyle='#fff3c4';
    ctx.lineWidth=Math.max(1,2*z);
    for(const tp of traceOverlay.tiles){
      const tsx=sxOf(tp.x,tp.y),tsy=syOf(tp.x,tp.y);
      if(!vis(tsx,tsy))continue;
      ctx.beginPath();ctx.moveTo(tsx+32*z,tsy);ctx.lineTo(tsx+64*z,tsy+16*z);ctx.lineTo(tsx+32*z,tsy+32*z);ctx.lineTo(tsx,tsy+16*z);ctx.closePath();
      ctx.fill();ctx.stroke();
    }
    ctx.globalAlpha=1;
  }
  // ---- 游標／框選預覽 ----
  drawCursor(sxOf,syOf,z);
  if(z<1)ctx.imageSmoothingEnabled=false; // T106：復原，z≥1 各檔渲染路徑不受影響
}
function drawCursor(sxOf,syOf,z){
  if(tool==='pan')return;
  if(tool==='busrt'){drawBusRoutes(sxOf,syOf,z);return;} // T120：路線工具不走一般建造游標，改繪路線彩色折線＋站點標記
  if(rect.on){
    const x0=Math.min(rect.x0,rect.x1),x1=Math.max(rect.x0,rect.x1);
    const y0=Math.min(rect.y0,rect.y1),y1=Math.max(rect.y0,rect.y1);
    let cost=0;
    for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){
      if(!inMap(x,y))continue;
      const ok=!canPlace(tool,x,y);
      ctx.drawImage(ok?SPR.cursor:SPR.cursorBad,sxOf(x,y),syOf(x,y),64*z,32*z);
      if(ok)cost+=placeCost(tool,x,y);
    }
    const dc=$('#dragcost');
    dc.style.display='block';
    dc.textContent='$'+Math.round(cost);
    dc.style.left=(pt.cx+14)+'px';dc.style.top=(pt.cy-30)+'px';
    dc.style.color=cost>money?'#ff9090':'#ffd977';
    return;
  }
  $('#dragcost').style.display='none';
  if(hover.x<0)return;
  const ok=!canPlace(tool,hover.x,hover.y)&&placeCost(tool,hover.x,hover.y)<=money;
  ctx.drawImage(ok?SPR.cursor:SPR.cursorBad,sxOf(hover.x,hover.y),syOf(hover.x,hover.y),64*z,32*z);
}
// T120：路線工具啟用時的疊圖——各路線用不同色彩折線連站點（依序）＋序號圓點；未入線站點畫白點提示可點擊
function drawBusRoutes(sxOf,syOf,z){
  const cols=['#ffd977','#5ec8ff','#7be08a'];
  for(let r=0;r<3;r++){
    const rt=busRoutes[r];
    if(!rt.stops.length)continue;
    const cx=(si)=>sxOf(si%N,(si/N)|0)+32*z, cy=(si)=>syOf(si%N,(si/N)|0)+16*z;
    if(rt.stops.length>=2){
      ctx.strokeStyle=cols[r];ctx.lineWidth=Math.max(1,2*z);ctx.globalAlpha=r===busRtEdit?.95:.5;
      ctx.beginPath();
      rt.stops.forEach((si,i)=>{i?ctx.lineTo(cx(si),cy(si)):ctx.moveTo(cx(si),cy(si));});
      ctx.stroke();ctx.globalAlpha=1;
    }
    rt.stops.forEach((si,i)=>{
      ctx.fillStyle=cols[r];
      ctx.beginPath();ctx.arc(cx(si),cy(si),5*z,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#0c1120';ctx.font=Math.max(7,8*z)+'px sans-serif';
      ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(i+1,cx(si),cy(si));
    });
  }
  ctx.fillStyle='rgba(255,255,255,.6)';
  for(const si of busList){
    if(busRoutes.some(rt=>rt.stops.includes(si)))continue;
    const cx=sxOf(si%N,(si/N)|0)+32*z, cy=syOf(si%N,(si/N)|0)+16*z;
    ctx.beginPath();ctx.arc(cx,cy,4*z,0,Math.PI*2);ctx.fill();
  }
}

   8. 輸入（滑鼠＋觸控）

const hover={x:-1,y:-1};
const pt={cx:0,cy:0};
const rect={on:false,x0:0,y0:0,x1:0,y1:0};
const pointers=new Map();
let panBase=null,pinchBase=null,paintLast=null,downInfo=null,firstPaint=null,dozeArm=null;
let longPressT=null;
let zoomAnim=null; // T108：換檔緩動狀態 {from,to,t,dur,mx,my,wx,wy}；mx/my＝錨點裝置像素座標，wx/wy＝該點對應世界座標（沿用既有 zoomStep 反推公式，全程鎖定）
let lastTapT=0,lastTapX=0,lastTapY=0; // T108：單擊雙擊（含觸控）＝放大一檔，偵測用時間戳/座標（不影響既有單擊建造/檢視的即時回應）
let twoTapT=0,twoTapX=0,twoTapY=0;    // T108：雙指雙擊＝縮小一檔，偵測用時間戳/座標
let undoStack=[],undoGroup=null;
const openUndo=()=>{undoGroup={snaps:[],seen:{},spent:0};};
const closeUndo=()=>{if(undoGroup&&undoGroup.snaps.length){undoStack.push(undoGroup);if(undoStack.length>40)undoStack.shift();}undoGroup=null;};

function toTile(cssX,cssY){
  const mx=cssX*DPR,my=cssY*DPR;
  const wx=(mx-(W/2-cam.x*cam.z))/cam.z;
  const wy=(my-(H/2-cam.y*cam.z))/cam.z;
  const fx=(wx/32+wy/16)/2, fy=(wy/16-wx/32)/2;
  return [Math.floor(fx),Math.floor(fy)];
}
function isRectTool(id){return id==='zr'||id==='zc'||id==='zi'||id==='doze'||id==='park'||id==='tree'||id==='fill';}
function paintTo(x,y){
  if(!inMap(x,y))return;
  if(paintLast&&paintLast[0]===x&&paintLast[1]===y)return;
  if(paintLast){ // L 型補間，快速拖曳不斷路
    let[px,py]=paintLast;
    while(px!==x){px+=Math.sign(x-px);if(doPlace(tool,px,py,true))sTick();}
    while(py!==y){py+=Math.sign(y-py);if(doPlace(tool,px,py,true))sTick();}
  }else{
    if(doPlace(tool,x,y,false))sTick();
  }
  paintLast=[x,y];
}
cvs.addEventListener('pointerdown',e=>{
  try{cvs.setPointerCapture(e.pointerId);}catch(err){}
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  initAudio();
  if(pointers.size===2){
    // 進入雙指：取消畫線/框選，改為縮放平移；單指剛誤放的一格退款撤銷
    rect.on=false;paintLast=null;downInfo=null;
    if(firstPaint&&performance.now()-firstPaint.t<400&&firstPaint.spent>0)undoPlace(firstPaint);
    firstPaint=null;
    undoGroup=null;
    const ps=[...pointers.values()];
    const pd0=Math.hypot(ps[0].x-ps[1].x,ps[0].y-ps[1].y),pcx0=(ps[0].x+ps[1].x)/2,pcy0=(ps[0].y+ps[1].y)/2;
    pinchBase={d0:pd0,cx0:pcx0,cy0:pcy0,z0:cam.z,cx:pcx0,cy:pcy0,downT:performance.now(),moved:false}; // T108：捏合改連續累積（z0/d0 為起點基準，隨手勢比例連續換算 cam.z，取代舊版門檻跳檔）；cx/cy 追蹤最新中心供放開時就近落檔／雙指雙擊判定
    zoomAnim=null; // T108：進入新手勢前若仍有換檔緩動在跑，交由手勢本身接管，避免兩者搶寫 cam.z
    panBase=null;
    return;
  }

// T106：縮放檔位階梯（√2 步進，遠景全覽～近景像素特寫），取代舊 1..4 整數檔
const ZOOMS=[0.25,0.35,0.5,0.7,1,1.4,2,2.8,4];
function zoomIdx(z){ // z 在 ZOOMS 中最接近的索引（相容舊存檔/舊 DPR 推算殘留的非階梯值）
  let bi=0,bd=Infinity;
  for(let i=0;i<ZOOMS.length;i++){const dd=Math.abs(ZOOMS[i]-z);if(dd<bd){bd=dd;bi=i;}}

}
function zoomStep(d,cssX,cssY){
  const baseZ=zoomAnim?zoomAnim.to:cam.z; // T108：若換檔緩動仍在跑，以其目標檔為基準疊加下一檔，連續滾動快速跨檔才不會抖動/卡在中途值
  const nz=ZOOMS[clamp(zoomIdx(baseZ)+d,0,ZOOMS.length-1)];
  if(nz===baseZ)return;
  const mx=cssX*DPR,my=cssY*DPR;
  const wx=(mx-(W/2-cam.x*cam.z))/cam.z; // 錨點以目前實際（可能仍在動畫中）相機狀態反推，全程鎖定
  const wy=(my-(H/2-cam.y*cam.z))/cam.z;
  zoomAnim={from:cam.z,to:nz,t:0,dur:.15,mx,my,wx,wy}; // T108：硬切改 ~150ms easeOutQuad 緩動，見 updateZoomAnim（主迴圈 advance() 呼叫）

function updateZoomAnim(dtReal){ // T108：換檔緩動插值入口，由主迴圈 advance() 每幀呼叫；與 speed 無關，緩動節奏只認真實時間
  if(!zoomAnim)return;

  const z=zoomAnim.from+(zoomAnim.to-zoomAnim.from)*ease;

  cam.y=zoomAnim.wy-(zoomAnim.my-H/2)/z;

let AC=null;
function initAudio(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}
  if(AC&&AC.state==='suspended')AC.resume();}
function tone(f,dur,type,vol,slide){
  if(!AC||muted)return;
  const o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'square';o.frequency.value=f;
  if(slide)o.frequency.linearRampToValueAtTime(slide,AC.currentTime+dur);
  g.gain.setValueAtTime(vol||.08,AC.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+dur);
  o.connect(g).connect(AC.destination);
  o.start();o.stop(AC.currentTime+dur);
}

// 雷聲（T17）：0.5s 白噪聲 → 低通 400Hz → 音量包絡衰減；遵守 sndMode（muted 時靜音）
function sThunder(){
  if(!AC||muted)return;
  const dur=.5,len=(AC.sampleRate*dur)|0;
  const buf=AC.createBuffer(1,len,AC.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
  const src=AC.createBufferSource();src.buffer=buf;
  const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=400;
  const g=AC.createGain();
  g.gain.setValueAtTime(.4,AC.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+dur);
  src.connect(lp).connect(g).connect(AC.destination);
  src.start();src.stop(AC.currentTime+dur);
}

// 頻率表（C4 基準）
const SCALES={
  CM:[261.63,293.66,329.63,349.23,392.00,440.00,493.88,523.25],
  Am:[220.00,246.94,261.63,293.66,329.63,349.23,392.00,440.00],
  DmPent:[146.83,174.61,196.00,220.00,261.63,293.66],
  Pent:[261.63,293.66,349.23,392.00,440.00,523.25,587.33,659.25]
};
// 每種情緒的和弦進行、音色、速度、延音與織體
const MOODS={
  day:   {scale:'CM',     chords:[[0,2,4],[5,7,2],[3,5,0],[4,6,1]], type:'triangle', vol:.018, tempo:.28, hold:.55, arp:false},
  rain:  {scale:'Am',     chords:[[0,2,4],[3,5,0],[0,2,4],[4,6,1]], type:'sine',     vol:.022, tempo:.42, hold:.70, arp:true},
  storm: {scale:'DmPent', chords:[[0,2,4],[2,4,6],[1,3,5],[0,2,4]], type:'sawtooth', vol:.015, tempo:.55, hold:1.0, arp:false, lp:250},
  night: {scale:'CM',     chords:[[0,2,4],[4,6,1],[0,2,4],[3,5,0]], type:'sine',     vol:.020, tempo:.60, hold:1.2, arp:false},
  winter:{scale:'Pent',   chords:[[0,2,4],[3,5,7],[1,3,5],[0,2,4]], type:'square',   vol:.016, tempo:.25, hold:.35, arp:true, bell:true},
  summer:{scale:'CM',     chords:[[0,2,4],[2,4,6],[4,6,1],[0,2,4]], type:'triangle', vol:.020, tempo:.24, hold:.50, arp:true}, // T136：夏日晴朗白晝情緒，較 day 明亮輕快
  autumn:{scale:'Am',     chords:[[0,2,4],[3,5,0],[2,4,6],[0,2,4]], type:'sine',     vol:.017, tempo:.34, hold:.65, arp:false} // T136：秋日沉穩情緒，較 day 略慢略暖
};
class AudioComposer{
  constructor(){
    this.curMood=null;     // 目前情緒標籤
    this.out=null;         // 目前 master gain
    this.playing=false;
    this.timer=null;       // setTimeout id
    this._phraseId=0;      // 防止舊 timeout 在 stop 後仍發聲
  }
  pickMood(){
    if(weather===2)return 'storm';
    if(weather===1)return 'rain';
    const b=daylight().b;
    if(inWinter()&&b>=.5)return 'winter';
    if(b<.5)return 'night';
    const sea=season(); // T136：非雨/雪/夜的晴日白晝情緒依季細分——原本恆回 'day' 的區間拆為夏/秋/day(春)，其餘既有分支零改動
    if(sea===1)return 'summer';
    if(sea===2)return 'autumn';
    return 'day';
  }
  start(){
    if(this.playing)return;
    initAudio();
    if(!AC)return;
    this.playing=true;
    this.curMood=this.pickMood();
    this._phraseId++;
    this.out=AC.createGain(); this.out.gain.value=0;
    this.out.connect(AC.destination);
    this._fade(this.out.gain,.001,.30,1.2);
    this._schedule();
  }
  stop(){
    if(!this.playing)return;
    this.playing=false;
    this._phraseId++;
    if(this.timer){clearTimeout(this.timer);this.timer=null;}
    if(this.out){
      const old=this.out; this.out=null;
      this._fade(old.gain,old.gain.value,.001,1.5,()=>{try{old.disconnect();}catch(e){}});
    }
  }
  update(){
    if(!this.playing)return;
    const m=this.pickMood();
    if(m!==this.curMood)this._crossfadeTo(m);
  }
  _fade(gain,from,to,dur,onDone){
    if(!AC)return;
    const t0=AC.currentTime;
    gain.cancelScheduledValues(t0);
    gain.setValueAtTime(from,t0);
    gain.linearRampToValueAtTime(to,t0+dur);
    if(onDone)setTimeout(onDone,dur*1000+20);
  }
  _crossfadeTo(m){
    const old=this.out;
    this.curMood=m;
    this.out=AC.createGain(); this.out.gain.value=0;
    this.out.connect(AC.destination);
    this._fade(this.out.gain,.001,.30,1.2);
    if(old)this._fade(old.gain,old.gain.value,.001,1.5,()=>{try{old.disconnect();}catch(e){}});
  }
  _schedule(){
    if(!this.playing||!AC)return;
    const phrase=this._buildPhrase();
    const dur=phrase.dur;
    this._phraseId++;
    const pid=this._phraseId;
    this.timer=setTimeout(()=>{if(this.playing&&this._phraseId===pid)this._schedule();},Math.max(50,dur*1000-80));
  }
  _buildPhrase(){
    const m=MOODS[this.curMood]||MOODS.day;
    const scale=SCALES[m.scale];
    const chords=m.chords;
    const beat=m.tempo;
    const prog=chords;
    const now=AC.currentTime;
    const out=this.out;
    let maxT=0;
    const {type,vol,hold,arp,lp,bell}=m;
    for(let c=0;c<prog.length;c++){
      const indices=prog[c];
      const t0=now+c*beat*4;
      if(arp){
        for(let i=0;i<4;i++){
          const noteT=t0+i*beat;
          const idx=indices[i%indices.length];
          this._note(scale[idx],beat*.9,noteT,type,vol,lp,bell,out);
          maxT=Math.max(maxT,noteT+beat);
        }
      }else{
        for(const idx of indices){
          this._note(scale[idx],beat*4*hold,t0,type,vol,lp,bell,out);
          maxT=Math.max(maxT,t0+beat*4*hold);
        }
      }
    }
    // 偶爾加低音鋪底（除 winter 鐘琴外）
    if(!bell&&Math.random()<.6){
      const root=scale[prog[0][0]]/2;
      this._note(root,beat*4*1.5,now,type,vol*.7,lp,true,out);
    }
    return {dur:maxT-now+0.2};
  }
  _note(f,dur,t0,type,vol,lp,bell,out){
    if(!out||!AC)return;
    const o=AC.createOscillator();
    o.type=type; o.frequency.value=f;
    if(bell&&f>220)o.frequency.exponentialRampToValueAtTime(f*1.5,t0+dur);
    const g=AC.createGain();
    g.gain.setValueAtTime(0,t0);
    g.gain.linearRampToValueAtTime(vol,t0+0.02);
    const dec=bell?dur*.35:dur;
    g.gain.exponentialRampToValueAtTime(.001,t0+0.02+dec);
    let last=o;
    if(lp){const ftr=AC.createBiquadFilter();ftr.type='lowpass';ftr.frequency.value=lp;o.connect(ftr);last=ftr;}
    last.connect(g).connect(out);
    o.start(t0); o.stop(t0+dur+.1);
  }
}
const composer=new AudioComposer();

   9c. 環境音動態分層混音（T144，氛圍勝點）——交通/人口/工業/公園四層
   程序化噪聲／振盪源，增益依即時指標平滑跟隨，疊加於既有 BGM 之上（不取代）；
   season/weather 切換時複用與 composer 情緒交叉淡出同量級的線性斜坡（1.3s）。
===================================================================== */
const AMBIENT_LAYERS=['traffic','voice','industry','nature']; // 街噪/人聲/機械/鳥鳴
const AMBIENT_VOL={traffic:.05,voice:.035,industry:.045,nature:.028}; // 各層滿載輸出音量上限（遠低於 composer 主旋律，確保疊加不喧賓奪主）
const AMBIENT_RAMP=1.3; // 增益平滑跟隨時間（秒），與 composer._fade 的 1.2~1.5s 同量級（複用同款線性斜坡淡出手法）
class AmbientBus{
  constructor(){
    this.on=false;
    this.layers={};    // key -> {src,filter?,gain,lfo?,lfoGain?}
    this._lastCalc=-1; // 指標重算節流基準：以 AC.currentTime（真實時間）為準，跟遊戲倍速無關
  }
  start(){
    if(this.on)return;
    initAudio();
    if(!AC)return;
    this.on=true;
    this.layers.traffic=this._mkNoise(700,'lowpass',1,false);  // 街噪＝低通濾波噪聲（悶悶的車流底噪）
    this.layers.voice=this._mkNoise(1400,'bandpass',1.4,true); // 人聲＝帶通噪聲＋慢速 LFO（群集氣泡起伏）
    this.layers.industry=this._mkOsc(58,'sawtooth',true);      // 機械＝低頻鋸齒＋LFO 脈衝
    this.layers.nature=this._mkNoise(4200,'bandpass',3,true);  // 鳥鳴＝高頻帶通噪聲＋LFO 點綴閃爍
    this._lastCalc=-1; // 強制下一次 update() 立即重算，開啟當下即反映城市現況
    this.update();
  }
  stop(){
    if(!this.on)return;
    this.on=false;
    for(const k of AMBIENT_LAYERS){
      const L=this.layers[k];
      if(!L)continue;
      this._rampGain(L.gain,0,.4);
      setTimeout(()=>{
        for(const n of [L.src,L.filter,L.lfo,L.lfoGain])if(n){try{n.stop&&n.stop();}catch(e){}try{n.disconnect();}catch(e){}}
        try{L.gain.disconnect();}catch(e){}
      },450);
    }
    this.layers={};
  }
  _rampGain(g,to,dur){
    if(!AC)return;
    const t0=AC.currentTime;
    g.gain.cancelScheduledValues(t0);
    g.gain.setValueAtTime(g.gain.value,t0);
    g.gain.linearRampToValueAtTime(to,t0+dur);
  }
  _mkNoise(freq,type,q,useLfo){
    const len=(AC.sampleRate*2)|0,buf=AC.createBuffer(1,len,AC.sampleRate),d=buf.getChannelData(0);
    for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
    const src=AC.createBufferSource();src.buffer=buf;src.loop=true;
    const filter=AC.createBiquadFilter();filter.type=type;filter.frequency.value=freq;filter.Q.value=q;
    const gain=AC.createGain();gain.gain.value=0;
    src.connect(filter).connect(gain).connect(AC.destination);
    src.start();
    let lfo=null,lfoGain=null;
    if(useLfo){
      lfo=AC.createOscillator();lfo.type='sine';lfo.frequency.value=.12+Math.random()*.1;
      lfoGain=AC.createGain();lfoGain.gain.value=0; // 隨 update() 依當前層音量比例設定，指標為 0 時不殘留任何調變
      lfo.connect(lfoGain).connect(gain.gain);
      lfo.start();
    }
    return {src,filter,gain,lfo,lfoGain};
  }
  _mkOsc(freq,type,useLfo){
    const o=AC.createOscillator();o.type=type;o.frequency.value=freq;
    const gain=AC.createGain();gain.gain.value=0;
    o.connect(gain).connect(AC.destination);
    o.start();
    let lfo=null,lfoGain=null;
    if(useLfo){
      lfo=AC.createOscillator();lfo.type='sine';lfo.frequency.value=.4;
      lfoGain=AC.createGain();lfoGain.gain.value=0;
      lfo.connect(lfoGain).connect(gain.gain);
      lfo.start();
    }
    return {src:o,gain,lfo,lfoGain};
  }
  update(){
    if(!this.on||!AC)return;
    const now=AC.currentTime;
    if(now-this._lastCalc<.5)return; // 節流：真實時間至少 0.5s 才重算一次指標，避免高倍速下浪費運算
    this._lastCalc=now;
    // 交通密度：全圖道路格 roadLoad/容量 之平均比例（T129 既有場，純讀取不消耗 R()）
    let loadSum=0,loadN=0;
    for(let i=0;i<N*N;i++){
      const t=tiles[i];
      if(t.road){const cap=ROAD_CAP[(t.rc||2)-1];if(cap>0){loadSum+=Math.min(1.4,roadLoad[i]/cap);loadN++;}}
    }
    const trafficT=loadN?clamp(loadSum/loadN,0,1):0;
    // 人口：全域 pop，2600 視為滿層基準（大城喧鬧感）
    const voiceT=clamp(pop/2600,0,1);
    // 工業計數：achStats.nI（tick() 每日重算快取，比照既有 achStats 慣例，純讀取不新增計數迴圈）
    const industryT=clamp((achStats.nI||0)/18,0,1);
    // 公園覆蓋：COV.park 覆蓋格數佔全圖比例（6% 視為滿層）
    let parkN=0;for(let i=0;i<N*N;i++)if(COV.park[i]>0)parkN++;
    const natureBase=clamp(parkN/(N*N*.06),0,1);
    const b=daylight().b; // 晝夜：夜晚鳥鳴自然壓低（複用既有 composer.pickMood() 同款 daylight() 判斷）
    const natureT=natureBase*clamp((b-.2)/.5,0,1)*(weather===2?.2:1)*(inWinter()?.35:1); // 暴風雨/冬季壓低——複用 composer 情緒切換所讀的同一批 weather/inWinter 訊號
    this._setTarget('traffic',trafficT);
    this._setTarget('voice',voiceT);
    this._setTarget('industry',industryT);
    this._setTarget('nature',natureT);
  }
  _setTarget(k,v){
    const L=this.layers[k];if(!L)return;
    const vol=v*(AMBIENT_VOL[k]||0);
    this._rampGain(L.gain,vol,AMBIENT_RAMP);
    if(L.lfoGain)this._rampGain(L.lfoGain,vol*.5,AMBIENT_RAMP); // LFO 調變深度隨層音量同步淡出，指標為 0 時不殘留任何調變
  }
}

function buildToolbar(){
  const cats=$('#toolcats');cats.innerHTML='';cats.style.display='flex';
  for(const c of TOOL_CATS){
    const b=document.createElement('button');
    b.textContent=c.nm;b.className=c.id===toolCat?'on':'';
    b.onclick=()=>{toolCat=c.id;buildToolbar();sTick();};
    cats.appendChild(b);
  }
  if(toolCat==='terra'){ // T121：地形筆刷尺寸切換（1×1／3×3），僅「地形」分類顯示，重用 #toolcats button 既有樣式
    const tb=document.createElement('button');
    tb.textContent='筆刷 '+terraBrush+'×'+terraBrush;
    tb.className='on';
    tb.onclick=()=>{terraBrush=terraBrush===1?3:1;buildToolbar();sTick();};
    cats.appendChild(tb);
  }
  const bar=$('#tools');bar.innerHTML='';
  for(const t of TOOLS){
    if(t.cat!==toolCat&&t.id!=='pan'&&t.id!=='doze')continue;
    if(t.unlockRank&&rankIdx+1<t.unlockRank)continue; // T133：等級解鎖掛點——目前全部 TOOLS 皆未設 unlockRank，此判斷恆為 false（既有 34 種建築在任何等級都可放，不 re-lock）；供未來 MU 波新建築設定門檻
    if(toolCat!=='base'&&(t.id==='pan'||t.id==='doze')&&t.cat==='base'&&toolCat!=='base'){/* pan/doze only in base */}
    const el=document.createElement('button');
    el.className='tool'+(t.id===tool?' sel':'');
    el.dataset.tid=t.id; // FIX-E：快捷鍵由可見按鈕反查工具 id 用
    el.innerHTML=`<span class="ic">${t.ic}</span><span>${t.nm}</span><span class="pr">${t.pr}</span>`;
    el.onclick=()=>{
      tool=t.id;
      document.querySelectorAll('.tool').forEach(b=>b.classList.remove('sel'));
      el.classList.add('sel');
      cvs.classList.toggle('build',tool!=='pan');
      if(tool==='busrt')showBusRt();else hideInfo(); // T120：選中路線工具時顯示路線編輯面板
      sTick();initAudio();
    };
    bar.appendChild(el);
  }
  // FIX-E：doze 已由上方篩選放行（t.id==='doze' 不 continue），每分類恰渲染一個拆除鈕；移除舊的重複 append
}
// T120：路線工具點選公車站——依序加入目前編輯中的路線（再點一次＝移出），純 UI 狀態，不走 doPlace
function busRtClick(x,y){
  if(!inMap(x,y))return;
  const i=idx(x,y);
  if(!T(i).bus){toast('請點選公車站','bad');return;}
  const rt=busRoutes[busRtEdit];
  const p=rt.stops.indexOf(i);
  if(p>=0)rt.stops.splice(p,1);
  else{
    if(rt.stops.length>=8){toast('單條路線最多 8 站','bad');return;}
    rt.stops.push(i);
  }
  showBusRt();
}
// T120：路線編輯面板（重用 #info/#infoBody，仿 showSlots/showLog 樣式）
function showBusRt(){
  const body=$('#infoBody');body.innerHTML='';
  const h=document.createElement('h3');h.textContent='🚏 公車路線';body.appendChild(h);
  const tip=document.createElement('div');tip.className='row';
  tip.textContent='點地圖上的公車站依序加站（再點一次移出），每條最多 8 站；路線半徑3內住宅小車生成率×0.7';
  body.appendChild(tip);
  const sel=document.createElement('div');sel.className='row';
  for(let r=0;r<3;r++){
    const b=document.createElement('button');b.className='hbtn';
    b.textContent='路線'+(r+1)+'（'+busRoutes[r].stops.length+'站）'+(r===busRtEdit?' ◀':'');
    b.addEventListener('click',()=>{busRtEdit=r;showBusRt();});
    sel.appendChild(b);
  }
  body.appendChild(sel);
  const rt=busRoutes[busRtEdit];
  const list=document.createElement('div');
  if(!rt.stops.length){
    const e=document.createElement('div');e.className='row';e.textContent='（尚未加入站點）';list.appendChild(e);
  }else{
    rt.stops.forEach((si,i)=>{
      const row=document.createElement('div');row.className='row';
      const lab=document.createElement('span');lab.textContent=(i+1)+'. 站點 ('+si%N+','+((si/N)|0)+')　';
      row.appendChild(lab);
      const rm=document.createElement('button');rm.className='hbtn';rm.textContent='移除';
      rm.addEventListener('click',()=>{rt.stops.splice(i,1);showBusRt();});
      row.appendChild(rm);
      list.appendChild(row);
    });
  }
  body.appendChild(list);
  const clr=document.createElement('button');clr.className='hbtn';clr.textContent='清空此路線';
  clr.addEventListener('click',()=>{rt.stops.length=0;showBusRt();});
  body.appendChild(clr);
  $('#info').style.display='block';
}

const MINI_VIEW_NAME=['一般','地價','污染熱度','壅堵','犯罪熱點','服務覆蓋','資源']; // T131：小地圖視圖標籤，索引對齊 miniView；T140：新增「資源」視圖

function drawMini(){
  if(!tiles)return;
  miniG.fillStyle='#0d1226';miniG.fillRect(0,0,144,144);
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){
    const t=T(idx(x,y));
    let c;
    if(miniView===1){ // T130→T131：地價視圖，冷（藍）→暖（紅）對應 LAND 0→255，128中性落中間色
      const lt=LAND[idx(x,y)]/255;
      c='rgb('+Math.round(lerp(42,216,lt))+','+Math.round(lerp(74,68,lt))+','+Math.round(lerp(138,42,lt))+')';
    }else if(miniView===2){ // T110→T131：污染熱度視圖，紅色深淺對應 POL[i] 強度
      const v=POL[idx(x,y)];
      c=v>0?'rgb('+Math.min(255,40+v*5)+',26,26)':'#141a30';
    }else if(miniView===3){ // T131：壅堵視圖，道路依 roadLoad/容量比例綠→紅（比例達2倍容量封頂全紅），非道路格用底色
      if(t.road){
        const cap=ROAD_CAP[(t.rc||2)-1];
        const r=cap>0?clamp(roadLoad[idx(x,y)]/cap/2,0,1):0;
        c='rgb('+Math.round(lerp(58,224,r))+','+Math.round(lerp(150,60,r))+','+Math.round(lerp(90,40,r))+')';
      }else c='#141a30';
    }else if(miniView===4){ // T131：犯罪熱點視圖，半徑4內犯罪建築計數→紅色深淺（比照 landStaticAt 犯罪項同款 countNear 手法）
      const cr=countNear(x,y,4,tt=>tt.bld&&tt.bld.k<=3&&tt.bld.crime);
      c=cr>0?'rgb('+Math.min(255,60+cr*35)+',24,24)':'#141a30';
    }else if(miniView===5){ // T131：服務覆蓋視圖，五大服務（警/消/校/醫/公園）COV 覆蓋家數→紅(0)到綠(5)
      const ci=idx(x,y);
      const sc=(COV.police[ci]>0?1:0)+((COV.fire[ci]>0||COV.fire2[ci]>0)?1:0)+(COV.school[ci]>0?1:0)
        +((COV.hospital[ci]>0||COV.clinic[ci]>0)?1:0)+(COV.park[ci]>0?1:0);
      const r=sc/5;
      c='rgb('+Math.round(lerp(200,60,r))+','+Math.round(lerp(60,190,r))+',60)';
    }else if(miniView===6){ // T140：資源視圖——RESOURCE 由種子決定（0無/1油/2礦），純顯示原始礦藏分布（不隨 RDEP 耗損變色）
      const rv=RESOURCE[idx(x,y)];
      c=rv===1?'#4a3826':rv===2?'#a68a52':'#141a30';
    }else{
      c=t.t===0?'#3671b6':t.t===1?'#d9c689':'#74b258';
      if(t.tree)c='#3e7a3c';
      if(t.zone)c=['','#2e7a44','#2f5f9a','#9a7a2e'][t.zone];
      if(t.road)c=t.hw?'#3a3d44':'#565b64';
      if(t.rail)c='#8b7355';if(t.tram)c='#6a8fbf';if(t.dock)c='#3d6a8a';if(t.flood)c='#1a4a7a';if(t.levee)c='#9a8a6a';
      if(t.wp)c='#2f6fc0';
      // T90：小地圖色表（pal）索引 0..32 對齊 KNAME 1..32，鐵路站(17)/港口(18)/機場(19)/停車場(20)/輕軌站(21)等 v3.0
      // 建築（T39-T54）色碼已全數涵蓋（見下陣列），多格建築 ref 副格同步 t.bld.k 一併正確上色，核對現狀達標、無新增
      if(t.bld)c=MINI_BLD_PAL[t.bld.k]||'#aaa'; // T107：改讀共用 MINI_BLD_PAL（陣列內容與原本行內字面量逐字相同）
      if(t.bld&&t.bld.k===1&&t.bld.we!==undefined&&t.bld.we!==1)c=shade(c,t.bld.we===2?18:-18); // T125：小地圖住宅色按財富微調明度（貧暗/富亮，中產與缺省沿用原色不變）
      if(t.bld&&t.bld.fire)c='#ff5030';
    }
    miniG.fillStyle=c;miniG.fillRect(x*2,y*2,2,2);
  }
  // 視野框：四個螢幕角反推格座標連線
  miniG.strokeStyle='rgba(255,255,255,.85)';miniG.lineWidth=1;miniG.beginPath();
  [[0,0],[cvs.clientWidth,0],[cvs.clientWidth,cvs.clientHeight],[0,cvs.clientHeight]]
    .forEach((p,i)=>{const[tx,ty]=toTile(p[0],p[1]);
      const mx=clamp(tx,0,N)*2,my=clamp(ty,0,N)*2;
      i?miniG.lineTo(mx,my):miniG.moveTo(mx,my);});
  miniG.closePath();miniG.stroke();
}

function toast(msg,cls,x,y){
  const el=document.createElement('div');
  el.className='toast'+(cls?' '+cls:'');
  el.textContent=msg;
  $('#toasts').appendChild(el);
  setTimeout(()=>{el.style.transition='opacity .5s';el.style.opacity='0';},2800);
  setTimeout(()=>el.remove(),3400);
  // T114：同步寫入通知中心日誌（100 筆封頂丟最舊）；x/y 為選填座標（災害/事件類呼叫點補傳）
  const le={d:day,m:msg,c:cls};if(x!==undefined&&y!==undefined){le.x=x;le.y=y;}
  log.push(le);if(log.length>100)log.shift();
  unread++;updBell();
}

function importShareCode(code){ // T135：匯入核心邏輯（不依賴 prompt 取碼），供 importShare()（UI）與 GV 測試鉤子共用；舊格式碼與擴充版碼（含 egoal 目標包）皆由此處理

  }catch(e){toast('分享碼無效','bad');return false;}

function drawHistChart(){
  const cv=$('#histCv');if(!cv)return;
  const g=cv.getContext('2d');
  g.clearRect(0,0,260,80);
  if(!hist.length)return;
  const data=hist.slice(-histRange);
  const n=data.length;
  if(n<2)return;
  const series=[['money','#ffd977'],['net','#5ec8ff'],['pop','#7be08a'],['happy','#ff8fd0']];
  for(const[k,col]of series){
    let lo=Infinity,hi=-Infinity;
    for(const d of data){const v=d[k];if(v<lo)lo=v;if(v>hi)hi=v;}
    if(hi===lo)hi=lo+1;
    g.strokeStyle=col;g.lineWidth=1.2;g.beginPath();
    for(let i=0;i<n;i++){
      const px=1+(n>1?(i/(n-1))*258:0);
      const py=78-((data[i][k]-lo)/(hi-lo))*76;
      i?g.lineTo(px,py):g.moveTo(px,py);
    }
    g.stroke();
  }
}

// （COV/POL/LAND/roadLoad/dem/fin），不新增模擬、只在 showStats() 開啟時呼叫（不加每幀成本）。
function cityAdvisor(){
  let zoned=0;
  const miss={police:0,fire:0,hospital:0,school:0,park:0};
  let polMax=-1,polX=0,polY=0,crimeMax=-1,crimeX=0,crimeY=0,jamMax=-1,jamX=0,jamY=0;
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){
    const i=idx(x,y),t=tiles[i],b=t.bld;
    if(b&&b.k<=3){
      zoned++;
      if(!(COV.police[i]>0))miss.police++;
      if(!(COV.fire[i]>0||COV.fire2[i]>0))miss.fire++;
      if(!(COV.hospital[i]>0||COV.clinic[i]>0))miss.hospital++;
      if(!(COV.school[i]>0))miss.school++;
      if(!(COV.park[i]>0))miss.park++;
      if(POL[i]>polMax){polMax=POL[i];polX=x;polY=y;}
      const cr=countNear(x,y,4,tt=>tt.bld&&tt.bld.k<=3&&tt.bld.crime);
      if(cr>crimeMax){crimeMax=cr;crimeX=x;crimeY=y;}
    }
    if(t.road){
      const cap=ROAD_CAP[(t.rc||2)-1],ld=cap>0?roadLoad[i]/cap:0;
      if(ld>jamMax){jamMax=ld;jamX=x;jamY=y;}
    }
  }
  const tips=[];
  const SVC_NM={police:['🚓 治安覆蓋不足','警察局'],fire:['🚒 消防覆蓋不足','消防局'],hospital:['🏥 醫療覆蓋不足','醫院或診所'],school:['🏫 教育覆蓋不足','學校'],park:['🌳 綠地覆蓋不足','公園']};
  if(zoned>0){
    for(const f in miss){
      const ratio=miss[f]/zoned;
      if(ratio>.2)tips.push({sev:ratio,text:SVC_NM[f][0]+'：'+Math.round(ratio*100)+'% 建築未受覆蓋 → 加蓋'+SVC_NM[f][1]});
    }
  }
  if(polMax>15)tips.push({sev:Math.min(1,polMax/60),text:'🏭 污染熱點：該處污染值達 '+polMax+' → 遠離污染源、多種樹或建污水廠',x:polX,y:polY});
  if(crimeMax>=2)tips.push({sev:Math.min(1,crimeMax/6),text:'🚨 犯罪熱點：鄰近聚集 '+crimeMax+' 處治安隱患 → 加蓋警察局',x:crimeX,y:crimeY});
  if(jamMax>1)tips.push({sev:Math.min(1,jamMax/2),text:'🚗 道路壅堵：負載達容量 '+Math.round(jamMax*100)+'% → 升級路級或增闢替代道路',x:jamX,y:jamY});
  const RCI_NM={1:'📈 住宅需求殷切 → 多劃住宅區',2:'📈 商業需求殷切 → 多劃商業區',3:'📈 工業需求殷切 → 多劃工業區'};
  let rciZ=0,rciV=.3;
  for(const z of[1,2,3])if(dem[z]>rciV){rciV=dem[z];rciZ=z;}
  if(rciZ)tips.push({sev:rciV,text:RCI_NM[rciZ]+'（需求 '+Math.round(rciV*100)+'%）'});
  if(fin.net<0)tips.push({sev:Math.min(1,-fin.net/40),text:'💰 財政吃緊：每日淨收入 '+fin.net.toFixed(1)+' → 調高稅率或減少維護支出'});
  tips.sort((a,b)=>b.sev-a.sev);
  return tips.slice(0,5);
}

function achRow(a){
  const meta=Object.assign({},ACH_META[a.id],a); // 舊 8 條靠 ACH_META 補 ic/desc/cat/prog；新條目自身已含全部欄位、Object.assign 後半段原樣覆蓋
  const done=!!ach[a.id];
  const lockedHidden=!!meta.hidden&&!done;
  const [cur,tgt]=meta.prog?meta.prog(achStats):[0,1];
  const pct=lockedHidden?0:clamp(Math.round(cur/Math.max(1,tgt)*100),0,100);
  const tierBadge=meta.tier?({bronze:'🥉',silver:'🥈',gold:'🥇'}[meta.tier]+' '):'';
  const nmTxt=lockedHidden?'？？？':tierBadge+meta.nm;
  const descTxt=lockedHidden?'尚未解鎖的隱藏成就':(meta.desc||'');
  const icTxt=lockedHidden?'❔':(meta.ic||'🏅');
  const barColor=done?'linear-gradient(90deg,#ffd977,#ffb347)':'linear-gradient(90deg,#5ec8ff,#7be08a)';
  const barHtml=lockedHidden?'':`<div class="row" style="background:#1c2340;border-radius:4px;height:6px;overflow:hidden;margin:2px 0"><div style="width:${pct}%;height:100%;background:${barColor}"></div></div>`;
  const progTxt=lockedHidden?'':`<span style="opacity:.7;font-size:11px">${cur}/${tgt}</span>`;
  return `<div class="row"${done?' style="color:#ffd977"':''}>${done?'✅':'⬜'} ${icTxt} <b>${nmTxt}</b>　${progTxt}</div>
    <div class="row" style="font-size:11px;opacity:.75">${descTxt}</div>
    ${barHtml}`;
}

function undo(){
  const g2=undoStack.pop();
  if(!g2){toast('沒有可撤銷的操作');return;}
  for(const sn of g2.snaps){
    tiles[sn.i]=JSON.parse(sn.s);
    const x=sn.i%N,y=(sn.i/N)|0;
    recalcMask(x,y);recalcMask(x,y-1);recalcMask(x+1,y);recalcMask(x,y+1);recalcMask(x-1,y);
    recalcFoamNear(x,y);recalcElMaskNear(x,y); // FIX-O：T121 遺留——快照還原後鄰域水岸泡沫/崖沿位罩需跟隨重算
  }
  money+=g2.spent;
  computePower();
  rebuildCov(); // T61：撤銷還原 tile 快照後全量重建覆蓋場最穩（只在撤銷時付費）
  recalcAllRailMasks(); // 撤銷含鋪軌/拆軌時遮罩一併補算（快照格只重算道路版，軌道走全量最穩）
  groundDirty=true; // T96：撤銷直接覆寫 tiles、繞過 doPlace，需另外標記地面層快取失效
  if(typeof drawMini==='function')drawMini();
  toast('↩️ 已撤銷（退還 $'+Math.round(g2.spent)+'）');sTick();
}

// 存檔槽：SAVEKEY.s1/.s2/.s3；目前槽記在 SAVEKEY.slot（預設1）
function slotKey(n){return SAVEKEY+'.s'+n;}
function curSlot(){const n=+localStorage.getItem(SAVEKEY+'.slot');return n>=1&&n<=3?n:1;}
function setSlot(n){localStorage.setItem(SAVEKEY+'.slot',n);}
// 讀某槽概要（給槽位面板用）：{nm,pop,day} 或 null
function slotInfo(n){
  try{
    const raw=localStorage.getItem(slotKey(n));
    if(!raw)return null;
    const d=JSON.parse(raw);
    if(d.v!==1)return null;
    let p=0;for(const b of d.bl||[])if(b[1]===1)p+=POPS[b[2]]||0;
    return{nm:d.nm||'微光小鎮',pop:p,day:d.day||1};
  }catch(e){return null;}
}
function save(){
  try{
    const bl=[];
	    let ter='',tre='',rd='',zn='',dc='',rn='',rc='',rcl='',wp='',el='',bs='',cm='',sk='',dt='',skd='',dtd='';
	    let rl='',rb='',dk='',ow='',tl='',pm='',bln='',tr='',of='',fl='',le='',ab=''; // T39-T60
	    let ctr=''; // T117：隕石坑（可選欄位）
	    const rdepArr=[]; // T140：資源耗損（稀疏可選欄位，僅收錄已開採格 [i,累計開採量]）
    for(let i=0;i<N*N;i++){
      const t=tiles[i];
      ter+=t.t;tre+=t.tree;zn+=t.zone;dc+=t.deco;rn+=t.ruin?1:0;rc+=t.rdec?1:0;rcl+=String.fromCharCode(48+(t.rc||0));wp+=t.wp?1:0;el+=t.el?1:0;bs+=t.bus?1:0; // bs：公車站（T26）
      rd+=t.road?(t.hw?(t.bridge?4:3):(t.bridge?2:1)):0; // 0無 1路 2橋 3高速 4高速橋（T21）
      cm+=t.bld&&t.bld.crime?1:0;                        // 犯罪標記（T32）
      sk+=t.bld&&t.bld.sick?1:0;                        // 生病標記（T33）
      dt+=t.bld&&t.bld.death?1:0;                       // 死亡標記（T38）
      skd+=t.bld&&t.bld.sick?(''+Math.min(9,t.bld.sickDays||0)):'0';   // 生病天數（FIX-A，上限9；舊檔缺 skd 容錯）
	      dtd+=t.bld&&t.bld.death?(''+Math.min(9,t.bld.deathAge||0)):'0';  // 死亡天數（FIX-A，上限9；舊檔缺 dtd 容錯）
	      rl+=t.rail?1:0;rb+=t.railBridge?1:0;dk+=t.dock?1:0; // T39-T40
	      ow+=t.oneway||0;tl+=t.light?1:0;pm+=t.parkMeter?1:0; // T42-T43
	      bln+=t.busLane?1:0;tr+=t.tram?1:0;of+=t.office?1:0; // T44-T45
	      fl+=t.flood?1:0;le+=t.levee?1:0;ab+=t.abandoned?1:0; // T56-T58
	      ctr+=t.crater?1:0; // T117：隕石坑
	      if(RDEP[i])rdepArr.push([i,RDEP[i]]); // T140：資源耗損（僅非零格才收錄，稀疏）
      if(t.bld&&!t.bld.ref){                             // 多格建築只存 root（T22）
        const e=[i,t.bld.k,t.bld.lv,t.bld.v,t.bld.age];
        if(t.bld.k===9)e.push(t.bld.sz||2);              // k=9：第 6 位存 sz（fire 永不發生在 k=9，無歧義，T22）
        else if(t.bld.fire)e.push(t.bld.fire);
        if(t.bld.k===1&&t.bld.den&&t.bld.den!==3){      // k=1：第 6/7 位存密度 den（T30）
          if(!t.bld.fire)e.push(0);                      // 無火災時補 0 占位，避免 den 誤判為 fire
          e.push(t.bld.den);
        }
        if(t.bld.k===1&&t.bld.we!==undefined&&t.bld.we!==1){ // T123：第 8 位存財富 we（沿用 sz/den 尾端可選位先例，僅非預設中產才落盤）
          if(e.length<6)e.push(0);                       // 補齊 fire 佔位（第 6 位）
          if(e.length<7)e.push(t.bld.den||3);             // 補齊 den 佔位（第 7 位）
          e.push(t.bld.we);
        }
        bl.push(e);
      }
    }
    const data={v:1,gameVer:GAME_VER,seed,money:Math.round(money),day,msIdx,
      cam:{x:Math.round(cam.x),y:Math.round(cam.y),z:cam.z},ter,tre,rd,zn,dc,rn,rc,rcl,wp,el,bs,cm,sk,dt,skd,dtd,bl,ach:Object.keys(ach),nm:townName,
      ln:loan?[loan.remain,loan.daily]:null,star:bestStar,
      rl,rb,dk,ow,tl,pm,bln,tr,of,fl,le,ab,pol,region, // T39-T60 新欄位（可選）
      ctr, // T117：隕石坑（可選欄位，仿 flood/ruin 先例）

      if(k===9){                                         // 體育場：第 6 位是 sz，重建 root＋3 個 ref 格（T22）

      }

    if(d.sk)for(let i=0;i<N*N;i++){const b=tiles[i].bld;if(b&&b.k===1&&+d.sk[i])b.sick=1;} // 生病標記（T33，舊檔無 sk 則無生病）
    if(d.dt)for(let i=0;i<N*N;i++){const b=tiles[i].bld;if(b&&b.k===1&&+d.dt[i])b.death=1;} // 死亡標記（T38，舊檔無 dt 則無死亡）

    if(d.dtd)for(let i=0;i<N*N;i++){const b=tiles[i].bld;if(b&&b.k===1&&b.death){const v=+d.dtd[i];if(v)b.deathAge=v;}} // 死亡天數延續（FIX-A，舊檔缺 dtd 則預設 0）
    money=d.money;day=d.day;townName=d.nm||'微光小鎮';document.title=townName+' · 微光小鎮';msIdx=d.msIdx||0;ach={};for(const id of d.ach||[])ach[id]=1;achStats={bridges:0,parks:0,plants:0,nI:0,roads:0,svcTypes:0,towers:0,so:0,wi:0,st:0,po:0,ai:0,tr:0,un:0}; // T134：成就快照成對重置（鐵律7，下一次 tick() 即重算，不影響存讀檔本體）

    scenario=(d.sc&&d.sc.id)?{id:d.sc.id,startDay:d.sc.startDay||d.day,hold:d.sc.hold||0}:null; // T132：場景戰役進度（可選欄位，舊檔缺 sc 則回一般模式，鐵律7成對重置）
    editMode=false;customScenario=null; // T135：讀取常規存檔視為離開編輯器、清空自製場景定義（鐵律7；編輯器產物本就不入常規存檔，故無對應欄位可還原）
    weather=0;wxT=3+ri(5);flashT=0;rainDays=0;wSeason=-1;shakeT=0;quakeRecover=0;tornado=null;drought=false;blizzard=null;leakDays.fill(0);fog=null; // T154：霧（純視覺、不進存檔）隨其餘天氣殘留成對歸零（鐵律7）｜FIX-L：天氣/災害殘留狀態重置（比照 newWorld() 的 FIX-K）——weather/wxT/rainDays/quakeRecover 會改變 tick() 內 R() 消耗次數，不重置則同存檔跨分頁（分頁歷史不同時）讀檔後模擬分岔；wxT 用 ri 於上方 R 重設之後擲骰，天然種子化；T116：龍捲風不進存檔，讀檔強制消散；T137：乾旱/暴風雪/工業洩漏皆運行時狀態，讀檔強制歸零消散
    cam.x=d.cam.x;cam.y=d.cam.y;cam.z=ZOOMS[zoomIdx(clamp(d.cam.z||2,ZOOMS[0],4))];zoomAnim=null; // FIX-M：讀檔 z 就近落 T106 階梯（含遠景檔），並清掉殘留換檔緩動
    recalcAllMasks();

    commuteLoad.fill(0);commutePass.fill(0);commutePenalty.fill(0);commuteUnreach.fill(0);commuteClusters.length=0; // T141：通勤運行時場/叢集快取不入存檔，讀檔成對歸零（鐵律7）
    recomputeLandDynamic(); // T130：load() 內 rebuildCov 先於本行執行，roadLoad 歸零後補算一次，確保 LAND 壅堵項與歸零後狀態同步（鐵律7）

      const pcells=[];

let lastT=performance.now(),hudT=0,running=false,lastDraw=0;
// 推進遊戲邏輯（dtReal 不截斷，動畫另外截斷）
function advance(dtReal){
  updateZoomAnim(dtReal); // T108：縮放緩動插值入口，與模擬節奏（speed/tick）分離，真實時間驅動
  visT+=Math.min(dtReal,2);
  simAcc+=dtReal*speed;
  let steps=0;
  while(simAcc>=DAYLEN&&steps<8){simAcc-=DAYLEN;tick();steps++;}
  if(steps>=8)simAcc=0; // 落後太多就放棄追趕
  const dtA=Math.min(.05,dtReal);
  updCars(dtA);
  updTrains(dtA);updTrams(dtA);updShips(dtA);updAmbulances(dtA);updFireTrucks(dtA);updGarbageTrucks(dtA); // T119：消防車/垃圾車與救護車同為每幀出勤更新
  updSmoke(dtA);
  updRain(dtA);
  updFxParts(dtA);updConfetti(dtA); // T159：粒子特效（塵土/碎屑/火花餘燼/落葉/尾氣/彩帶），與煙/雨同為每幀動畫更新
  updBuses(dtA);   // 公車巡迴（T26）：與 cars/smoke/rain 同為每幀動畫更新
  updRouteBuses(dtA); // T120：路線公車，與一般公車同幀更新
}
function frame(ts){
  requestAnimationFrame(frame);
  if(!running){lastT=ts;return;}
  const dt=Math.max(0,Math.min(2,(ts-lastT)/1000));
  lastT=ts;
  advance(dt);
  draw(Math.min(.05,dt));
  lastDraw=performance.now();
  hudT+=dt;
  if(hudT>.25){hudT=0;updHud();}
}
requestAnimationFrame(frame);
// rAF 被瀏覽器暫停（分頁隱藏／省電）時，用計時器低頻接手，遊戲不會凍結
setInterval(()=>{
  if(!running)return;
  const now=performance.now();
  if(now-lastDraw<400)return; // rAF 正常時不介入
  const dt=Math.max(0,Math.min(2,(now-lastT)/1000));
  lastT=now;
  advance(dt);
  draw(.05);
  lastDraw=now;
  updHud();
},250);

  if(fresh){

  if(!hasSave||fresh)checkHints(0,0);
}

/* 除錯／測試用 API（不影響一般遊玩） */
window.GV={
  N:()=>N,
  newWorld:()=>{newWorld();return true;},
  newWorldSeeded:(sd)=>{newWorld(sd);return true;},
  save:()=>{save();return true;},
  load:()=>load(curSlot()),
  place:(t,x,y)=>doPlace(t,x,y,true),
  center:()=>toTile(cvs.clientWidth/2,cvs.clientHeight/2),
  tile:(x,y)=>inMap(x,y)?JSON.parse(JSON.stringify(T(idx(x,y)))):null,
  cov:(f,x,y)=>COV[f]?.[idx(x,y)], // T61：覆蓋場除錯鉤子（回傳該格某設施覆蓋計數）
  rebuildCov:()=>{rebuildCov();return true;}, // T61：手動重建覆蓋場（對照測試用）

  wealthAt:(x,y)=>{if(!inMap(x,y))return null;const b=T(idx(x,y)).bld;return(b&&b.k===1)?(b.we!==undefined?b.we:1):null;}, // T123：住宅財富級除錯鉤子（0貧/1中/2富，非住宅回 null）
  landAt:(x,y)=>inMap(x,y)?LAND[idx(x,y)]:null, // T130：地價場除錯鉤子
  eduAt:(x,y)=>inMap(x,y)?EDU[idx(x,y)]:null, // T142：教育場除錯鉤子
  resourceAt:(x,y)=>inMap(x,y)?RESOURCE[idx(x,y)]:null, // T140：資源層除錯鉤子（0無/1油/2礦，由種子決定不受耗損影響）
  supplies:()=>supplies, // T140：資源供應品全域存量
  rdepAt:(x,y)=>inMap(x,y)?RDEP[idx(x,y)]:null, // T140：該格累計已開採量除錯鉤子（供存讀檔耗損往返驗收）
  resourceStock:()=>RESOURCE_STOCK, // T140：測試用——單格資源總開採量上限
  loadAt:(x,y)=>inMap(x,y)?+roadLoad[idx(x,y)].toFixed(4):null, // T129：道路壅堵場除錯鉤子
  roadCapAt:(x,y)=>{if(!inMap(x,y))return null;const t=T(idx(x,y));return t.road?ROAD_CAP[(t.rc||2)-1]:null;}, // T129：查詢該格道路容量
  setLoadAt:(x,y,v)=>{if(!inMap(x,y))return false;roadLoad[idx(x,y)]=+v||0;return true;}, // T129：測試用強制設定 load（跳過自然車流累積，供驗收快速觸發過載情境）
  commuteLoad:()=>{let unreachable=0;for(let i=0;i<N*N;i++)if(commuteUnreach[i])unreachable++;return{clusters:commuteClusters.length,unreachable};}, // T141：通勤場彙總鉤子（叢集快取數／全城不可達住宅數）
  commuteAt:(x,y)=>inMap(x,y)?+commuteLoad[idx(x,y)].toFixed(4):null, // T141：通勤場除錯鉤子（該格由通勤 trip 貢獻的衰減式移動平均 load，供驗證「沿路上升」）
  commutePenaltyAt:(x,y)=>inMap(x,y)?+commutePenalty[idx(x,y)].toFixed(4):null, // T141：測試用——該格住宅通勤懲罰快取值（happyParts「通勤」項/judgeWealth 附加項讀取的同一份數值）
  commuteUnreachAt:(x,y)=>inMap(x,y)?!!commuteUnreach[idx(x,y)]:null, // T141：測試用——該格住宅是否被判定通勤不可達（孤島）
  recomputeCommute:()=>{computeCommute();return true;}, // T141：測試用——手動觸發叢集快取重算（跳過 COMMUTE_PERIOD 天數門檻）
  setSpeed:s=>{speed=s;},
  setDay:d=>{day=d;return day;},                                // 設模擬天數（T18 測試用；季節由 day 導出）
  season:()=>({idx:season(),name:SEASON_NAME[season()],icon:SEASON_ICON[season()],farmMult:FARM_SEASON_MULT[season()],powerMult:POWER_SEASON_MULT[season()],tourMult:TOUR_SEASON_MULT[season()]}), // T136 測試用：目前季節快照（0春/1夏/2秋/3冬）
  setSeason:(s)=>{s=clamp(s|0,0,3);day=[1,101,201,301][s];return{idx:season(),name:SEASON_NAME[season()],icon:SEASON_ICON[season()],farmMult:FARM_SEASON_MULT[season()],powerMult:POWER_SEASON_MULT[season()],tourMult:TOUR_SEASON_MULT[season()]};}, // T136 測試用：直接跳到指定季節第一天（同 setDay 屬 sim 鉤子，季節純由 day 導出不需額外欄位），回傳形狀與 GV.season() 一致
  ignite:(x,y)=>{if(!inMap(x,y))return false;const b=T(idx(x,y)).bld;if(b&&b.k<=3){b.fire=1;return true;}return false;},
  igniteCrime:(x,y)=>{if(!inMap(x,y))return false;const b=T(idx(x,y)).bld;if(b&&b.k<=3){b.crime=1;return true;}return false;},
  clearCrime:(x,y)=>{if(!inMap(x,y))return false;const b=T(idx(x,y)).bld;if(b&&b.k<=3){b.crime=0;return true;}return false;},
  igniteSick:(x,y)=>{if(!inMap(x,y))return false;const b=T(idx(x,y)).bld;if(b&&b.k===1){b.sick=1;return true;}return false;},
  clearSick:(x,y)=>{if(!inMap(x,y))return false;const b=T(idx(x,y)).bld;if(b&&b.k===1){b.sick=0;return true;}return false;},
  igniteDeath:(x,y)=>{if(!inMap(x,y))return false;const b=T(idx(x,y)).bld;if(b&&b.k===1){b.death=1;b.deathAge=0;b.sick=0;return true;}return false;},
  clearDeath:(x,y)=>{if(!inMap(x,y))return false;const b=T(idx(x,y)).bld;if(b&&b.k===1){b.death=0;b.deathAge=0;return true;}return false;},
  weather:(w)=>{weather=clamp(w|0,0,2);wxT=99;return weather;}, // 強制設天氣（測試用，鎖住不換態）
  flash:()=>{flashT=.4;sThunder();return true;},               // 強制觸發閃電（測試用）
  fog:(days)=>{if(days!==undefined)fog={days:clamp(days|0,1,30)};return fog?{...fog}:null;}, // T154 測試用：強制觸發（或查詢）霧，不受 disastersOn 管轄（純視覺天氣，非災害）；無參數呼叫僅回傳現況、不改動狀態
  rainDays:()=>rainDays,                                       // T154 測試用：曝光既有 rainDays（T57「連續雨天計數」），驗證濕地反光／積雪疊加強度換算
  daylightDbg:()=>daylight(),                                  // T149 測試用：直接曝光既有 daylight() 回傳值（b/dusk/ph/d），純讀取、零新邏輯，供光影驗收精確判斷日夜相位
  snowCapDbg:(s)=>snowCap(s),                                   // T183 測試用：曝光屋頂積雪雪帽生成器（純既有像素 canvas 操作、不消耗 R()），供單元驗證頂部加白＋剪影遮罩正確，接受 {img,w,h} 合成 sprite
  smokeCount:()=>smokes.length,                                 // T185 測試用：曝光目前煙粒數（比照 fxCount），供冬季民居炊煙驗證
  setVisT:(v)=>{visT=+v||0;return visT;},                       // T149 測試用：直接設定 visT（僅影響渲染晝夜相位，不寫入存檔、不影響 tick()/day 模擬節奏），供光影驗收鎖定精確相位
  forceDraw:()=>{draw(.016);return true;},                      // T149 測試用：同步立即觸發一次 draw()（§11 不變量 7：渲染不改遊戲狀態，重複呼叫安全），供像素回歸在同一輪事件迴圈內連續比對，避開背景模擬（day/車輛/水面幀）跨呼叫真實時間漂移雜訊
  setZoom:(z)=>{cam.z=+z||1;zoomAnim=null;return cam.z;},        // T149 測試用：直接設定 cam.z（沿用既有 zoomStep 寫入同一變數），供驗證 T107 z<0.5 LOD 門檻正確跳過光影
  lookAt:(x,y)=>{cam.x=(x-y)*32;cam.y=(x+y)*16;zoomAnim=null;return[cam.x,cam.y];}, // T183 測試用：把相機中心對準 tile(x,y)（沿用 newWorld 初始置中同款公式 (x-y)*32/(x+y)*16 寫入既有 cam.x/y），純渲染鏡頭定位不改模擬/存檔，解決既有 GV.center() 只回座標不移鏡頭之驗證痛點
  titleForceDraw:(ts)=>{ensureTitleBgSize();drawTitleBg(ts!==undefined?+ts:performance.now());return true;}, // T158 測試用：同步立即觸發一次標題背景重繪（比照 forceDraw 同款用途），供背景分頁 rAF 停擺時的像素回歸／動態取樣繞開真實時間等待
  titleAnimOn:()=>!!titleRAF,                                   // T158 測試用：曝光標題動畫 rAF 是否在跑，驗證進遊戲後 stopTitleAnim() 已 cancelAnimationFrame（無殘留）
  addMoney:v=>{money+=v;return Math.round(money);},            // 測試用資金調整
  canPlaceTool:(t,x,y)=>canPlace(t,x,y),                       // 測試用建造可行性
  buses:()=>buses.map(b=>({x:b.x,y:b.y,stop:[b.stop%N,(b.stop/N)|0],p:+b.p.toFixed(2),wait:+b.wait.toFixed(2),moving:!!b.path})), // 公車運行快照（T26 測試用）
  busRoutes:()=>busRoutes.map(rt=>({stops:rt.stops.map(i=>[i%N,(i/N)|0])})),         // T120 測試用：目前 3 條路線快照（座標陣列）
  setBusRoute:(r,pts)=>{ // T120 測試用：直接設定路線（pts＝[[x,y],...] 或站點 idx 陣列），繞過 UI 點選
    r=clamp(r|0,0,2);
    const stops=(pts||[]).map(p=>Array.isArray(p)?idx(p[0],p[1]):p).filter(i=>i>=0&&i<N*N&&tiles[i]&&tiles[i].bus).slice(0,8);
    busRoutes[r].stops=stops;
    return busRoutes[r].stops.map(i=>[i%N,(i/N)|0]);
  },
  routeBuses:()=>rbuses.map(b=>({r:b.r,x:b.x,y:b.y,si:b.si,dir:b.dir,p:+b.p.toFixed(2),wait:+b.wait.toFixed(2),moving:!!b.path})), // T120 測試用：路線公車位置快照
  busRtCovPop:()=>busRtCovPop, // T120 測試用：路線覆蓋住宅人口折抵基準
  step:(n)=>{n=clamp(n|0,1,60);for(let i=0;i<n;i++)tick();return day;}, // 手動推進 n 個模擬日（測試用，同 setDay 屬 sim 鉤子）
  advanceN:(dt,n)=>{dt=+dt||0.05;n=clamp(n|0,1,6000);for(let i=0;i<n;i++)advance(dt);return day;}, // T119 測試用：以固定 dt 推進 n 幀（車輛出勤等每幀動畫系統於 headless 環境亦可決定性重放，同 step() 屬 sim 鉤子）
  stats:()=>{let b=0,r=0,z=0,pw=0,f=0,ru=0;
    for(let i=0;i<N*N;i++){const t=tiles[i];
      if(t.bld){b++;if(t.bld.pw)pw++;if(t.bld.fire)f++;}
      if(t.ruin)ru++;
      if(t.road)r++;if(t.zone)z++;}
    return{money:Math.round(money),pop,jobs,day,buildings:b,poweredBld:pw,
      roads:r,zones:z,happy:+cityHappy.toFixed(2),dem:{...dem},cars:cars.length,fires:f,ruins:ru,weather,buses:buses.length};},
  composer:composer,
  npu:npuComposer,
  ver:()=>GAME_VER,
  pol:(p)=>{if(p&&typeof p==='object')pol={taxR:p.taxR??1,taxC:p.taxC??1,taxI:p.taxI??1,curfew:!!p.curfew,recycle:!!p.recycle,tourPromo:!!p.tourPromo,ecoReg:!!p.ecoReg};return pol;}, // T122：擴四布林（法規開關，測試用整組覆寫，taxR/taxC/taxI 既有覆寫語義不變）
  quake:()=>{if(!disastersOn)return false;shakeT=.55;quakeRecover=20;return true;},
  tornado:()=>{ // T116：手動觸發龍捲風（受災害總開關管轄，仿 quake() 慣例）
    if(!disastersOn)return false;
    const tx0=ri(N),ty0=ri(N);
    let tdx=ri(3)-1,tdy=ri(3)-1;if(!tdx&&!tdy)tdx=1;
    tornado={x:tx0,y:ty0,dx:tdx,dy:tdy,life:18+ri(18)};
    toast('🌪️ 龍捲風來襲！沿途建築恐成廢墟','bad',tx0,ty0);sErr();
    return true;
  },
  meteor:(x,y)=>{if(!disastersOn)return false;return meteorStrike(x,y);}, // T117：手動觸發隕石（指定落點，仿 ignite(x,y) 慣例＋受災害總開關管轄）
  riot:()=>{ // T118：手動觸發暴亂（需實際低幸福＋高犯罪住宅簇存在才成功，仿 tick() 內同款判定但跳過每日機率骰）
    if(!disastersOn||cityHappy>=.3)return false;
    const hot=[];
    for(let i=0;i<N*N;i++){
      const b=tiles[i].bld;
      if(!b||b.k!==1||b.ref)continue;
      const hx=i%N,hy=(i/N)|0;
      if(countNear(hx,hy,4,tt=>tt.bld&&tt.bld.k<=3&&tt.bld.crime)>=2)hot.push(i);
    }
    if(!hot.length)return false;
    const cells=hot.slice(0,10);
    for(const ci of cells){const cb=tiles[ci].bld;if(cb)cb.riot=1;}
    riot={cells,days:10+ri(10)};
    toast('🔥 暴亂爆發！封鎖道路，警局可自然平息或付費鎮壓','bad',cells[0]%N,(cells[0]/N)|0);sErr();
    return true;
  },
  plague:()=>{ // T137：手動觸發瘟疫（需實際存在高密度＋無醫療覆蓋住宅簇才能成功，仿 GV.riot() 慣例跳過每日機率骰）
    if(!disastersOn)return false;
    const hot=[];
    for(let i=0;i<N*N;i++){
      const b=tiles[i].bld;
      if(!b||b.k!==1||b.ref||b.plague)continue;
      if(COV.clinic[i]>0||COV.hospital[i]>0)continue;
      const hx=i%N,hy=(i/N)|0;
      if(countNear(hx,hy,3,tt=>tt.bld&&tt.bld.k===1)>=PLAGUE_DENSITY)hot.push(i);
    }
    if(!hot.length)return false;
    const cells=hot.slice(0,10);
    for(const ci of cells){const cb=tiles[ci].bld;if(cb)cb.plague=1;}
    plague={cells,days:12+ri(10)};
    toast('🦠 瘟疫爆發！人口密集區疫情蔓延，醫院覆蓋或隔離可平息','bad',cells[0]%N,(cells[0]/N)|0);sErr();
    return true;
  },
  drought:()=>{ // T137：手動觸發乾旱（需當下為夏季，仿 quake() 慣例受災害總開關管轄）
    if(!disastersOn||season()!==1)return false;
    drought=true;
    toast('☀️ 乾旱來襲！供水吃緊、火險升高，入秋自動解除','bad',N>>1,N>>1);
    return true;
  },
  blizzard:()=>{ // T137：手動觸發暴風雪/沙暴（依當下季節挑選視覺類型，仿 quake() 慣例）
    if(!disastersOn)return false;
    const sea2=season();
    blizzard={days:4+ri(4),type:sea2===3?'snow':'sand'};
    toast(sea2===3?'🌨️ 暴風雪來襲！道路能見度驟降、車行幾近癱瘓':'🏜️ 沙暴來襲！道路能見度驟降、車行幾近癱瘓','bad',N>>1,N>>1);
    return true;
  },
  leak:(x,y)=>{ // T137：手動觸發工業洩漏（指定工業建築座標，仿 ignite(x,y) 慣例＋受災害總開關管轄）
    if(!disastersOn||!inMap(x,y))return false;
    const b=T(idx(x,y)).bld;
    if(!b||b.k!==3)return false;
    b.fire=1;startLeak(x,y);
    return true;
  },
  flood:()=>{if(!disastersOn)return false;let n=0;for(let i=0;i<N*N&&n<12;i++){const t=tiles[i];if(t.t===2&&!t.levee&&countNear(i%N,(i/N)|0,1,tt=>tt.t===0)){t.flood=1;n++;}}if(n)groundDirty=true;return n;}, // T96：直接改 tile 繞過 doPlace/tick，需另外標記快取失效；FIX-O：對齊 quake/tornado/meteor/riot，disastersOn=false 時不執行
  trains:()=>trains.length,
  trams:()=>tramCars.length,
  ships:()=>cargoShips.length,
  ambulances:()=>ambulances.length,                              // T119 測試用：出勤中救護車數
  ladderTrucks:()=>ladderTrucks.length,                           // T119 測試用：出勤中消防車數
  garbageTrucks:()=>recycleTrucks.length,                         // T119 測試用：巡邏中垃圾車數
  svcTrucks:()=>({ladder:ladderTrucks.map(c=>({x:c.x,y:c.y,tx:c.tx,ty:c.ty,p:+c.p.toFixed(2)})),recycle:recycleTrucks.map(c=>({x:c.x,y:c.y,tx:c.tx,ty:c.ty,p:+c.p.toFixed(2)}))}), // T119 測試用：位置快照（仿 GV.buses() 慣例）
  garbLocalAt:(x,y)=>inMap(x,y)?garbLocal[idx(x,y)]:null,         // T119 測試用：該格住宅局部垃圾係數
  svcResponseSample:()=>({amb:svcSamples.amb.slice(),fire:svcSamples.fire.slice()}), // T145：救護車/消防車到場 tick 數樣本快照（最近至多20筆，供驗證壅堵前後到場延遲差異，判準17可觀測）
  svcResponseReset:()=>{svcSamples={amb:[],fire:[]};return true;}, // T145：測試用——清空樣本，供驗收前後對照乾淨起算
  setChallenge:(id,bonus=1000)=>{challenge={id,bonus,label:id};return challenge;},
  region:()=>({...region}),
  food:()=>foodPoints,
  tourists:()=>tourists,
  hist:()=>hist.map(h=>({...h})),                              // T112 測試用：歷史曲線緩衝快照
  log:()=>log.map(l=>({...l})),                                 // T114 測試用：通知中心日誌快照
  unread:()=>unread,                                             // T114 測試用：目前未讀數
  diff:()=>diff,                                                  // T115 測試用：目前難度 0-3
  setDiff:(d)=>{diff=clamp(d|0,0,3);return diff;},                // T115 測試用：直接設難度（不經開始畫面）
  happyBreakdown:()=>happyAgg.map(p=>({...p})),                   // T111 測試用：幸福構成城市平均值快照 [{name,val}]
  scenarios:()=>SCENARIOS.map(s=>({id:s.id,name:s.name,goal:{...s.goal},done:!!scDone[s.id]})), // T132 測試用：8 關清單快照＋通關狀態
  scenario:()=>scenario?{...scenario}:null,                       // T132 測試用：目前進行中場景（null＝一般/沙盒/挑戰模式）
  scDone:()=>({...scDone}),                                       // T132 測試用：已通關場景 id 集合快照
  startScenario:(id)=>{const s=SCENARIOS.find(x=>x.id===id);if(!s)return false;challenge=null;pendingScenario=s;begin(true);return true;}, // T132 測試用：繞過選單直接開始指定關卡（等同真點擊該場景按鈕）
  clearScDone:()=>{scDone={};try{localStorage.removeItem(SAVEKEY+'.scDone');}catch(e){}return true;},      // T132 測試用：清空通關記錄（回歸測試用）
  rank:()=>({idx:rankIdx,lv:rankIdx+1,name:RANKS[rankIdx].name,unlock:RANKS[rankIdx].unlock||null,points:cityPoints,next:RANKS[rankIdx+1]?{...RANKS[rankIdx+1]}:null}), // T133 測試用：目前城市等級快照
  cityPoints:()=>cityPoints, // T133 測試用：目前城市點數（tick() 每日重算）
  achs:()=>ACHS.map(a=>{const m=Object.assign({},ACH_META[a.id],a);return{id:a.id,nm:m.nm,cat:m.cat,tier:m.tier||null,chain:m.chain||null,hidden:!!m.hidden,done:!!ach[a.id]};}), // T134 測試用：全部成就定義快照（不洩漏隱藏成就達成條件本身，僅回傳中繼資料）
  achDone:()=>Object.keys(ach), // T134 測試用：已解鎖成就 id 陣列（與存檔 ach 欄位同格式）
  achStats:()=>({...achStats}), // T134 測試用：成就檢查用指標快照（tick() 每日重算）
  forceAch:(id)=>{if(!ACHS.some(a=>a.id===id))return false;if(!ach[id]){ach[id]=1;}return true;}, // T134 測試用：強制標記成就已解鎖（跳過每日 t() 判定與 toast，僅供面板/存讀檔回歸測試，不影響任何模擬狀態）
  editorOn:()=>editMode,                                          // T135 測試用：目前是否處於編輯器模式
  editorEnter:()=>{challenge=null;pendingScenario=null;diff=3;begin(true);editMode=true;const b=$('#bEditor');if(b)b.style.display='block';return editMode;}, // T135 測試用：繞過開始畫面按鈕，等同點擊「🛠 編輯器」
  editorExit:()=>{editMode=false;diff=1;const b=$('#bEditor');if(b)b.style.display='none';return true;}, // T135 測試用：等同面板內「🚪 離開編輯器」
  editorGoal:()=>({...editorGoal}),                               // T135 測試用：目前編輯器目標草稿快照
  editorSetGoal:(g)=>{Object.assign(editorGoal,g||{});return {...editorGoal};}, // T135 測試用：直接設定目標草稿（繞過 prompt() UI）
  editorExportCode:()=>{const d=buildEditorShareData();if(!d)return null;try{return encodeShare(d);}catch(e){return null;}}, // T135 測試用：不經剪貼簿/prompt，直接回傳擴充版分享碼字串
  importCode:(code)=>importShareCode(code),                       // T135 測試用：不經 prompt() 直接匯入指定分享碼（舊版/擴充版皆可），回傳是否成功
  customScenario:()=>customScenario?{...customScenario}:null,     // T135 測試用：目前由分享碼匯入的自製場景定義（null＝無）
  disasters:()=>({types:['flood','quake','fire','tornado','meteor','riot','plague','drought','blizzard','leak'],count:10,on:disastersOn}), // T137 測試用：災害總數枚舉（既有6種＋本卡新增4種＝10）
  plagueDays:()=>plague?plague.days:0,             // T137 測試用：瘟疫剩餘天數（0＝無瘟疫）
  droughtOn:()=>drought,                            // T137 測試用：目前是否處於乾旱
  blizzardAt:()=>blizzard?{...blizzard}:null,       // T137 測試用：目前暴風雪/沙暴狀態快照
  leakDaysAt:(x,y)=>inMap(x,y)?leakDays[idx(x,y)]:null, // T137 測試用：該格工業洩漏剩餘天數
  trace:(factor)=>{ // T143 測試用：依因子鍵掃出貢獻來源格並設 traceOverlay（等同面板點擊），回傳 tiles 陣列快照；未知/無來源格回傳 null 且不改動 traceOverlay
    const tl=traceFactor(factor);
    if(!tl||!tl.length)return null;
    traceOverlay={factor,tiles:tl};
    return tl.map(t=>({...t}));
  },
  traceOverlay:()=>traceOverlay?{factor:traceOverlay.factor,tiles:traceOverlay.tiles.map(t=>({...t}))}:null, // T143 測試用：目前因果追溯疊圖狀態快照（null＝未啟用）
  clearTrace:()=>{traceOverlay=null;return true;}, // T143 測試用：手動清除因果追溯疊圖（等同關面板/再點同因子）
  ambientLevels:()=>{ // T144 測試用：環境音四層目前增益（0-1，即時讀 GainNode.gain.value 正規化，非快取值）；音效關閉/未啟動時全 0
    const r={on:ambientBus.on};
    for(const k of AMBIENT_LAYERS)r[k]=ambientBus.layers[k]?+(ambientBus.layers[k].gain.gain.value/(AMBIENT_VOL[k]||1)).toFixed(4):0;
    return r;
  },
  fxCount:()=>fxParts.length,                                    // T159 測試用：目前世界空間粒子總數（塵土/碎屑/火花/落葉/尾氣）
  fxCountByType:()=>{const m={};for(const p of fxParts)m[p.ty]=(m[p.ty]||0)+1;return m;}, // T159 測試用：依類型分組計數
  fxCap:()=>fxCap(),                                              // T159 測試用：目前效能檔下的世界空間粒子上限
  confettiCount:()=>confetti.length,                              // T159 測試用：目前彩帶粒子數
  confettiCap:()=>confettiCap(),                                  // T159 測試用：目前效能檔下的彩帶上限
  fxTest:(ty,x,y,d)=>{ // T159 測試用：直接觸發指定粒子類型（繞過真實觸發條件如 doPlace/fire/milestone，供驗收快速抽樣個別效果，不改動任何模擬狀態）
    if(!inMap(x,y))return false;
    if(ty==='dust')spawnDust(x,y);
    else if(ty==='debris')spawnDebris(x,y);
    else if(ty==='ember')spawnEmber(x,y);
    else if(ty==='leaf')spawnLeaf(x,y);
    else if(ty==='exhaust')spawnExhaust(x,y,d|0);
    else if(ty==='confetti')spawnConfetti();
    else return false;
    return true;
  }
};

if('serviceWorker' in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
