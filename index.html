<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d1226">
<meta name="mobile-web-app-capable" content="yes">
<title>微光小鎮 Glimmerville</title>
<style>
/* ============================================================
   微光小鎮 Glimmerville — 原創等距像素城市建造小遊戲
   全部美術以 Canvas 程式化手繪，無任何外部素材。
   ============================================================ */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#0d1226;
  font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",system-ui,sans-serif;
  user-select:none;-webkit-user-select:none;touch-action:none}
#game{position:absolute;inset:0;width:100%;height:100%;display:block;
  image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none;cursor:grab}
#game.build{cursor:crosshair}
/* ---------- 頂部資訊列 ---------- */
#hud{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;gap:6px;
  padding:5px 8px;background:rgba(10,14,26,.86);border-bottom:2px solid #2c3450;
  color:#dfe6f5;font-size:13px;z-index:20;flex-wrap:wrap}
.chip{display:flex;align-items:center;gap:4px;background:#181f36;border:1px solid #303a5c;
  border-radius:6px;padding:2px 8px;white-space:nowrap;line-height:20px}
.chip b{font-weight:700;color:#fff}
#money b{color:#ffd977}
#hud .spacer{flex:1}
.hbtn{background:#232c4a;border:1px solid #3a4670;color:#dfe6f5;border-radius:6px;
  padding:2px 9px;font-size:13px;line-height:22px;cursor:pointer}
.hbtn:active{background:#31407a}
.hbtn.on{background:#3a5a2f;border-color:#5f8f4a}
/* RCI 需求柱 */
#rci{display:flex;align-items:flex-end;gap:3px;height:26px;padding:2px 6px;
  background:#181f36;border:1px solid #303a5c;border-radius:6px}
#rci .col{width:9px;height:22px;background:#0c1020;border-radius:2px;position:relative;overflow:hidden}
#rci .col i{position:absolute;bottom:0;left:0;right:0;height:0%}
#rci .r i{background:#58c470}#rci .c i{background:#5aa0e8}#rci .i i{background:#e8b23e}
/* ---------- 工具列 ---------- */
#tools{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);display:flex;gap:6px;
  padding:6px;background:rgba(10,14,26,.88);border:2px solid #2c3450;border-radius:12px;
  z-index:20;max-width:96vw;overflow-x:auto}
.tool{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  width:56px;min-width:56px;height:56px;border-radius:9px;border:2px solid #303a5c;
  background:#181f36;color:#c9d2ea;font-size:10px;cursor:pointer}
.tool .ic{font-size:20px;line-height:22px}
.tool .pr{color:#8fa0c8;font-size:9px}
.tool.sel{border-color:#ffd977;background:#33395e;color:#fff}
.tool:active{transform:scale(.95)}
/* ---------- 提示橫幅 ---------- */
#hint{position:absolute;top:44px;left:50%;transform:translateX(-50%);z-index:19;
  background:rgba(20,28,52,.94);border:1px solid #46538a;color:#ffe9ad;border-radius:8px;
  padding:6px 12px;font-size:13px;display:none;max-width:92vw;align-items:center;gap:8px}
#hint button{background:none;border:none;color:#8fa0c8;font-size:14px;cursor:pointer}
/* ---------- 訊息泡 ---------- */
#toasts{position:absolute;left:50%;bottom:78px;transform:translateX(-50%);z-index:25;
  display:flex;flex-direction:column-reverse;align-items:center;gap:5px;pointer-events:none}
.toast{background:rgba(16,22,42,.94);border:1px solid #4a5788;color:#eaf0ff;border-radius:8px;
  padding:5px 14px;font-size:13px;animation:tin .25s ease-out;white-space:nowrap}
.toast.gold{border-color:#c9a84c;color:#ffe9ad}
.toast.bad{border-color:#a85050;color:#ffc4c4}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1}}
/* ---------- 檢視面板 ---------- */
#info{position:absolute;left:10px;bottom:80px;z-index:22;background:rgba(12,17,32,.94);
  border:2px solid #3a4670;border-radius:10px;padding:10px 14px;color:#dfe6f5;font-size:13px;
  display:none;min-width:180px;max-width:70vw}
#info h3{font-size:14px;color:#ffd977;margin-bottom:4px}
#info .row{margin:2px 0;color:#c9d2ea}
#info .x{position:absolute;top:4px;right:8px;color:#8fa0c8;cursor:pointer;font-size:15px}
/* ---------- 拖放成本提示 ---------- */
#dragcost{position:absolute;z-index:23;display:none;background:rgba(12,17,32,.9);
  border:1px solid #4a5788;color:#ffd977;border-radius:6px;padding:2px 8px;font-size:12px;pointer-events:none}
/* ---------- 縮放按鈕（手機友善） ---------- */
#zoomer{position:absolute;right:10px;bottom:80px;z-index:20;display:flex;flex-direction:column;gap:6px}
#zoomer button{width:40px;height:40px;font-size:20px;border-radius:9px;border:2px solid #303a5c;
  background:rgba(16,22,42,.9);color:#dfe6f5;cursor:pointer}
#zoomer button:active{background:#31407a}
/* ---------- 開始畫面 ---------- */
#start{position:absolute;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:14px;text-align:center;
  background:linear-gradient(180deg,#0d1226 0%,#1b2547 55%,#33406e 100%)}
#start h1{color:#ffe9ad;font-size:34px;letter-spacing:10px;text-shadow:0 3px 0 #7a5b1e,0 6px 14px #000}
#start .en{color:#8fa0c8;letter-spacing:6px;font-size:13px;margin-top:-8px}
#start .sub{color:#c9d2ea;font-size:14px;margin:6px 0 10px}
#start button{min-width:210px;padding:12px 22px;font-size:16px;border-radius:12px;cursor:pointer;
  border:2px solid #5f8f4a;background:#2e4a26;color:#dff5cf}
#start button.alt{border-color:#46538a;background:#1d2745;color:#c9d2ea}
#start button:active{transform:scale(.97)}
#start .help{margin-top:10px;color:#96a4c9;font-size:12px;line-height:1.9;max-width:340px}
#logo{image-rendering:pixelated;width:224px;height:128px}
#mini{position:absolute;top:48px;right:10px;width:144px;height:144px;z-index:18;
  border:2px solid #2c3450;border-radius:8px;background:#0d1226;
  image-rendering:pixelated;cursor:pointer;display:none}
@media (max-width:420px){#mini{width:96px;height:96px;top:64px}}
@media (max-height:520px){#logo{display:none}#start h1{font-size:26px}}
/* 窄螢幕（360~420px 手機）壓縮工具列與 HUD，八顆工具鍵可完整捲動觸及 */
@media (max-width:420px){
  .tool{width:46px;min-width:46px;height:50px;font-size:9px}
  .tool .ic{font-size:16px;line-height:18px}
  #hud{font-size:11px;gap:4px;padding:4px 6px}
  .chip{padding:2px 6px;line-height:18px}
  .hbtn{padding:2px 7px;font-size:12px}
}
</style>

<script>
(()=>{ 'use strict';
/* =====================================================================
   0. 小工具
===================================================================== */
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const lerp=(a,b,t)=>a+(b-a)*t;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
let R=mulberry32(1); // 全域隨機（依種子重設）
const ri=n=>Math.floor(R()*n);

/* 值噪聲（地形用） */
function makeNoise(rand,G){
  const v=new Float32Array(G*G);
  for(let i=0;i<G*G;i++)v[i]=rand();
  const at=(x,y)=>{
    const xi=Math.floor(x),yi=Math.floor(y);
    const xf=x-xi,yf=y-yi,sx=xf*xf*(3-2*xf),sy=yf*yf*(3-2*yf);
    const g=(a,b)=>v[((a%G)+G)%G*G+(((b%G)+G)%G)];
    return lerp(lerp(g(xi,yi),g(xi+1,yi),sx),lerp(g(xi,yi+1),g(xi+1,yi+1),sx),sy);
  };
  return (x,y)=>.6*at(x,y)+.3*at(x*2.13+7,y*2.13+3)+.1*at(x*4.7+13,y*4.7+11);
}

/* =====================================================================
   1. 常數與狀態
===================================================================== */
const TW=64,TH=32;         // 單格像素尺寸（精細版：每格 64×32）
const N=72;                // 地圖邊長
const SAVEKEY='glimmerville.v1';
const DAYLEN=0.9;          // 一天（模擬）＝0.9 秒（1x）
const CYCLE=110;           // 日夜循環（真實秒）

// 建築種類：1住宅 2商業 3工業 4公園 5電廠
const KNAME={1:'住宅',2:'商業',3:'工業',4:'公園',5:'發電廠',6:'消防局',7:'學校',8:'垃圾場'};
const LVNAME={
  1:['小屋','公寓','住宅大樓'],
  2:['小舖','商場','商業大樓'],
  3:['工坊','工廠','重工業區']};
const POPS =[0,8,22,54];    // 住宅各級人口
const JOBSC=[0,5,14,38];    // 商業各級就業
const JOBSI=[0,7,20,48];    // 工業各級就業
const PLANT_CAP=50;         // 每座電廠供電建築數
const DUMP_CAP=40;          // 每座垃圾場處理容量（T19）
const COST={road:15,bridge:60,zone:8,park:60,plant:550,doze:2,fire:400,school:350,dump:300,rdec:25,hwy:45,hwyBridge:180};

const TOOLS=[
  {id:'pan',  ic:'🖐', nm:'檢視', pr:''},
  {id:'road', ic:'🛣', nm:'道路', pr:'$'+COST.road},
  {id:'hwy',  ic:'🛤️', nm:'高速路', pr:'$'+COST.hwy},
  {id:'zr',   ic:'🏠', nm:'住宅區', pr:'$'+COST.zone},
  {id:'zc',   ic:'🏪', nm:'商業區', pr:'$'+COST.zone},
  {id:'zi',   ic:'🏭', nm:'工業區', pr:'$'+COST.zone},
  {id:'park', ic:'🌳', nm:'公園', pr:'$'+COST.park},
  {id:'plant',ic:'⚡', nm:'電廠', pr:'$'+COST.plant},
  {id:'fire', ic:'🚒', nm:'消防局', pr:'$'+COST.fire},
  {id:'school',ic:'🏫', nm:'學校', pr:'$'+COST.school},
  {id:'dump', ic:'🗑️', nm:'垃圾場', pr:'$'+COST.dump},
  {id:'rdec', ic:'🌲', nm:'路飾', pr:'$'+COST.rdec},
  {id:'doze', ic:'💥', nm:'拆除', pr:'$'+COST.doze},
];

let seed=0, tiles=null;
let money=3000, day=1, speed=1, prevSpeed=1;
let pop=0,jobs=0,cityHappy=.6;
let dem={1:.5,2:0,3:0};
let msIdx=0; // 里程碑進度
const MILES=[[50,300],[150,600],[400,1000],[900,1600],[1600,2600],[2600,4000],[4000,6000],[7000,10000]];
let ach={};   // 已解鎖成就 id → 1
let townName='微光小鎮';
const NM1=['微光','晨曦','雲杉','風鈴','石楠','銀月','翠嶺','暖泉','星港','霧谷','楓橋','鹿鳴','燕泊','柳蔭','螢澤','嵐坡','鯨落','棠梨'];
const NM2=['小鎮','村','城','港','丘','灣','岸','屯','里','洲'];
const ACHS=[
  {id:'bridge',  nm:'跨海工程師',   t:s=>s.bridges>=1},
  {id:'park10',  nm:'綠意之城',     t:s=>s.parks>=10},
  {id:'plant3',  nm:'電力大亨',     t:s=>s.plants>=3},
  {id:'rich',    nm:'金庫滿盈',     t:()=>money>=50000},
  {id:'pop5k',   nm:'大都會',       t:()=>pop>=5000},
  {id:'year3',   nm:'三年之約',     t:()=>day>=1080},
  {id:'ind20',   nm:'工業重鎮',     t:s=>s.nI>=20},
  {id:'happy',   nm:'幸福之都',     t:()=>pop>=500&&cityHappy>=.75},
];
let bailoutDay=-999;
let loan=null; // {remain:天數, daily:120}（T16）
let fin={taxR:0,taxC:0,taxI:0,upR:0,upP:0,upE:0,net:0};
let garbage=0,garbCap=0,garbRatio=0; // 垃圾（T19）：每日重算，不進存檔，供 inspect/統計面板讀取
let lastGarbT=-999;                  // 垃圾超載 toast 節流（T19，不進存檔）
let tool='pan';
let muted=false,sndMode=1;
let visT=CYCLE*.38; // 視覺時間（從早晨開始）
let simAcc=0;
let weather=0,wxT=5,flashT=0; // 天氣（T17）：0晴 1雨 2暴雨；wxT 剩餘天數、flashT 閃電計時（皆不進存檔）
const inWinter=()=>((day-1)%360)>=300; // 冬季（T18）：每年第 300-360 天；由 day 導出，不進存檔
let wSeason=-1; // 上次 tick 的季節旗標（-1 未定 / 0 非冬 / 1 冬）；入冬／開春 toast 防重複（T18，不進存檔）
let hintsOff=false, hintShown={};

// 相機（世界像素座標，z＝裝置像素縮放倍率）
const cam={x:0,y:0,z:3};

const cvs=$('#game'), ctx=cvs.getContext('2d');
let W=0,H=0,DPR=1;
function resize(){
  DPR=window.devicePixelRatio||1;
  W=cvs.width=Math.round(cvs.clientWidth*DPR);
  H=cvs.height=Math.round(cvs.clientHeight*DPR);
  ctx.imageSmoothingEnabled=false;
}
window.addEventListener('resize',resize);

const T=i=>tiles[i];
const idx=(x,y)=>y*N+x;
const inMap=(x,y)=>x>=0&&y>=0&&x<N&&y<N;

/* =====================================================================
   2. 程式化像素美術
===================================================================== */
function cv(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;
  const g=c.getContext('2d');g.imageSmoothingEnabled=false;return[c,g];}

// 菱形：中心 cx、頂點 y=ty、半寬 hw（偶數），高度=hw，斜率固定 2:1
function dia(g,cx,ty,hw,col){
  g.fillStyle=col;
  const hh=hw>>1;
  for(let i=0;i<hh;i++){
    const w=(i+1)*2;
    g.fillRect(cx-w,ty+i,w*2,1);
    g.fillRect(cx-w,ty+hw-1-i,w*2,1);
  }
}
// 菱形內隨機點綴
function speck(g,cx,ty,hw,cols,n,rand){
  for(let i=0;i<n;i++){
    const yy=1+Math.floor(rand()*(hw-2));
    const hr=Math.max(1,(yy<hw/2?(yy+1):(hw-yy))*2-2);
    const xx=cx-hr+Math.floor(rand()*hr*2);
    g.fillStyle=cols[Math.floor(rand()*cols.length)];
    g.fillRect(xx,ty+yy,2,1);
  }
}
// 菱形四邊描邊（bit：1上右 2下右 4下左 8上左）
function diaEdge(g,edges,col,cx=32,ty=0,hw=32){
  g.fillStyle=col;
  const hh=hw>>1;
  for(let i=0;i<hh;i++){
    const a=2*(i+1);
    if(edges&1)g.fillRect(cx+a-2,ty+i,2,1);
    if(edges&8)g.fillRect(cx-a,  ty+i,2,1);
    const b=2*(hh-i);
    if(edges&2)g.fillRect(cx+b-2,ty+hh+i,2,1);
    if(edges&4)g.fillRect(cx-b,  ty+hh+i,2,1);
  }
}
// 等距方塊：底頂點 (cx,by)、半寬 hw（偶數）、牆高 h；回傳屋頂菱形頂點 y
function isoBox(g,cx,by,hw,h,cL,cR,cTop){
  g.fillStyle=cL;
  for(let dx=1;dx<=hw;dx++){const yF=by-(dx>>1);g.fillRect(cx-dx,yF-h,1,h);}
  g.fillStyle=cR;
  for(let dx=0;dx<hw;dx++){const yF=by-((dx+1)>>1);g.fillRect(cx+dx,yF-h,1,h);}
  g.fillStyle='rgba(0,0,0,.13)';                       // 底部 AO
  for(let dx=1;dx<=hw;dx++){const yF=by-(dx>>1);g.fillRect(cx-dx,yF-3,1,3);}
  for(let dx=0;dx<hw;dx++){const yF=by-((dx+1)>>1);g.fillRect(cx+dx,yF-3,1,3);}
  g.fillStyle='rgba(0,0,0,.25)';g.fillRect(cx,by-h,1,h); // 前角線
  const rty=by-h-hw;
  dia(g,cx,rty,hw,cTop);
  diaEdge(g,6,shade(cTop,-26),cx,rty,hw);              // 簷口陰影
  diaEdge(g,9,shade(cTop,16),cx,rty,hw);               // 頂緣受光
  return rty;
}
// 牆上窗（含窗台與反光，跟著牆斜率排），同步畫到夜間圖層
function windows(g,ng,cx,by,hw,h,rand,litP,opts){
  const o=Object.assign({w:3,ht:4,gx:5,gy:7,glass:'#26314e',lit:'#ffd77a'},opts||{});
  const put=(x,y)=>{
    g.fillStyle=o.glass;g.fillRect(x,y,o.w,o.ht);
    g.fillStyle='rgba(255,255,255,.28)';g.fillRect(x,y,o.w,1);
    g.fillStyle='rgba(255,255,255,.30)';g.fillRect(x,y+o.ht,o.w,1);
    if(ng&&rand()<litP){ng.fillStyle=o.lit;ng.fillRect(x,y,o.w,o.ht);}
  };
  for(let dx=2;dx<hw-o.w-1;dx+=o.gx){                  // 右牆
    const yF=by-((dx+1)>>1);
    for(let y=yF-h+3;y<yF-o.ht-2;y+=o.gy)put(cx+dx,y);
  }
  for(let dx=4;dx<hw-1;dx+=o.gx){                      // 左牆
    const yF=by-(dx>>1);
    for(let y=yF-h+3;y<yF-o.ht-2;y+=o.gy)put(cx-dx-o.w+1,y);
  }
}
// 輪廓線後處理：透明像素貼著實體 → 描 1px 深色邊
function outlineSprite(c,r,gc,b){
  const g=c.getContext('2d');
  const w=c.width,h=c.height;
  const im=g.getImageData(0,0,w,h),a=im.data;
  const solid=(x,y)=>x>=0&&y>=0&&x<w&&y<h&&a[(y*w+x)*4+3]>40;
  const marks=[];
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const i=(y*w+x)*4;

/* =====================================================================
   3. 世界生成
===================================================================== */
function genWorld(sd){
  seed=sd;R=mulberry32(sd);
  const noi=makeNoise(mulberry32(sd^0x9e37),64);
  const noi2=makeNoise(mulberry32(sd^0x51f3),64);
  tiles=new Array(N*N);
  let water=0;
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){
    const n=noi(x*.085,y*.085);
    let t=2;
    if(n<.40)t=0; else if(n<.455)t=1;
    if(t===0)water++;
    const tile={t,tree:0,gv:ri(4),road:0,bridge:0,hw:0,mask:0,zone:0,bld:null,rp:false,wm:0,deco:0};
    if(t===2&&noi2(x*.13,y*.13)>.62&&R()<.8)tile.tree=1+ri(4);
    else if(t===2&&R()<.015)tile.deco=1;
    tiles[idx(x,y)]=tile;
  }
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){
    const tl=tiles[idx(x,y)];
    if(tl.t===1&&!tl.deco&&R()<.25){
      for(const[dx,dy]of[[0,-1],[1,0],[0,1],[-1,0]])
        if(inMap(x+dx,y+dy)&&tiles[idx(x+dx,y+dy)].t===0){tl.deco=2;break;} // 蘆葦
    }else if(tl.t===2&&!tl.tree&&!tl.deco&&R()<.01)tl.deco=3;               // 野花叢
  }
  return water/(N*N);
}
// 水岸泡沫遮罩（哪幾條邊鄰接陸地）
function computeFoam(){
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){
    const t=T(idx(x,y));t.wm=0;
    if(t.t!==0)continue;
    let m=0;
    if(inMap(x,y-1)&&T(idx(x,y-1)).t!==0)m|=1;
    if(inMap(x+1,y)&&T(idx(x+1,y)).t!==0)m|=2;
    if(inMap(x,y+1)&&T(idx(x,y+1)).t!==0)m|=4;
    if(inMap(x-1,y)&&T(idx(x-1,y)).t!==0)m|=8;
    t.wm=m;
  }
}
function newWorld(){
  let sd=(Math.random()*1e9)|0;
  for(let tries=0;tries<40;tries++){
    const w=genWorld(sd);
    if(w>.06&&w<.38)break;
    sd=(sd*1664525+1013904223)|0;
  }
  // 找一塊開闊草地當出生視角
  let best=null,bestScore=-1;
  for(let s=0;s<160;s++){
    const x=6+ri(N-12),y=6+ri(N-12);
    let sc=0;
    for(let dy=-4;dy<=4;dy++)for(let dx=-4;dx<=4;dx++){
      const t=T(idx(x+dx,y+dy));
      if(t.t===2&&!t.tree)sc++;
    }
    if(sc>bestScore){bestScore=sc;best=[x,y];}
  }
  money=3000;day=1;msIdx=0;ach={};pop=0;jobs=0;cityHappy=.6;dem={1:.5,2:0,3:0};
  bailoutDay=-999;loan=null;cars.length=0;smokes.length=0;hintShown={};hintsOff=false;
  undoStack.length=0;undoGroup=null;
  cam.x=(best[0]-best[1])*32;cam.y=(best[0]+best[1])*16;cam.z=Math.max(1,Math.min(3,Math.round(DPR)));
  recalcAllMasks();
  computeFoam();
  townName=NM1[ri(NM1.length)]+NM2[ri(NM2.length)];
  document.title=townName+' · 微光小鎮';
  toast(`🏙️ 歡迎來到「${townName}」！`,'gold');
}

/* =====================================================================
   4. 建造邏輯
===================================================================== */
function recalcMask(x,y){
  const t=T(idx(x,y));if(!t.road)return;
  let m=0;
  if(inMap(x,y-1)&&T(idx(x,y-1)).road)m|=1;
  if(inMap(x+1,y)&&T(idx(x+1,y)).road)m|=2;
  if(inMap(x,y+1)&&T(idx(x,y+1)).road)m|=4;
  if(inMap(x-1,y)&&T(idx(x-1,y)).road)m|=8;
  t.mask=m;
}
function recalcAllMasks(){
  for(let y=0;y<N;y++)for(let x=0;x<N;x++)recalcMask(x,y);
}
function roadCostAt(x,y){return T(idx(x,y)).t===0?COST.bridge:COST.road;}
// 回傳 null＝可行，否則錯誤訊息
function canPlace(toolId,x,y){
  if(!inMap(x,y))return '超出地圖';
  const t=T(idx(x,y));
  if(t.ruin&&toolId!=='doze')return '焦土需先清理';
  switch(toolId){
    case 'road':
      if(t.road)return null; // 重複鋪＝略過（不收費）
      if(t.bld)return '有建築擋住';
      return null;
    case 'hwy':
      if(t.road)return null; // 已有路（含高速）＝略過，不原地轉換
      if(t.bld)return '有建築擋住';
      return null;
    case 'zr':case 'zc':case 'zi':
      if(t.t!==2&&t.t!==1)return '只能劃在陸地上';
      if(t.road)return '道路上不能分區';
      if(t.bld)return '已有建築';
      return null;
    case 'park':case 'plant':case 'fire':case 'school':case 'dump':
      if(t.t!==2&&t.t!==1)return '只能蓋在陸地上';
      if(t.road)return '道路上不能建造';
      if(t.bld)return '已有建築';
      return null;
    case 'rdec':
      if(!t.road||t.bridge||t.rdec)return '只能加在道路上';
      return null;
    case 'doze':
      if(!t.road&&!t.bld&&!t.zone&&!t.tree&&!t.deco&&!t.ruin)return '這裡沒東西';
      return null;
  }
  return '無法建造';
}
function placeCost(toolId,x,y){
  const t=T(idx(x,y));
  let c=0;
  switch(toolId){
    case 'road': if(t.road)return 0; c=roadCostAt(x,y); break;
    case 'hwy': if(t.road)return 0; c=t.t===0?COST.hwyBridge:COST.hwy; break;
    case 'zr':case 'zc':case 'zi':
      c=COST.zone; if(t.zone)c=0; break;
    case 'park':c=COST.park;break;
    case 'plant':c=COST.plant;break;
    case 'fire':c=COST.fire;break;
    case 'school':c=COST.school;break;
    case 'dump':c=COST.dump;break;
    case 'rdec':c=COST.rdec;break;
    case 'doze':c=COST.doze;break;
  }
  if(toolId!=='doze'&&t.tree)c+=COST.doze; // 順手清樹
  return c;
}
function doPlace(toolId,x,y,silent){
  const err=canPlace(toolId,x,y);
  if(err){if(!silent){toast(err,'bad');sErr();}return false;}
  const cost=placeCost(toolId,x,y);
  if(cost>money){if(!silent){toast('資金不足！','bad');sErr();}return false;}
  const t=T(idx(x,y));
  if(undoGroup&&!undoGroup.seen[idx(x,y)]){
    undoGroup.seen[idx(x,y)]=1;
    undoGroup.snaps.push({i:idx(x,y),s:JSON.stringify(t)});
  }
  const zoneOf={zr:1,zc:2,zi:3};
  switch(toolId){
    case 'road':
      if(t.road)return false;
      t.road=1;t.bridge=t.t===0?1:0;t.tree=0;t.zone=0;t.deco=0;
      recalcMask(x,y);recalcMask(x,y-1);recalcMask(x+1,y);recalcMask(x,y+1);recalcMask(x-1,y);
      break;
    case 'hwy':
      if(t.road)return false;
      t.road=1;t.hw=1;t.bridge=t.t===0?1:0;t.tree=0;t.zone=0;t.deco=0;
      recalcMask(x,y);recalcMask(x,y-1);recalcMask(x+1,y);recalcMask(x,y+1);recalcMask(x-1,y);
      break;
    case 'zr':case 'zc':case 'zi':
      if(t.zone===zoneOf[toolId]&&!t.tree)return false;
      t.zone=zoneOf[toolId];t.tree=0;t.deco=0;
      break;
    case 'park':
      t.bld={k:4,lv:1,v:ri(3),age:0,pw:true,h:1};t.tree=0;t.zone=0;t.deco=0;
      break;
    case 'plant':
      t.bld={k:5,lv:1,v:0,age:0,pw:true,h:1};t.tree=0;t.zone=0;t.deco=0;
      break;
    case 'fire':
      t.bld={k:6,lv:1,v:ri(3),age:0,pw:true,h:1};t.tree=0;t.zone=0;t.deco=0;
      break;
    case 'school':
      t.bld={k:7,lv:1,v:ri(3),age:0,pw:true,h:1};t.tree=0;t.zone=0;t.deco=0;
      break;
    case 'dump':
      t.bld={k:8,lv:1,v:ri(3),age:0,pw:true,h:1};t.tree=0;t.zone=0;t.deco=0;
      break;
    case 'rdec':
      t.rdec=1;
      break;
    case 'doze':
      if(t.ruin){t.ruin=0;t.zone=0;}                    // 清理焦土：連同殘留分區一併復原
      else if(t.bld)t.bld=null;
      else if(t.rdec)t.rdec=0;                          // 路飾優先於路面清除（T20）
      else if(t.road){t.road=0;t.hw=0;t.bridge=0;t.mask=0;t.rdec=0;
        recalcMask(x,y-1);recalcMask(x+1,y);recalcMask(x,y+1);recalcMask(x-1,y);}
      else if(t.zone)t.zone=0;
      else if(t.tree)t.tree=0;
      else if(t.deco)t.deco=0;
      break;
  }
  money-=cost;
  if(undoGroup)undoGroup.spent+=cost;
  if(toolId==='plant'||toolId==='road'||toolId==='hwy'||toolId==='doze')computePower(); // 供電狀態即時反映
  return true;
}

/* =====================================================================
   5. 模擬
===================================================================== */
function hasRoadNear(x,y,r,needPow,noHw){
  for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){
    const nx=x+dx,ny=y+dy;
    if(!inMap(nx,ny))continue;
    const t=T(idx(nx,ny));
    if(t.road&&(!noHw||!t.hw)&&(!needPow||t.rp))return true; // noHw：分區生長只認普通路（高速不吸引住宅，T21）
  }
  return false;
}
function computePower(){
  let plants=0;
  for(let i=0;i<N*N;i++){tiles[i].rp=false;if(tiles[i].bld&&tiles[i].bld.k===5)plants++;}
  if(!plants)return 0;
  const seen=new Uint8Array(N*N);
  const q=[];
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){
    const t=T(idx(x,y));
    if(!(t.bld&&t.bld.k===5))continue;
    for(const[dx,dy]of[[0,-1],[1,0],[0,1],[-1,0]]){
      const nx=x+dx,ny=y+dy;
      if(inMap(nx,ny)&&T(idx(nx,ny)).road&&!seen[idx(nx,ny)]){
        seen[idx(nx,ny)]=1;q.push([nx,ny,0]);
      }
    }
  }
  let head=0;
  while(head<q.length){
    const[x,y,d]=q[head++];
    T(idx(x,y)).rp=true;
    if(d>=90)continue;
    for(const[dx,dy]of[[0,-1],[1,0],[0,1],[-1,0]]){
      const nx=x+dx,ny=y+dy;
      if(!inMap(nx,ny))continue;
      const j=idx(nx,ny);
      if(T(j).road&&!seen[j]){seen[j]=1;q.push([nx,ny,d+1]);}
    }
  }
  return plants*PLANT_CAP;
}
function countNear(x,y,r,pred){
  let n=0;
  for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){
    const nx=x+dx,ny=y+dy;
    if(!inMap(nx,ny))continue;
    if(pred(T(idx(nx,ny))))n++;
  }
  return n;
}
function tick(){
  day++;
  // 季節轉換 toast（T18）：入冬／開春各一次，flag 防重複；季節由 day 導出
  {const w=inWinter()?1:0;
   if(w!==wSeason){
     if(wSeason!==-1)toast(w?'❄️ '+townName+'入冬了':'🌱 春天來了');
     wSeason=w;
   }}
  // 天氣狀態機（T17）：每天遞減，歸零擲骰換態；暴雨每天 25% 觸發閃電
  if(--wxT<=0){
    if(weather===0){if(R()<.12){weather=1;wxT=3+ri(6);}else wxT=3+ri(5);}
    else if(weather===1){
      if(R()<.20){weather=2;wxT=1+ri(2);}
      else if(R()<.35){weather=0;wxT=4+ri(6);}
      else wxT=2+ri(3);
    }else{
      if(R()<.35){weather=0;wxT=4+ri(6);}
      else{weather=1;wxT=2+ri(4);}
    }
  }
  if(weather===2&&!inWinter()&&R()<.25){flashT=.4;sThunder();} // 冬季不觸發閃電（T18）
  const cap=computePower();
  // 供電判定
  let powered=0;
  let popN=0,jobsC=0,jobsI=0,happySum=0,happyN=0,schools=0,dumps=0;
  const grown=[];
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){
    const t=T(idx(x,y));
    const b=t.bld;
    if(b&&b.k===7)schools++;
    if(b&&b.k===8)dumps++;
    if(!b||b.k>3)continue;
    const near=hasRoadNear(x,y,2,true);
    b.pw=near&&powered<cap;
    if(b.pw)powered++;
    if(b.k===1){
      const parks=countNear(x,y,4,tt=>tt.bld&&tt.bld.k===4);
      const ind  =countNear(x,y,3,tt=>tt.bld&&tt.bld.k===3);
      const pl   =countNear(x,y,4,tt=>tt.bld&&tt.bld.k===5);
      b.h=clamp(.62+(parks?.16:0)+(parks>1?.06:0)+0.03*(countNear(x,y,2,tt=>tt.rdec)>0?1:0)-ind*.09-pl*.18-(b.pw?0:.3)-(weather===1?.02:weather===2?.05:0)-(inWinter()?.02:0),.05,1);
      happySum+=b.h;happyN++;
      if(b.pw){popN+=POPS[b.lv];}
    }else if(b.pw){
      if(b.k===2)jobsC+=JOBSC[b.lv];else jobsI+=JOBSI[b.lv];
    }
  }
  pop=popN;jobs=jobsC+jobsI+schools*8;
  cityHappy=happyN?happySum/happyN:.6;
  // 垃圾（T19）：產量/容量/超載係數；套用到全城住宅幸福尾端，並節流提示
  garbage=pop*.05+jobsI*.08;
  garbCap=dumps*DUMP_CAP;
  garbRatio=garbCap>0?clamp(garbage/garbCap,0,2):2;
  if(garbRatio>1){
    const pen=(garbRatio-1)*.15;
    happySum=0;happyN=0;
    for(let i=0;i<N*N;i++){
      const b=tiles[i].bld;
      if(!b||b.k!==1)continue;
      b.h=clamp(b.h-pen,.05,1);
      happySum+=b.h;happyN++;
    }
    cityHappy=happyN?happySum/happyN:cityHappy;
    if(day-lastGarbT>=30){toast('🗑️ 垃圾堆積！蓋垃圾場','bad');lastGarbT=day;}
  }
  // 需求
  const workers=pop*.6;
  dem[1]=clamp((jobs*1.2+25-workers)/70,-1,1);
  dem[2]=clamp((workers*.45-jobsC)/50,-1,1);
  dem[3]=clamp((workers*.55-jobsI)/55,-1,1);
  // 生長：收集候選
  const cands=[];
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){
    const t=T(idx(x,y));
    if(t.zone&&!t.bld&&!t.ruin&&hasRoadNear(x,y,2,true,true))cands.push([x,y,t.zone]); // 生長鄰路只認通電普通路（高速不算，T21）
  }
  // 洗牌取前幾個
  for(let i=cands.length-1;i>0;i--){const j=ri(i+1);const tmp=cands[i];cands[i]=cands[j];cands[j]=tmp;}
  let spawns=0;
  for(const[x,y,z]of cands){
    if(spawns>=3)break;
    const p=.10+.5*Math.max(0,dem[z])*(z===1?clamp(cityHappy+.25,.3,1):1);
    if(R()<p){
      T(idx(x,y)).bld={k:z,lv:1,v:ri(4),age:0,pw:true,h:.6};
      spawns++;sPop();
    }
  }
  // 升級
  for(let i=0;i<N*N;i++){
    const b=tiles[i].bld;
    if(!b||b.k>3)continue;
    b.age++;
    const x=i%N,y=(i/N)|0;
    if(b.lv<3&&b.pw&&!b.fire&&b.age>14&&dem[b.k]>.15&&(b.k!==1||b.h>.45)&&R()<.035*(b.k===1&&countNear(x,y,8,tt=>tt.bld&&tt.bld.k===7)>0?1.6:1)){
      b.lv++;b.age=0;b.v=ri(4);
    }
  }
  // 火災（升級段之後）：起火→蔓延→推進燃燒/燒毀成焦土
  const burning=[];
  for(let i=0;i<N*N;i++){const b=tiles[i].bld;if(b&&b.k<=3&&b.fire)burning.push(i);}
  let fireAlert=false;
  for(let i=0;i<N*N;i++){                                // 起火擲骰（未燃 k≤3）
    const b=tiles[i].bld;
    if(!b||b.k>3||b.fire)continue;
    let p=.0005*(b.k===3?3:1)*b.lv;
    const x=i%N,y=(i/N)|0;                               // 消防局半徑 9 覆蓋 → 起火率 -85%
    if(countNear(x,y,9,tt=>tt.bld&&tt.bld.k===6)>0)p*=.15;
    if(R()<p){
      b.fire=1;
      if(!fireAlert){toast('🔥 '+townName+'發生火災！點擊燃燒的建築滅火','bad');sErr();fireAlert=true;}
    }
  }
  for(const i of burning){                               // 蔓延：20% 點燃 Chebyshev 1 內未燃建築
    if(R()<.20){
      const x=i%N,y=(i/N)|0,opts=[];
      for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
        if(!dx&&!dy)continue;
        const nx=x+dx,ny=y+dy;
        if(!inMap(nx,ny))continue;
        const nb=T(idx(nx,ny)).bld;
        if(nb&&nb.k<=3&&!nb.fire)opts.push(nb);
      }
      if(opts.length)opts[ri(opts.length)].fire=1;
    }
  }
  let fireOut=false;
  for(const i of burning){                               // 推進燃燒天數；消防局覆蓋→撲滅；fire>=5 燒毀成焦土
    const t=tiles[i],b=t.bld;
    if(!b||!b.fire)continue;
    const x=i%N,y=(i/N)|0;
    if(countNear(x,y,9,tt=>tt.bld&&tt.bld.k===6)>0){     // 消防局覆蓋 → 次日自動撲滅
      b.fire=0;
      if(!fireOut){toast('🚒 消防隊撲滅了火災','gold');fireOut=true;}
      continue;
    }
    b.fire++;
    if(b.fire>=5){t.bld=null;t.ruin=1;}                  // zone 保留
  }
  // 經濟
  let income=0,upkeep=0,roads=0,parks=0,plants=0,bridges=0,nI=0,taxR=0,taxC=0,taxI=0,fireStations=0;
  for(let i=0;i<N*N;i++){
    const t=tiles[i];
    if(t.road)roads++;
    if(t.bridge)bridges++;
    const b=t.bld;
    if(!b)continue;
    if(b.k===3)nI++;
    if(b.k===4)parks++;
    else if(b.k===5)plants++;
    else if(b.k===6)fireStations++;
    else if(b.k===8);                 // 垃圾場已在上方計數 dumps，此處明確排除，不參與稅收（T19，鑑於 T15 教訓）
    else if(b.pw&&!b.fire){
      if(b.k===1){const v2=POPS[b.lv]*.12;income+=v2;taxR+=v2;}
      else if(b.k===2){const v2=JOBSC[b.lv]*.18;income+=v2;taxC+=v2;}
      else{const v2=JOBSI[b.lv]*.15;income+=v2;taxI+=v2;}
    }
  }
  upkeep=roads*.02+parks*.5+plants*4+fireStations*3+schools*2.5+dumps*2;
  fin={taxR,taxC,taxI,upR:roads*.02,upP:parks*.5,upE:plants*4,net:income-upkeep};
  money+=income-upkeep;
  // 貸款還款（T16）
  if(loan){money-=loan.daily;if(--loan.remain<=0){loan=null;toast('🏦 貸款已還清！','gold');}}
  // 里程碑
  if(msIdx<MILES.length&&pop>=MILES[msIdx][0]){
    const bonus=MILES[msIdx][1];money+=bonus;
    toast(`🎉 人口突破 ${MILES[msIdx][0]}！獎勵 $${bonus}`,'gold');
    sFanfare();msIdx++;
  }
  // 成就
  for(const a of ACHS){
    if(ach[a.id])continue;
    if(a.t({bridges,parks,plants,nI})){
      ach[a.id]=1;
      toast(`🏆 成就解鎖：${a.nm}`,'gold');sFanfare();
    }
  }
  // 紓困保底（避免卡死）
  if(money<20&&income-upkeep<=0&&day-bailoutDay>60){
    money+=250;bailoutDay=day;
    toast('🏦 小鎮銀行送來 $250 紓困金（也可到 📊 面板貸款）','gold');
  }
  checkHints(plants,roads);
}

/* =====================================================================
   6. 小車與煙
===================================================================== */
const cars=[],smokes=[];
function roadDirs(x,y){
  const t=T(idx(x,y));const out=[];
  if(t.mask&1)out.push(0);if(t.mask&2)out.push(1);
  if(t.mask&4)out.push(2);if(t.mask&8)out.push(3);
  return out;
}
const DIRV=[[0,-1],[1,0],[0,1],[-1,0]];
function updCars(dt){
  const target=clamp(Math.floor(pop/45),0,32);
  if(cars.length<target&&Math.random()<.1){
    // 隨機找條路
    for(let tries=0;tries<30;tries++){
      const x=ri(N),y=ri(N);
      const t=T(idx(x,y));
      if(t.road&&t.mask){
        const ds=roadDirs(x,y);
        const d=ds[ri(ds.length)];
        cars.push({x,y,d,p:Math.random(),ci:ri(SPR.car.length)});
        break;
      }
    }
  }
  for(let i=cars.length-1;i>=0;i--){
    const c=cars[i];
    if(!inMap(c.x,c.y)||!T(idx(c.x,c.y)).road){cars.splice(i,1);continue;}
    c.p+=dt*1.4*(T(idx(c.x,c.y)).hw?2:1); // 高速路車速×2（T21）
    if(c.p>=1){
      c.p-=1;
      c.x+=DIRV[c.d][0];c.y+=DIRV[c.d][1];
      if(!inMap(c.x,c.y)||!T(idx(c.x,c.y)).road){cars.splice(i,1);continue;}
      const ds=roadDirs(c.x,c.y);
      if(!ds.length){cars.splice(i,1);continue;}
      const rev=(c.d+2)%4;
      const fwd=ds.filter(d=>d!==rev);
      c.d=fwd.length?fwd[ri(fwd.length)]:rev;
    }
  }
  if(cars.length>target+4)cars.length=target+4;
}
let smokeAcc=0;
function updSmoke(dt){
  smokeAcc+=dt;
  const spawn=smokeAcc>.45;
  if(spawn)smokeAcc=0;
  if(spawn&&smokes.length<130){
    for(let y=0;y<N;y++)for(let x=0;x<N;x++){
      const t=T(idx(x,y)),b=t.bld;
      if(!b)continue;
      let offs=null,dark=false;
      if(b.k===3&&b.lv>=2&&b.pw)offs=SPR.bld[b.k+'_'+b.lv+'_'+b.v].smoke;
      if(b.k===5){offs=SPR.plant.smoke;dark=true;}
      if(!offs||!offs.length)continue;
      if(Math.random()<.5)continue;
      const o=offs[ri(offs.length)];
      const wx=(x-y)*32+o.dx, wy=(x+y)*16+32+o.dy;
      smokes.push({wx,wy,age:0,life:(2.2+Math.random())*(weather?.6:1),dark,dep:x+y});
    }
  }
  for(let i=smokes.length-1;i>=0;i--){
    const s=smokes[i];
    s.age+=dt;s.wy-=dt*14;s.wx+=dt*6;
    if(s.age>s.life)smokes.splice(i,1);
  }
}

/* =====================================================================
   7. 繪製
===================================================================== */
const stars=[];
for(let i=0;i<90;i++)stars.push([Math.random(),Math.random()*.8,Math.random()*6.28]);
let waterF=0,waterT=0;
const DIRSCR=[[4,-2],[4,2],[-4,2],[-4,-2]];   // 各行進方向的螢幕向量（車頭燈用）
// 天氣雨粒子（螢幕空間池，重用，上限 240；暴雨密度×2；T17）
const rain=[];
function updRain(dt){
  if(!weather){if(rain.length)rain.length=0;return;}
  const win=inWinter();                       // 冬季：雪花直落＋隨 visT 微擺；非冬季：斜雨（T18）
  const cap=weather===2?240:120;
  const f=dt*60;                              // 以 60fps 為基準的幀係數（後備迴圈 dt 大時等比加速）
  const vx=(win?Math.sin(visT*.8)*1.4:-1.2)*cam.z*f, vy=(win?6:14)*cam.z*f; // 斜向下落／雪花直落
  while(rain.length<cap)rain.push({x:Math.random()*(W+240)-40,y:Math.random()*H});
  if(rain.length>cap)rain.length=cap;         // 暴雨轉小雨→截斷
  for(const p of rain){
    p.x+=vx;p.y+=vy;
    if(p.y>H||p.x<-40){p.x=Math.random()*(W+240)-40;p.y=-Math.random()*40;} // 落出畫面回收到頂端
  }
}
function drawRain(z){
  if(inWinter()){                             // 冬季雪花：2×2 白點（T18）
    const s=Math.max(2,Math.round(2*z));
    ctx.fillStyle='rgba(255,255,255,.85)';
    for(const p of rain)ctx.fillRect(p.x,p.y,s,s);
    return;
  }
  const w=z,L=Math.max(2,Math.round(2*z));
  ctx.fillStyle='rgba(200,220,255,.5)';
  for(const p of rain){                       // 2 段偏轉 fillRect＝斜向雨絲（配合 vx<0,vy>0）
    ctx.fillRect(p.x,p.y,w,L);
    ctx.fillRect(p.x-w,p.y+L,w,L);
  }
}

function easeOutBack(t){
  const c1=1.70158,c3=c1+1;
  return t>=1?1:1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2);
}
function daylight(){
  const ph=(visT%CYCLE)/CYCLE;             // 0..1，0.25 日出 0.75 日落
  const d=Math.max(0,Math.sin((ph-.25)*Math.PI*2));
  const b=.34+.66*Math.pow(d,.7);
  const dusk=(d>0&&d<.30)?(0.30-d)/.30:0;
  return {b,dusk,ph};
}
function draw(dt){
  const {b,dusk}=daylight();
  // 天空
  const sky=[Math.round(lerp(13,140,b)),Math.round(lerp(17,195,b)),Math.round(lerp(38,232,b))];
  ctx.fillStyle=`rgb(${sky[0]},${sky[1]},${sky[2]})`;
  ctx.fillRect(0,0,W,H);
  if(b<.62){
    ctx.fillStyle='#fff';
    for(const s of stars){
      const tw=.4+.6*Math.abs(Math.sin(visT*1.5+s[2]));
      ctx.globalAlpha=(0.62-b)/.62*tw;
      ctx.fillRect(Math.floor(s[0]*W),Math.floor(s[1]*H),2,2);
    }
    ctx.globalAlpha=1;
  }
  const z=cam.z;
  const ox=Math.round(W/2-cam.x*z), oy=Math.round(H/2-cam.y*z);
  const sxOf=(x,y)=>ox+((x-y)*32-32)*z;
  const syOf=(x,y)=>oy+((x+y)*16)*z;
  const pad=160*z;
  const vis=(sx,sy)=>sx>-pad&&sx<W+pad&&sy>-pad&&sy<H+pad;
  waterT+=dt;if(waterT>.5){waterT=0;waterF=(waterF+1)%3;}
  const win=inWinter();                             // 冬季雪皮切換（T18；一次計算，draw 內零新配置）
  const rdecGlow=[];                                 // 路飾夜燈暫存，併入 nightSprites（T20）
  // ---- 地面層 ----
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){
    const sx=sxOf(x,y),sy=syOf(x,y);
    if(!vis(sx,sy))continue;
    const t=T(idx(x,y));
    if(x===N-1||y===N-1)ctx.drawImage(SPR.cliff,sx,sy,64*z,56*z);
    const base= t.t===0?SPR.water[waterF] : t.t===1?(win?SPR.sandW:SPR.sand) : (win?SPR.grassW:SPR.grass)[t.gv&3];
    ctx.drawImage(base,sx,sy,64*z,32*z);
    if(t.t===0&&t.wm)ctx.drawImage(SPR.foam[t.wm],sx,sy,64*z,32*z);
    if(t.ruin)ctx.drawImage(SPR.ruin,sx,sy,64*z,32*z);
    if(t.road){
      if(t.hw){ // 高速路（T21）：深路面雙白線；橋版混凝土
        if(t.bridge)ctx.drawImage(SPR.hwyBridge[t.mask],sx,sy-4*z,64*z,44*z);
        else ctx.drawImage(SPR.hwy[t.mask],sx,sy,64*z,32*z);
      }else{
        if(t.bridge)ctx.drawImage(SPR.bridge[t.mask],sx,sy-4*z,64*z,44*z);
        else ctx.drawImage(SPR.road[t.mask],sx,sy,64*z,32*z);
      }
      if(t.rdec){
        const rs=SPR.rdec;
        const rx=sx+(32-rs.ax)*z, ry=sy+(32-rs.ay)*z;
        ctx.drawImage(rs.img,rx,ry,rs.w*z,rs.h*z);
        rdecGlow.push({img:SPR.rdecN,x:rx,y:ry,w:rs.w*z,h:rs.h*z});
      }
    }else if(t.zone&&!t.bld&&!t.ruin){
      ctx.globalAlpha=.5;ctx.drawImage(SPR.zone[t.zone],sx,sy,64*z,32*z);ctx.globalAlpha=1;
    }
  }
  // ---- 物件層（依深度排序） ----
  const objs=[];
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){
    const t=T(idx(x,y));
    if(!t.tree&&!t.bld&&!t.deco)continue;
    const sx=sxOf(x,y),sy=syOf(x,y);
    if(!vis(sx,sy))continue;
    objs.push({dep:x+y+y*.001,x,y,sx,sy,t});
  }
  for(const c of cars){
    const fx=c.x+DIRV[c.d][0]*c.p, fy=c.y+DIRV[c.d][1]*c.p;
    const wx=(fx-fy)*32, wy=(fx+fy)*16+16;
    objs.push({dep:fx+fy+.01,car:c,wx,wy});
  }
  for(const s of smokes)objs.push({dep:s.dep+.02,smoke:s});
  objs.sort((a,b2)=>a.dep-b2.dep);
  const nightSprites=[];
  nightSprites.push(...rdecGlow);
  const bob=Math.sin(visT*5)*2;
  for(const o of objs){
    if(o.car){
      const sx=ox+o.wx*z, sy=oy+o.wy*z;
      const spr=SPR.car[o.car.ci][(o.car.d===0||o.car.d===2)?'A':'B'];
      ctx.drawImage(spr,sx-6*z,sy-5*z,12*z,8*z);
      if(b<.55){
        const v=DIRSCR[o.car.d];
        nightSprites.push({rect:[sx+v[0]*z-z,sy+v[1]*z-z,2*z,2*z]});
      }
      continue;
    }
    if(o.smoke){
      const s=o.smoke;
      const k=s.age/s.life;
      const sz=Math.max(z,Math.round((2+k*4.5)*z));
      ctx.globalAlpha=(1-k)*.5;
      ctx.fillStyle=s.dark?'#9aa0a8':'#d7dce2';
      ctx.fillRect(ox+s.wx*z,oy+s.wy*z,sz,sz);
      ctx.globalAlpha=1;
      continue;
    }
    const t=o.t;
    if(t.tree){
      const s=(win?SPR.treeW:SPR.tree)[(t.tree-1)&3];
      ctx.drawImage(s.img,o.sx+(32-s.ax)*z,o.sy+(32-s.ay)*z,s.w*z,s.h*z);
      continue;
    }
    if(!t.bld&&t.deco){
      const s=SPR.deco[t.deco-1];
      ctx.drawImage(s.img,o.sx+(32-s.ax)*z,o.sy+(32-s.ay)*z,s.w*z,s.h*z);
      continue;
    }
    const bd=t.bld;
    let s;
    if(bd.k===4)s=(win?SPR.parkW:SPR.park)[bd.v];
    else if(bd.k===5)s=SPR.plant;
    else s=SPR.bld[bd.k+'_'+bd.lv+'_'+bd.v];
    const bx=o.sx+(32-s.ax)*z, by=o.sy+(32-s.ay)*z;
    ctx.drawImage(s.img,bx,by,s.w*z,s.h*z);
    if(s.night&&(bd.k===5||bd.pw))nightSprites.push({img:s.night,x:bx,y:by,w:s.w*z,h:s.h*z});
    if(bd.k<=3&&bd.fire){                                // 火焰疊加在建築之後，並發光
      const fr=SPR.fire[visT*6&1];
      const fx2=o.sx+(32-fr.ax)*z, fy2=o.sy+(32-fr.ay)*z;
      ctx.drawImage(fr.img,fx2,fy2,fr.w*z,fr.h*z);
      nightSprites.push({img:fr.img,x:fx2,y:fy2,w:fr.w*z,h:fr.h*z});
    }
    if(bd.k===5&&Math.sin(visT*4)>0){
      ctx.fillStyle='#ff4040';
      ctx.fillRect(o.sx+(32+s.lamp.dx)*z,o.sy+(32+s.lamp.dy)*z,2*z,2*z);
    }
    if(bd.k<=3&&!bd.pw){
      ctx.drawImage(SPR.nopow,o.sx+24*z,o.sy+(-52+bob)*z,16*z,20*z);
    }
  }
  // ---- 天氣色調（雨天壓暗，晝夜 multiply 之前疊加；T17）----
  if(weather){
    ctx.fillStyle=win?'rgba(200,210,230,.14)':weather===2?'rgba(70,90,120,.3)':'rgba(70,90,120,.18)'; // 冬季雪天色調（T18）
    ctx.fillRect(0,0,W,H);
  }
  // ---- 晝夜色調 ----
  if(b<1){
    ctx.globalCompositeOperation='multiply';
    const nc=[110,125,190];
    const col=[0,1,2].map(i=>Math.round(lerp(nc[i],255,b)));
    ctx.fillStyle=`rgb(${col[0]},${col[1]},${col[2]})`;
    ctx.fillRect(0,0,W,H);
    ctx.globalCompositeOperation='source-over';
  }
  if(dusk>0){
    ctx.fillStyle=`rgba(255,145,60,${(dusk*.16).toFixed(3)})`;
    ctx.fillRect(0,0,W,H);
  }
  // ---- 夜間燈光 ----
  if(b<.72){
    const a=clamp((0.72-b)/.5,0,1);
    ctx.globalAlpha=a;
    ctx.globalCompositeOperation='screen';
    for(const nsp of nightSprites){
      if(nsp.img)ctx.drawImage(nsp.img,nsp.x,nsp.y,nsp.w,nsp.h);
      else if(nsp.rect){ctx.fillStyle='#ffe9a0';ctx.fillRect(...nsp.rect);}
    }
    ctx.globalCompositeOperation='source-over';
    ctx.globalAlpha=1;
  }
  // ---- 天氣：雨絲＋閃電（螢幕空間，夜燈之後、游標之前；T17）----
  if(weather)drawRain(z);
  if(flashT>0){
    ctx.fillStyle=`rgba(255,255,255,${Math.min(.85,flashT*2).toFixed(3)})`;
    ctx.fillRect(0,0,W,H);
    flashT=Math.max(0,flashT-dt);
  }
  // ---- 游標／框選預覽 ----
  drawCursor(sxOf,syOf,z);
}
function drawCursor(sxOf,syOf,z){
  if(tool==='pan')return;
  if(rect.on){
    const x0=Math.min(rect.x0,rect.x1),x1=Math.max(rect.x0,rect.x1);
    const y0=Math.min(rect.y0,rect.y1),y1=Math.max(rect.y0,rect.y1);
    let cost=0;
    for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){
      if(!inMap(x,y))continue;
      const ok=!canPlace(tool,x,y);
      ctx.drawImage(ok?SPR.cursor:SPR.cursorBad,sxOf(x,y),syOf(x,y),64*z,32*z);
      if(ok)cost+=placeCost(tool,x,y);
    }
    const dc=$('#dragcost');
    dc.style.display='block';
    dc.textContent='$'+Math.round(cost);
    dc.style.left=(pt.cx+14)+'px';dc.style.top=(pt.cy-30)+'px';
    dc.style.color=cost>money?'#ff9090':'#ffd977';
    return;
  }
  $('#dragcost').style.display='none';
  if(hover.x<0)return;
  const ok=!canPlace(tool,hover.x,hover.y)&&placeCost(tool,hover.x,hover.y)<=money;
  ctx.drawImage(ok?SPR.cursor:SPR.cursorBad,sxOf(hover.x,hover.y),syOf(hover.x,hover.y),64*z,32*z);
}

   8. 輸入（滑鼠＋觸控）
===================================================================== */
const hover={x:-1,y:-1};
const pt={cx:0,cy:0};
const rect={on:false,x0:0,y0:0,x1:0,y1:0};
const pointers=new Map();
let panBase=null,pinchBase=null,paintLast=null,downInfo=null,firstPaint=null,dozeArm=null;
let longPressT=null;
let undoStack=[],undoGroup=null;
const openUndo=()=>{undoGroup={snaps:[],seen:{},spent:0};};
const closeUndo=()=>{if(undoGroup&&undoGroup.snaps.length){undoStack.push(undoGroup);if(undoStack.length>40)undoStack.shift();}undoGroup=null;};

function toTile(cssX,cssY){
  const mx=cssX*DPR,my=cssY*DPR;
  const wx=(mx-(W/2-cam.x*cam.z))/cam.z;
  const wy=(my-(H/2-cam.y*cam.z))/cam.z;
  const fx=(wx/32+wy/16)/2, fy=(wy/16-wx/32)/2;

function isRectTool(id){return id==='zr'||id==='zc'||id==='zi'||id==='doze'||id==='park';}
function paintTo(x,y){
  if(!inMap(x,y))return;
  if(paintLast&&paintLast[0]===x&&paintLast[1]===y)return;
  if(paintLast){ // L 型補間，快速拖曳不斷路
    let[px,py]=paintLast;
    while(px!==x){px+=Math.sign(x-px);if(doPlace(tool,px,py,true))sTick();}
    while(py!==y){py+=Math.sign(y-py);if(doPlace(tool,px,py,true))sTick();}
  }else{
    if(doPlace(tool,x,y,false))sTick();
  }

function undoPlace(f){
  if(!inMap(f.x,f.y))return;
  const t=T(idx(f.x,f.y));

    cam.x=pinchBase.camX-(cx-pinchBase.cx)*DPR/cam.z;
    cam.y=pinchBase.camY-(cy-pinchBase.cy)*DPR/cam.z;
    clampCam();

    if(pinchBase.acc>.28){zoomStep(1,cx,cy);pinchBase.acc=0;pinchBase.camX=cam.x;pinchBase.camY=cam.y;pinchBase.cx=cx;pinchBase.cy=cy;}
    if(pinchBase.acc<-.28){zoomStep(-1,cx,cy);pinchBase.acc=0;pinchBase.camX=cam.x;pinchBase.camY=cam.y;pinchBase.cx=cx;pinchBase.cy=cy;}
    return;
  }
  if(downInfo&&Math.hypot(e.clientX-downInfo.x,e.clientY-downInfo.y)>6){

    cam.y=panBase.camY-(e.clientY-panBase.y)*DPR/cam.z;
    clampCam();
    return;
  }
  if(rect.on){rect.x1=clamp(x,0,N-1);rect.y1=clamp(y,0,N-1);return;}
  if(paintLast&&pointers.size===1&&!panBase&&tool!=='plant')paintTo(x,y); // 電廠不允許拖曳連放

function zoomStep(d,cssX,cssY){
  const nz=clamp(cam.z+d,1,4);
  if(nz===cam.z)return;
  const mx=cssX*DPR,my=cssY*DPR;
  const wx=(mx-(W/2-cam.x*cam.z))/cam.z;
  const wy=(my-(H/2-cam.y*cam.z))/cam.z;
  cam.z=nz;
  cam.x=wx-(mx-W/2)/nz;
  cam.y=wy-(my-H/2)/nz;
  clampCam();
  drawMini();
}
function clampCam(){
  const m=N*32;
  cam.x=clamp(cam.x,-m,m);
  cam.y=clamp(cam.y,-16,N*32+16);
}
function commitRect(){
  const x0=Math.min(rect.x0,rect.x1),x1=Math.max(rect.x0,rect.x1);
  const y0=Math.min(rect.y0,rect.y1),y1=Math.max(rect.y0,rect.y1);
  const single=(x0===x1&&y0===y1);
  const hiBld=(x,y)=>{const b=T(idx(x,y)).bld;return !!(b&&b.k<=3&&b.lv>=2);};
  let done=0,cost=0,skippedHi=0;
  // 先估總價，一次判斷
  for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){
    if(!inMap(x,y)||canPlace(tool,x,y))continue;
    if(tool==='doze'&&hiBld(x,y)){
      if(single){
        if(!(dozeArm&&dozeArm.x===x&&dozeArm.y===y&&performance.now()-dozeArm.t<3000)){
          dozeArm={x,y,t:performance.now()};
          const b=T(idx(x,y)).bld;
          toast(`⚠️ 再點一次確認拆除 Lv${b.lv} ${KNAME[b.k]}`,'bad');sErr();
          return;
        }
        dozeArm=null;
      }else{skippedHi++;continue;}
    }
    cost+=placeCost(tool,x,y);
  }
  if(cost>money){toast('資金不足！需要 $'+Math.round(cost),'bad');sErr();return;}
  openUndo();
  for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){
    if(!inMap(x,y))continue;
    if(tool==='doze'&&hiBld(x,y)&&!single)continue;
    if(doPlace(tool,x,y,true))done++;
  }
  if(skippedHi)toast(`已跳過 ${skippedHi} 棟 Lv2+ 建築（單獨點兩次可拆）`);
  closeUndo();
  if(done){sBuild();}
}

let AC=null;
function initAudio(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}
  if(AC&&AC.state==='suspended')AC.resume();}
function tone(f,dur,type,vol,slide){
  if(!AC||muted)return;
  const o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'square';o.frequency.value=f;
  if(slide)o.frequency.linearRampToValueAtTime(slide,AC.currentTime+dur);
  g.gain.setValueAtTime(vol||.08,AC.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+dur);
  o.connect(g).connect(AC.destination);
  o.start();o.stop(AC.currentTime+dur);
}
const sTick=()=>tone(520,.05,'square',.05);
const sBuild=()=>{tone(300,.09,'square',.07,180);setTimeout(()=>tone(430,.07,'square',.05),60);};
const sErr=()=>tone(110,.18,'sawtooth',.08);

// 雷聲（T17）：0.5s 白噪聲 → 低通 400Hz → 音量包絡衰減；遵守 sndMode（muted 時靜音）
function sThunder(){
  if(!AC||muted)return;
  const dur=.5,len=(AC.sampleRate*dur)|0;
  const buf=AC.createBuffer(1,len,AC.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
  const src=AC.createBufferSource();src.buffer=buf;
  const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=400;
  const g=AC.createGain();
  g.gain.setValueAtTime(.4,AC.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+dur);
  src.connect(lp).connect(g).connect(AC.destination);
  src.start();src.stop(AC.currentTime+dur);
}
// 環境音排程器：白天鳥鳴、夜晚蟲鳴（sndMode===2 才啟用）
setInterval(()=>{
  if(sndMode<2||!AC||AC.state!=='running'||!running)return;
  const b=daylight().b;
  if(b>.6&&Math.random()<.14){        // 白天鳥鳴：兩聲快速下滑音
    tone(1750+Math.random()*300,.09,'triangle',.02,1350);
    setTimeout(()=>tone(1500+Math.random()*250,.07,'triangle',.016,1200),120);
  }else if(b<.45&&Math.random()<.5){  // 夜晚蟲鳴：四連脈衝
    for(let i=0;i<4;i++)setTimeout(()=>tone(4200,.03,'square',.012),i*90);
  }
},700);

    const d=JSON.parse(json);
    if(d.v===1&&d.ter&&d.ter.length===N*N){
      localStorage.setItem(slotKey(curSlot()),json);
      if(load()){computePower();updHud();drawMini();toast('📥 匯入成功');hideInfo();}
      else toast('匯入失敗','bad');
    }else toast('分享碼無效','bad');
  }catch(e){toast('分享碼無效','bad');}
}
function showStats(){
  let nR=0,nC=0,nI=0,nP=0,nE=0,nF=0,nS=0,nD=0;
  for(let i=0;i<N*N;i++){const b=tiles[i].bld;if(!b)continue;
    if(b.k===1)nR++;else if(b.k===2)nC++;else if(b.k===3)nI++;
    else if(b.k===4)nP++;else if(b.k===5)nE++;else if(b.k===6)nF++;
    else if(b.k===7)nS++;else if(b.k===8)nD++;}
  const f=v=>(v>=0?'+':'')+v.toFixed(1);
  $('#infoBody').innerHTML=
    `<h3>📊 ${townName}</h3>
     <div class="row">🏠 住宅稅 ${f(fin.taxR)}　🏪 商業稅 ${f(fin.taxC)}　🏭 工業稅 ${f(fin.taxI)}</div>
     <div class="row">🛣 道路 -${fin.upR.toFixed(1)}　🌳 公園 -${fin.upP.toFixed(1)}　⚡ 電廠 -${fin.upE.toFixed(1)}</div>
     <div class="row"><b>每日淨收入 ${f(fin.net)}</b></div>
     <div class="row">建築：住${nR} 商${nC} 工${nI} 公園${nP} 電廠${nE} 消防局${nF} 學校${nS} 垃圾場${nD}</div>
     <div class="row">🗑️ 垃圾 ${garbage.toFixed(1)}/${garbCap}</div>
     <div class="row">👥 ${pop}　💼 ${jobs}　😊 ${Math.round(cityHappy*100)}%</div>
     <div class="row">${loan?`🏦 貸款還款中：剩 ${loan.remain} 天，每天 -$120`:`<button class="hbtn" id="bLoan">🏦 貸款 $2000（20天每天還$120）</button>`}</div>`;
  $('#info').style.display='block';
  const lb=$('#bLoan');                                    // 貸款按鈕（事件綁定，不用內聯 onclick，T16）
  if(lb)lb.addEventListener('click',()=>{
    money+=2000;loan={remain:20,daily:120};
    toast('🏦 貸款到帳 $2000！','gold');sBuild();
    showStats();
  });
}
$('#bStats').onclick=()=>{showStats();sTick();};
function showHelp(){
  $('#infoBody').innerHTML=
    `<h3>❓ 玩法指南</h3>
     <div class="row">🖐 拖曳平移・滾輪/雙指縮放・點擊建築看詳情</div>
     <div class="row">🛣 先鋪路 → 🏠🏪🏭 沿路劃區 → ⚡ 蓋電廠供電</div>
     <div class="row">建築自動生長升級（最高 Lv3），每天繳稅給你</div>
     <div class="row">需求條 R/C/I：綠＝想搬來・藍＝缺商店・黃＝缺工廠</div>
     <div class="row">🌳 公園加幸福；住宅緊鄰工業/電廠會扣幸福</div>
     <div class="row">⚡ 每座電廠供 50 棟建築，電力沿道路輸送</div>
     <div class="row">💥 拆除 Lv2+ 建築需點兩次確認</div>
     <div class="row">快捷鍵：1-8 工具・空白鍵暫停・Esc 檢視</div>`;
  $('#info').style.display='block';
}
function undo(){
  const g2=undoStack.pop();
  if(!g2){toast('沒有可撤銷的操作');return;}
  for(const sn of g2.snaps){
    tiles[sn.i]=JSON.parse(sn.s);
    const x=sn.i%N,y=(sn.i/N)|0;
    recalcMask(x,y);recalcMask(x,y-1);recalcMask(x+1,y);recalcMask(x,y+1);recalcMask(x-1,y);
  }
  money+=g2.spent;
  computePower();
  if(typeof drawMini==='function')drawMini();
  toast('↩️ 已撤銷（退還 $'+Math.round(g2.spent)+'）');sTick();
}
$('#bHelp').onclick=()=>{showHelp();sTick();};
$('#bUndo').onclick=()=>undo();
$('#bNew').onclick=()=>{
  if(confirm('開一張新地圖？目前的小鎮會被覆蓋。')){
    newWorld();save();toast('🌱 新的開始！');
  }
};
$('#zin').onclick=()=>zoomStep(1,cvs.clientWidth/2,cvs.clientHeight/2);
$('#zout').onclick=()=>zoomStep(-1,cvs.clientWidth/2,cvs.clientHeight/2);
$('#hintX').onclick=()=>{$('#hint').style.display='none';hintsOff=true;};
window.addEventListener('keydown',e=>{
  const map={'1':'pan','2':'road','3':'zr','4':'zc','5':'zi','6':'park','7':'plant','8':'fire','9':'school','0':'dump','-':'doze','=':'rdec'};
  if(map[e.key]){document.querySelectorAll('.tool')[TOOLS.findIndex(t=>t.id===map[e.key])].click();}
  if(e.key===' '){e.preventDefault();$('#bSpeed').click();}
  if((e.ctrlKey||e.metaKey)&&e.key==='z'){e.preventDefault();undo();}
  if(e.key==='Escape'){document.querySelectorAll('.tool')[0].click();}
});
function showHint(key,msg){
  if(hintsOff||hintShown[key])return;
  hintShown[key]=1;
  $('#hintTxt').textContent=msg;
  $('#hint').style.top=($('#hud').offsetHeight+6)+'px'; // 動態排在 HUD 之下（小螢幕 HUD 會換行變高）
  $('#hint').style.display='flex';
}
function checkHints(plants,roads){
  if(roads<3){showHint('h1','👉 先選「🛣 道路」，在草地上拖出幾條路');return;}
  let zones=0;for(let i=0;i<N*N;i++)if(tiles[i].zone)zones++;
  if(zones<4){showHint('h2','👉 選「🏠 住宅區」，在路邊拖出一塊區域');return;}
  if(plants===0){showHint('h3','👉 蓋一座「⚡ 電廠」，電力會沿道路送到建築');return;}
  if(pop>0&&!hintShown['h4']){
    showHint('h4','🎉 居民入住了！接著劃「🏪 商業」「🏭 工業」提供工作');
  }
}

/* =====================================================================
   11. 存檔／讀檔
===================================================================== */
// 存檔槽：SAVEKEY.s1/.s2/.s3；目前槽記在 SAVEKEY.slot（預設1）
function slotKey(n){return SAVEKEY+'.s'+n;}
function curSlot(){const n=+localStorage.getItem(SAVEKEY+'.slot');return n>=1&&n<=3?n:1;}
function setSlot(n){localStorage.setItem(SAVEKEY+'.slot',n);}
// 讀某槽概要（給槽位面板用）：{nm,pop,day} 或 null
function slotInfo(n){
  try{
    const raw=localStorage.getItem(slotKey(n));
    if(!raw)return null;
    const d=JSON.parse(raw);
    if(d.v!==1)return null;
    let p=0;for(const b of d.bl||[])if(b[1]===1)p+=POPS[b[2]]||0;
    return{nm:d.nm||'微光小鎮',pop:p,day:d.day||1};
  }catch(e){return null;}
}
function save(){
  try{
    const bl=[];
    let ter='',tre='',rd='',zn='',dc='',rn='',rc='';
    for(let i=0;i<N*N;i++){
      const t=tiles[i];
      ter+=t.t;tre+=t.tree;zn+=t.zone;dc+=t.deco;rn+=t.ruin?1:0;rc+=t.rdec?1:0;
      rd+=t.road?(t.hw?(t.bridge?4:3):(t.bridge?2:1)):0; // 0無 1路 2橋 3高速 4高速橋（T21）
      if(t.bld){const e=[i,t.bld.k,t.bld.lv,t.bld.v,t.bld.age];if(t.bld.fire)e.push(t.bld.fire);bl.push(e);}
    }
    const data={v:1,seed,money:Math.round(money),day,msIdx,
      cam:{x:Math.round(cam.x),y:Math.round(cam.y),z:cam.z},ter,tre,rd,zn,dc,rn,rc,bl,ach:Object.keys(ach),nm:townName,
      ln:loan?[loan.remain,loan.daily]:null};
    localStorage.setItem(slotKey(curSlot()),JSON.stringify(data));
  }catch(e){}
}
function load(slot){
  try{
    const raw=localStorage.getItem(slotKey(slot||curSlot()));
    if(!raw)return false;
    const d=JSON.parse(raw);
    if(d.v!==1||d.ter.length!==N*N)return false;
    seed=d.seed;R=mulberry32(seed^d.day);
    tiles=new Array(N*N);
    for(let i=0;i<N*N;i++){
      const rv=+d.rd[i]; // 0無 1路 2橋 3高速 4高速橋（舊檔僅 0-2，hw=0 天然相容，T21）
      tiles[i]={t:+d.ter[i],tree:+d.tre[i],gv:i&3,road:rv?1:0,bridge:(rv===2||rv===4)?1:0,hw:rv>=3?1:0,
        mask:0,zone:+d.zn[i],bld:null,rp:false,wm:0,deco:d.dc?+d.dc[i]:0,ruin:d.rn?+d.rn[i]:0,rdec:d.rc?+d.rc[i]:0};
    }
    for(const[i,k,lv,v,age,fire]of d.bl)tiles[i].bld={k,lv,v,age,pw:true,h:.6,fire:fire||0};
    money=d.money;day=d.day;townName=d.nm||'微光小鎮';document.title=townName+' · 微光小鎮';msIdx=d.msIdx||0;ach={};for(const id of d.ach||[])ach[id]=1;
    loan=d.ln?{remain:d.ln[0],daily:d.ln[1]}:null;
    cam.x=d.cam.x;cam.y=d.cam.y;cam.z=clamp(d.cam.z||2,1,4);
    recalcAllMasks();
    computeFoam();
    cars.length=0;smokes.length=0;
    hintsOff=true;
    undoStack.length=0;undoGroup=null;
    return true;
  }catch(e){return false;}
}
setInterval(save,25000);
document.addEventListener('visibilitychange',()=>{if(document.hidden&&tiles)save();});

/* =====================================================================
   12. 主迴圈
===================================================================== */
let lastT=performance.now(),hudT=0,running=false,lastDraw=0;
// 推進遊戲邏輯（dtReal 不截斷，動畫另外截斷）
function advance(dtReal){
  visT+=Math.min(dtReal,2);
  simAcc+=dtReal*speed;
  let steps=0;
  while(simAcc>=DAYLEN&&steps<8){simAcc-=DAYLEN;tick();steps++;}
  if(steps>=8)simAcc=0; // 落後太多就放棄追趕
  const dtA=Math.min(.05,dtReal);
  updCars(dtA);
  updSmoke(dtA);
  updRain(dtA);
}
function frame(ts){
  requestAnimationFrame(frame);
  if(!running){lastT=ts;return;}
  const dt=Math.max(0,Math.min(2,(ts-lastT)/1000));
  lastT=ts;
  advance(dt);
  draw(Math.min(.05,dt));
  lastDraw=performance.now();
  hudT+=dt;
  if(hudT>.25){hudT=0;updHud();}
}
requestAnimationFrame(frame);
// rAF 被瀏覽器暫停（分頁隱藏／省電）時，用計時器低頻接手，遊戲不會凍結
setInterval(()=>{
  if(!running)return;
  const now=performance.now();
  if(now-lastDraw<400)return; // rAF 正常時不介入
  const dt=Math.max(0,Math.min(2,(now-lastT)/1000));
  lastT=now;
  advance(dt);
  draw(.05);
  lastDraw=now;
  updHud();
},250);

/* =====================================================================
   13. 啟動
===================================================================== */
buildSprites();
buildToolbar();
resize();
drawLogo();
const oldMute=localStorage.getItem(SAVEKEY+'.mute');
sndMode=+(localStorage.getItem(SAVEKEY+'.snd')??(oldMute==='1'?0:1));
if(sndMode<0||sndMode>2||isNaN(sndMode))sndMode=1;
muted=sndMode===0;
$('#bSound').textContent=['🔇','🔊','🎵'][sndMode];
// 一次性遷移：舊單一鍵 SAVEKEY 若有值且槽1為空 → 搬到槽1並刪除舊鍵
const oldSave=localStorage.getItem(SAVEKEY);
if(oldSave&&!localStorage.getItem(slotKey(1))){localStorage.setItem(slotKey(1),oldSave);localStorage.removeItem(SAVEKEY);}
const hasSave=!!(localStorage.getItem(slotKey(1))||localStorage.getItem(slotKey(2))||localStorage.getItem(slotKey(3)));
if(hasSave)$('#bContinue').style.display='block';
function begin(fresh){
  initAudio();
  if(fresh||!load())newWorld();
  $('#start').style.display='none';
  running=true;
  $('#mini').style.display='block';drawMini();
  computePower();
  updHud();
  if(!hasSave||fresh)checkHints(0,0);
}
$('#bNewGame').onclick=()=>begin(true);
$('#bContinue').onclick=()=>begin(false);

/* 除錯／測試用 API（不影響一般遊玩） */
window.GV={
  place:(t,x,y)=>doPlace(t,x,y,true),
  center:()=>toTile(cvs.clientWidth/2,cvs.clientHeight/2),
  tile:(x,y)=>inMap(x,y)?JSON.parse(JSON.stringify(T(idx(x,y)))):null,
  setSpeed:s=>{speed=s;},
  setDay:d=>{day=d;return day;},                                // 設模擬天數（T18 測試用；季節由 day 導出）
  ignite:(x,y)=>{if(!inMap(x,y))return false;const b=T(idx(x,y)).bld;if(b&&b.k<=3){b.fire=1;return true;}return false;},
  weather:(w)=>{weather=clamp(w|0,0,2);wxT=99;return weather;}, // 強制設天氣（測試用，鎖住不換態）
  flash:()=>{flashT=.4;sThunder();return true;},               // 強制觸發閃電（測試用）
  stats:()=>{let b=0,r=0,z=0,pw=0,f=0,ru=0;
    for(let i=0;i<N*N;i++){const t=tiles[i];
      if(t.bld){b++;if(t.bld.pw)pw++;if(t.bld.fire)f++;}
      if(t.ruin)ru++;
      if(t.road)r++;if(t.zone)z++;}
    return{money:Math.round(money),pop,jobs,day,buildings:b,poweredBld:pw,
      roads:r,zones:z,happy:+cityHappy.toFixed(2),dem:{...dem},cars:cars.length,fires:f,ruins:ru,weather};}
};
})();
