<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d1226">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<title>微光小鎮 Glimmerville</title>
<style>
/* ============================================================
   微光小鎮 Glimmerville — 原創等距像素城市建造小遊戲
   全部美術以 Canvas 程式化手繪，無任何外部素材。
   ============================================================ */
:root{
  /* T157：UI 視覺升級主題變數（新增，套用到既有面板/按鈕；數值取自既有配色，套用後零位移，只疊加陰影/圓角/過渡） */
  --panel-bg:rgba(12,17,32,.94);
  --panel-border:#3a4670;
  --panel-border-soft:#303a5c;
  --panel-border-strong:#46538a;
  --accent:#ffd977;
  --accent-soft:#c9a24c;
  --accent-green:#5f8f4a;
  --text:#dfe6f5;
  --text-dim:#8fa0c8;
  --radius-xs:6px;
  --radius-sm:8px;
  --radius-md:9px;
  --radius-lg:10px;
  --radius-xl:12px;
  --shadow-panel:0 10px 28px rgba(0,0,0,.5),0 2px 8px rgba(0,0,0,.35);
  --shadow-btn:0 2px 5px rgba(0,0,0,.3);
  --ease:.16s cubic-bezier(.4,0,.2,1);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#0d1226;
  font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",system-ui,sans-serif;
  user-select:none;-webkit-user-select:none;touch-action:none}
#game{position:absolute;inset:0;width:100%;height:100%;display:block;
  image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none;cursor:grab}
#game.build{cursor:crosshair}
/* ---------- 頂部資訊列 ---------- */
#hud{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;gap:6px;
  padding:5px 8px;background:rgba(10,14,26,.86);border-bottom:2px solid #2c3450;
  color:#dfe6f5;font-size:13px;z-index:20;flex-wrap:wrap}
.chip{display:flex;align-items:center;gap:4px;background:#181f36;border:1px solid var(--panel-border-soft);
  border-radius:var(--radius-xs);padding:2px 8px;white-space:nowrap;line-height:20px;transition:border-color var(--ease),box-shadow var(--ease)}
.chip b{font-weight:700;color:#fff;font-variant-numeric:tabular-nums}
#money b{color:var(--accent)}
#hud .spacer{flex:1}
.hbtn{background:#232c4a;border:1px solid var(--panel-border);color:var(--text);border-radius:var(--radius-xs);
  padding:2px 9px;font-size:13px;line-height:22px;cursor:pointer;transition:background-color var(--ease),border-color var(--ease),transform var(--ease),box-shadow var(--ease)}
.hbtn:active{background:#31407a;transform:scale(.95)}
.hbtn.on{background:#3a5a2f;border-color:var(--accent-green)}
@media (hover:hover) and (pointer:fine){.hbtn:hover{background:#2d3860;border-color:var(--panel-border-strong);box-shadow:var(--shadow-btn)}}
#bBell{position:relative}
.dot{position:absolute;top:-4px;right:-4px;background:#e05252;color:#fff;font-size:9px;
  line-height:14px;min-width:14px;height:14px;border-radius:7px;text-align:center;padding:0 2px;font-weight:700}
/* RCI 需求柱（T109：4×24px 豎條，綠正紅負，顏色由 JS 依正負動態設定） */
#rci{display:flex;align-items:flex-end;gap:3px;height:28px;padding:2px 6px;
  background:#181f36;border:1px solid #303a5c;border-radius:6px}
#rci .col{width:4px;height:24px;background:#0c1020;border-radius:2px;position:relative;overflow:hidden}
#rci .col i{position:absolute;bottom:0;left:0;right:0;height:0%;background:#58c470}
/* ---------- 工具列 ---------- */
#toolcats{position:absolute;left:50%;bottom:68px;transform:translateX(-50%);z-index:21;display:none;gap:4px;flex-wrap:wrap;justify-content:center;max-width:96vw}
#toolcats button{padding:4px 8px;border-radius:var(--radius-sm);border:1px solid #3a456e;background:rgba(16,22,42,.92);color:#c9d2ea;font-size:11px;cursor:pointer;transition:background-color var(--ease),border-color var(--ease),box-shadow var(--ease)}
#toolcats button.on{border-color:var(--accent-soft);color:#ffe9ad;background:#2a3358;box-shadow:0 0 0 1px rgba(201,162,76,.35)}
@media (hover:hover) and (pointer:fine){#toolcats button:hover{border-color:var(--panel-border-strong);background:#232c4a}}
#tools{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);display:flex;gap:6px;
  padding:6px;background:rgba(10,14,26,.88);border:2px solid #2c3450;border-radius:var(--radius-xl);
  box-shadow:var(--shadow-panel);
  z-index:20;max-width:96vw;overflow-x:auto}
.tool{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  width:56px;min-width:56px;height:56px;border-radius:var(--radius-md);border:2px solid var(--panel-border-soft);
  background:#181f36;color:#c9d2ea;font-size:10px;cursor:pointer;transition:background-color var(--ease),border-color var(--ease),transform var(--ease),box-shadow var(--ease)}
.tool .ic{font-size:20px;line-height:22px}
.tool .pr{color:var(--text-dim);font-size:9px}
.tool.sel{border-color:var(--accent);background:#33395e;color:#fff;box-shadow:0 0 0 2px rgba(255,217,119,.25)}
.tool:active{transform:scale(.95)}
@media (hover:hover) and (pointer:fine){.tool:hover{border-color:var(--panel-border-strong);background:#20294a;box-shadow:var(--shadow-btn)}}
/* ---------- 提示橫幅 ---------- */
#hint{position:absolute;top:44px;left:50%;transform:translateX(-50%);z-index:19;
  background:rgba(20,28,52,.94);border:1px solid var(--panel-border-strong);color:#ffe9ad;border-radius:var(--radius-sm);
  padding:6px 12px;font-size:13px;display:none;max-width:92vw;align-items:center;gap:8px;box-shadow:var(--shadow-btn)}
#hint button{background:none;border:none;color:var(--text-dim);font-size:14px;cursor:pointer;transition:color var(--ease)}
@media (hover:hover) and (pointer:fine){#hint button:hover{color:#dfe6f5}}
/* ---------- 訊息泡 ---------- */
#toasts{position:absolute;left:50%;bottom:78px;transform:translateX(-50%);z-index:25;
  display:flex;flex-direction:column-reverse;align-items:center;gap:5px;pointer-events:none}
.toast{background:rgba(16,22,42,.94);border:1px solid #4a5788;color:#eaf0ff;border-radius:var(--radius-sm);
  padding:5px 14px;font-size:13px;animation:tin .25s ease-out;white-space:nowrap;box-shadow:var(--shadow-btn)}
.toast.gold{border-color:#c9a84c;color:#ffe9ad}
.toast.bad{border-color:#a85050;color:#ffc4c4}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1}}
/* ---------- 檢視面板 ---------- */
#info{position:absolute;left:10px;bottom:80px;z-index:22;background:var(--panel-bg);
  border:2px solid var(--panel-border);border-radius:var(--radius-lg);padding:10px 14px;color:var(--text);font-size:13px;
  display:none;min-width:180px;max-width:70vw;box-shadow:var(--shadow-panel);animation:panelIn .2s var(--ease)}
#info h3{font-size:14px;color:var(--accent);margin-bottom:4px}
#info .row{margin:2px 0;color:#c9d2ea;line-height:1.5}
#info .x{position:absolute;top:4px;right:8px;color:var(--text-dim);cursor:pointer;font-size:15px;transition:color var(--ease)}
#info .x:hover{color:var(--text)}
@keyframes panelIn{from{opacity:0;transform:translateY(6px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
/* ---------- 拖放成本提示 ---------- */
#dragcost{position:absolute;z-index:23;display:none;background:rgba(12,17,32,.9);
  border:1px solid #4a5788;color:#ffd977;border-radius:6px;padding:2px 8px;font-size:12px;pointer-events:none}
/* ---------- 縮放按鈕（手機友善） ---------- */
#zoomer{position:absolute;right:10px;bottom:80px;z-index:20;display:flex;flex-direction:column;gap:6px}
#zoomer button{width:40px;height:40px;font-size:20px;border-radius:var(--radius-md);border:2px solid var(--panel-border-soft);
  background:rgba(16,22,42,.9);color:var(--text);cursor:pointer;transition:background-color var(--ease),border-color var(--ease),transform var(--ease),box-shadow var(--ease);box-shadow:var(--shadow-btn)}
#zoomer button:active{background:#31407a;transform:scale(.93)}
@media (hover:hover) and (pointer:fine){#zoomer button:hover{border-color:var(--panel-border-strong);background:#232c4a}}
/* ---------- 開始畫面 ---------- */
#start{position:absolute;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:14px;text-align:center;overflow-y:auto;padding:16px 0; /* T132：新增戰役選單後按鈕列變長，矮視窗需可捲動才不致下方按鈕被裁掉 */
  background:linear-gradient(180deg,#0d1226 0%,#1b2547 55%,#33406e 100%)}
#start h1{color:#ffe9ad;font-size:34px;letter-spacing:10px;
  /* T158：像素風描邊（四向硬邊偏移）＋暖光暈，取代單純投影，與新增標題背景呼應 */
  text-shadow:2px 2px 0 #7a5b1e,-2px 2px 0 #7a5b1e,2px -2px 0 #7a5b1e,-2px -2px 0 #7a5b1e,
    0 4px 0 #4a3510,0 0 16px rgba(255,217,119,.6),0 0 32px rgba(255,217,119,.3),0 8px 18px rgba(0,0,0,.5)}
#start .en{color:#8fa0c8;letter-spacing:6px;font-size:13px;margin-top:-8px;text-shadow:0 1px 3px rgba(0,0,0,.65)} /* T158：新增背景晝間偏亮，補陰影維持文字對比 */
#start .sub{color:#c9d2ea;font-size:14px;margin:6px 0 10px;text-shadow:0 1px 3px rgba(0,0,0,.65)}
#start button{min-width:210px;padding:12px 22px;font-size:16px;border-radius:var(--radius-xl);cursor:pointer;
  border:2px solid var(--accent-green);background:#2e4a26;color:#dff5cf;transition:transform var(--ease),box-shadow var(--ease),border-color var(--ease),background-color var(--ease);box-shadow:var(--shadow-btn)}
#start button.alt{border-color:var(--panel-border-strong);background:#1d2745;color:#c9d2ea}
#start button:active{transform:scale(.97)}
@media (hover:hover) and (pointer:fine){#start button:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(0,0,0,.4)}}
#start .help{margin-top:10px;color:#96a4c9;font-size:12px;line-height:1.9;max-width:340px;text-shadow:0 1px 3px rgba(0,0,0,.65)}
#start .diffrow{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:340px}
#start .diffbtn{min-width:auto;padding:6px 12px;font-size:12px;border-radius:9px}
#start .diffbtn.sel{border-color:var(--accent);background:#33395e;color:#fff}
/* T132：場景戰役選單（比照 .diffrow/.diffbtn 樣式先例） */
#start .scmenu{display:none;flex-direction:column;gap:5px;max-width:340px;margin-top:6px;max-height:220px;overflow-y:auto}
#start .scmenu.show{display:flex}
#start .scbtn{min-width:auto;width:100%;padding:8px 12px;font-size:12px;border-radius:9px;text-align:left}
#start .scbtn.done{border-color:#58c470;color:#9be6ac}
#start .scbtn.locked{opacity:.45;cursor:not-allowed}
/* T158：標題畫面背景（等距小鎮剪影＋星空＋窗燈微光，requestAnimationFrame 繪製，僅開始畫面用，
   進遊戲即 cancelAnimationFrame 停止）；z-index:-1 使其落在 #start 靜態排版內容之下（CSS 疊層規則：
   負 z-index 定位子元素繪製於同層內非定位版面內容之前），不需改動其餘既有子元素的定位/z-index */
#titleBg{position:absolute;inset:0;width:100%;height:100%;z-index:-1;display:block}
/* T158：開始畫面按鈕分組排版與視覺層級——主按鈕（繼續/開拓）突出；難度/挑戰/戰役等次級選項收攏進
   .startMore（細分隔線＋縮小字級/留白），與 T157 主題變數（--panel-border-soft/--accent/--shadow-btn/
   --ease 等）統一，不改動任一既有按鈕 id/事件綁定 */
#start .startPrimary{display:flex;flex-direction:column;gap:8px;width:100%;max-width:280px}
#start .startPrimary button{width:100%;font-size:17px;padding:14px 22px;
  animation:startGlow 2.6s ease-in-out infinite}
@keyframes startGlow{0%,100%{box-shadow:0 4px 18px rgba(255,217,119,.18),var(--shadow-btn)}
  50%{box-shadow:0 4px 26px rgba(255,217,119,.42),var(--shadow-btn)}}
@media (prefers-reduced-motion:reduce){#start .startPrimary button{animation:none}}
#start .startMore{display:flex;flex-direction:column;align-items:center;gap:6px;width:100%;max-width:320px;
  margin-top:4px;padding-top:12px;border-top:1px solid var(--panel-border-soft)}
#start .startMore button{min-width:auto;padding:8px 16px;font-size:13px}
.startMoreLabel{font-size:10px;letter-spacing:3px;color:var(--text-dim);text-transform:uppercase;margin-top:4px;text-shadow:0 1px 3px rgba(0,0,0,.65)}
#logo{image-rendering:pixelated;width:224px;height:128px;
  filter:drop-shadow(0 6px 14px rgba(0,0,0,.45)) drop-shadow(0 0 18px rgba(255,217,119,.25))}
#mini{position:absolute;top:48px;right:10px;width:144px;height:144px;z-index:18;
  border:2px solid #2c3450;border-radius:8px;background:#0d1226;
  image-rendering:pixelated;cursor:pointer;display:none}
@media (max-width:420px){#mini{width:96px;height:96px;top:64px}}
/* T110：小地圖視圖切換鈕（普通/污染熱度/地價，T130 擴；T131 擴為六段：普通/地價/污染/壅堵/犯罪/服務覆蓋） */
#miniToggle{position:absolute;top:48px;right:160px;width:28px;height:28px;z-index:19;
  border-radius:8px;border:2px solid #303a5c;background:#181f36;color:#dfe6f5;
  font-size:14px;line-height:24px;cursor:pointer;padding:0;display:none}
@media (max-width:420px){#miniToggle{top:64px;right:112px;width:24px;height:24px;font-size:11px;line-height:20px}}
@media (max-height:520px){#logo{display:none}#start h1{font-size:26px}}
/* 窄螢幕（360~420px 手機）壓縮工具列與 HUD，八顆工具鍵可完整捲動觸及 */
@media (max-width:420px){
  .tool{width:46px;min-width:46px;height:50px;font-size:9px}
  .tool .ic{font-size:16px;line-height:18px}
  #hud{font-size:11px;gap:4px;padding:4px 6px}
  .chip{padding:2px 6px;line-height:18px}
  .hbtn{padding:2px 7px;font-size:12px}
}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud">
  <span class="chip" id="money">💰 <b>0</b></span>
  <span class="chip" id="pop">👥 <b>0</b></span>
  <span class="chip" id="jobs">💼 <b>0</b></span>
  <span class="chip" id="happy">😊 <b>--</b></span>
  <span class="chip" id="star">⭐ <b>–</b></span>
  <span class="chip" id="date">📅 第1年 第1天</span>
  <span id="rci" title="需求：住宅/商業/工業">
    <span class="col r"><i></i></span><span class="col c"><i></i></span><span class="col i"><i></i></span>
  </span>
  <span class="spacer"></span>
  <button class="hbtn" id="bStats">📊</button>
  <button class="hbtn" id="bHelp">❓</button>
  <button class="hbtn" id="bUndo">↩️</button>
  <button class="hbtn" id="bSpeed">▶ 1x</button>

  <button class="hbtn" id="bBell">🔔<span id="bellDot" class="dot" style="display:none">0</span></button>
  <button class="hbtn" id="bAch">🏆</button>
  <button class="hbtn" id="bEditor" style="display:none">🛠 目標</button>
</div>

<div id="hint"><span id="hintTxt"></span><button id="hintX">✕</button></div>

<div id="toolcats"></div>
<div id="tools"></div>

<div id="dragcost"></div>
<canvas id="mini" width="144" height="144"></canvas>
<button id="miniToggle" title="切換小地圖視圖：普通／地價／污染／壅堵／犯罪／服務覆蓋">🏭</button>
<div id="zoomer">
  <button id="zin">＋</button>
  <button id="zout">－</button>
</div>

<div id="info"><span class="x" id="infoX">✕</span><div id="infoBody"></div></div>

<div id="start">
  <canvas id="titleBg"></canvas>
  <canvas id="logo" width="224" height="128"></canvas>
  <h1>微光小鎮</h1>
  <div class="en">G L I M M E R V I L L E</div>

  <div class="startPrimary">
    <button id="bContinue" style="display:none">▶ 繼續上次的小鎮</button>
    <button id="bNewGame">🌱 開拓新地圖</button>
  </div>
  <div class="help">
    🖐 拖曳平移 ・ 滾輪／雙指縮放<br>
    🛣 先鋪路 → 🏠 劃分區域 → ⚡ 蓋電廠供電<br>
    建築會沿著有電的道路自己生長、繳稅給你
  </div>
  <div class="startMore" id="startMore">
    <button class="alt" id="bEditorMode">🛠 編輯器</button>
  </div>
</div>

<script>
(()=>{ 'use strict';
/* =====================================================================
   0. 小工具
===================================================================== */
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const lerp=(a,b,t)=>a+(b-a)*t;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
let R=mulberry32(1); // 全域隨機（依種子重設）
const ri=n=>Math.floor(R()*n);

/* 值噪聲（地形用） */
function makeNoise(rand,G){
  const v=new Float32Array(G*G);
  for(let i=0;i<G*G;i++)v[i]=rand();
  const at=(x,y)=>{
    const xi=Math.floor(x),yi=Math.floor(y);
    const xf=x-xi,yf=y-yi,sx=xf*xf*(3-2*xf),sy=yf*yf*(3-2*yf);
    const g=(a,b)=>v[((a%G)+G)%G*G+(((b%G)+G)%G)];
    return lerp(lerp(g(xi,yi),g(xi+1,yi),sx),lerp(g(xi,yi+1),g(xi+1,yi+1),sx),sy);
  };
  return (x,y)=>.6*at(x,y)+.3*at(x*2.13+7,y*2.13+3)+.1*at(x*4.7+13,y*4.7+11);
}

/* =====================================================================
   1. 常數與狀態
===================================================================== */
const TW=64,TH=32;         // 單格像素尺寸（精細版：每格 64×32）
const N=72;                // 地圖邊長
const SAVEKEY='glimmerville.v1';
const DAYLEN=0.9;          // 一天（模擬）＝0.9 秒（1x）
const CYCLE=110;           // 日夜循環（真實秒）

// 建築種類：1住宅 2商業 3工業 4公園 5電廠

   2. 程式化像素美術
===================================================================== */
function cv(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;
  const g=c.getContext('2d');g.imageSmoothingEnabled=false;return[c,g];}

// T183 屋頂積雪雪帽（Opus 親手）：逐列掃出該欄最高不透明像素（屋頂線），自屋頂線往下塗數列白雪（頂濃底淡），雪帽因此貼合建築剪影輪廓而非畫布頂端——修正「建築 sprite 頂部多為透明天空、canvas 頂端加白會落在透明區不可見」之關鍵陷阱。一次性生成快取於 s.snow，純既有像素 canvas 操作（getImageData/putImageData）、不呼叫 rand()/R()/ri() 零亂數依賴，不改 s.img。win 冬季且 snowLvl>0 才被呼叫，故非冬場景永不生成＝零位移。
function snowCap(s){
  if(s.snow!==undefined)return s.snow;
  const w=s.w|0,h=s.h|0;
  const[mc,mg]=cv(w,h);mg.drawImage(s.img,0,0);
  const sd=mg.getImageData(0,0,w,h).data;
  const[sc,sg]=cv(w,h);
  const out=sg.createImageData(w,h),nd=out.data;
  const cap=Math.max(3,Math.round(h*.11)); // 雪帽厚度（隨 sprite 高度）
  for(let x=0;x<w;x++){
    let top=-1;
    for(let y=0;y<h;y++){if(sd[(y*w+x)*4+3]>40){top=y;break;}} // 該欄最高不透明像素＝屋頂線
    if(top<0)continue;
    for(let dy=0;dy<cap;dy++){
      const y=top+dy;if(y>=h)break;
      const idx=(y*w+x)*4;
      if(sd[idx+3]<40)continue; // 僅落在建築剪影上（跳過內部鏤空/透明）
      const a=(1-dy/cap)*.9; // 頂濃底淡＝屋頂積雪自然堆疊
      nd[idx]=245;nd[idx+1]=250;nd[idx+2]=255;nd[idx+3]=Math.round(a*255);
    }
  }
  sg.putImageData(out,0,0);
  s.snow=sc;return sc;
}
// T184 雨天濕膜（Opus 親手）：以 sprite 剪影為遮罩（source-atop 只落不透明像素，故覆蓋全剪影亦不塗到透明天空、不涉屋頂線陷阱）疊冷暗垂直漸層（頂微暗、底較暗＝雨水沿牆流/牆腳積水）。一次性生成快取於 s.wet，純既有像素 canvas 操作、不消耗 R()、不改 s.img；wetLvl>0（非冬下雨）才被呼叫。
function wetSkin(s){
  if(s.wet!==undefined)return s.wet;
  const[c,g]=cv(s.w|0,s.h|0);
  g.drawImage(s.img,0,0);
  const grad=g.createLinearGradient(0,0,0,s.h);
  grad.addColorStop(0,'rgba(40,54,76,0.16)');grad.addColorStop(1,'rgba(24,36,56,0.5)');
  g.globalCompositeOperation='source-atop';
  g.fillStyle=grad;g.fillRect(0,0,s.w,s.h);
  s.wet=c;return c;
}

// 菱形：中心 cx、頂點 y=ty、半寬 hw（偶數），高度=hw，斜率固定 2:1
function dia(g,cx,ty,hw,col){
  g.fillStyle=col;
  const hh=hw>>1;
  for(let i=0;i<hh;i++){
    const w=(i+1)*2;
    g.fillRect(cx-w,ty+i,w*2,1);
    g.fillRect(cx-w,ty+hw-1-i,w*2,1);
  }
}
// 菱形內隨機點綴
function speck(g,cx,ty,hw,cols,n,rand){
  for(let i=0;i<n;i++){
    const yy=1+Math.floor(rand()*(hw-2));
    const hr=Math.max(1,(yy<hw/2?(yy+1):(hw-yy))*2-2);
    const xx=cx-hr+Math.floor(rand()*hr*2);
    g.fillStyle=cols[Math.floor(rand()*cols.length)];
    g.fillRect(xx,ty+yy,2,1);
  }
}
// 菱形四邊描邊（bit：1上右 2下右 4下左 8上左）
function diaEdge(g,edges,col,cx=32,ty=0,hw=32){
  g.fillStyle=col;
  const hh=hw>>1;
  for(let i=0;i<hh;i++){
    const a=2*(i+1);
    if(edges&1)g.fillRect(cx+a-2,ty+i,2,1);
    if(edges&8)g.fillRect(cx-a,  ty+i,2,1);
    const b=2*(hh-i);
    if(edges&2)g.fillRect(cx+b-2,ty+hh+i,2,1);
    if(edges&4)g.fillRect(cx-b,  ty+hh+i,2,1);
  }
}
// T189 鐵軌鋼軌+枕木（Opus 親手）：沿連接方向（遮罩 m，位元 1上右/2下右/4下左/8上左）自菱形中心(32,cy)向邊中點畫暗棕枕木短槓＋雙銀灰鋼軌；純幾何 fillRect、不消耗 rand（可安插於既有 speck 之後不位移亂數流）。len＝半瓦等距步數（路基 8／較窄橋面 6）
function railTrack(g,m,cy,len){
  const AX={1:[2,-1],2:[2,1],4:[-2,1],8:[-2,-1]}, cx=32;
  for(const bit of [1,2,4,8]){
    if(!(m&bit))continue;
    const a=AX[bit], ax=a[0], ay=a[1], pl=Math.hypot(ax,ay), px=-ay/pl, py=ax/pl; // px,py＝垂直單位向量
    g.fillStyle='#4a3a2a'; // 枕木（暗棕短槓，橫跨軌距）
    for(let u=1.5;u<=len-.5;u+=2){const bx=cx+ax*u, by=cy+ay*u;for(let k=-3;k<=3;k++)g.fillRect(Math.round(bx+px*k),Math.round(by+py*k),1,1);}
    for(let u=0;u<=len;u+=.5){ // 雙鋼軌（銀灰＋1px 軌側陰影）
      const bx=cx+ax*u, by=cy+ay*u;
      g.fillStyle='#b8bcc4';g.fillRect(Math.round(bx+px*2.3),Math.round(by+py*2.3),1,1);g.fillRect(Math.round(bx-px*2.3),Math.round(by-py*2.3),1,1);
      g.fillStyle='#8a8e96';g.fillRect(Math.round(bx+px*2.3),Math.round(by+py*2.3)+1,1,1);g.fillRect(Math.round(bx-px*2.3),Math.round(by-py*2.3)+1,1,1);
    }
  }
}
// 等距方塊：底頂點 (cx,by)、半寬 hw（偶數）、牆高 h；回傳屋頂菱形頂點 y
function isoBox(g,cx,by,hw,h,cL,cR,cTop){
  g.fillStyle=cL;
  for(let dx=1;dx<=hw;dx++){const yF=by-(dx>>1);g.fillRect(cx-dx,yF-h,1,h);}
  g.fillStyle=cR;
  for(let dx=0;dx<hw;dx++){const yF=by-((dx+1)>>1);g.fillRect(cx+dx,yF-h,1,h);}
  g.fillStyle='rgba(0,0,0,.13)';                       // 底部 AO
  for(let dx=1;dx<=hw;dx++){const yF=by-(dx>>1);g.fillRect(cx-dx,yF-3,1,3);}
  for(let dx=0;dx<hw;dx++){const yF=by-((dx+1)>>1);g.fillRect(cx+dx,yF-3,1,3);}
  g.fillStyle='rgba(0,0,0,.25)';g.fillRect(cx,by-h,1,h); // 前角線
  const rty=by-h-hw;
  dia(g,cx,rty,hw,cTop);
  diaEdge(g,6,shade(cTop,-26),cx,rty,hw);              // 簷口陰影
  diaEdge(g,9,shade(cTop,16),cx,rty,hw);               // 頂緣受光
  return rty;
}
// 牆上窗（含窗台與反光，跟著牆斜率排），同步畫到夜間圖層
function windows(g,ng,cx,by,hw,h,rand,litP,opts){
  const o=Object.assign({w:3,ht:4,gx:5,gy:7,glass:'#26314e',lit:'#ffd77a'},opts||{});
  const put=(x,y)=>{
    g.fillStyle=o.glass;g.fillRect(x,y,o.w,o.ht);
    g.fillStyle='rgba(255,255,255,.28)';g.fillRect(x,y,o.w,1);
    g.fillStyle='rgba(255,255,255,.30)';g.fillRect(x,y+o.ht,o.w,1);
    if(ng&&rand()<litP){ng.fillStyle=o.lit;ng.fillRect(x,y,o.w,o.ht);}
  };
  for(let dx=2;dx<hw-o.w-1;dx+=o.gx){                  // 右牆
    const yF=by-((dx+1)>>1);
    for(let y=yF-h+3;y<yF-o.ht-2;y+=o.gy)put(cx+dx,y);
  }
  for(let dx=4;dx<hw-1;dx+=o.gx){                      // 左牆
    const yF=by-(dx>>1);
    for(let y=yF-h+3;y<yF-o.ht-2;y+=o.gy)put(cx-dx-o.w+1,y);
  }
}
// 輪廓線後處理：透明像素貼著實體 → 描 1px 深色邊
function outlineSprite(c,r,gc,b){
  const g=c.getContext('2d');
  const w=c.width,h=c.height;
  const im=g.getImageData(0,0,w,h),a=im.data;
  const solid=(x,y)=>x>=0&&y>=0&&x<w&&y<h&&a[(y*w+x)*4+3]>40;
  const marks=[];
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const i=(y*w+x)*4;
    if(a[i+3]<=40&&(solid(x+1,y)||solid(x-1,y)||solid(x,y+1)||solid(x,y-1)))marks.push(i);
  }
  for(const i of marks){a[i]=r;a[i+1]=gc;a[i+2]=b;a[i+3]=255;}
  g.putImageData(im,0,0);
}
function shade(hex,amt){
  const n=parseInt(hex.slice(1),16);
  const r=clamp((n>>16)+amt,0,255),g=clamp(((n>>8)&255)+amt,0,255),b=clamp((n&255)+amt,0,255);
  return '#'+((r<<16|g<<8|b).toString(16).padStart(6,'0'));
}
// 建築地基板
function plate(g,ax,ay,col){
  col=col||'#9a9484';
  dia(g,ax,ay-32,32,col);
  speck(g,ax,ay-32,32,[shade(col,-10),shade(col,8)],26,()=>Math.random());
  diaEdge(g,6,shade(col,-20),ax,ay-32,32);
  diaEdge(g,9,shade(col,10),ax,ay-32,32);
}

  /* ===== T125 住宅財富分級外觀：k=1 每個 (lv,v) 生成貧/富兩套色變（鍵名 1_lv_v_w0/w2），
     置於 buildSprites 絕對尾端（接在 T119 尾端新增之後），不位移任何既有 rand 消耗序、不重繪既有中產鍵
     （中產沿用既有 SPR.bld['k_lv_v']，像素零改動）；富＝提亮牆色＋屋頂加天線／小花圃綠化，
     貧＝降飽和牆色（略壓暗）＋牆面補丁色塊；沿用 mkBld 同款部件引擎重繪，僅色盤與收尾裝飾不同 ===== */
  {
    const desat=hex=>{ // 降飽和＋略壓暗（貧宅褪色感），沿用既有 shade() 同款十六進位色算法
      const n=parseInt(hex.slice(1),16);
      const r=(n>>16)&255,gg=(n>>8)&255,b=n&255;
      const l=Math.round(r*.3+gg*.59+b*.11);
      const mix=v=>clamp(Math.round(v*.4+l*.5-12),0,255);
      return '#'+((mix(r)<<16|mix(gg)<<8|mix(b)).toString(16).padStart(6,'0'));

    };

  }

  /* ===== T128 建築細節密度提升：屋頂雜物（空調外機/通風管/曬衣繩/儲物箱/太陽能小板）＋立面件（陽台欄杆/
     窗台花箱/店招燈箱），置於 buildSprites 絕對尾端（接在 T127 尾端新增之後）。detailPass() 遍歷 k=1/2/3
     DRAFTS 建築（含 T125 財富色變 w0/w2 鍵）與 k=33/34 摩天樓，直接讀 DRAFTS/塔樓幾何（hw/h，與 mkBld/塔樓
     生成時 isoBox 呼叫同一組 ax/by 座標系）推算屋頂菱形（roofHalfW 公式與 dia() 內部展開式一致）與牆面矩形
     （wallCol 的 yF 公式與 isoBox 逐列填色公式一致）安全範圍，只在此範圍內補畫，保證不越出建築剪影；細節色
     一律由該建築 PAL 牆/屋頂色 shade() 深淺派生，不引入新色；密度依 lv 遞增（lv1 少、lv3 密，塔樓比照最密）；
     夜光件（店招燈箱/機電指示燈）同步補進 night 圖層；純尾端疊加、不在既有序列中間消耗 rand（本段仍用同一
     buildSprites 局部 rand 做細節取色/位置的小幅變化，但因處於絕對尾端，不位移其後任何生成——已無其後生成）；
     window.__noDetail=true 時整段跳過 detailPass() 呼叫＝零位移（改動前位元一致，供除錯/回歸比對用） ===== */
  {
    // 屋頂菱形在列偏移 ry（0..hw-1，0＝頂點所在列）處的半寬，公式與 dia() 內部展開式完全一致
    const roofHalfW=(hw,ry)=>{ry=clamp(ry,0,hw-1);const hh=hw>>1;const i=ry<hh?ry:hw-1-ry;return(i+1)*2;};
    // 牆面在偏移 dx 處的列 x 座標與該列頂端 y（沿用 isoBox 逐列 yF 公式，保證落在已填實牆面矩形內）
    const wallCol=(cx,by,dx,side)=>side==='R'?{x:cx+dx,yF:by-((dx+1)>>1)}:{x:cx-dx,yF:by-(dx>>1)};

      g.fillStyle=shade(tone,18);g.fillRect(x,y,1,h2);
      g.fillStyle=shade(tone,-36);g.fillRect(x-1,y,4,1);
    };
    const storageBox=(g,x,y,tone)=>{ // 儲物箱
      g.fillStyle=tone;g.fillRect(x,y,4,3);
      g.fillStyle=shade(tone,18);g.fillRect(x,y,4,1);
      g.fillStyle=shade(tone,-30);g.fillRect(x,y+2,4,1);
    };
    const solarPanel=(g,x,y,w,tone)=>{ // 太陽能小板：深藍格紋＋支架陰影

    // 3) detailPass 覆蓋（T128 同款屋頂雜物/立面件，獨立作用域重新宣告，僅套用新鍵）
    {
      const roofHalfW=(hw,ry)=>{ry=clamp(ry,0,hw-1);const hh=hw>>1;const i=ry<hh?ry:hw-1-ry;return(i+1)*2;};

      const solarPanel=(g,x,y,w,tone)=>{
        g.fillStyle='#2a3f5c';g.fillRect(x,y,w,3);

        g.fillStyle=shade(tone,-24);g.fillRect(x,y+3,w,1);

      const clothesline=(g,x,y,w,cols)=>{

      const balconyRail=(g,x,y,w,tone)=>{
        g.fillStyle=tone;g.fillRect(x,y,w,1);

      const flowerBox=(g,x,y,tone)=>{

      };
      const signLightbox=(g,ng,x,y,w,col)=>{
        g.fillStyle='#20242c';g.fillRect(x,y,w,3);

      const acLamp=(g,ng,x,y)=>{
        g.fillStyle='#c94848';g.fillRect(x,y,1,1);

      const applyDetail=(key,k,cL,cR,rf,ax,ay,by,hw,h,density)=>{
        const spr=SPR.bld[key];
        if(!spr)return;
        const g=spr.img.getContext('2d'),ng=spr.night.getContext('2d');
        const rty=by-h-hw;

        const facadeSpots=[.30,.55,.15,.70];

    }
    // 4) detailPass2 覆蓋（T147 同款風化/招牌/牆面痕跡/屋頂二期/陽台雜物二期，獨立作用域重新宣告，僅套用新鍵）
    {
      const roofHalfW=(hw,ry)=>{ry=clamp(ry,0,hw-1);const hh=hw>>1;const i=ry<hh?ry:hw-1-ry;return(i+1)*2;};
      const wallCol=(cx,by,dx,side)=>side==='R'?{x:cx+dx,yF:by-((dx+1)>>1)}:{x:cx-dx,yF:by-(dx>>1)};
      const wallSafeY=(yF,h,frac,mh)=>{const top=yF-h+4,bot=yF-5-mh+1;return clamp(Math.round(yF-4-h*frac),top,Math.max(top,bot));};
      const grime=(g,x,y,tone)=>{g.fillStyle='rgba(22,20,16,.24)';g.fillRect(x,y,2,2);g.fillStyle=shade(tone,-26);g.fillRect(x,y,1,1);};
      const rustSpot=(g,x,y)=>{g.fillStyle='rgba(150,80,40,.5)';g.fillRect(x,y,2,1);g.fillStyle='rgba(108,58,28,.5)';g.fillRect(x,y+1,1,1);};
      const mossPatch=(g,x,y)=>{g.fillStyle='rgba(92,122,62,.32)';g.fillRect(x,y,3,2);g.fillStyle='rgba(70,100,45,.3)';g.fillRect(x+1,y,1,1);};
      const shopAwning=(g,x,y,w,col)=>{g.fillStyle=shade(col,-10);g.fillRect(x,y,w,2);for(let i=0;i<w;i+=2){g.fillStyle=(i&2)?col:'#f2f2f2';g.fillRect(x+i,y,2,2);}};
      const neonStrip=(g,ng,x,y,w,col)=>{g.fillStyle='#1c1f26';g.fillRect(x,y,w,2);g.fillStyle=col;g.fillRect(x+1,y,w-2,1);ng.fillStyle=col;ng.fillRect(x,y,w,2);};
      const posterMark=(g,x,y,col)=>{g.fillStyle='#e8e4d8';g.fillRect(x,y,3,4);g.fillStyle=col;g.fillRect(x+1,y+1,1,2);};
      const graffitiMark=(g,x,y,col)=>{const a=g.globalAlpha;g.globalAlpha=.55;g.fillStyle=col;g.fillRect(x,y,4,2);g.globalAlpha=a;};
      const roofGarden=(g,x,y,halfw)=>{const w=halfw*2;g.fillStyle='#6b4c38';g.fillRect(x-halfw,y,w,2);const gc=['#5a9450','#78b062','#4a8244'];for(let i=0;i<w;i+=2){g.fillStyle=gc[(i>>1)%3];g.fillRect(x-halfw+i,y-1,1,1);}};
      const satelliteDish=(g,x,y)=>{g.fillStyle='#aab0b8';g.fillRect(x-2,y,4,3);g.fillStyle='#7f858c';g.fillRect(x-1,y+3,1,2);};
      const tankVariant=(g,x,y)=>{g.fillStyle='#8a95a0';g.fillRect(x-2,y,5,4);g.fillStyle='#c0c8d0';g.fillRect(x-2,y,5,1);g.fillStyle='#5f6870';g.fillRect(x-1,y+4,1,2);g.fillRect(x+1,y+4,1,2);};
      const pottedPlant=(g,x,y,tone)=>{g.fillStyle='#5a9450';g.fillRect(x,y,1,3);g.fillRect(x+2,y,1,3);g.fillStyle='#78b062';g.fillRect(x+1,y,1,2);g.fillStyle=tone;g.fillRect(x,y+3,3,2);};
      const boxStack=(g,x,y,tone)=>{g.fillStyle=tone;g.fillRect(x,y,4,2);g.fillStyle=shade(tone,-18);g.fillRect(x+1,y+2,3,2);};
      const WEATHER_N=[5,2,1];
      const applyDetail2=(key,k,we,lv,cL,cR,rf,ax,ay,by,hw,h)=>{
        const spr=SPR.bld[key];
        if(!spr)return;
        const g=spr.img.getContext('2d'),ng=spr.night.getContext('2d');
        const rty=by-h-hw;
        const faTone=shade(cR,-16);
        const kind=(k===2||k===34)?'C':(k===3?'I':'R');
        const wn=Math.max(0,WEATHER_N[we]+(lv===1?1:lv===3?-1:0)-(kind==='C'?1:0));
        for(let i=0;i<wn;i++){
          const side=i%2===0?'R':'L';
          const dx=clamp(1+Math.floor(rand()*Math.max(1,hw-5)),1,hw-4);
          const{x:colX,yF}=wallCol(ax,by,dx,side);
          const py=wallSafeY(yF,h,.15+rand()*.55,2);
          const m=i%3;
          if(kind==='I'||m===1)rustSpot(g,colX-1,py);
          else if(m===2)mossPatch(g,colX-1,py);
          else grime(g,colX-1,py,faTone);
        }
        if(kind==='C'){
          const dx=clamp(Math.round(hw*.42)+Math.floor(rand()*3)-1,2,hw-6);
          const{x:colX,yF}=wallCol(ax,by,dx,'R');
          const topY=wallSafeY(yF,h,.72,2);
          shopAwning(g,colX-3,topY,7,SIGNC[(k*3+we+dx)%SIGNC.length]);
          const neonY=clamp(topY+3,yF-h+4,yF-6);
          neonStrip(g,ng,colX-3,neonY,7,SIGNC[(k*3+we+dx+4)%SIGNC.length]);
        }
        if(k===1&&lv<=2&&we!==2){
          const pn=we===0?2:1;
          for(let i=0;i<pn;i++){
            const dx=clamp(3+Math.floor(rand()*Math.max(1,hw-8)),2,hw-5);
            const side=i%2===0?'L':'R';

            else{const py=wallSafeY(yF,h,.12,2);graffitiMark(g,colX-2,py,SIGNC[(dx+we+3)%SIGNC.length]);}
          }
        }
        const roofRows2=[.2,.72];
        const rn=Math.max(0,lv-1);
        for(let i=0;i<rn;i++){

        }
      }

function wealthSpr(baseKey,we){
  if(we===0)return SPR.bld[baseKey+'_w0']||SPR.bld[baseKey];
  if(we===2)return SPR.bld[baseKey+'_w2']||SPR.bld[baseKey];
  return SPR.bld[baseKey];
}
// T163：岸邊倒影用簡化建築 sprite 查找（僅涵蓋常見單格建築；多格/摩天樓/體育場等複雜案例回退 null 不繪，
// 低成本簡化設計已於卡面驗收確認，不影響其餘既有渲染路徑，不消耗 R()/ri()）
function reflectSprite(bd){
  if(!bd||bd.ref||(bd.sz&&bd.sz>=2))return null;
  if(bd.k===4)return(inWinter()?SPR.parkW:SPR.park)[bd.v];
  if(bd.k===5)return SPR.plant;
  if(bd.k===10)return SPR.waterTower;
  if(bd.k===11)return SPR.police;
  if(bd.k===12)return SPR.hospital;
  if(bd.k===13)return SPR.clinic;
  if(bd.k===1)return wealthSpr(bd.k+'_'+bd.lv+'_'+(bd.v||0),bd.we)||SPR.bld[bd.k+'_'+bd.lv+'_0'];
  if(bd.k===2||bd.k===3)return SPR.bld[bd.k+'_'+bd.lv+'_'+(bd.v||0)]||SPR.bld[bd.k+'_'+bd.lv+'_0'];
  return null;
}

/* 標題 LOGO（開始畫面的小島） */
function drawLogo(){
  const c=$('#logo'),g=c.getContext('2d');g.imageSmoothingEnabled=false;
  g.clearRect(0,0,c.width,c.height);
  const sx=(x,y)=>112+(x-y)*32-32, sy=(x,y)=>18+(x+y)*16;
  for(let y=0;y<3;y++)for(let x=0;x<3;x++){
    if(x===2||y===2)g.drawImage(SPR.cliff,sx(x,y),sy(x,y));
    g.drawImage(SPR.grass[(x*2+y)%4],sx(x,y),sy(x,y));
  }
  g.drawImage(SPR.roadClass[1][1|4],sx(1,1),sy(1,1));
  const put=(s,x,y)=>g.drawImage(s.img,sx(x,y)+32-s.ax,sy(x,y)+32-s.ay);
  put(SPR.tree[0],2,0);
  put(SPR.bld['1_1_0'],0,1);
  put(SPR.bld['2_1_1'],2,1);
}

/* ===== T158 標題畫面美術：等距小鎮剪影背景＋星空＋窗燈微光（v4.3，僅開始畫面用）。獨立計時（titlePhase 由
   rAF timestamp 換算，不讀寫 visT/cam/tiles 等任何模擬全域狀態），沿用既有 isoBox()/dia()（本節開頭）與
   streetHash()（第 7 節）同款手法縮小繪製窗燈決定性排列；天空/星空色彩曲線公式沿用 daylight()/stars 同款
   邏輯（獨立 titleStars 陣列與獨立相位，不共用/不消耗遊戲原有 stars 或 R()/ri()）。版面（TITLE_BLDGS 各
   建築 rx/hw/h）與剪影構圖皆本卡原創設計，未參考、描摹或轉換任何 TheoTown 或其他既有遊戲之素材。
   requestAnimationFrame 迴圈僅於 #start 顯示時運行，begin() 進遊戲時 cancelAnimationFrame 停止（見該處），
   不洩漏、不影響遊戲主迴圈（第 12 節 frame()）效能。===== */
const titleCvs=$('#titleBg'),titleCtx=titleCvs&&titleCvs.getContext('2d');
let titleRAF=null;
const TITLE_CYCLE=42000; // 標題晝夜循環週期（毫秒，獨立於遊戲 CYCLE/visT）
const titleStars=[];
for(let i=0;i<70;i++)titleStars.push([Math.random(),Math.random()*.6,Math.random()*6.28]);
// 剪影小鎮固定版面：rx＝畫面寬度比例、hw＝半寬（偶數，供 isoBox/dia 使用，符合鐵律6）、h＝牆高
const TITLE_BLDGS=[
  {rx:.06,hw:18,h:34},{rx:.16,hw:22,h:54},{rx:.27,hw:16,h:30},{rx:.36,hw:26,h:70},
  {rx:.47,hw:18,h:42},{rx:.58,hw:24,h:60},{rx:.68,hw:16,h:32},{rx:.79,hw:22,h:50},
  {rx:.90,hw:18,h:38}
];
function ensureTitleBgSize(){
  if(!titleCvs)return;
  const cw=titleCvs.clientWidth||window.innerWidth||800,ch=titleCvs.clientHeight||window.innerHeight||600;
  if(titleCvs.width!==cw||titleCvs.height!==ch){titleCvs.width=cw;titleCvs.height=ch;}
}
// 窗燈微光：streetHash 決定性挑選是否為亮窗（越夜比例越高），微光閃爍純數學 sine，不消耗 R()/ri()
function titleWinDot(x,y,seed,litBase,t){
  if(streetHash(x,y,seed)>=.26+litBase*.44)return;
  const tw=.5+.5*Math.abs(Math.sin(t*1.8+x*.11+y*.09));
  titleCtx.globalAlpha=.3+litBase*.7*tw;
  titleCtx.fillStyle='#ffd977';
  titleCtx.fillRect(x,y,2,2);
}
// 窗格排列沿用既有 windows() 同款逐列座標公式（右牆 yF=by-((dx+1)>>1)、左牆 yF=by-(dx>>1)），簡化為單層點光
function titleWindows(cx,by,hw,h,seed,litBase,t){
  for(let dx=2;dx<hw-2;dx+=6){
    const yF=by-((dx+1)>>1);
    for(let y=yF-h+4;y<yF-4;y+=8)titleWinDot(cx+dx,y,seed,litBase,t);
  }
  for(let dx=4;dx<hw-1;dx+=6){
    const yF=by-(dx>>1);
    for(let y=yF-h+4;y<yF-4;y+=8)titleWinDot(cx-dx,y,seed,litBase,t);
  }
}
function drawTitleBg(ts){
  if(!titleCtx)return;
  const W2=titleCvs.width,H2=titleCvs.height;
  if(!W2||!H2)return;
  const t=(ts||0)/1000;
  const ph=((ts||0)%TITLE_CYCLE)/TITLE_CYCLE;
  const dd=Math.max(0,Math.sin((ph-.25)*Math.PI*2));
  const b=.30+.66*Math.pow(dd,.7); // 沿用 daylight() 同款曲線公式（色調邏輯與遊戲一致，計時完全獨立）
  const topC=[Math.round(lerp(8,70,b)),Math.round(lerp(10,110,b)),Math.round(lerp(28,168,b))];
  const botC=[Math.round(lerp(20,196,b)),Math.round(lerp(26,206,b)),Math.round(lerp(56,224,b))];
  const grad=titleCtx.createLinearGradient(0,0,0,H2);
  grad.addColorStop(0,`rgb(${topC[0]},${topC[1]},${topC[2]})`);
  grad.addColorStop(1,`rgb(${botC[0]},${botC[1]},${botC[2]})`);
  titleCtx.fillStyle=grad;titleCtx.fillRect(0,0,W2,H2);
  if(b<.6){ // 星空：沿用遊戲 stars 陣列同款 twinkle 公式（獨立 titleStars，不共用/不消耗遊戲 stars）
    titleCtx.fillStyle='#fff';
    const starA=(0.6-b)/.6;
    for(const s of titleStars){
      const tw=.35+.65*Math.abs(Math.sin(t*1.4+s[2]));
      titleCtx.globalAlpha=starA*tw;

   3. 世界生成
===================================================================== */
function genWorld(sd){
  seed=sd;R=mulberry32(sd);
  const noi=makeNoise(mulberry32(sd^0x9e37),64);
  const noi2=makeNoise(mulberry32(sd^0x51f3),64);
  const noi3=makeNoise(mulberry32(sd^0x27b1),64);                          // 高地噪聲（T24）
  tiles=new Array(N*N);
  let water=0;
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){
    const n=noi(x*.085,y*.085);
    let t=2;
    if(n<.40)t=0; else if(n<.455)t=1;
    if(t===0)water++;
    const el=(t===2&&noi3(x*.06,y*.06)>.62)?1:0;                           // 高地：僅草地（T24）
    const tile={t,tree:0,gv:ri(4),road:0,bridge:0,hw:0,rc:0,mask:0,zone:0,bld:null,rp:false,wp:0,wr:0,wm:0,deco:0,el,em:0};
    if(t===2&&noi2(x*.13,y*.13)>.62&&R()<.8)tile.tree=1+ri(10); // T104：樹種 4→7；T150：樹種 7→10
    else if(t===2&&R()<.015)tile.deco=1;
    tiles[idx(x,y)]=tile;
  }
  // ---- 河流：1-3 條，向噪聲遞減方向蜿蜒挖成真水域（T24） ----
  const carve=(cx,cy)=>{const tl=tiles[idx(cx,cy)];if(tl.t!==0){tl.t=0;water++;}tl.tree=0;tl.deco=0;tl.el=0;};
  const nR=1+ri(3),dirs=[[0,-1],[1,0],[0,1],[-1,0]];
  for(let r=0;r<nR;r++){
    let cx=0,cy=0,ok=false;
    for(let tr=0;tr<40&&!ok;tr++){const rx=ri(N),ry=ri(N);if(tiles[idx(rx,ry)].el===1){cx=rx;cy=ry;ok=true;}} // 優先高地起點
    if(!ok){const e=ri(4);cx=e===1?N-1:e===3?0:ri(N);cy=e===0?0:e===2?N-1:ri(N);}                              // 退化：地圖邊緣隨機點
    let px=-1,py=-1;
    for(let step=0;step<60;step++){
      const wr=1+ri(2);                                                    // 路徑及其鄰寬隨機 1-2 格
      for(let dy=-wr;dy<=wr;dy++)for(let dx=-wr;dx<=wr;dx++)
        if(Math.abs(dx)+Math.abs(dy)<=wr&&inMap(cx+dx,cy+dy))carve(cx+dx,cy+dy);
      let best=-1,bestV=1e9;
      for(let d=0;d<4;d++){const nx=cx+dirs[d][0],ny=cy+dirs[d][1];
        if(!inMap(nx,ny)||(nx===px&&ny===py))continue;
        const v=noi(nx*.085,ny*.085);if(v<bestV){bestV=v;best=d;}}         // 向鄰格中 noi 最低者
      if(best<0)break;
      if(R()<.30){const cand=[];for(let d=0;d<4;d++){const nx=cx+dirs[d][0],ny=cy+dirs[d][1];if(inMap(nx,ny)&&!(nx===px&&ny===py))cand.push(d);}if(cand.length)best=cand[ri(cand.length)];} // 30% 隨機偏折
      px=cx;py=cy;cx+=dirs[best][0];cy+=dirs[best][1];
      if(noi(cx*.085,cy*.085)<.40){carve(cx,cy);break;}                    // 觸及原生水域→匯流停止
    }
  }
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){
    const tl=tiles[idx(x,y)];
    if(tl.t===1&&!tl.deco&&R()<.25){
      for(const[dx,dy]of[[0,-1],[1,0],[0,1],[-1,0]])
        if(inMap(x+dx,y+dy)&&tiles[idx(x+dx,y+dy)].t===0){tl.deco=2;break;} // 蘆葦
    }else if(tl.t===2&&!tl.tree&&!tl.deco&&R()<.01)tl.deco=3;               // 野花叢
  }
  // ---- T105 新裝飾散布：石燈籠/小雕像/噴泉座/花壇/告示牌（v4-8）----
  // 獨立亂數流（自 sd 派生，同 noi/noi2/noi3 手法），不消耗全域 R，不干擾既有地形/樹/deco(1-3) 的既有判定與後續序列
  const decoR=mulberry32(sd^0x5b1e);
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){
    const tl=tiles[idx(x,y)];
    if(tl.t===2&&!tl.tree&&!tl.deco&&decoR()<.018)tl.deco=4+Math.floor(decoR()*6); // T176：值域 4-8→4-9 納入小池塘 v9（decoR 呼叫數不變＝不位移串流；decoR 為裝飾專用流不影響模擬）
  }
  genResource(sd); // T140：資源層（獨立種子噪聲，不消耗全域 R()，見 genResource 定義處說明）
  return water/(N*N);
}
// 水岸泡沫遮罩（哪幾條邊鄰接陸地）
// T121：單格版抽出（逐行搬運不改邏輯，continue→return），供地形筆刷鄰域重算複用；computeFoam 逐格呼叫，全圖結果不變
function recalcFoamAt(x,y){
  if(!inMap(x,y))return;
  const t=T(idx(x,y));t.wm=0;
  if(t.t!==0)return;
  let m=0;
  if(inMap(x,y-1)&&T(idx(x,y-1)).t!==0)m|=1;
  if(inMap(x+1,y)&&T(idx(x+1,y)).t!==0)m|=2;
  if(inMap(x,y+1)&&T(idx(x,y+1)).t!==0)m|=4;
  if(inMap(x-1,y)&&T(idx(x-1,y)).t!==0)m|=8;
  t.wm=m;
}
function computeFoam(){
  for(let y=0;y<N;y++)for(let x=0;x<N;x++)recalcFoamAt(x,y);
}
// T121：地形筆刷用——僅重算操作格自己＋四鄰（對齊 recalcMask/recalcMask4 既有寫法），不做全圖校驗
function recalcFoamNear(x,y){

}
// 高地內陸崖沿位罩（哪幾條邊鄰接低地；el 生成後算一次，沿用 foam 位向約定，T24）
// T121：單格版抽出（逐行搬運不改邏輯，continue→return），供地形筆刷鄰域重算複用；computeElMask 逐格呼叫，全圖結果不變
function recalcElMaskAt(x,y){
  if(!inMap(x,y))return;
  const t=T(idx(x,y));t.em=0;
  if(t.el!==1)return;
  let m=0;
  if(inMap(x,y-1)&&T(idx(x,y-1)).el===0)m|=1;
  if(inMap(x+1,y)&&T(idx(x+1,y)).el===0)m|=2;
  if(inMap(x,y+1)&&T(idx(x,y+1)).el===0)m|=4;
  if(inMap(x-1,y)&&T(idx(x-1,y)).el===0)m|=8;
  t.em=m;
}
function computeElMask(){
  for(let y=0;y<N;y++)for(let x=0;x<N;x++)recalcElMaskAt(x,y);
}
// T121：地形筆刷用——僅重算操作格自己＋四鄰
function recalcElMaskNear(x,y){
  recalcElMaskAt(x,y);recalcElMaskAt(x,y-1);recalcElMaskAt(x+1,y);recalcElMaskAt(x,y+1);recalcElMaskAt(x-1,y);
}

function recalcMask(x,y){
  if(!inMap(x,y))return; // 邊界防護：鄰格重算可能落在圖外
  const t=T(idx(x,y));if(!t.road)return;
  let m=0;
  if(inMap(x,y-1)&&T(idx(x,y-1)).road)m|=1;
  if(inMap(x+1,y)&&T(idx(x+1,y)).road)m|=2;
  if(inMap(x,y+1)&&T(idx(x,y+1)).road)m|=4;
  if(inMap(x-1,y)&&T(idx(x-1,y)).road)m|=8;
  t.mask=m;
}
function recalcAllMasks(){
  for(let y=0;y<N;y++)for(let x=0;x<N;x++)recalcMask(x,y);
}
function roadToolToRc(id){return {alley:1,road:2,coll:3,art:4,hwy:5}[id]||0;}
function rcToName(rc){return ROAD_NAME[rc-1]||'';}
// 鐵路/輕軌遮罩（T39/T44）
function recalcRailMask(x,y){
  if(!inMap(x,y))return;
  const t=T(idx(x,y));
  if(!t.rail&&!t.tram)return;
  let m=0;
  if(inMap(x,y-1)&&(T(idx(x,y-1)).rail||T(idx(x,y-1)).tram))m|=1;
  if(inMap(x+1,y)&&(T(idx(x+1,y)).rail||T(idx(x+1,y)).tram))m|=2;
  if(inMap(x,y+1)&&(T(idx(x,y+1)).rail||T(idx(x,y+1)).tram))m|=4;
  if(inMap(x-1,y)&&(T(idx(x-1,y)).rail||T(idx(x-1,y)).tram))m|=8;
  if(t.rail)t.railMask=m;
  if(t.tram)t.tramMask=m;
}
// 對齊道路做法（recalcMask）：軌道變更後自己＋四鄰一起重算（recalcRailMask 自帶 inMap 與無軌早退，鄰格可安全呼叫）
function recalcRailMask4(x,y){
  recalcRailMask(x,y);recalcRailMask(x,y-1);recalcRailMask(x+1,y);recalcRailMask(x,y+1);recalcRailMask(x-1,y);
}
function getMaxRoadClass(x,y,r=1){
  let mx=0;
  for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){
    const nx=x+dx,ny=y+dy;
    if(!inMap(nx,ny))continue;
    const t=T(idx(nx,ny));
    if(t.road&&t.rc>mx)mx=t.rc;

}
function roadCostAt(x,y,rc){return T(idx(x,y)).t===0?ROAD_COST[rc-1]+COST.bridge:ROAD_COST[rc-1];}
// T121：地形筆刷涵蓋格清單（依全域 terraBrush：1→僅中心格，3→3×3，皆裁切地圖邊界）
function terraCells(x,y){
  if(terraBrush!==3)return [[x,y]];
  const arr=[];
  for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){

// 回傳 null＝可行，否則錯誤訊息
function canPlace(toolId,x,y){
  if(!inMap(x,y))return '超出地圖';
  const t=T(idx(x,y));
  if(t.ruin&&toolId!=='doze')return '焦土需先清理';
  if(t.crater&&toolId!=='doze')return '隕石坑需先剷除';                        // T117：拆除隕石坑走 doze 鏈最小分支
  switch(toolId){
    case 'alley':case 'road':case 'coll':case 'art':case 'hwy':{
      const rcTarget=roadToolToRc(toolId);
      if(t.road&&t.rc>=rcTarget)return '已為同級或更高級道路';
      if(t.bld)return '有建築擋住';
      return null;}
    case 'zr':case 'zc':case 'zi':
      if(t.t!==2&&t.t!==1)return '只能劃在陸地上';
      if(t.road)return '道路上不能分區';
      if(t.bld)return '已有建築';
      return null;
    case 'park':case 'plant':case 'water':case 'fire':case 'police':case 'hospital':case 'clinic':case 'school':case 'library':case 'post':case 'cemetery':case 'dump':
      if(t.t!==2&&t.t!==1)return '只能蓋在陸地上';
      if(t.road)return '道路上不能建造';
      if(t.bld)return '已有建築';
      return null;
    case 'wpipe':

      for(const[sx,sy]of[[x,y],[x+1,y],[x,y+1],[x+1,y+1]]){
        if(!inMap(sx,sy))return '需 2×2 陸地';
        const st=T(idx(sx,sy));
        if(st.t!==2&&st.t!==1)return '需 2×2 陸地';
        if(st.road)return '道路擋住';
        if(st.bld)return '已有建築';
        if(st.ruin)return '焦土需先清理';
      }
      return null;
    case 'rdec':
      if(!t.road||t.bridge||t.rdec)return '只能加在道路上';

      if(!t.road||t.bridge||t.bus)return '只能加在道路上';

    case 'tree':

    case 'fill':
      if(t.t!==1)return '只能填在沙地上';

      if(toolId==='landmark'||toolId==='prison'||toolId==='farm'||toolId==='ranch'||toolId==='solar'||toolId==='museum'||toolId==='theater'||toolId==='aquarium'||toolId==='grandlib'||toolId==='civichall'||toolId==='court'||toolId==='institute'){ // T138：博物館/劇院/水族館/圖書總館 2×2；T139：市政廳/法院/研究院 2×2

    case 'oneway':

function canPlaceMulti(x,y,sz,msg){
  for(let dy=0;dy<sz;dy++)for(let dx=0;dx<sz;dx++){
    const sx=x+dx,sy=y+dy;
    if(!inMap(sx,sy))return msg;
    const st=T(idx(sx,sy));
    if(st.t!==2&&st.t!==1)return msg;
    if(st.road||st.rail||st.tram)return '交通線擋住';
    if(st.bld)return '已有建築';
    if(st.ruin)return '焦土需先清理';
  }
  return null;
}

  groundDirty=true; // T96：doPlace 是建造/拆除唯一資料變更點，統一於此標記地面層快取失效
  if(toolId==='doze')spawnDebris(x,y);else spawnDust(x,y); // T159：拆除碎屑／建造塵土，doPlace 觸發一次性運行時粒子（不影響存檔與模擬）
  return true;
}

/* =====================================================================
   5. 模擬
===================================================================== */
function hasRoadNear(x,y,r,needPow,noHw){
  for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){
    const nx=x+dx,ny=y+dy;
    if(!inMap(nx,ny))continue;
    const t=T(idx(nx,ny));
    if(t.road&&(!noHw||!t.hw)&&(!needPow||t.rp))return true; // noHw：分區生長只認普通路（高速不吸引住宅，T21）
  }
  return false;
}
function computePower(){
  let plants=0,so=0,wi=0;
  for(let i=0;i<N*N;i++){tiles[i].rp=false;const b=tiles[i].bld;if(b&&!b.ref){if(b.k===5)plants++;else if(b.k===25)so++;else if(b.k===26)wi++;}}
  // T82：再生能源加容量；仍需至少一座電廠啟動路網 BFS
  if(!plants)return 0;
  const seen=new Uint8Array(N*N);
  const q=[];
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){
    const t=T(idx(x,y));
    if(!(t.bld&&t.bld.k===5))continue;
    for(const[dx,dy]of[[0,-1],[1,0],[0,1],[-1,0]]){
      const nx=x+dx,ny=y+dy;
      if(inMap(nx,ny)&&T(idx(nx,ny)).road&&!seen[idx(nx,ny)]){
        seen[idx(nx,ny)]=1;q.push([nx,ny,0]);
      }
    }
  }
  let head=0;
  while(head<q.length){
    const[x,y,d]=q[head++];
    T(idx(x,y)).rp=true;
    if(d>=90)continue;
    for(const[dx,dy]of[[0,-1],[1,0],[0,1],[-1,0]]){
      const nx=x+dx,ny=y+dy;
      if(!inMap(nx,ny))continue;
      const j=idx(nx,ny);
      if(T(j).road&&!seen[j]){seen[j]=1;q.push([nx,ny,d+1]);}
    }
  }
  return plants*(PLANT_CAP+(pol&&pol.ecoReg?5:0))+so*15+wi*20; // T82 太陽能/風力額外容量；T122 節能條例：每電廠供電棟數+5
}
function countNear(x,y,r,pred){
  let n=0;
  for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){
    const nx=x+dx,ny=y+dy;
    if(!inMap(nx,ny))continue;
    if(pred(T(idx(nx,ny))))n++;
  }
  return n;
}
// T129：鄰近道路壅堵程度（Chebyshev 半徑 r）——countNear 的 pred 只拿得到鄰格 tile 物件、查不到其 idx，
// 故仿 stampCov／stampPolSrc 手法自行逐格算 idx 查 roadLoad/ROAD_CAP；回傳半徑內「目前過載」的道路格數。
// load 全圖為 0（空車城）時任一鄰格 roadLoad[j]>ROAD_CAP 恆假、回傳 0，供 happyParts「交通壅堵」項不變量成立。
function congestNear(x,y,r){
  let n=0;
  for(let dy=-r;dy<=r;dy++){const ny=y+dy;if(ny<0||ny>=N)continue;
    for(let dx=-r;dx<=r;dx++){const nx=x+dx;if(nx<0||nx>=N)continue;
      const j=idx(nx,ny),tt=tiles[j];
      if(tt.road&&roadLoad[j]>ROAD_CAP[(tt.rc||2)-1])n++;
    }}
  return n;
}
/* T61 服務覆蓋計數場：擺放時蓋印一次，tick 內 O(1) 讀取（取代逐棟 countNear 方框掃描）。
   運行時重建、不入存檔（load/newWorld 後與 undo 後 rebuildCov 全量重建）。語義與原 countNear(...)>0／計數完全一致。*/
const COVR={park:4,plant:4,fire:9,school:8,stadium:10,police:10,hospital:12,clinic:6,library:6,post:8,cemetery:10,bus:6,rdec:2,ambulance:10,fire2:12,prison:8,university:10,parking:8,museum:8,theater:7,cinema:6,grandlib:12,court:10,institute:8,botanical:10,megahosp:18}; // T138：博物館/劇院/電影院＝觀光＋幸福半徑；圖書總館＝大範圍教育（水族館/動物園/遊樂園純觀光係數，無 COV 欄）；T139：法院＝降犯罪半徑（配合警局）；研究院＝科技升級加成半徑；植物園＝大範圍幸福半徑；綜合醫院＝超大半徑醫療（市政廳/會展中心/氣象站為全城效果，無 COV 欄）
const COV={};for(const f in COVR)COV[f]=new Uint8Array(N*N);
// T67：新服務 k 接入覆蓋場；高級消防用 fire2 更大半徑
function covFieldOfK(k){return {4:'park',5:'plant',6:'fire',7:'school',9:'stadium',11:'police',12:'hospital',13:'clinic',14:'library',15:'post',16:'cemetery',28:'ambulance',30:'fire2',31:'prison',32:'university',20:'parking',35:'museum',36:'theater',40:'cinema',41:'grandlib',43:'court',45:'institute',47:'botanical',48:'megahosp'}[k]||null;} // T138：k35/36/40/41 接入覆蓋場；T139：k43/45/47/48 接入覆蓋場（k42/44/46 市政廳/會展中心/氣象站為全城效果，無 COV 欄）
// Chebyshev 半徑 r 方框逐格 ±delta（邊界裁剪），支持重疊計數
function stampCov(field,x,y,r,delta){
  const a=COV[field];
  for(let dy=-r;dy<=r;dy++){const ny=y+dy;if(ny<0||ny>=N)continue;
    for(let dx=-r;dx<=r;dx++){const nx=x+dx;if(nx<0||nx>=N)continue;a[idx(nx,ny)]+=delta;}}
}
/* T110 污染擴散場：中心強、半徑 4-6 遞減；樹格對鄰域 −2 減免。POL 為對外曝光之最終值
   （供住宅幸福 −POL[i] 係數／小地圖熱度視圖／inspect 讀取）；POLBASE=污染源原始衰減和、
   POLTREE=樹木減免累計（皆 Uint8 內部量），POL 由兩者相減衍生重算——避免 Uint8Array 無號下溢
   （教訓見 §11-12：COV 缺蓋印會 0→255，此處改用雙陣列衍生法從根本避開，種樹/砍樹可安全對稱 ±）。
   命名地雷：勿與稅率政策全域 pol（T55，小寫）混淆。運行時重建、不入存檔（隨 rebuildCov 一併重建）。*/
const POL=new Uint8Array(N*N),POLBASE=new Uint8Array(N*N),POLTREE=new Uint8Array(N*N);
const POL_SRC={3:{r:5,p:30},5:{r:6,p:40},8:{r:5,p:26},19:{r:6,p:34}}; // 工業/電廠/垃圾場/機場：半徑4-6、中心峰值
const POL_LV3_MAX=15; // T113：lv2→3 升級要求 POL 低於此值（低污染門檻）
function recomputePol(i){const v=POLBASE[i]-POLTREE[i];POL[i]=v>0?(v<255?v:255):0;}
// 中心強、半徑遞減至0（Chebyshev，與COVR家族一致）；sign=+1放置/-1拆除，doPlace/doze成對呼叫維持±對稱
function stampPolSrc(x,y,k,sign){
  const cfg=POL_SRC[k];if(!cfg)return;const r=cfg.r,p=cfg.p;
  for(let dy=-r;dy<=r;dy++){const ny=y+dy;if(ny<0||ny>=N)continue;
    for(let dx=-r;dx<=r;dx++){const nx=x+dx;if(nx<0||nx>=N)continue;
      const d=Math.max(Math.abs(dx),Math.abs(dy));
      const v=Math.round(p*(1-d/(r+1)));if(v<=0)continue;
      const i=idx(nx,ny);
      POLBASE[i]=clamp(POLBASE[i]+sign*v,0,255);recomputePol(i);
    }}
}
// 樹格對鄰域（半徑2）固定 −2 減免；sign=+1種樹/-1砍樹，doPlace 通用 hadTree 差異偵測成對呼叫
function stampPolTree(x,y,sign){
  const r=2;
  for(let dy=-r;dy<=r;dy++){const ny=y+dy;if(ny<0||ny>=N)continue;
    for(let dx=-r;dx<=r;dx++){const nx=x+dx;if(nx<0||nx>=N)continue;
      const i=idx(nx,ny);
      POLTREE[i]=clamp(POLTREE[i]+sign*2,0,255);recomputePol(i);
    }}
}
// T137：工業洩漏——工業建築起火期間機率觸發，該格 POL 疊加尖峰並持續數日（比照 stampPolSrc 加法對稱手法＋隕石坑「持續危害」樣板，改為顯式天數倒數）
const LEAK_POL_SPIKE=60,LEAK_DURATION=6; // 洩漏 POL 疊加尖峰值與持續天數
const leakDays=new Uint8Array(N*N); // 洩漏持續天數倒數（0=無洩漏），運行時場，不入存檔；隨 rebuildCov 全量重建時尖峰同步失效，需與此陣列成對歸零（newWorld/load，鐵律7）
function startLeak(x,y){ // 供 tick() 因果觸發與 GV.leak() 手動鉤子共用，避免兩處邏輯分岔（仿 meteorStrike 慣例）
  const i=idx(x,y);
  if(leakDays[i]>0)return; // 已在洩漏中，不重複疊加尖峰
  leakDays[i]=LEAK_DURATION;
  POLBASE[i]=clamp(POLBASE[i]+LEAK_POL_SPIKE,0,255);recomputePol(i);
  toast('☣️ 工業洩漏！污染物外洩擴散','bad',x,y);sErr();
}
/* T130：地價場——服務覆蓋＋景觀（公園）－污染－犯罪 的靜態基準分，疊加（−）壅堵動態扣分，128為中性基準（0-255）。
   比照 §COV/POL 家族設計：LANDBASE=靜態基準（服務/景觀/污染/犯罪，rebuildCov 內同步全量重建，load/newWorld/undo
   自動覆蓋）；LAND=對外曝光值（LANDBASE 疊加壅堵動態扣分衍生，仿 T110 POL=POLBASE-POLTREE 手法，先夾 0 避免
   Uint8 無號下溢）。景觀項僅取玩家可控的 COV.park（不含天然樹木/水岸——newWorld 的 genWorld 恆保留 6%-42%
   水域且常伴生樹木，若計入天然地形將無法滿足「空曠新圖 LAND 恆 128」硬性不變量，故卡面「景觀（公園/樹/水岸）」
   用詞中僅落地與空曠新圖歸零相容的公園覆蓋，如實記錄此設計取捨）。不入存檔（rebuild 可重建）。*/
const LAND=new Uint8Array(N*N), LANDBASE=new Uint8Array(N*N);
// 靜態基準單格公式：服務覆蓋（警/消/校/醫/圖/郵各 COV.xxx>0 記1分，0~6）＋景觀（COV.park 封頂2分）
// －污染 POL[i]*1.2－犯罪 countNear*10；全零時 clamp(128+0,0,255) 精確回傳 128（空曠新圖不變量之根本）
function landStaticAt(x,y){
  const i=idx(x,y);
  const svc=(COV.police[i]>0?1:0)+((COV.fire[i]>0||COV.fire2[i]>0)?1:0)+(COV.school[i]>0?1:0)
    +((COV.hospital[i]>0||COV.clinic[i]>0)?1:0)+(COV.library[i]>0?1:0)+(COV.post[i]>0?1:0);
  const land=Math.min(2,COV.park[i]);
  const crime=countNear(x,y,4,tt=>tt.bld&&tt.bld.k<=3&&tt.bld.crime); // 犯罪為動態源，比照 judgeWealth 用 countNear（未蓋印）
  return clamp(128+svc*8+land*8-(POL[i]||0)*1.2-crime*10,0,255);
}
// 動態壅堵懲罰（單格，供 rebuildCov 初值與 tick 每日刷新共用）：半徑2內過載道路格數 * 12，封頂50；空車城恆為0
function landCongestAt(x,y){return Math.min(50,congestNear(x,y,2)*12);}
// 由 LANDBASE 衍生 LAND（扣壅堵懲罰後先夾0再寫回 Uint8Array，避免無號下溢）；rebuildCov 尾端與 tick() 每日皆呼叫
function recomputeLandDynamic(){
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){
    const i=idx(x,y);
    const v=LANDBASE[i]-landCongestAt(x,y);
    LAND[i]=v>0?(v<255?v:255):0;
  }
}
/* T142：教育場——依 school/university/library 覆蓋累積住宅可用之受教勞動力水準，比照 §COV/POL/LAND 家族設計
   （LAND/POL rebuildCov 先例，見上方 T130 段落）。EDU=Uint8Array(N*N)，取 0 為基準（無教育建築覆蓋時全城恆為 0，
   即「中性教育」之根本——EDU 純累加不含扣分項，異於 LAND/POL 的 128 中性基準，取 0 基準更直觀）。單格分數＝
   COV.school/COV.university/COV.library 三家族各自 >0 門檻各疊加固定權重（大學>學校>圖書館，呼應既有升級加成
   排序 uniBoost1.8>schoolBoost1.6>libraryBoost1.25），clamp 0-255。於 rebuildCov 尾端隨 COV 同步全量重建
   （load/newWorld/undo 自動覆蓋）。不入存檔（rebuild 可重建）。*/
const EDU=new Uint8Array(N*N);
const EDU_W_SCHOOL=50,EDU_W_UNI=90,EDU_W_LIB=35; // 學校/大學/圖書館覆蓋各自加分權重
function eduStaticAt(x,y){
  const i=idx(x,y);
  const v=(COV.school[i]>0?EDU_W_SCHOOL:0)+(COV.university[i]>0?EDU_W_UNI:0)+(COV.library[i]>0?EDU_W_LIB:0);
  return v<255?v:255;
}
// 全量重建（load/newWorld 後、undo 後）：清零後掃全圖蓋印每個設施（含體育場 4 格皆為 k9 覆蓋源，與 countNear 一致）
function rebuildCov(){
  for(const f in COV)COV[f].fill(0);
  POLBASE.fill(0);POLTREE.fill(0);POL.fill(0); // T110：污染場隨 COV 同步全量重建
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){
    const t=tiles[idx(x,y)],b=t.bld;
    if(b){
      if(b.ref){if(b.k===9)stampCov('stadium',x,y,COVR.stadium,1);}
      else{
        const f=covFieldOfK(b.k);if(f)stampCov(f,x,y,COVR[f],1);
        if(POL_SRC[b.k])stampPolSrc(x,y,b.k,1); // T110：污染源（工業/電廠/垃圾場/機場）
      }
    }
    if(t.rdec)stampCov('rdec',x,y,COVR.rdec,1);
    if(t.bus)stampCov('bus',x,y,COVR.bus,1);
    if(t.tree)stampPolTree(x,y,1); // T110：樹格鄰域污染減免
  }
  for(let y=0;y<N;y++)for(let x=0;x<N;x++)LANDBASE[idx(x,y)]=landStaticAt(x,y); // T130：地價靜態基準隨 COV/POL 同步全量重建
  recomputeLandDynamic(); // T130：以當下 roadLoad 疊一次壅堵初值（undo 未重置 roadLoad，newWorld/load 已於呼叫前歸零）
  for(let y=0;y<N;y++)for(let x=0;x<N;x++)EDU[idx(x,y)]=eduStaticAt(x,y); // T142：教育場隨 COV 同步全量重建
}
// T123：住宅財富分級判定——服務覆蓋數（警/校/醫/公園）－POL污染－犯罪 加權得分 → 0貧/1中/2富
// 純資料層：只在住宅新建／升級時呼叫寫入 bld.we，不參與稅收/幸福/需求任何公式（wealth 只寫不讀）
function judgeWealth(x,y){
  const i=idx(x,y);
  const cov=(COV.police[i]>0?1:0)+(COV.school[i]>0?1:0)+(COV.hospital[i]>0?1:0)+(COV.park[i]>0?1:0);
  const crime=countNear(x,y,4,tt=>tt.bld&&tt.bld.k<=3&&tt.bld.crime); // 犯罪為動態源，比照 §11-11 用 countNear（未蓋印）
  const landTerm=(LAND[i]-128)/128; // T130：地價附加項（-1~+1），附加不取代既有服務/污染/犯罪項；中性地價(128)精確貢獻0
  const commuteTerm=-(commutePenalty[i]||0)*3; // T141：通勤附加項（不可達/路徑過長拉低財富評分，叢集快取讀取），無就業區/未觸發時精確為0
  const eduTerm=(EDU[i]/255)*.6; // T142：教育附加項（受教勞動力足→易判富），附加不取代既有各項；EDU=0（無教育建築覆蓋，中性教育）時精確恆為0
  const score=cov-(POL[i]||0)*.05-crime*.4+landTerm*.5+commuteTerm+eduTerm;
  if(score>=2)return 2; // 富
  if(score>0)return 1;  // 中
  return 0;              // 貧
}
/* T140：資源供應鏈——地圖稀缺資源層（比照 §COV/POL/LAND 家族設計）。
   RESOURCE＝每格資源型別（0無/1油/2礦），僅由種子決定、地理集中（低頻值噪聲門檻，非均勻散布）；
   與 COV/POL/LAND 同款「運行時重建、不入存檔」——genWorld（新圖）與 load（讀檔）皆呼叫 genResource(seed) 用
   獨立種子化亂數（mulberry32 衍生噪聲）重建，不觸碰全域主亂數流 R()/ri()，故不影響地形/樹木/河流等既有生成序列。
   RDEP＝各資源格「累計已開採量」（Uint16Array，僅開採過的格非零），達 RESOURCE_STOCK 上限即該格停產；
   為運行時場但**內容非純衍生**（開採歷史無法從種子重建），故其存檔鏡射改走稀疏可選欄位 rdep（僅存非零格
   [i,amt] 配對，舊檔缺欄位＝未耗損，見 save()/load()），newWorld()/load() 皆 RDEP.fill(0) 後再視存檔內容還原（鐵律7）。*/
const RESOURCE=new Uint8Array(N*N), RDEP=new Uint16Array(N*N);
function genResource(sd){
  const noiOil=makeNoise(mulberry32(sd^0x7c2f19),64), noiOre=makeNoise(mulberry32(sd^0x1a4d63),64); // 獨立種子噪聲，不消耗全域 R()
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){
    const i=idx(x,y),t=tiles[i].t;
    let r=0;
    if(t===1||t===2){ // 僅陸地（沙/草）鋪資源，避開水域（呼應建築須陸地放置的通用限制）
      if(noiOil(x*.045,y*.045)>.74)r=1;        // 油：低頻噪聲門檻→地理集中斑塊（非均勻）
      else if(noiOre(x*.05+50,y*.05+50)>.74)r=2; // 礦：獨立噪聲場＋offset，避免與油田系統性重疊
    }
    RESOURCE[i]=r;
  }
}
function computeWater(){
  let towers=0;
  for(let i=0;i<N*N;i++){tiles[i].wr=false;if(tiles[i].bld&&tiles[i].bld.k===10)towers++;}
  if(!towers)return 0;
  const seen=new Uint8Array(N*N);
  const q=[];
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){
    const t=T(idx(x,y));
    if(!(t.bld&&t.bld.k===10))continue;
    for(const[dx,dy]of[[0,-1],[1,0],[0,1],[-1,0]]){
      const nx=x+dx,ny=y+dy;
      if(inMap(nx,ny)&&T(idx(nx,ny)).wp&&!seen[idx(nx,ny)]){
        seen[idx(nx,ny)]=1;q.push([nx,ny,0]);
      }
    }
  }
  let head=0;
  while(head<q.length){
    const[x,y,d]=q[head++];

function scenarioGoalMet(sc){

function riotBlockedRoad(x,y){

function updCars(dt){

        // 車輛移動只改 c.x/c.y，vt/vc 不重算＝同一輛車連續幀車型不變（無閃爍）；SPR.vehTypes 缺失（__noVeh）時

  for(let i=cars.length-1;i>=0;i--){

}
// 沿道路 BFS 最短路（含高速）；回傳 [[x,y]...] 起→迄（含端點），無路回 null
function busBFS(sx,sy,gx,gy){
  if(!inMap(sx,sy)||!inMap(gx,gy))return null;
  if(!T(idx(sx,sy)).road||!T(idx(gx,gy)).road)return null;
  const start=idx(sx,sy),goal=idx(gx,gy);
  if(start===goal)return[[sx,sy]];
  const prev=new Int32Array(N*N).fill(-1);
  const seen=new Uint8Array(N*N);
  const q=[start];seen[start]=1;
  let head=0,found=false;
  while(head<q.length){
    const cur=q[head++];
    if(cur===goal){found=true;break;}
    const cx=cur%N,cy=(cur/N)|0;
    for(const[dx,dy]of DIRV){
      const nx=cx+dx,ny=cy+dy;
      if(!inMap(nx,ny))continue;
      const j=idx(nx,ny);
      if(seen[j]||!T(j).road)continue;
      seen[j]=1;prev[j]=cur;q.push(j);
    }
  }
  if(!found)return null;
  const path=[];
  for(let c=goal;c!==-1;c=prev[c])path.push([c%N,(c/N)|0]);
  path.reverse();
  return path;
}
function busPlanNext(bus){                          // 由目標站起連續嘗試，跳過不可達站；成功回 true
  let g=busNextStop(bus.stop),tries=0;
  while(g>=0&&tries<busList.length){
    if(tiles[g]&&tiles[g].bus){
      const path=busBFS(bus.x,bus.y,g%N,(g/N)|0);
      if(path&&path.length>1){bus.path=path;bus.pi=0;bus.p=0;bus.stop=g;return true;}
    }
    g=busNextStop(g);tries++;
  }
  return false;
}
function busReplan(bus){                            // 目標不變、路斷重算；失敗回 false
  if(!(tiles[bus.stop]&&tiles[bus.stop].bus))return false;
  const path=busBFS(bus.x,bus.y,bus.stop%N,(bus.stop/N)|0);
  if(path&&path.length>1){bus.path=path;bus.pi=0;bus.p=0;return true;}
  return false;
}
function updBuses(dt){
  rebuildBusList();
  const nStop=busList.length;
  const target=nStop>=2?Math.min(nStop-1,4):0;       // ≥2 站才發車，最多 4 輛
  while(buses.length<target){
    const s=busList[ri(busList.length)];
    buses.push({x:s%N,y:(s/N)|0,stop:s,path:null,pi:0,p:0,d:0,wait:1});
  }
  if(buses.length>target)buses.length=target;
  if(!target)return;
  for(const bus of buses){
    if(!inMap(bus.x,bus.y)||!T(idx(bus.x,bus.y)).road){ // 所在路被拆→重生於某站
      const s=busList[ri(busList.length)];
      bus.x=s%N;bus.y=(s/N)|0;bus.stop=s;bus.path=null;bus.pi=0;bus.p=0;bus.wait=1;bus.d=0;
      continue;
    }
    if(bus.wait>0){bus.wait-=dt;continue;}            // 到站停 1s
    if(bus.path&&!(tiles[bus.stop]&&tiles[bus.stop].bus)){bus.path=null;bus.p=0;} // 目標站被拆→改選
    if(!bus.path){
      if(!busPlanNext(bus))bus.wait=1;                // 全站不可達→稍後再試
      continue;
    }
    const ct=T(idx(bus.x,bus.y));
    bus.p+=dt*1.1*(ct&&ct.hw?1.6:1)*(ct&&ct.busLane?1.3:1); // 1.1 格/s，高速×1.6，公車道×1.3（T76）
    let guard=0;
    while(bus.p>=1&&guard++<64){
      const nxt=bus.path[bus.pi+1];
      if(!nxt||!inMap(nxt[0],nxt[1])||!T(idx(nxt[0],nxt[1])).road){ // 下一格不可走→重算
        bus.p=0;
        if(!busReplan(bus))bus.path=null;
        break;
      }
      bus.p-=1;
      bus.d=busDir(bus.x,bus.y,nxt[0],nxt[1]);
      bus.x=nxt[0];bus.y=nxt[1];bus.pi++;
      if(bus.pi>=bus.path.length-1){                 // 抵達目標站→停靠
        bus.path=null;bus.p=0;bus.wait=1;
        break;
      }
    }
  }
}
/* ---------- T120：公車路線——玩家自訂站序（busRoutes），公車沿路線站序 BFS 往返（ping-pong）
   複用 busBFS/busDir；斷路（中途道路被拆／規劃失敗）就地折返（反轉方向）不崩潰；
   路線不足 2 個可用站時該路線不派車（拆站已由 removeBusStopFromRoutes 自動剔除失效站）---------- */
function removeBusStopFromRoutes(i){ // 拆站時自動從所有路線剔除該站
  for(const rt of busRoutes){const p=rt.stops.indexOf(i);if(p>=0)rt.stops.splice(p,1);}
}
function updRouteBuses(dt){
  for(let r=0;r<3;r++){ // 依需要為每條可行路線補派 1 輛車
    const rt=busRoutes[r];
    const validStops=rt.stops.filter(si=>tiles[si]&&tiles[si].bus);
    let bus=rbuses.find(b=>b.r===r);
    if(validStops.length<2){if(bus)rbuses.splice(rbuses.indexOf(bus),1);continue;}
    if(!bus){
      const s0=validStops[0];
      rbuses.push({r,x:s0%N,y:(s0/N)|0,si:0,dir:1,path:null,pi:0,p:0,d:0,wait:.5});
    }
  }
  for(let i=rbuses.length-1;i>=0;i--){
    const bus=rbuses[i];
    const rt=busRoutes[bus.r];
    const validStops=rt?rt.stops.filter(si=>tiles[si]&&tiles[si].bus):[];
    if(!rt||validStops.length<2){rbuses.splice(i,1);continue;} // 路線被清空/剩不足 2 站→撤車
    if(bus.si>=validStops.length)bus.si=0;                     // 拆站導致索引越界→安全歸零
    if(!inMap(bus.x,bus.y)||!T(idx(bus.x,bus.y)).road){        // 所在路被拆→重生於路線起點
      const s0=validStops[0];bus.x=s0%N;bus.y=(s0/N)|0;bus.si=0;bus.dir=1;bus.path=null;bus.pi=0;bus.p=0;bus.wait=.5;
      continue;
    }
    if(bus.wait>0){bus.wait-=dt;continue;}                     // 到站停 .5s
    if(!bus.path){
      let nsi=bus.si+bus.dir;
      if(nsi<0||nsi>=validStops.length){bus.dir*=-1;nsi=bus.si+bus.dir;} // 到端點→折返
      const gi=validStops[nsi];
      const path=busBFS(bus.x,bus.y,gi%N,(gi/N)|0);
      if(path&&path.length>1){bus.path=path;bus.pi=0;bus.p=0;bus.nsi=nsi;}
      else{bus.dir*=-1;bus.wait=.5;}                            // 斷路無法規劃→就地折返，不崩潰
      continue;
    }
    const ct=T(idx(bus.x,bus.y));
    bus.p+=dt*1.1*(ct&&ct.hw?1.6:1)*(ct&&ct.busLane?1.3:1);
    let guard=0;
    while(bus.p>=1&&guard++<64){
      const nxt=bus.path[bus.pi+1];
      if(!nxt||!inMap(nxt[0],nxt[1])||!T(idx(nxt[0],nxt[1])).road){ // 中途斷路→就地折返，不崩潰
        bus.p=0;bus.path=null;bus.dir*=-1;bus.wait=.5;break;
      }
      bus.p-=1;
      bus.d=busDir(bus.x,bus.y,nxt[0],nxt[1]);
      bus.x=nxt[0];bus.y=nxt[1];bus.pi++;
      if(bus.pi>=bus.path.length-1){                 // 抵達目標站→停靠
        bus.si=bus.nsi;bus.path=null;bus.p=0;bus.wait=.5;
        break;
      }
    }
  }
}

function railDirs(x,y){
  const t=T(idx(x,y));if(!t.rail&&!t.tram)return [];
  const ds=[];
  if(inMap(x,y-1)&&(T(idx(x,y-1)).rail||T(idx(x,y-1)).tram))ds.push(0);
  if(inMap(x+1,y)&&(T(idx(x+1,y)).rail||T(idx(x+1,y)).tram))ds.push(1);
  if(inMap(x,y+1)&&(T(idx(x,y+1)).rail||T(idx(x,y+1)).tram))ds.push(2);
  if(inMap(x-1,y)&&(T(idx(x-1,y)).rail||T(idx(x-1,y)).tram))ds.push(3);
  return ds;
}
function listBldK(k){

function updTrains(dt){

    if(inMap(x,y-1)&&T(idx(x,y-1)).rail)ds.push(0);

    if(!ds.length)break;
    const d0=ds[ri(ds.length)];
    const tx0=x+DIRV[d0][0],ty0=y+DIRV[d0][1];
    const pt=window.__noVeh?0:(streetHash(tx0,ty0,940)<.5?0:1); // T155：車廂塗裝（0既有暗紅/1新塗裝）依生成格座標決定性挑選，不消耗R()，終生固定；__noVeh 時恆 0＝零位移
    trains.push({x:tx0,y:ty0,d:d0,p:0,pt}); // 生在鄰接的軌道格（站牌格本身不可行走）
    if(trains.length>=target)break;
  }
  for(let i=trains.length-1;i>=0;i--){
    const c=trains[i];

/* ---------- T119：服務車輛出勤框架——from（可出車站 sts）/target（候選格 cand）/onArrive（抵達效果）
   三段抽象；救護車邏輯原樣搬入，行為位元不變（同一組 ri() 呼叫順序/次數、同一套移動公式、同一個抵達效果）：
   onArrive 回傳 [tx,ty] 則車輛換下一個目標繼續出勤（垃圾車巡迴用）；回傳假值則車輛消失（救護車/消防車原行為）---------- */
function updDispatch(arr,dt,speed,cap,sts,cand,onArrive){
  const target=sts.length&&cand.length?Math.min(cap,sts.length):0;
  while(arr.length<target&&cand.length){
    const si=sts[ri(sts.length)],ti=cand[ri(cand.length)];
    arr.push({x:si%N,y:(si/N)|0,p:0,tx:ti%N,ty:(ti/N)|0,ticks:0}); // T145：ticks 純觀測計數（到場所需更新次數），未動 si/ti 選擇邏輯本身，RNG 消耗序列不變
  }
  for(let i=arr.length-1;i>=0;i--){
    const c=arr[i];c.ticks++; // T145：每次派遣更新累計 tick 數，供 GV.svcResponseSample 觀測到場延遲差異（純觀測，不消耗 R()）
    let sp=speed;
    const st=T(idx(c.x,c.y));
    if(st&&st.road){ // T145：服務車輛所在格若為道路，比照 T129 過載降速公式同樣折減（load≤cap 時 clamp 內恆為 1，無壅堵逐位元不變）；非道路格（多數行程）不受影響
      const capT=ROAD_CAP[(st.rc||2)-1];
      if(capT>0)sp*=clamp(1-Math.max(0,roadLoad[idx(c.x,c.y)]-capT)/capT*ROAD_JAM_K,.3,1);
    }
    c.p+=dt*sp;if(c.p<1)continue;c.p-=1;
    if(c.x!==c.tx)c.x+=Math.sign(c.tx-c.x);else if(c.y!==c.ty)c.y+=Math.sign(c.ty-c.y);
    if(c.x===c.tx&&c.y===c.ty){
      const nt=onArrive(c);
      if(nt){c.tx=nt[0];c.ty=nt[1];}else arr.splice(i,1);
    }
  }
}

// T119：住宅沿路距垃圾場(k8)>18 的局部垃圾係數上升——BFS 比照 busBFS 走道路網，每天（tick）重算一次
function computeGarbLocal(){
  const dsrc=[];
  for(let i=0;i<N*N;i++){const b=tiles[i].bld;if(b&&!b.ref&&b.k===8)dsrc.push(i);}
  const dist=new Uint16Array(N*N).fill(9999);
  const q=[];
  for(const di of dsrc){
    const dx0=di%N,dy0=(di/N)|0;
    for(const[dx,dy]of DIRV){
      const nx=dx0+dx,ny=dy0+dy;
      if(inMap(nx,ny)){const j=idx(nx,ny);if(T(j).road&&dist[j]>0){dist[j]=0;q.push(j);}}
    }
  }
  let head=0;
  while(head<q.length){
    const cur=q[head++],d=dist[cur],cx=cur%N,cy=(cur/N)|0;
    for(const[dx,dy]of DIRV){
      const nx=cx+dx,ny=cy+dy;
      if(!inMap(nx,ny))continue;
      const j=idx(nx,ny);
      if(T(j).road&&dist[j]>d+1){dist[j]=d+1;q.push(j);}
    }
  }
  for(let i=0;i<N*N;i++){
    const b=tiles[i].bld;
    if(!b||b.k!==1){garbLocal[i]=0;continue;}
    const x=i%N,y=(i/N)|0;let bd=9999;
    for(const[dx,dy]of DIRV){const nx=x+dx,ny=y+dy;if(inMap(nx,ny)){const j=idx(nx,ny);if(T(j).road)bd=Math.min(bd,dist[j]);}}
    if(bd>18){
      garbLocal[i]=clamp(garbRatio+.3,0,2);

    }
  }
}
/* T141：通勤/就業 agent——叢集級近似（比照上方 computeGarbLocal／busBFS 尋路慣例）。tick() 於 day%COMMUTE_PERIOD===0
   時呼叫本函式（其餘天數複用上次快取，避免每 tick 全城 BFS）：
   ①多源 BFS——源＝已完工商業/工業分區建築（k===2 含辦公區/k===3），沿道路網算每一道路格到最近就業區的最短路距
     dist（含 prev 回溯指標），純陣列/佇列運算不消耗 R()；
   ②住宅依 COMMUTE_CELL×COMMUTE_CELL 網格分「叢集」，每叢集僅取首個住宅格為代表，沿 prev 回溯出代表→最近就業區
     的路徑並快取進 commuteClusters（供 tick() 每日複用貢獻 roadPass/commutePass，避免逐棟尋路控制大城效能）；
   ③每格住宅（非僅代表格）依同一 dist 場查最近路口距離，寫入 commutePenalty／commuteUnreach 供 happyParts「通勤」項
     與 judgeWealth 全日讀取（叢集內住宅共用同一批距離場，僅路徑追蹤動作只做一次，非「逐人尋路」）。
   無就業區（dsrc 為空）時提前 return，commutePenalty/commuteUnreach/commuteClusters 皆維持全零／空陣列，
   通勤零效果（硬性不變量：無道路/無就業區時通勤恆零，同種子 30 天位元回歸與基準一致）。*/
function computeCommute(){
  commutePenalty.fill(0);
  commuteUnreach.fill(0);
  commuteClusters.length=0;
  const dsrc=[];
  for(let i=0;i<N*N;i++){const b=tiles[i].bld;if(b&&!b.ref&&(b.k===2||b.k===3))dsrc.push(i);}
  if(!dsrc.length)return; // 無就業區：全部維持零（不變量）
  const dist=new Uint16Array(N*N).fill(9999);
  const prev=new Int32Array(N*N).fill(-1);
  const q=[];
  for(const si of dsrc){
    const sx0=si%N,sy0=(si/N)|0;
    for(const[dx,dy]of DIRV){
      const nx=sx0+dx,ny=sy0+dy;
      if(inMap(nx,ny)){const j=idx(nx,ny);if(T(j).road&&dist[j]>0){dist[j]=0;q.push(j);}}
    }
  }
  let head=0;
  while(head<q.length){
    const cur=q[head++],d=dist[cur],cx=cur%N,cy=(cur/N)|0;
    for(const[dx,dy]of DIRV){
      const nx=cx+dx,ny=cy+dy;
      if(!inMap(nx,ny))continue;
      const j=idx(nx,ny);
      if(T(j).road&&dist[j]>d+1){dist[j]=d+1;prev[j]=cur;q.push(j);}
    }
  }
  const blkPerRow=Math.ceil(N/COMMUTE_CELL);
  const blkSeen=new Uint8Array(blkPerRow*blkPerRow);
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){
    const i=idx(x,y),b=tiles[i].bld;
    if(!b||b.k!==1)continue;
    let bd=9999,broad=-1;
    for(const[dx,dy]of DIRV){
      const nx=x+dx,ny=y+dy;
      if(!inMap(nx,ny))continue;
      const j=idx(nx,ny);
      if(T(j).road&&dist[j]<bd){bd=dist[j];broad=j;}
    }
    if(broad<0||bd>=9999){commuteUnreach[i]=1;commutePenalty[i]=COMMUTE_PEN_UNREACH;}
    else if(bd>COMMUTE_FAR){commutePenalty[i]=Math.min(COMMUTE_PEN_MAX,(bd-COMMUTE_FAR)*COMMUTE_PEN_STEP);}
    const blk=((x/COMMUTE_CELL)|0)*blkPerRow+((y/COMMUTE_CELL)|0); // 叢集鍵：粗網格分塊，塊內首個住宅格為代表
    if(blkSeen[blk])continue;
    blkSeen[blk]=1;
    if(broad<0||bd>=9999)continue; // 代表格本身不可達，該叢集無路徑可貢獻 load（不進 commuteClusters）
    const path=[];
    let c=broad,steps=0;
    while(c!==-1&&steps<600){path.push(c);c=prev[c];steps++;}
    commuteClusters.push({path});
  }
}
// T120：路線覆蓋（半徑3內、多路線不疊加，二值化覆蓋後加總人口）住宅人口——供 updCars 小車生成率折抵；每天（tick）重算一次，不進存檔
function computeBusRtCovPop(){
  if(!busRoutes.some(rt=>rt.stops.length)){busRtCovPop=0;return;}
  const cov=new Uint8Array(N*N);
  for(const rt of busRoutes)for(const si of rt.stops){
    if(!(tiles[si]&&tiles[si].bus))continue;
    const sx=si%N,sy=(si/N)|0;
    for(let dy=-3;dy<=3;dy++){const ny=sy+dy;if(ny<0||ny>=N)continue;
      for(let dx=-3;dx<=3;dx++){const nx=sx+dx;if(nx<0||nx>=N)continue;cov[idx(nx,ny)]=1;}}
  }
  let p=0;
  for(let i=0;i<N*N;i++){
    if(!cov[i])continue;
    const b=tiles[i].bld;
    if(b&&!b.ref&&b.k===1&&b.pw&&!b.sick&&!b.death)p+=Math.round(POPS[b.lv]*(b.den?DEN_POP[b.den-1]:1));
  }
  busRtCovPop=p;
}


// T146：座標決定性雜湊（純函式，不讀寫任何全域狀態、不消耗共用 rand()/R()/ri()，同一 (x,y,salt) 恆回傳同值）——

        /* ===== T146 街道級細節層：座標決定性雜湊挑選（streetHash，不消耗 R()/ri()），併入 groundCache 重
           繪路徑（本段純新增，未變動 gKey 結構、未新增快取鍵成分）；高速路(t.hw)／橋(t.bridge)不畫（無人
           行道概念，且橋面 sy 偏移不同，疊上去會錯位）；window.__noStreet=true 或生成端已整段跳過時本段
           整段短路（SPR.roadDeco 不存在）＝零位移 ===== */
        if(!window.__noStreet&&SPR.roadDeco&&!t.hw&&!t.bridge){
          const rc2=t.rc||2, pc=STREET_POPCOUNT[t.mask];
          gc.drawImage(SPR.roadDeco.curb[t.mask],sx,sy,64*z,32*z); // 人行道邊石：任意縮放層級皆畫（比照道路本體 sprite，非「小件」）
          if(!lodMini){ // T107 LOD：z<0.5 連標線（斑馬線／車道標線）一併跳過
            if(pc<=1||pc>=3)gc.drawImage(SPR.roadDeco.zebra[t.mask],sx,sy,64*z,32*z); // 斑馬線：路口／端點
            if(rc2>=3){ // 車道標線：僅 rc>=3（次幹道以上）
              if(t.mask===(1|4))gc.drawImage(SPR.roadDeco.lane14,sx,sy,64*z,32*z);
              else if(t.mask===(2|8))gc.drawImage(SPR.roadDeco.lane28,sx,sy,64*z,32*z);
            }
          }
          if(pc===2){ // T107 LOD：z<1 跳過街道小件／停放車；行人另計（T155：z<1 退回點狀而非整段跳過，見下方）；直行/轉彎段(popcount===2)才擺（路口/端點已有斑馬線）
            let nearLv=0;
            const nb4=[[x-1,y],[x+1,y],[x,y-1],[x,y+1]];
            for(const nb of nb4){const nx=nb[0],ny=nb[1];if(!inMap(nx,ny))continue;const nt=T(idx(nx,ny));if(nt.bld&&!nt.bld.ref&&nt.bld.lv>nearLv)nearLv=nt.bld.lv;}
            if(!lodFar){
              const dens=clamp(.15+(rc2-1)*.025+nearLv*.05,0,.42); // 密度依道路等級與鄰近建築等級遞增
              if(streetHash(x,y,701)<dens){
                const pick=streetHash(x,y,702);
                if(pick<.17){const d=SPR.roadDeco.hydrant;gc.drawImage(d.img,sx+(32-d.ax)*z,sy+(32-d.ay)*z,d.w*z,d.h*z);}
                else if(pick<.34){const d=SPR.roadDeco.mailbox;gc.drawImage(d.img,sx+(32-d.ax)*z,sy+(32-d.ay)*z,d.w*z,d.h*z);}
                else if(pick<.51){const d=SPR.roadDeco.bench;gc.drawImage(d.img,sx+(32-d.ax)*z,sy+(32-d.ay)*z,d.w*z,d.h*z);}
                else if(pick<.68){const d=SPR.roadDeco.trash;gc.drawImage(d.img,sx+(32-d.ax)*z,sy+(32-d.ay)*z,d.w*z,d.h*z);}
                else if(pick<.80){
                  const d=SPR.roadDeco.shelter;
                  const dx2=sx+(32-d.ax)*z,dy2=sy+(32-d.ay)*z;
                  gc.drawImage(d.img,dx2,dy2,d.w*z,d.h*z);
                  rdecGlow.push({img:d.night,x:dx2,y:dy2,w:d.w*z,h:d.h*z}); // 夜光候車亭
                }else{ // 路邊停放車：複用既有 SPR.car（8 色池依雜湊挑色＋左右側挑向）縮小 78% 貼近路緣
                  const ci=Math.floor(streetHash(x,y,703)*SPR.car.length)%SPR.car.length;
                  const carSide=streetHash(x,y,704)<.5;
                  const carImg=carSide?SPR.car[ci].A:SPR.car[ci].B;
                  gc.drawImage(carImg,sx+(carSide?16:40)*z,sy+22*z,12*.78*z,8*.78*z);
                }
              }
            }
            /* 行人：T146 原始 2px 點，T155 升級為 3 種 3×5px 小人（成人/孩童/推車）＋走路兩幀，依座標決定性雜湊
               挑形態、visT 決定性選幀；僅於 groundCache 本次重繪時取樣一幀，重繪之間畫面沿用同一快取畫布，「連
               續兩幀」不觸發重繪＝checksum 不變，符合硬性不變量；跨重繪之間會緩慢切幀，呼應卡面「可微動」。
               LOD（T155）：z<1（lodFar）原版整段不畫，本卡改為退回點狀而非整段消失；window.__noVeh=true 或
               SPR.ped 缺失（active=false）時，z>=1／z<1 兩種情形皆退回改動前原始點狀（含「z<1 完全不畫」）＝
               零位移 ===== */
            if(streetHash(x,y,705)<.05+nearLv*.015){
              const active=!window.__noVeh&&SPR.ped;
              const pedFrame=Math.floor(visT*1.1)%2;
              const pedX=streetHash(x,y,706)<.5?20:44;
              if(!lodFar&&active){
                const pk=streetHash(x,y,707);
                const ptype=pk<.6?'adult':pk<.85?'child':'stroller';
                const ps=SPR.ped[ptype][pedFrame];
                gc.drawImage(ps.img,sx+(pedX-ps.ax)*z,sy+(24-ps.ay)*z,ps.w*z,ps.h*z);
              }else if(!lodFar||active){ // (!lodFar&&!active)＝原版 z>=1 點狀；(lodFar&&active)＝T155 新增 z<1 退回點狀；(lodFar&&!active) 兩者皆假，落空＝原版 z<1 不畫
                const pedY=24+pedFrame;
                gc.fillStyle='#3a342e';gc.fillRect(sx+pedX*z,sy+(pedY-2)*z,2*z,2*z);
                gc.fillStyle='#dcb890';gc.fillRect(sx+pedX*z,sy+(pedY-3)*z,2*z,1*z);
              }
            }
          }
        }
      }else if(t.zone&&!t.bld&&!t.ruin){
        gc.globalAlpha=.5;gc.drawImage(SPR.zone[t.zone],sx,sy,64*z,32*z);gc.globalAlpha=1;
      }
      // T39/T44 鐵路/輕軌
      if(t.rail){
        if(t.railBridge)gc.drawImage(SPR.railBridge[t.railMask],sx,sy-4*z,64*z,44*z);
        else gc.drawImage(SPR.rail[t.railMask],sx,sy,64*z,32*z);
      }
      if(t.tram){
        if(t.tramBridge)gc.drawImage(SPR.railBridge[t.tramMask],sx,sy-4*z,64*z,44*z);
        else gc.drawImage(SPR.rail[t.tramMask],sx,sy,64*z,32*z);
      }
      // T40 碼頭
      if(t.dock)gc.drawImage(SPR.dock,sx,sy,64*z,32*z);
      // T42 單行道箭頭
      if(t.oneway&&t.road)gc.drawImage(SPR.oneway[t.oneway-1]||SPR.oneway[0],sx,sy,64*z,32*z);
      // T57 洪水疊加
      if(t.flood){gc.globalAlpha=.35;gc.fillStyle='#4a8ab8';gc.fillRect(sx,sy,64*z,32*z);gc.globalAlpha=1;}
      // T70 堤防：內縮菱形描邊示意加高河堤（土黃色，先前僅小地圖上色、地面無標記）
      if(t.levee){
        const lx=sx+32*z,ly=sy+16*z;
        gc.strokeStyle='#8a6d3b';gc.lineWidth=Math.max(1,2*z);gc.globalAlpha=.85;
        gc.beginPath();gc.moveTo(lx,sy+3*z);gc.lineTo(sx+59*z,ly);gc.lineTo(lx,sy+29*z);gc.lineTo(sx+5*z,ly);gc.closePath();gc.stroke();
        gc.globalAlpha=1;
      }
    }
    groundCacheKey=gKey;groundCacheGlow=rdecGlow;groundDirty=false;groundCacheZ=z; // T108：記錄本次烘焙的 cam.z，供之後縮放動畫換算貼圖比例
  }else{
    rdecGlow=groundCacheGlow;
  }
  if(!zoomAnim)ctx.drawImage(groundCache,0,0); // T108：動畫中的縮放重貼已在上方分支自行繪製，此處只負責一般（非動畫）路徑
  /* ===== T149 路燈／裝飾光源地面光暈：rdecGlow 既有點光源清單（路燈/公車亭/隕石坑餘燼等，位置已是螢幕座標），
     於此處（地面快取貼上之後、物件層繪製之前）疊一圈徑向暖色光斑，之後建築/樹木依深度序繪製自然蓋在其上；
     nightDepth===0（日間，含正午）時 fxOn 短路本段零繪製，逐像素與改動前一致；'lighter' 加成疊加不影響下方地面顏色語意 ===== */
  if(nightDepth>0&&rdecGlow.length){
    ctx.save();
    ctx.globalCompositeOperation='lighter';
    for(const rg2 of rdecGlow){
      const gx=rg2.x+(rg2.w||0)/2, gy=rg2.y+(rg2.h||0)/2, gr=30*z;
      const grad=ctx.createRadialGradient(gx,gy,0,gx,gy,gr);
      grad.addColorStop(0,`rgba(255,214,150,${(0.26*nightDepth).toFixed(3)})`);
      grad.addColorStop(1,'rgba(255,214,150,0)');
      ctx.fillStyle=grad;
      ctx.beginPath();ctx.arc(gx,gy,gr,0,Math.PI*2);ctx.fill();
    }
    ctx.restore();
  }
  /* ===== T152 水面波光：既有 waterF 幀之外另疊依 visT 的高光點閃爍，畫在 groundCache 貼上之後、物件層之前
     （不烘進 groundCache，每幀重算，低成本）；挑選點位與是否點亮皆由 streetHash(x,y,salt) 決定性雜湊，
     不消耗 R()/ri()；animOn 已含 z<0.5／quality===0／__noAnim 短路，此處再加 !lodFar（z<1 停用，等同「靜態
     首幀」＝不疊加）滿足卡面 LOD 兩檔要求 ===== */
  if(animOn&&!lodFar){
    ctx.save();
    for(let y=0;y<N;y++)for(let x=0;x<N;x++){
      const t=T(idx(x,y));
      if(t.t!==0)continue;
      const sx=sxOf(x,y),sy=syOf(x,y);
      if(!vis(sx,sy))continue;
      const ph=streetHash(x,y,910);
      if(ph>.12)continue; // 稀疏度：約 12% 水格具備波光點資格
      const tw=Math.sin(visT*2.2+ph*37)*.5+.5;
      if(tw<.55)continue; // 閃爍：僅約一半時間點亮，形成明滅感
      ctx.globalAlpha=(tw-.55)/.45*.6;
      ctx.fillStyle='#fff';
      const spx=sx+(14+ph*36)*z, spy=sy+(8+((ph*53)%1)*14)*z;
      ctx.fillRect(spx,spy,Math.max(1,z),Math.max(1,z));
    }
    ctx.globalAlpha=1;
    ctx.restore();
  }
  /* ===== T163 動態浪花＋岸邊倒影：畫在地面快取貼上、T149 光暈、T152 水面波光之後，物件層之前（不烘進
     groundCache，每幀重算，快取鍵 gKey 未新增任何組成分量）；浪花挑幀＋倒影目標挑選皆由 streetHash(x,y,
     salt) 決定性雜湊，不消耗 R()/ri()；oceanOn 已含 z<0.5／quality===0／__noOcean 短路，此處再加 !lodFar
     （z<1 停用，同 T152 慣例）滿足卡面 LOD「z<1 跳過浪花/倒影」要求。倒影複用既有 T149 陰影同款
     brightness(0) 濾鏡剪影技法，reflectSprite() 僅涵蓋常見單格建築，複雜/多格建築回退 null 不繪（低成本
     簡化，已於卡面驗收確認） ===== */
  if(oceanOn&&!lodFar){
    ctx.save();
    for(let y=0;y<N;y++)for(let x=0;x<N;x++){
      const t=T(idx(x,y));
      if(t.t!==0||!t.wm)continue;
      const sx=sxOf(x,y),sy=syOf(x,y);
      if(!vis(sx,sy))continue;
      if(SPR.foamWave){ // 浪花：3 幀依 streetHash 相位＋visT 決定性播放
        const fh=streetHash(x,y,919);
        const frame=Math.floor(visT*1.4+fh*7)%3;
        ctx.globalAlpha=.35+.35*(Math.sin(visT*2+fh*31)*.5+.5);
        ctx.drawImage(SPR.foamWave[frame][t.wm],sx,sy,64*z,32*z);
        ctx.globalAlpha=1;
      }
      let rb=null; // 倒影：依 wm 位向優先序找第一個有建築的鄰接陸地格
      if(t.wm&1)rb=T(idx(x,y-1)).bld;
      if(!rb&&t.wm&2)rb=T(idx(x+1,y)).bld;
      if(!rb&&t.wm&4)rb=T(idx(x,y+1)).bld;
      if(!rb&&t.wm&8)rb=T(idx(x-1,y)).bld;
      const rs=rb&&reflectSprite(rb);
      if(rs){
        const ax2=sx+32*z,ay2=sy+32*z;
        ctx.save();
        ctx.translate(ax2,ay2);ctx.scale(1,-.35);
        ctx.filter='brightness(0)';
        ctx.globalAlpha=.22;
        ctx.drawImage(rs.img,-rs.ax*z,-rs.ay*z,rs.w*z,rs.h*z);
        ctx.restore();
      }
    }
    ctx.restore();
  }
  /* ===== T154 雨天地面水花＋濕地反光：地面快取貼上、T149 光暈、T152 水面波光之後，物件層之前疊加（不烘進
     groundCache，每幀重算，快取鍵 gKey 未新增任何組成分量）；水花挑選＋2 幀相位皆由 streetHash(x,y,salt)＋
     visT 決定性驅動，不消耗 R()/ri()；wxUp 為假（z<0.5／quality===0／__noWx=true）時整段跳過＝退回既有簡單
     版本（下方既有「天氣色調」區塊完全不受本開關節流，原樣繼續運作）。
     wetLvl／snowLvl：直接衍生既有 rainDays（T57「連續雨天計數」，tick() 既有遞增/遞減邏輯完全不變，此處純
     讀取不新增全域狀態、不消耗 R()），依當下季節分流為雨天濕地反光強度／雪天積雪強度，兩者天然隨 rainDays
     於雨/雪停止後遞減同步緩降；晴天基準（newWorld/load 後 rainDays 恆 0）時兩者精確為 0 ===== */
  const wetLvl=win?0:clamp(rainDays/RAIN_ACC_DAYS,0,1);
  const snowLvl=win?clamp(rainDays/SNOW_ACC_DAYS,0,1):0;
  if(wxUp&&wetLvl>0){ // 濕地反光：配合 T149 光暈疊一層淡藍灰 'lighter' 加成，形成濕潤地面感，不改地面顏色語意
    ctx.save();
    ctx.globalCompositeOperation='lighter';
    ctx.fillStyle=`rgba(150,178,206,${(wetLvl*.09).toFixed(3)})`;
    ctx.fillRect(0,0,W,H);
    ctx.restore();
  }
  if(wxUp&&weather&&!win&&!lodFar){ // 落點水花：僅非冬季雨天（冬季由既有雪花粒子代表降水，不疊加水花圈）；z<1 略去個體（同既有 drawRain 之 !lodFar 慣例）
    for(let y=0;y<N;y++)for(let x=0;x<N;x++){
      const t=T(idx(x,y));
      if(t.t===0)continue; // 水面不畫地面水花
      const sx=sxOf(x,y),sy=syOf(x,y);
      if(!vis(sx,sy))continue;
      const ph2=streetHash(x,y,930);
      if(ph2>.10)continue; // 稀疏度：約 10% 地面格具備水花資格
      const cyc=(visT*1.6+ph2*23)%1; // 0..1 決定性循環相位（同 visT 下重繪恆等，符合像素回歸「同一事件迴圈內比對」慣例）
      const frame=cyc<.5?0:1; // 2 幀：小環（濃）→大環（淡），模擬水花擴散消退
      const rr=(frame===0?3:7)*z, ra=frame===0?.5:.2;
      ctx.strokeStyle=`rgba(215,228,245,${ra})`;
      ctx.lineWidth=Math.max(1,z);
      ctx.beginPath();
      ctx.arc(sx+(16+ph2*32)*z,sy+(10+((ph2*53)%1)*14)*z,rr,0,Math.PI*2);
      ctx.stroke();
    }
  }
  // ---- 物件層（依深度排序） ----
  const objs=[];
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){
    const t=T(idx(x,y));
    if(t.bld&&t.bld.ref)continue;                          // 多格建築只由 root 繪製（T22）
    if(!t.tree&&!t.bld&&!t.deco)continue;
    const sx=sxOf(x,y),sy=syOf(x,y);
    if(!vis(sx,sy))continue;
    const dep=(t.bld&&(t.bld.k===9||t.bld.sz>=2))?((t.bld.ref?x:(t.bld.sz?x+t.bld.sz-1:x+1))+(t.bld.ref?y:(t.bld.sz?y+t.bld.sz-1:y+1))+y*.001):x+y+y*.001; // T39-T60 多格建築深度以 SE 角計
    objs.push({dep,x,y,sx,sy,t});
  }
  if(!lodMini)for(const c of cars){ // T107：z<0.5 小車不畫個體（updCars 模擬照跑，僅略去繪製）
    const fx=c.x+DIRV[c.d][0]*c.p, fy=c.y+DIRV[c.d][1]*c.p;
    const wx=(fx-fy)*32, wy=(fx+fy)*16+16;
    objs.push({dep:fx+fy+.01,car:c,wx,wy});
  }
  for(const bs of buses){                                  // 公車（T26）：與小車同深度規則插入 objs
    let fx=bs.x,fy=bs.y;
    const nx=bs.path&&bs.path[bs.pi+1];
    if(nx){fx=bs.x+(nx[0]-bs.x)*bs.p;fy=bs.y+(nx[1]-bs.y)*bs.p;}
    const wx=(fx-fy)*32, wy=(fx+fy)*16+16;
    objs.push({dep:fx+fy+.01,bus:bs,wx,wy,bd:bs.d});
  }
  for(const bs of rbuses){                                 // 路線公車（T120）：與一般公車同深度規則插入 objs，複用同一 SPR.bus 繪製分支
    let fx=bs.x,fy=bs.y;
    const nx=bs.path&&bs.path[bs.pi+1];
    if(nx){fx=bs.x+(nx[0]-bs.x)*bs.p;fy=bs.y+(nx[1]-bs.y)*bs.p;}
    const wx=(fx-fy)*32, wy=(fx+fy)*16+16;
    objs.push({dep:fx+fy+.01,bus:bs,wx,wy,bd:bs.d});
  }
  for(const tr of trains){                                // 火車（T63）：無 BFS 路徑，直接依 d/p 內插，同小車位置公式
    const fx=tr.x+DIRV[tr.d][0]*tr.p, fy=tr.y+DIRV[tr.d][1]*tr.p;
    const wx=(fx-fy)*32, wy=(fx+fy)*16+16;
    objs.push({dep:fx+fy+.01,train:tr,wx,wy,td:tr.d});
  }
  for(const sh of cargoShips){                            // 貨船（T64）：同小車/火車位置內插公式，沿水面 t===0 緩動
    const fx=sh.x+DIRV[sh.d][0]*sh.p, fy=sh.y+DIRV[sh.d][1]*sh.p;
    const wx=(fx-fy)*32, wy=(fx+fy)*16+16;
    objs.push({dep:fx+fy+.01,ship:sh,wx,wy,sd:sh.d});
  }
  for(const tc of tramCars){                              // 輕軌（T65）：同小車/火車位置內插公式，沿 tram 軌緩動
    const fx=tc.x+DIRV[tc.d][0]*tc.p, fy=tc.y+DIRV[tc.d][1]*tc.p;
    const wx=(fx-fy)*32, wy=(fx+fy)*16+16;
    objs.push({dep:fx+fy+.01,tram:tc,wx,wy,trd:tc.d});
  }
  for(const c of ladderTrucks){                           // 消防車（T119）：出勤中，位置公式同小車/火車內插（朝 tx/ty 單軸推進）
    const svcD=c.x!==c.tx?(c.tx>c.x?1:3):(c.y!==c.ty?(c.ty>c.y?2:0):0);
    const fx=c.x+DIRV[svcD][0]*c.p, fy=c.y+DIRV[svcD][1]*c.p;
    const wx=(fx-fy)*32, wy=(fx+fy)*16+16;
    objs.push({dep:fx+fy+.01,svc:'ladderTruck',svcD,wx,wy});
  }
  for(const c of recycleTrucks){                          // 垃圾車（T119）：沿路巡迴，位置公式同上
    const svcD=c.x!==c.tx?(c.tx>c.x?1:3):(c.y!==c.ty?(c.ty>c.y?2:0):0);
    const fx=c.x+DIRV[svcD][0]*c.p, fy=c.y+DIRV[svcD][1]*c.p;
    const wx=(fx-fy)*32, wy=(fx+fy)*16+16;

    else if(bd.k===1)s=wealthSpr(bd.k+'_'+bd.lv+'_'+bd.v,bd.we)||SPR.bld[bd.k+'_'+bd.lv+'_0']; // T125：住宅財富色變；變體鍵兜底同 FIX-D

      ctx.globalAlpha=Math.min(1,snowLvl*1.08)*drawA;

    if(wetLvl>0&&!lodFar&&bd.k!==4&&!window.__noWetBld){ // T184 雨天濕潤建築（Opus 親手）——與 T154 地面濕反光對稱：非冬下雨(wetLvl>0，沿用 rainDays/RAIN_ACC_DAYS)時建築本體疊冷暗濕膜 wetSkin(s)（頂微暗底較暗＝雨水沿牆流/牆腳積水），修正「地濕牆乾」違和；覆蓋全剪影故不涉屋頂線陷阱；乘 drawA 同步淡化；冬季(wetLvl=0，改由 T183 屋頂積雪表現)/晴天/公園(k4)/遠景 不繪＝該狀態逐像素零改動，__noWetBld 開關供回歸；純讀既有 wetLvl/drawA 不消耗 R()
