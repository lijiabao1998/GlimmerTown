/* ============================================================
   微光小鎮 Glimmerville — 原創等距像素城市建造小遊戲

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#0d1226;
  font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",system-ui,sans-serif;
  user-select:none;-webkit-user-select:none;touch-action:none}
#game{position:absolute;inset:0;width:100%;height:100%;display:block;
  image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none;cursor:grab}
#game.build{cursor:crosshair}
/* ---------- 頂部資訊列 ---------- */
#hud{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;gap:6px;
  padding:5px 8px;background:rgba(10,14,26,.86);border-bottom:2px solid #2c3450;
  color:#dfe6f5;font-size:13px;z-index:20;flex-wrap:wrap}
.chip{display:flex;align-items:center;gap:4px;background:#181f36;border:1px solid #303a5c;
  border-radius:6px;padding:2px 8px;white-space:nowrap;line-height:20px}
.chip b{font-weight:700;color:#fff}
#money b{color:#ffd977}
#hud .spacer{flex:1}
.hbtn{background:#232c4a;border:1px solid #3a4670;color:#dfe6f5;border-radius:6px;
  padding:2px 9px;font-size:13px;line-height:22px;cursor:pointer}
.hbtn:active{background:#31407a}
.hbtn.on{background:#3a5a2f;border-color:#5f8f4a}
/* RCI 需求柱 */
#rci{display:flex;align-items:flex-end;gap:3px;height:26px;padding:2px 6px;
  background:#181f36;border:1px solid #303a5c;border-radius:6px}
#rci .col{width:9px;height:22px;background:#0c1020;border-radius:2px;position:relative;overflow:hidden}
#rci .col i{position:absolute;bottom:0;left:0;right:0;height:0%}
#rci .r i{background:#58c470}#rci .c i{background:#5aa0e8}#rci .i i{background:#e8b23e}
/* ---------- 工具列 ---------- */
#toolcats{position:absolute;left:50%;bottom:68px;transform:translateX(-50%);z-index:21;display:none;gap:4px;flex-wrap:wrap;justify-content:center;max-width:96vw}
#toolcats button{padding:4px 8px;border-radius:8px;border:1px solid #3a456e;background:rgba(16,22,42,.92);color:#c9d2ea;font-size:11px;cursor:pointer}
#toolcats button.on{border-color:#c9a24c;color:#ffe9ad;background:#2a3358}
#tools{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);display:flex;gap:6px;
  padding:6px;background:rgba(10,14,26,.88);border:2px solid #2c3450;border-radius:12px;
  z-index:20;max-width:96vw;overflow-x:auto}
.tool{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;

.tool .pr{color:#8fa0c8;font-size:9px}
.tool.sel{border-color:#ffd977;background:#33395e;color:#fff}
.tool:active{transform:scale(.95)}
/* ---------- 提示橫幅 ---------- */
#hint{position:absolute;top:44px;left:50%;transform:translateX(-50%);z-index:19;

#hint button{background:none;border:none;color:#8fa0c8;font-size:14px;cursor:pointer}
/* ---------- 訊息泡 ---------- */
#toasts{position:absolute;left:50%;bottom:78px;transform:translateX(-50%);z-index:25;

.toast{background:rgba(16,22,42,.94);border:1px solid #4a5788;color:#eaf0ff;border-radius:8px;

.toast.gold{border-color:#c9a84c;color:#ffe9ad}
.toast.bad{border-color:#a85050;color:#ffc4c4}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1}}
/* ---------- 檢視面板 ---------- */
#info{position:absolute;left:10px;bottom:80px;z-index:22;background:rgba(12,17,32,.94);

#start{position:absolute;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;

#logo{image-rendering:pixelated;width:224px;height:128px}

  .chip{padding:2px 6px;line-height:18px}
  .hbtn{padding:2px 7px;font-size:12px}

const lerp=(a,b,t)=>a+(b-a)*t;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
let R=mulberry32(1); // 全域隨機（依種子重設）

/* 值噪聲（地形用） */
function makeNoise(rand,G){
  const v=new Float32Array(G*G);
  for(let i=0;i<G*G;i++)v[i]=rand();
  const at=(x,y)=>{
    const xi=Math.floor(x),yi=Math.floor(y);
    const xf=x-xi,yf=y-yi,sx=xf*xf*(3-2*xf),sy=yf*yf*(3-2*yf);
    const g=(a,b)=>v[((a%G)+G)%G*G+(((b%G)+G)%G)];
    return lerp(lerp(g(xi,yi),g(xi+1,yi),sx),lerp(g(xi,yi+1),g(xi+1,yi+1),sx),sy);
  };
  return (x,y)=>.6*at(x,y)+.3*at(x*2.13+7,y*2.13+3)+.1*at(x*4.7+13,y*4.7+11);
}

function cv(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;
  const g=c.getContext('2d');g.imageSmoothingEnabled=false;return[c,g];}

// 菱形：中心 cx、頂點 y=ty、半寬 hw（偶數），高度=hw，斜率固定 2:1
function dia(g,cx,ty,hw,col){
  g.fillStyle=col;
  const hh=hw>>1;
  for(let i=0;i<hh;i++){
    const w=(i+1)*2;
    g.fillRect(cx-w,ty+i,w*2,1);
    g.fillRect(cx-w,ty+hw-1-i,w*2,1);
  }
}
// 菱形內隨機點綴
function speck(g,cx,ty,hw,cols,n,rand){
  for(let i=0;i<n;i++){
    const yy=1+Math.floor(rand()*(hw-2));
    const hr=Math.max(1,(yy<hw/2?(yy+1):(hw-yy))*2-2);
    const xx=cx-hr+Math.floor(rand()*hr*2);
    g.fillStyle=cols[Math.floor(rand()*cols.length)];
    g.fillRect(xx,ty+yy,2,1);
  }
}
// 菱形四邊描邊（bit：1上右 2下右 4下左 8上左）
function diaEdge(g,edges,col,cx=32,ty=0,hw=32){
  g.fillStyle=col;
  const hh=hw>>1;
  for(let i=0;i<hh;i++){
    const a=2*(i+1);
    if(edges&1)g.fillRect(cx+a-2,ty+i,2,1);
    if(edges&8)g.fillRect(cx-a,  ty+i,2,1);
    const b=2*(hh-i);
    if(edges&2)g.fillRect(cx+b-2,ty+hh+i,2,1);
    if(edges&4)g.fillRect(cx-b,  ty+hh+i,2,1);
  }
}
// 等距方塊：底頂點 (cx,by)、半寬 hw（偶數）、牆高 h；回傳屋頂菱形頂點 y
function isoBox(g,cx,by,hw,h,cL,cR,cTop){
  g.fillStyle=cL;
  for(let dx=1;dx<=hw;dx++){const yF=by-(dx>>1);g.fillRect(cx-dx,yF-h,1,h);}
  g.fillStyle=cR;
  for(let dx=0;dx<hw;dx++){const yF=by-((dx+1)>>1);g.fillRect(cx+dx,yF-h,1,h);}
  g.fillStyle='rgba(0,0,0,.13)';                       // 底部 AO
  for(let dx=1;dx<=hw;dx++){const yF=by-(dx>>1);g.fillRect(cx-dx,yF-3,1,3);}
  for(let dx=0;dx<hw;dx++){const yF=by-((dx+1)>>1);g.fillRect(cx+dx,yF-3,1,3);}
  g.fillStyle='rgba(0,0,0,.25)';g.fillRect(cx,by-h,1,h); // 前角線
  const rty=by-h-hw;
  dia(g,cx,rty,hw,cTop);
  diaEdge(g,6,shade(cTop,-26),cx,rty,hw);              // 簷口陰影
  diaEdge(g,9,shade(cTop,16),cx,rty,hw);               // 頂緣受光
  return rty;
}
// 牆上窗（含窗台與反光，跟著牆斜率排），同步畫到夜間圖層
function windows(g,ng,cx,by,hw,h,rand,litP,opts){
  const o=Object.assign({w:3,ht:4,gx:5,gy:7,glass:'#26314e',lit:'#ffd77a'},opts||{});
  const put=(x,y)=>{
    g.fillStyle=o.glass;g.fillRect(x,y,o.w,o.ht);
    g.fillStyle='rgba(255,255,255,.28)';g.fillRect(x,y,o.w,1);
    g.fillStyle='rgba(255,255,255,.30)';g.fillRect(x,y+o.ht,o.w,1);
    if(ng&&rand()<litP){ng.fillStyle=o.lit;ng.fillRect(x,y,o.w,o.ht);}
  };
  for(let dx=2;dx<hw-o.w-1;dx+=o.gx){                  // 右牆
    const yF=by-((dx+1)>>1);
    for(let y=yF-h+3;y<yF-o.ht-2;y+=o.gy)put(cx+dx,y);
  }
  for(let dx=4;dx<hw-1;dx+=o.gx){                      // 左牆
    const yF=by-(dx>>1);
    for(let y=yF-h+3;y<yF-o.ht-2;y+=o.gy)put(cx-dx-o.w+1,y);
  }
}
// 輪廓線後處理：透明像素貼著實體 → 描 1px 深色邊
function outlineSprite(c,r,gc,b){
  const g=c.getContext('2d');
  const w=c.width,h=c.height;
  const im=g.getImageData(0,0,w,h),a=im.data;
  const solid=(x,y)=>x>=0&&y>=0&&x<w&&y<h&&a[(y*w+x)*4+3]>40;
  const marks=[];
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const i=(y*w+x)*4;
    if(a[i+3]<=40&&(solid(x+1,y)||solid(x-1,y)||solid(x,y+1)||solid(x,y-1)))marks.push(i);
  }
  for(const i of marks){a[i]=r;a[i+1]=gc;a[i+2]=b;a[i+3]=255;}
  g.putImageData(im,0,0);
}
function shade(hex,amt){
  const n=parseInt(hex.slice(1),16);
  const r=clamp((n>>16)+amt,0,255),g=clamp(((n>>8)&255)+amt,0,255),b=clamp((n&255)+amt,0,255);
  return '#'+((r<<16|g<<8|b).toString(16).padStart(6,'0'));
}
// 建築地基板
function plate(g,ax,ay,col){
  col=col||'#9a9484';
  dia(g,ax,ay-32,32,col);
  speck(g,ax,ay-32,32,[shade(col,-10),shade(col,8)],26,()=>Math.random());
  diaEdge(g,6,shade(col,-20),ax,ay-32,32);
  diaEdge(g,9,shade(col,10),ax,ay-32,32);
}

/* =====================================================================
   3. 世界生成
===================================================================== */
function genWorld(sd){
  seed=sd;R=mulberry32(sd);
  const noi=makeNoise(mulberry32(sd^0x9e37),64);
  const noi2=makeNoise(mulberry32(sd^0x51f3),64);
  const noi3=makeNoise(mulberry32(sd^0x27b1),64);                          // 高地噪聲（T24）
  tiles=new Array(N*N);
  let water=0;
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){
    const n=noi(x*.085,y*.085);
    let t=2;
    if(n<.40)t=0; else if(n<.455)t=1;
    if(t===0)water++;
    const el=(t===2&&noi3(x*.06,y*.06)>.62)?1:0;                           // 高地：僅草地（T24）
    const tile={t,tree:0,gv:ri(4),road:0,bridge:0,hw:0,rc:0,mask:0,zone:0,bld:null,rp:false,wp:0,wr:0,wm:0,deco:0,el,em:0};
    if(t===2&&noi2(x*.13,y*.13)>.62&&R()<.8)tile.tree=1+ri(4);
    else if(t===2&&R()<.015)tile.deco=1;
    tiles[idx(x,y)]=tile;
  }
  // ---- 河流：1-3 條，向噪聲遞減方向蜿蜒挖成真水域（T24） ----
  const carve=(cx,cy)=>{const tl=tiles[idx(cx,cy)];if(tl.t!==0){tl.t=0;water++;}tl.tree=0;tl.deco=0;tl.el=0;};
  const nR=1+ri(3),dirs=[[0,-1],[1,0],[0,1],[-1,0]];
  for(let r=0;r<nR;r++){
    let cx=0,cy=0,ok=false;
    for(let tr=0;tr<40&&!ok;tr++){const rx=ri(N),ry=ri(N);if(tiles[idx(rx,ry)].el===1){cx=rx;cy=ry;ok=true;}} // 優先高地起點
    if(!ok){const e=ri(4);cx=e===1?N-1:e===3?0:ri(N);cy=e===0?0:e===2?N-1:ri(N);}                              // 退化：地圖邊緣隨機點
    let px=-1,py=-1;
    for(let step=0;step<60;step++){
      const wr=1+ri(2);                                                    // 路徑及其鄰寬隨機 1-2 格
      for(let dy=-wr;dy<=wr;dy++)for(let dx=-wr;dx<=wr;dx++)
        if(Math.abs(dx)+Math.abs(dy)<=wr&&inMap(cx+dx,cy+dy))carve(cx+dx,cy+dy);
      let best=-1,bestV=1e9;
      for(let d=0;d<4;d++){const nx=cx+dirs[d][0],ny=cy+dirs[d][1];
        if(!inMap(nx,ny)||(nx===px&&ny===py))continue;
        const v=noi(nx*.085,ny*.085);if(v<bestV){bestV=v;best=d;}}         // 向鄰格中 noi 最低者
      if(best<0)break;
      if(R()<.30){const cand=[];for(let d=0;d<4;d++){const nx=cx+dirs[d][0],ny=cy+dirs[d][1];if(inMap(nx,ny)&&!(nx===px&&ny===py))cand.push(d);}if(cand.length)best=cand[ri(cand.length)];} // 30% 隨機偏折
      px=cx;py=cy;cx+=dirs[best][0];cy+=dirs[best][1];
      if(noi(cx*.085,cy*.085)<.40){carve(cx,cy);break;}                    // 觸及原生水域→匯流停止
    }
  }
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){
    const tl=tiles[idx(x,y)];
    if(tl.t===1&&!tl.deco&&R()<.25){
      for(const[dx,dy]of[[0,-1],[1,0],[0,1],[-1,0]])
        if(inMap(x+dx,y+dy)&&tiles[idx(x+dx,y+dy)].t===0){tl.deco=2;break;} // 蘆葦
    }else if(tl.t===2&&!tl.tree&&!tl.deco&&R()<.01)tl.deco=3;               // 野花叢
  }
  return water/(N*N);
}
// 水岸泡沫遮罩（哪幾條邊鄰接陸地）
function computeFoam(){
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){
    const t=T(idx(x,y));t.wm=0;
    if(t.t!==0)continue;
    let m=0;
    if(inMap(x,y-1)&&T(idx(x,y-1)).t!==0)m|=1;
    if(inMap(x+1,y)&&T(idx(x+1,y)).t!==0)m|=2;
    if(inMap(x,y+1)&&T(idx(x,y+1)).t!==0)m|=4;
    if(inMap(x-1,y)&&T(idx(x-1,y)).t!==0)m|=8;
    t.wm=m;
  }
}
// 高地內陸崖沿位罩（哪幾條邊鄰接低地；el 生成後算一次，沿用 foam 位向約定，T24）
function computeElMask(){
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){
    const t=T(idx(x,y));t.em=0;
    if(t.el!==1)continue;
    let m=0;
    if(inMap(x,y-1)&&T(idx(x,y-1)).el===0)m|=1;
    if(inMap(x+1,y)&&T(idx(x+1,y)).el===0)m|=2;
    if(inMap(x,y+1)&&T(idx(x,y+1)).el===0)m|=4;
    if(inMap(x-1,y)&&T(idx(x-1,y)).el===0)m|=8;
    t.em=m;
  }
}
function newWorld(seedOverride){
  let sd=seedOverride!==undefined?seedOverride:(Math.random()*1e9)|0;
  for(let tries=0;tries<40;tries++){
    const w=genWorld(sd);
    if(w>.06&&w<.42)break;
    sd=(sd*1664525+1013904223)|0;
  }
  // 找一塊開闊草地當出生視角
  let best=null,bestScore=-1;
  for(let s=0;s<160;s++){
    const x=6+ri(N-12),y=6+ri(N-12);
    let sc=0;
    for(let dy=-4;dy<=4;dy++)for(let dx=-4;dx<=4;dx++){
      const t=T(idx(x+dx,y+dy));
      if(t.t===2&&!t.tree)sc++;
    }
    if(sc>bestScore){bestScore=sc;best=[x,y];}
  }
  money=3000;day=1;msIdx=0;ach={};pop=0;jobs=0;cityHappy=.6;dem={1:.5,2:0,3:0};
  bailoutDay=-999;loan=null;cars.length=0;smokes.length=0;hintShown={};hintsOff=false;
  trains.length=0;cargoShips.length=0;tramCars.length=0;buses.length=0;ambulances.length=0;pol=null;region={}; // FIX-G：開新圖清空運行時載具陣列（對齊 load()，防前一局列車/電車/貨船/公車殘留至新圖）；FIX-H：補清救護車與 pol/region（防前一局稅率政策/區域摘要帶入新圖）
  undoStack.length=0;undoGroup=null;
  cam.x=(best[0]-best[1])*32;cam.y=(best[0]+best[1])*16;cam.z=Math.max(1,Math.min(3,Math.round(DPR)));
  recalcAllMasks();
  computeFoam();
  computeElMask();
  rebuildCov(); // T61：新圖無建築，全量清零覆蓋場（清除前一局殘留）
  townName=NM1[ri(NM1.length)]+NM2[ri(NM2.length)];
  document.title=townName+' · 微光小鎮';
  toast(`🏙️ 歡迎來到「${townName}」！`,'gold');
}

/* =====================================================================
   4. 建造邏輯
===================================================================== */
function recalcMask(x,y){
  if(!inMap(x,y))return; // 邊界防護：鄰格重算可能落在圖外
  const t=T(idx(x,y));if(!t.road)return;
  let m=0;
  if(inMap(x,y-1)&&T(idx(x,y-1)).road)m|=1;
  if(inMap(x+1,y)&&T(idx(x+1,y)).road)m|=2;
  if(inMap(x,y+1)&&T(idx(x,y+1)).road)m|=4;
  if(inMap(x-1,y)&&T(idx(x-1,y)).road)m|=8;
  t.mask=m;
}
function recalcAllMasks(){
  for(let y=0;y<N;y++)for(let x=0;x<N;x++)recalcMask(x,y);
}
function roadToolToRc(id){return {alley:1,road:2,coll:3,art:4,hwy:5}[id]||0;}
function rcToName(rc){return ROAD_NAME[rc-1]||'';}
// 鐵路/輕軌遮罩（T39/T44）
function recalcRailMask(x,y){
  if(!inMap(x,y))return;
  const t=T(idx(x,y));
  if(!t.rail&&!t.tram)return;
  let m=0;
  if(inMap(x,y-1)&&(T(idx(x,y-1)).rail||T(idx(x,y-1)).tram))m|=1;
  if(inMap(x+1,y)&&(T(idx(x+1,y)).rail||T(idx(x+1,y)).tram))m|=2;
  if(inMap(x,y+1)&&(T(idx(x,y+1)).rail||T(idx(x,y+1)).tram))m|=4;
  if(inMap(x-1,y)&&(T(idx(x-1,y)).rail||T(idx(x-1,y)).tram))m|=8;
  if(t.rail)t.railMask=m;

function canPlace(toolId,x,y){

      if(t.bld)return '已有建築';
      return null;

      if(t.t!==2&&t.t!==1)return '只能蓋在陸地上';
      if(t.road)return '道路上不能建造';
      if(t.bld)return '已有建築';
      return null;
    case 'wpipe':
      if(t.t!==2&&t.t!==1)return '只能鋪在陸地上';
      if(t.wp)return '已有水管';
      return null;
    case 'stad': // 體育場 2×2：root=(x,y)，四格全需陸地、無路、無建築、無焦土（T22）
      for(const[sx,sy]of[[x,y],[x+1,y],[x,y+1],[x+1,y+1]]){
        if(!inMap(sx,sy))return '需 2×2 陸地';
        const st=T(idx(sx,sy));

      return null;
    case 'fill':
      if(t.t!==1)return '只能填在沙地上';
      return null;
    case 'doze':
      if(!t.road&&!t.bld&&!t.zone&&!t.tree&&!t.deco&&!t.ruin&&!t.rail&&!t.tram&&!t.dock&&!t.oneway&&!t.light&&!t.busLane&&!t.levee&&!t.flood&&!t.wp)return '這裡沒東西';
      return null;
    // T39-T60 新工具
    case 'rail':
      if(t.rail)return null;
      if(t.bld)return '有建築擋住';
      return null;
    // airport 必須在 case 列表內（漏列會落到「無法建造」）；farm/ranch/solar/landmark/prison 為 2×2
    case 'station':case 'port':case 'tramStation':case 'farm':case 'ranch':case 'landmark':case 'solar':case 'sewage':case 'ambulance':case 'recycling':case 'fireStation2':case 'prison':case 'university':case 'airport':
      if(t.t!==2&&t.t!==1)return '只能蓋在陸地上';
      if(t.road||t.rail||t.tram)return '交通線上不能建造';
      if(t.bld)return '已有建築';
      if(toolId==='port'||toolId==='sewage'){if(countNear(x,y,1,tt=>tt.t===0)<2)return '需鄰近水域(≥2格)';}
      if(toolId==='farm'||toolId==='ranch'||toolId==='solar'){if(t.t!==2)return '只能蓋在草地上';}

      if(toolId==='solar'&&t.el)return '高海拔不適合';
      if(toolId==='airport')return canPlaceMulti(x,y,4,'需 4×4 陸地');
      if(toolId==='landmark'||toolId==='prison'||toolId==='farm'||toolId==='ranch'||toolId==='solar'){

    case 'tram':
      if(t.tram)return null;
      if(t.bld)return '有建築擋住';
      if(t.t===0)return null; // 水上自動橋

      return null;
    case 'wind':
      if(t.t!==2&&t.t!==1)return '只能蓋在陸地上';
      if(t.road||t.rail||t.tram)return '交通線上不能建造';
      if(t.bld)return '已有建築';
      if(countNear(x,y,2,tt=>tt.bld&&tt.bld.k===26)>=1)return '風力發電機需間隔≥2格';
      return null;
    case 'office':
      if(t.t!==2&&t.t!==1)return '只能劃在陸地上';
      if(t.road)return '道路上不能分區';
      if(t.bld)return '已有建築';
      return null;
    case 'oneway':
      if(!t.road||t.bridge)return '只能加在道路上';
      if(t.oneway)return null;
      return null;
    case 'light':
      if(!t.road||t.bridge)return '只能加在路口';
      if(t.mask!==15&&t.mask!==(1|2|4)&&t.mask!==(2|4|8)&&t.mask!==(4|8|1)&&t.mask!==(8|1|2))return '只能加在3-4向路口';

      return null;
    case 'parking':
      return canPlaceMulti(x,y,2,'需 2×2 陸地');
    case 'busLane':
      if(!t.road||t.bridge||t.busLane)return '只能加在道路上';
      return null;
    case 'levee':

      if(!(t.t===2&&countNear(x,y,1,tt=>tt.t===0)>=1))return '只能蓋在河岸邊';
      if(t.levee)return null;
      return null;
  }
  return '無法建造';

function canPlaceMulti(x,y,sz,msg){
  for(let dy=0;dy<sz;dy++)for(let dx=0;dx<sz;dx++){
    const sx=x+dx,sy=y+dy;
    if(!inMap(sx,sy))return msg;
    const st=T(idx(sx,sy));
    if(st.t!==2&&st.t!==1)return msg;
    if(st.road||st.rail||st.tram)return '交通線擋住';
    if(st.bld)return '已有建築';
    if(st.ruin)return '焦土需先清理';
  }
  return null;

    case 'ranch':c=COST.ranch;break;
    case 'landmark':c=COST.landmark;break;
    case 'solar':c=COST.solar;break;

  return c;

function hasRoadNear(x,y,r,needPow,noHw){
  for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){
    const nx=x+dx,ny=y+dy;
    if(!inMap(nx,ny))continue;
    const t=T(idx(nx,ny));
    if(t.road&&(!noHw||!t.hw)&&(!needPow||t.rp))return true; // noHw：分區生長只認普通路（高速不吸引住宅，T21）
  }
  return false;
}
function computePower(){
  let plants=0,so=0,wi=0;
  for(let i=0;i<N*N;i++){tiles[i].rp=false;const b=tiles[i].bld;if(b&&!b.ref){if(b.k===5)plants++;else if(b.k===25)so++;else if(b.k===26)wi++;}}
  // T82：再生能源加容量；仍需至少一座電廠啟動路網 BFS
  if(!plants)return 0;
  const seen=new Uint8Array(N*N);
  const q=[];
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){
    const t=T(idx(x,y));
    if(!(t.bld&&t.bld.k===5))continue;
    for(const[dx,dy]of[[0,-1],[1,0],[0,1],[-1,0]]){
      const nx=x+dx,ny=y+dy;
      if(inMap(nx,ny)&&T(idx(nx,ny)).road&&!seen[idx(nx,ny)]){
        seen[idx(nx,ny)]=1;q.push([nx,ny,0]);
      }
    }
  }
  let head=0;
  while(head<q.length){
    const[x,y,d]=q[head++];
    T(idx(x,y)).rp=true;
    if(d>=90)continue;
    for(const[dx,dy]of[[0,-1],[1,0],[0,1],[-1,0]]){
      const nx=x+dx,ny=y+dy;
      if(!inMap(nx,ny))continue;
      const j=idx(nx,ny);
      if(T(j).road&&!seen[j]){seen[j]=1;q.push([nx,ny,d+1]);}
    }
  }
  return plants*PLANT_CAP+so*15+wi*20; // T82 太陽能/風力額外容量
}
function countNear(x,y,r,pred){
  let n=0;
  for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){
    const nx=x+dx,ny=y+dy;
    if(!inMap(nx,ny))continue;
    if(pred(T(idx(nx,ny))))n++;
  }
  return n;
}
/* T61 服務覆蓋計數場：擺放時蓋印一次，tick 內 O(1) 讀取（取代逐棟 countNear 方框掃描）。
   運行時重建、不入存檔（load/newWorld 後與 undo 後 rebuildCov 全量重建）。語義與原 countNear(...)>0／計數完全一致。*/
const COVR={park:4,plant:4,fire:9,school:8,stadium:10,police:10,hospital:12,clinic:6,library:6,post:8,cemetery:10,bus:6,rdec:2,ambulance:10,fire2:12,prison:8,university:10,parking:8};
const COV={};for(const f in COVR)COV[f]=new Uint8Array(N*N);
// T67：新服務 k 接入覆蓋場；高級消防用 fire2 更大半徑
function covFieldOfK(k){return {4:'park',5:'plant',6:'fire',7:'school',9:'stadium',11:'police',12:'hospital',13:'clinic',14:'library',15:'post',16:'cemetery',28:'ambulance',30:'fire2',31:'prison',32:'university',20:'parking'}[k]||null;}
// Chebyshev 半徑 r 方框逐格 ±delta（邊界裁剪），支持重疊計數
function stampCov(field,x,y,r,delta){
  const a=COV[field];
  for(let dy=-r;dy<=r;dy++){const ny=y+dy;if(ny<0||ny>=N)continue;
    for(let dx=-r;dx<=r;dx++){const nx=x+dx;if(nx<0||nx>=N)continue;a[idx(nx,ny)]+=delta;}}
}
// 全量重建（load/newWorld 後、undo 後）：清零後掃全圖蓋印每個設施（含體育場 4 格皆為 k9 覆蓋源，與 countNear 一致）
function rebuildCov(){
  for(const f in COV)COV[f].fill(0);
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){
    const t=tiles[idx(x,y)],b=t.bld;
    if(b){
      if(b.ref){if(b.k===9)stampCov('stadium',x,y,COVR.stadium,1);}
      else{const f=covFieldOfK(b.k);if(f)stampCov(f,x,y,COVR[f],1);}
    }
    if(t.rdec)stampCov('rdec',x,y,COVR.rdec,1);
    if(t.bus)stampCov('bus',x,y,COVR.bus,1);
  }
}
function computeWater(){
  let towers=0;
  for(let i=0;i<N*N;i++){tiles[i].wr=false;if(tiles[i].bld&&tiles[i].bld.k===10)towers++;}
  if(!towers)return 0;
  const seen=new Uint8Array(N*N);
  const q=[];
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){
    const t=T(idx(x,y));
    if(!(t.bld&&t.bld.k===10))continue;
    for(const[dx,dy]of[[0,-1],[1,0],[0,1],[-1,0]]){
      const nx=x+dx,ny=y+dy;
      if(inMap(nx,ny)&&T(idx(nx,ny)).wp&&!seen[idx(nx,ny)]){
        seen[idx(nx,ny)]=1;q.push([nx,ny,0]);
      }
    }
  }
  let head=0;
  while(head<q.length){
    const[x,y,d]=q[head++];
    T(idx(x,y)).wr=true;
    if(d>=90)continue;
    for(const[dx,dy]of[[0,-1],[1,0],[0,1],[-1,0]]){
      const nx=x+dx,ny=y+dy;
      if(!inMap(nx,ny))continue;
      const j=idx(nx,ny);
      if(T(j).wp&&!seen[j]){seen[j]=1;q.push([nx,ny,d+1]);}
    }
  }
  return towers*WATER_TOWER_CAP;
}
function hasWaterNear(x,y,r=2){
  for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){
    const nx=x+dx,ny=y+dy;
    if(!inMap(nx,ny))continue;
    if(T(idx(nx,ny)).wr)return true;
  }
  return false;
}
function tick(){
  day++;
  // 季節轉換 toast（T18）：入冬／開春各一次，flag 防重複；季節由 day 導出
  {const w=inWinter()?1:0;
   if(w!==wSeason){
     if(wSeason!==-1)toast(w?'❄️ '+townName+'入冬了':'🌱 春天來了');
     wSeason=w;
   }}
  // 天氣狀態機（T17）：每天遞減，歸零擲骰換態；暴雨每天 25% 觸發閃電
  if(--wxT<=0){
    if(weather===0){if(R()<.12){weather=1;wxT=3+ri(6);}else wxT=3+ri(5);}
    else if(weather===1){
      if(R()<.20){weather=2;wxT=1+ri(2);}
      else if(R()<.35){weather=0;wxT=4+ri(6);}
      else wxT=2+ri(3);
    }else{
      if(R()<.35){weather=0;wxT=4+ri(6);}
      else{weather=1;wxT=2+ri(4);}
    }
  }
  if(weather===2&&!inWinter()&&R()<.25){flashT=.4;sThunder();} // 冬季不觸發閃電（T18）
  composer.update(); // 天氣／季節變化時背景音樂可能換情緒（T37）
  const cap=computePower();
  const wCap=computeWater();
  // 死亡與墓園前置處理（T38）：既有死亡事件的懲罰標記與自動消退
  const deathPenalty=new Uint8Array(N*N);
  let cemCount=0;
  for(let i=0;i<N*N;i++){const b=tiles[i].bld;if(b&&b.k===16)cemCount++;}
  const cemCap=cemCount*3;
  let soothed=0;
  for(let i=0;i<N*N;i++){
    const b=tiles[i].bld;
    if(!b||b.k!==1||!b.death)continue;
    b.deathAge=(b.deathAge||0)+1;
    if(b.deathAge>=10){b.death=0;b.deathAge=0;b.sick=0;continue;}
    const x=i%N,y=(i/N)|0;
    const covered=COV.cemetery[i]>0;                    // T61：墓園半徑10覆蓋（原 countNear k===16）
    if(covered&&soothed<cemCap){soothed++;continue;}
    // 未安撫：半徑 6 內其他住宅幸福 -0.1
    for(let dy=-6;dy<=6;dy++)for(let dx=-6;dx<=6;dx++){
      const nx=x+dx,ny=y+dy;
      if(!inMap(nx,ny))continue;
      const j=idx(nx,ny),nb=tiles[j].bld;
      if(nb&&nb.k===1&&!nb.death)deathPenalty[j]=1;
    }
  }
  // 供電／供水判定
  let powered=0,watered=0;
  let popN=0,jobsC=0,jobsI=0,happySum=0,happyN=0,schools=0,dumps=0,stadiums=0,waterTowers=0,clinics=0,libraries=0,posts=0,cemeteries=0;
  let st=0,po=0,ai=0,pa=0,tr=0,fa=0,ra=0,la=0,so=0,wi=0,se=0,am=0,rc=0,fs2=0,pr=0,un=0;
  const grown=[];
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){
    const t=T(idx(x,y));
    const b=t.bld;
    if(b&&b.ref)continue;              // 多格建築 ref 格不參與任何模擬（T22）
    if(b&&b.k===7)schools++;
    if(b&&b.k===8)dumps++;
    if(b&&b.k===9)stadiums++;          // 體育場（root）計數，供 jobs/維護（T22）
    if(b&&b.k===10)waterTowers++;      // 水塔計數（T31）
    if(b&&b.k===13)clinics++;          // 診所計數（T34）
    if(b&&b.k===14)libraries++;        // 圖書館計數（T35）
    if(b&&b.k===15)posts++;             // 郵局計數（T36）
    if(b&&b.k===16)cemeteries++;        // 墓園計數（T38）
    if(b&&b.k===17)st++;               // 火車站（T39）
    if(b&&b.k===18)po++;               // 港口（T40）
    if(b&&b.k===19)ai++;               // 機場（T41）
    if(b&&b.k===20)pa++;               // 停車場（T43）
    if(b&&b.k===21)tr++;               // 輕軌站（T44）
    if(b&&b.k===22)fa++;               // 農場（T46）
    if(b&&b.k===23)ra++;               // 牧場（T46）
    if(b&&b.k===24)la++;               // 地標（T47）
    if(b&&b.k===25)so++;               // 太陽能（T48）
    if(b&&b.k===26)wi++;               // 風力（T48）
    if(b&&b.k===27)se++;               // 污水廠（T49）
    if(b&&b.k===28)am++;               // 救護站（T50）
    if(b&&b.k===29)rc++;               // 回收中心（T51）
    if(b&&b.k===30)fs2++;              // 高級消防（T52）
    if(b&&b.k===31)pr++;               // 監獄（T53）
    if(b&&b.k===32)un++;               // 大學（T54）

    if(b.pw)powered++;
    b.wa=b.pw&&hasWaterNear(x,y,2)&&watered<wCap; // 需供電且鄰近通水水管（T31）
    if(b.wa)watered++;
    if(b.k===1){
      const ci=idx(x,y);                                 // T61：本格覆蓋場索引

      const rc=getMaxRoadClass(x,y,1);

      const post=COV.post[ci]>0;                         // 郵局半徑8覆蓋（原 countNear k===15）

      happySum+=b.h;happyN++;
      if(b.pw&&!b.sick&&!b.death){popN+=Math.round(POPS[b.lv]*(b.den?DEN_POP[b.den-1]:1));}
    }else if(b.pw){

    }
  }

  cityHappy=happyN?happySum/happyN:.6;
  // 垃圾（T19）：產量/容量/超載係數；套用到全城住宅幸福尾端，並節流提示
  garbage=pop*.05+jobsI*.08;
  garbCap=dumps*DUMP_CAP+rc*(DUMP_CAP*.75); // T84
  garbRatio=garbCap>0?clamp(garbage/garbCap,0,2):2;
  if(garbRatio>1){
    const pen=(garbRatio-1)*.15;
    happySum=0;happyN=0;
    for(let i=0;i<N*N;i++){
      const b=tiles[i].bld;
      if(!b||b.k!==1)continue;

    if(rainDays>=6&&R()<.12){
      let n=0;
      for(let i=0;i<N*N&&n<8;i++){
        const t=tiles[i];if(t.t!==2||t.levee||t.flood)continue;
        if(countNear(i%N,(i/N)|0,1,tt=>tt.t===0)<1)continue;
        t.flood=1;n++;
      }
      if(n)toast('🌊 洪水來襲！河岸低地被淹（堤防可防護）','bad');
    }
    for(let i=0;i<N*N;i++)if(tiles[i].flood&&R()<.15)tiles[i].flood=0;
    if(quakeRecover>0)quakeRecover--;
    else if(R()<.0015){
      shakeT=.55;quakeRecover=40;let hit=0;
      for(let tries=0;tries<40&&hit<5;tries++){
        const i=ri(N*N),b=tiles[i].bld;
        if(b&&!b.ref&&b.k<=3&&!b.fire){b.fire=1;hit++;}
      }
      if(hit){toast('🌋 地震！部分建築起火','bad');sErr();}
    }
  }
  if(shakeT>0)shakeT=Math.max(0,shakeT-0.05);
  // 需求
  const workers=pop*.6;
  dem[1]=clamp((jobs*1.2+25-workers)/70,-1,1);
  dem[2]=clamp((workers*.45-jobsC)/50,-1,1);
  dem[3]=clamp((workers*.55-jobsI)/55,-1,1);
  // 生長：收集候選
  const cands=[];
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){
    const t=T(idx(x,y));
    if(t.zone&&!t.bld&&!t.ruin&&hasRoadNear(x,y,2,true,true))cands.push([x,y,t.zone]); // 生長鄰路只認通電普通路（高速不算，T21）
  }
  // 洗牌取前幾個
  for(let i=cands.length-1;i>0;i--){const j=ri(i+1);const tmp=cands[i];cands[i]=cands[j];cands[j]=tmp;}
  let spawns=0;
  for(const[x,y,z]of cands){
    if(spawns>=3)break;
    let p=.10+.5*Math.max(0,dem[z])*(z===1?clamp(cityHappy+.25,.3,1):1);
    const cell=T(idx(x,y));
    if(z===1&&cityHappy<.4)p*=.5; // T72
    if(cell.office)p*=1.35; // T79
    if(R()<p){
      const den=z===1?clamp(getMaxRoadClass(x,y,3),1,5):undefined;
      const kk=cell.office?2:z;
      cell.bld={k:kk,lv:1,v:ri(4),age:0,pw:true,h:.6,den};
      spawns++;sPop();
    }
  }
  // 升級
  for(let i=0;i<N*N;i++){
    const b=tiles[i].bld;
    if(!b||b.k>3)continue;
    b.age++;
    const x=i%N,y=(i/N)|0;
    const schoolBoost=(b.k===1&&COV.school[i]>0)?1.6:1;   // T61：學校半徑8覆蓋（原 countNear k===7）
    const libraryBoost=(b.k===1&&COV.library[i]>0)?1.25:1; // T61：圖書館半徑6覆蓋（原 countNear k===14）
    // T87：大學覆蓋升級加成 1.8（僅住宅；有大學時覆蓋學校 1.6）
    const uniBoost=(b.k===1&&COV.university&&COV.university[i]>0)?1.8:1;
    const eduBoost=uniBoost>1?uniBoost:schoolBoost;
    if(b.lv<3&&b.pw&&(b.lv!==2||b.wa)&&!b.fire&&b.age>14&&dem[b.k]>.15&&(b.k!==1||b.h>.45)&&R()<.035*eduBoost*libraryBoost){ // 供水閘門僅升 Lv3 需水（FIX-A/T31）
      b.lv++;b.age=0;b.v=ri(4);if(b.den===undefined)b.den=3;
    }
  }
  // 火災（升級段之後）：起火→蔓延→推進燃燒/燒毀成焦土
  const burning=[];
  for(let i=0;i<N*N;i++){const b=tiles[i].bld;if(b&&b.k<=3&&b.fire)burning.push(i);}
  let fireAlert=false;
  for(let i=0;i<N*N;i++){                                // 起火擲骰（未燃 k≤3）
    const b=tiles[i].bld;
    if(!b||b.k>3||b.fire)continue;
    let p=.0005*(b.k===3?3:1)*b.lv;
    const x=i%N,y=(i/N)|0;                               // 消防局半徑 9 覆蓋 → 起火率 -85%
    if((COV.fire[i]>0||(COV.fire2&&COV.fire2[i]>0)))p*=.15;                             // T61：消防局半徑9覆蓋（原 countNear k===6）
    if(R()<p){
      b.fire=1;
      if(!fireAlert){toast('🔥 '+townName+'發生火災！點擊燃燒的建築滅火','bad');sErr();fireAlert=true;}
    }
  }
  for(const i of burning){                               // 蔓延：20% 點燃 Chebyshev 1 內未燃建築
    if(R()<.20){
      const x=i%N,y=(i/N)|0,opts=[];
      for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
        if(!dx&&!dy)continue;
        const nx=x+dx,ny=y+dy;
        if(!inMap(nx,ny))continue;
        const nb=T(idx(nx,ny)).bld;
        if(nb&&nb.k<=3&&!nb.fire)opts.push(nb);
      }
      if(opts.length)opts[ri(opts.length)].fire=1;
    }
  }
  let fireOut=false;
  for(const i of burning){                               // 推進燃燒天數；消防局覆蓋→撲滅；fire>=5 燒毀成焦土
    const t=tiles[i],b=t.bld;
    if(!b||!b.fire)continue;
    const x=i%N,y=(i/N)|0;
    if((COV.fire[i]>0||(COV.fire2&&COV.fire2[i]>0))){                                   // T61：消防局半徑9覆蓋 → 次日自動撲滅（原 countNear k===6）
      b.fire=0;
      if(!fireOut){toast('🚒 消防隊撲滅了火災','gold');fireOut=true;}
      continue;
    }
    b.fire++;
    if(b.fire>=5){t.bld=null;t.ruin=1;}                  // zone 保留
  }
  // 犯罪（T32）：未受警察局半徑10覆蓋的 k≤3 建築每天小機率發生犯罪
  let crimeAlert=false;
  for(let i=0;i<N*N;i++){
    const b=tiles[i].bld;
    if(!b||b.k>3||b.crime)continue;
    const x=i%N,y=(i/N)|0;
    if(COV.police[i]>0)continue; // T61：警察局半徑10覆蓋則受保護（原 countNear k===11）
    if(!(COV.prison&&COV.prison[i]>0)&&R()<.001*(b.k===2?2:1)*b.lv){ // T67：監獄半徑8覆蓋則防犯罪（原 countNear k===31，O(N)→O(1)）
      b.crime=1;
      if(!crimeAlert){toast('🚓 '+townName+'發生犯罪！點擊受害建築處理','bad');sErr();crimeAlert=true;}
    }
  }
  // 廢棄（T71）：犯罪持續未被玩家處理（crimeBtn/GV.clearCrime）滿 15 天後每天 5% 機率轉為廢棄；
  // 廢棄建築的停稅由既有經濟段 `!b.abandoned` 判定（原已預留，本卡補上唯一賦值來源）
  let abandonAlert=false;
  for(let i=0;i<N*N;i++){
    const b=tiles[i].bld;
    if(!b||b.k>3||!b.crime||b.abandoned)continue;

  // 生病（T33/T34）：未受健康設施覆蓋的住宅每天小機率生病；醫院覆蓋內次日康復，診所覆蓋內每天50%機率康復
  let sickAlert=false;
  for(let i=0;i<N*N;i++){
    const b=tiles[i].bld;
    if(!b||b.k!==1)continue;

    const clinic=COV.clinic[i]>0;
    const covered=hospital||clinic;
    if(b.sick){

      else if(clinic&&R()<.5)b.sick=0; // 診所覆蓋 → 50% 機率康復

    }
    if(!covered&&R()<.001*b.lv){
      b.sick=1;
      if(!sickAlert){toast('🏥 '+townName+'爆發疾病！點擊生病住宅處理','bad');sErr();sickAlert=true;}
    }
  }
  // 生病→死亡轉化（T38）：sick≥3 天未康復每天 10% 轉死亡
  let deathAlert=false;
  for(let i=0;i<N*N;i++){
    const b=tiles[i].bld;
    if(!b||b.k!==1||!b.sick||b.death)continue;
    b.sickDays=(b.sickDays||0)+1;
    if(b.sickDays>=3&&R()<.10){
      b.death=1;b.deathAge=0;b.sick=0;b.sickDays=0;
      if(!deathAlert){toast('💀 發生憾事！請增設健康設施或墓園','bad');sErr();deathAlert=true;}
    }
  }
  // 經濟
  let income=0,upkeep=0,roads=0,parks=0,plants=0,bridges=0,nI=0,taxR=0,taxC=0,taxI=0,fireStations=0,policeStations=0,hospitals=0;
  let stations=0,ports=0,airports=0,parkingLots=0,tramStations=0,farms=0,ranches=0,landmarks=0,solars=0,winds=0,sewages=0,ambulances2=0,recyclings=0,fireStation2s=0,prisons=0,universities=0;
  for(let i=0;i<N*N;i++){
    const t=tiles[i];
    if(t.road)roads++;
    if(t.bridge)bridges++;
    const b=t.bld;
    if(!b)continue;
    if(b.ref)continue;                // 多格建築 ref 格不參與經濟（T22）
    if(b.k===3)nI++;
    if(b.k===4)parks++;
    else if(b.k===5)plants++;
    else if(b.k===6)fireStations++;
    else if(b.k===11)policeStations++; // 警察局計數（T32）
    else if(b.k===12)hospitals++;      // 醫院計數（T33）
    else if(b.k===14);                // 圖書館已在首迴圈計數（T35，FIX-A：勿重計避免維護費×2）
    else if(b.k===15);                // 郵局已在首迴圈計數（T36，FIX-A：勿重計避免維護費×2）
    else if(b.k===10);                // 水塔已在上方計數（T31）
    else if(b.k===7);                 // 學校已在首迴圈計數（T15，FIX-A：排除幽靈工業稅）
    else if(b.k===13);                // 診所已在首迴圈計數（T34，FIX-A：排除幽靈工業稅）
    else if(b.k===16);                // 墓園已在首迴圈計數（T38，FIX-A：排除幽靈工業稅）
    else if(b.k===8);                 // 垃圾場已在上方計數 dumps，此處明確排除，不參與稅收（T19，鑑於 T15 教訓）
    else if(b.k===9);                 // 體育場（root）維護另計、不參與稅收（T22，鑑於 T15 教訓）
    else if(b.k===17);                // 火車站（T39）
    else if(b.k===18);                // 港口（T40）
    else if(b.k===19);                // 機場（T41）
    else if(b.k===20);                // 停車場（T43）
    else if(b.k===21);                // 輕軌站（T44）
    else if(b.k===22);                // 農場（T46）
    else if(b.k===23);                // 牧場（T46）
    else if(b.k===24);                // 地標（T47）
    else if(b.k===25);                // 太陽能（T48）
    else if(b.k===26);                // 風力（T48）
    else if(b.k===27);                // 污水廠（T49）
    else if(b.k===28);                // 救護站（T50）
    else if(b.k===29);                // 回收中心（T51）
    else if(b.k===30);                // 高級消防（T52）
    else if(b.k===31);                // 監獄（T53）
    else if(b.k===32);                // 大學（T54）
    else if(b.pw&&!b.fire&&!b.sick&&!b.death&&!b.abandoned){
      const pm=pol||{taxR:1,taxC:1,taxI:1};
      if(b.k===1){const v2=POPS[b.lv]*.12*(pm.taxR||1);income+=v2;taxR+=v2;}
      else if(b.k===2){const bx=i%N,byy=(i/N)|0;const rc=getMaxRoadClass(bx,byy,1);let mult=(1+rc*.08)*(COV.bus[i]>0?1.1:1)*(COV.post[i]>0?1.15:1)*((COV.parking&&COV.parking[i]>0)?1.1:1);if(tourists>0)mult*=1+Math.min(.2,tourists/500);const v2=JOBSC[b.lv]*.18*mult*(pm.taxC||1);income+=v2;taxC+=v2;}
      else{const v2=JOBSI[b.lv]*.15*(pm.taxI||1);income+=v2;taxI+=v2;}
    }
  }
  let roadUpkeep=0;
  for(let i=0;i<N*N;i++){const t=tiles[i];if(t.road)roadUpkeep+=ROAD_UPKEEP[(t.rc||2)-1];}
  upkeep=roadUpkeep+parks*.5+plants*4+fireStations*3+policeStations*4+hospitals*5+clinics*2.5+schools*2.5+libraries*2+posts*3+cemeteries*2+dumps*2+stadiums*8+waterTowers*3+st*6+po*5+ai*25+pa*1.5+tr*4+fa*1+ra*1.5+la*8+so*1+wi*1.5+se*3+am*4+rc*2+fs2*6+pr*5+un*8; // T39-T54 維護費（T95：am 3→4，同步 COST.ambulance 調整）
  fin={taxR,taxC,taxI,upR:roadUpkeep,upP:parks*.5,upE:plants*4,upPol:policeStations*4,upH:hospitals*5,upC:clinics*2.5,upL:libraries*2,upPo:posts*3,upCe:cemeteries*2,upW:waterTowers*3,net:income-upkeep};
  money+=income-upkeep;
  region={stations:st,ports:po,airports:ai,powerCap:computePower(),food:foodPoints,tourists,ver:GAME_VER};
  // T88 挑戰檢查
  if(challenge){
    if(challenge.id==='pop1k'&&pop>=1000){toast('🏁 挑戰完成：人口1000！+$'+challenge.bonus,'gold');money+=challenge.bonus;challenge=null;sFanfare();}
    else if(challenge.id==='day200'&&day>=200&&money>=5000){toast('🏁 挑戰完成：200天金庫！+$'+challenge.bonus,'gold');money+=challenge.bonus;challenge=null;sFanfare();}
    else if(challenge.id==='star3'&&bestStar>=3){toast('🏁 挑戰完成：三星城市！+$'+challenge.bonus,'gold');money+=challenge.bonus;challenge=null;sFanfare();}
  }
  // 貸款還款（T16）
  if(loan){money-=loan.daily;if(--loan.remain<=0){loan=null;toast('🏦 貸款已還清！','gold');}}
  // 里程碑
  if(msIdx<MILES.length&&pop>=MILES[msIdx][0]){
    const bonus=MILES[msIdx][1];money+=bonus;
    toast(`🎉 人口突破 ${MILES[msIdx][0]}！獎勵 $${bonus}`,'gold');
    sFanfare();msIdx++;
  }
  // 成就
  for(const a of ACHS){
    if(ach[a.id])continue;
    if(a.t({bridges,parks,plants,nI})){
      ach[a.id]=1;
      toast(`🏆 成就解鎖：${a.nm}`,'gold');sFanfare();
    }
  }
  // 城市評分（T25）：幸福40＋就業率25＋消防覆蓋15＋垃圾10＋教育10 → 0~100 分、0~5 星；人口<50 不評分
  if(pop<50){
    score=-1;cityStar=-1;
  }else{
    let fireCoverN=0,fireTotalN=0,schoolCoverN=0,schoolTotalN=0;
    for(let i=0;i<N*N;i++){
      const b=tiles[i].bld;
      if(!b||b.k>3||b.ref)continue;
      const x=i%N,y=(i/N)|0;
      fireTotalN++;
      if((COV.fire[i]>0||(COV.fire2&&COV.fire2[i]>0)))fireCoverN++;                     // T61：消防局半徑9覆蓋（原 countNear k===6）
      if(b.k===1){
        schoolTotalN++;
        if(COV.school[i]>0)schoolCoverN++;               // T61：學校半徑8覆蓋（原 countNear k===7）
      }
    }
    const happyScore=cityHappy*40;
    const jobScore=Math.min(jobs/Math.max(1,pop*.6),1)*25;
    const fireScore=fireTotalN>0?(fireCoverN/fireTotalN)*15:15;
    const garbScore=typeof garbRatio!=='number'?10:(garbRatio<=1?10:Math.max(0,10-(garbRatio-1)*20));
    const eduScore=schoolTotalN>0?(schoolCoverN/schoolTotalN)*10:10;
    score=clamp(happyScore+jobScore+fireScore+garbScore+eduScore,0,100);
    cityStar=clamp(Math.floor(score/18),0,5);
    scoreParts={happy:happyScore,job:jobScore,fire:fireScore,garb:garbScore,edu:eduScore};
    if(cityStar>bestStar){
      const bonus=cityStar*500;
      money+=bonus;
      toast(`⭐ ${townName}升為 ${cityStar} 星城市！獎勵 $${bonus}`,'gold');
      sFanfare();
      bestStar=cityStar;
    }
  }
  // 紓困保底（避免卡死）
  if(money<20&&income-upkeep<=0&&day-bailoutDay>60){
    money+=250;bailoutDay=day;
    toast('🏦 小鎮銀行送來 $250 紓困金（也可到 📊 面板貸款）','gold');
  }
  checkHints(plants,roads);
}

   6. 小車與煙
===================================================================== */
const cars=[],smokes=[];
function roadDirs(x,y){
  const t=T(idx(x,y));const out=[];
  if(t.mask&1)out.push(0);if(t.mask&2)out.push(1);
  if(t.mask&4)out.push(2);if(t.mask&8)out.push(3);
  return out;
}
const DIRV=[[0,-1],[1,0],[0,1],[-1,0]];
function updCars(dt){
  const target=clamp(Math.floor(pop/45),0,32);
  if(cars.length<target&&Math.random()<.1){
    // 隨機找條路
    for(let tries=0;tries<30;tries++){
      const x=ri(N),y=ri(N);
      const t=T(idx(x,y));
      if(t.road&&t.mask){
        let ds=roadDirs(x,y);
        if(t.oneway>=1&&t.oneway<=4){const od=t.oneway-1;if(ds.includes(od))ds=[od];} // T77：出生於單行道須順向
        const d=ds[ri(ds.length)];
        cars.push({x,y,d,p:Math.random(),ci:ri(SPR.car.length)});
        break;
      }
    }
  }
  for(let i=cars.length-1;i>=0;i--){
    const c=cars[i];
    if(!inMap(c.x,c.y)||!T(idx(c.x,c.y)).road){cars.splice(i,1);continue;}
    const tcar=T(idx(c.x,c.y));let speed=tcar.road?ROAD_SPEED[(tcar.rc||2)-1]:1.0;
    // T74 擁堵：鄰近車多則降速
    let nearC=0;for(const o of cars)if(o!==c&&Math.abs(o.x-c.x)+Math.abs(o.y-c.y)<=1)nearC++;
    if(nearC>=2)speed*=.55;
    if(tcar.light)speed*=.5; // T78：號誌路口增速減半
    if(tcar.busLane)speed*=1.05;
    c.p+=dt*1.4*speed;
    if(c.p>=1){
      c.p-=1;
      c.x+=DIRV[c.d][0];c.y+=DIRV[c.d][1];
      if(!inMap(c.x,c.y)||!T(idx(c.x,c.y)).road){cars.splice(i,1);continue;}
      const tc=T(idx(c.x,c.y));
      let ds=roadDirs(c.x,c.y);
      if(!ds.length){cars.splice(i,1);continue;}
      // T77 單行道：1=N 2=E 3=S 4=W 對應 d 0..3
      if(tc.oneway>=1&&tc.oneway<=4){const od=tc.oneway-1;if(ds.includes(od))ds=[od];}
      const rev=(c.d+2)%4;
      const fwd=ds.filter(d=>d!==rev);
      c.d=fwd.length?fwd[ri(fwd.length)]:rev;
    }
  }
  const capC=Math.floor((target+4)*(quality===0?.5:quality===2?1.4:1));
  if(cars.length>capC)cars.length=capC;
}
let smokeAcc=0;
function updSmoke(dt){
  smokeAcc+=dt;
  const spawn=smokeAcc>.45;
  if(spawn)smokeAcc=0;
  if(spawn&&smokes.length<130){
    for(let y=0;y<N;y++)for(let x=0;x<N;x++){
      const t=T(idx(x,y)),b=t.bld;
      if(!b)continue;
      let offs=null,dark=false;
      if(b.k===3&&b.lv>=2&&b.pw)offs=SPR.bld[b.k+'_'+b.lv+'_'+b.v].smoke;
      if(b.k===5){offs=SPR.plant.smoke;dark=true;}
      if(!offs||!offs.length)continue;
      if(Math.random()<.5)continue;
      const o=offs[ri(offs.length)];
      const wx=(x-y)*32+o.dx, wy=(x+y)*16+32+o.dy;
      smokes.push({wx,wy,age:0,life:(2.2+Math.random())*(weather?.6:1),dark,dep:x+y});
    }
  }
  for(let i=smokes.length-1;i>=0;i--){
    const s=smokes[i];
    s.age+=dt;s.wy-=dt*14;s.wx+=dt*6;
    if(s.age>s.life)smokes.splice(i,1);
  }
}
/* ---------- 公車系統（T26；獨立於 cars 隨機遊走，站點間 BFS 巡迴）---------- */
const buses=[];
let busList=[];                                    // 站點 tile idx 升序表（每次 updBuses 重建）
function rebuildBusList(){
  busList.length=0;
  for(let i=0;i<N*N;i++)if(tiles[i].bus)busList.push(i);
}
function busNextStop(fromIdx){                      // 環狀輪詢：fromIdx 之後的下一站
  if(!busList.length)return -1;
  for(const s of busList)if(s>fromIdx)return s;
  return busList[0];
}
function busDir(x0,y0,x1,y1){
  const dx=x1-x0,dy=y1-y0;
  for(let d=0;d<4;d++)if(DIRV[d][0]===dx&&DIRV[d][1]===dy)return d;
  return 0;
}
// 沿道路 BFS 最短路（含高速）；回傳 [[x,y]...] 起→迄（含端點），無路回 null
function busBFS(sx,sy,gx,gy){
  if(!inMap(sx,sy)||!inMap(gx,gy))return null;
  if(!T(idx(sx,sy)).road||!T(idx(gx,gy)).road)return null;
  const start=idx(sx,sy),goal=idx(gx,gy);
  if(start===goal)return[[sx,sy]];
  const prev=new Int32Array(N*N).fill(-1);
  const seen=new Uint8Array(N*N);
  const q=[start];seen[start]=1;
  let head=0,found=false;
  while(head<q.length){
    const cur=q[head++];
    if(cur===goal){found=true;break;}
    const cx=cur%N,cy=(cur/N)|0;
    for(const[dx,dy]of DIRV){
      const nx=cx+dx,ny=cy+dy;
      if(!inMap(nx,ny))continue;
      const j=idx(nx,ny);
      if(seen[j]||!T(j).road)continue;
      seen[j]=1;prev[j]=cur;q.push(j);
    }
  }
  if(!found)return null;
  const path=[];
  for(let c=goal;c!==-1;c=prev[c])path.push([c%N,(c/N)|0]);
  path.reverse();
  return path;
}
function busPlanNext(bus){                          // 由目標站起連續嘗試，跳過不可達站；成功回 true
  let g=busNextStop(bus.stop),tries=0;
  while(g>=0&&tries<busList.length){
    if(tiles[g]&&tiles[g].bus){
      const path=busBFS(bus.x,bus.y,g%N,(g/N)|0);
      if(path&&path.length>1){bus.path=path;bus.pi=0;bus.p=0;bus.stop=g;return true;}
    }
    g=busNextStop(g);tries++;
  }
  return false;
}
function busReplan(bus){                            // 目標不變、路斷重算；失敗回 false
  if(!(tiles[bus.stop]&&tiles[bus.stop].bus))return false;
  const path=busBFS(bus.x,bus.y,bus.stop%N,(bus.stop/N)|0);
  if(path&&path.length>1){bus.path=path;bus.pi=0;bus.p=0;return true;}
  return false;
}
function updBuses(dt){
  rebuildBusList();
  const nStop=busList.length;
  const target=nStop>=2?Math.min(nStop-1,4):0;       // ≥2 站才發車，最多 4 輛
  while(buses.length<target){
    const s=busList[ri(busList.length)];
    buses.push({x:s%N,y:(s/N)|0,stop:s,path:null,pi:0,p:0,d:0,wait:1});
  }
  if(buses.length>target)buses.length=target;
  if(!target)return;
  for(const bus of buses){
    if(!inMap(bus.x,bus.y)||!T(idx(bus.x,bus.y)).road){ // 所在路被拆→重生於某站
      const s=busList[ri(busList.length)];
      bus.x=s%N;bus.y=(s/N)|0;bus.stop=s;bus.path=null;bus.pi=0;bus.p=0;bus.wait=1;bus.d=0;
      continue;
    }
    if(bus.wait>0){bus.wait-=dt;continue;}            // 到站停 1s
    if(bus.path&&!(tiles[bus.stop]&&tiles[bus.stop].bus)){bus.path=null;bus.p=0;} // 目標站被拆→改選
    if(!bus.path){
      if(!busPlanNext(bus))bus.wait=1;                // 全站不可達→稍後再試
      continue;
    }
    const ct=T(idx(bus.x,bus.y));
    bus.p+=dt*1.1*(ct&&ct.hw?1.6:1)*(ct&&ct.busLane?1.3:1); // 1.1 格/s，高速×1.6，公車道×1.3（T76）
    let guard=0;
    while(bus.p>=1&&guard++<64){
      const nxt=bus.path[bus.pi+1];
      if(!nxt||!inMap(nxt[0],nxt[1])||!T(idx(nxt[0],nxt[1])).road){ // 下一格不可走→重算
        bus.p=0;
        if(!busReplan(bus))bus.path=null;
        break;
      }
      bus.p-=1;
      bus.d=busDir(bus.x,bus.y,nxt[0],nxt[1]);
      bus.x=nxt[0];bus.y=nxt[1];bus.pi++;
      if(bus.pi>=bus.path.length-1){                 // 抵達目標站→停靠
        bus.path=null;bus.p=0;bus.wait=1;
        break;
      }
    }
  }
}

   7. 繪製
===================================================================== */
const stars=[];
for(let i=0;i<90;i++)stars.push([Math.random(),Math.random()*.8,Math.random()*6.28]);
let waterF=0,waterT=0;
const DIRSCR=[[4,-2],[4,2],[-4,2],[-4,-2]];   // 各行進方向的螢幕向量（車頭燈用）
// 天氣雨粒子（螢幕空間池，重用，上限 240；暴雨密度×2；T17）
const rain=[];
function updRain(dt){
  if(!weather){if(rain.length)rain.length=0;return;}
  const win=inWinter();                       // 冬季：雪花直落＋隨 visT 微擺；非冬季：斜雨（T18）
  const cap=weather===2?240:120;
  const f=dt*60;                              // 以 60fps 為基準的幀係數（後備迴圈 dt 大時等比加速）
  const vx=(win?Math.sin(visT*.8)*1.4:-1.2)*cam.z*f, vy=(win?6:14)*cam.z*f; // 斜向下落／雪花直落
  while(rain.length<cap)rain.push({x:Math.random()*(W+240)-40,y:Math.random()*H});
  if(rain.length>cap)rain.length=cap;         // 暴雨轉小雨→截斷
  for(const p of rain){
    p.x+=vx;p.y+=vy;
    if(p.y>H||p.x<-40){p.x=Math.random()*(W+240)-40;p.y=-Math.random()*40;} // 落出畫面回收到頂端
  }
}
function drawRain(z){
  if(inWinter()){                             // 冬季雪花：2×2 白點（T18）
    const s=Math.max(2,Math.round(2*z));
    ctx.fillStyle='rgba(255,255,255,.85)';
    for(const p of rain)ctx.fillRect(p.x,p.y,s,s);
    return;
  }
  const w=z,L=Math.max(2,Math.round(2*z));
  ctx.fillStyle='rgba(200,220,255,.5)';
  for(const p of rain){                       // 2 段偏轉 fillRect＝斜向雨絲（配合 vx<0,vy>0）
    ctx.fillRect(p.x,p.y,w,L);
    ctx.fillRect(p.x-w,p.y+L,w,L);
  }
}

function easeOutBack(t){
  const c1=1.70158,c3=c1+1;
  return t>=1?1:1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2);
}
function daylight(){
  const ph=(visT%CYCLE)/CYCLE;             // 0..1，0.25 日出 0.75 日落
  const d=Math.max(0,Math.sin((ph-.25)*Math.PI*2));
  const b=.34+.66*Math.pow(d,.7);
  const dusk=(d>0&&d<.30)?(0.30-d)/.30:0;
  return {b,dusk,ph};
}
/* ---------- T63-T66 列車/貨船/輕軌/救護車 ---------- */
function railDirs(x,y){
  const t=T(idx(x,y));if(!t.rail&&!t.tram)return [];
  const ds=[];
  if(inMap(x,y-1)&&(T(idx(x,y-1)).rail||T(idx(x,y-1)).tram))ds.push(0);
  if(inMap(x+1,y)&&(T(idx(x+1,y)).rail||T(idx(x+1,y)).tram))ds.push(1);
  if(inMap(x,y+1)&&(T(idx(x,y+1)).rail||T(idx(x,y+1)).tram))ds.push(2);
  if(inMap(x-1,y)&&(T(idx(x-1,y)).rail||T(idx(x-1,y)).tram))ds.push(3);
  return ds;
}
function listBldK(k){
  const a=[];for(let i=0;i<N*N;i++){const b=tiles[i].bld;if(b&&!b.ref&&b.k===k)a.push(i);}return a;
}
function updTrains(dt){
  const sts=listBldK(17);
  const target=sts.length>=2?Math.min(3,sts.length-1):0;
  while(trains.length<target){
    const si=sts[ri(sts.length)],x=si%N,y=(si/N)|0;
    const ds=[];                                             // T63 FIX-F：站牌本身無 rail 旗標，不可用 railDirs(x,y)（其首行要求自身即為 rail 才回傳鄰邊，站牌恆回空陣列致列車永不生成）；改為直接掃描站牌四鄰的 rail 格
    if(inMap(x,y-1)&&T(idx(x,y-1)).rail)ds.push(0);
    if(inMap(x+1,y)&&T(idx(x+1,y)).rail)ds.push(1);
    if(inMap(x,y+1)&&T(idx(x,y+1)).rail)ds.push(2);
    if(inMap(x-1,y)&&T(idx(x-1,y)).rail)ds.push(3);
    if(!ds.length)break;
    const d0=ds[ri(ds.length)];
    trains.push({x:x+DIRV[d0][0],y:y+DIRV[d0][1],d:d0,p:0}); // 生在鄰接的軌道格（站牌格本身不可行走）
    if(trains.length>=target)break;
  }
  for(let i=trains.length-1;i>=0;i--){
    const c=trains[i];
    if(!inMap(c.x,c.y)||!T(idx(c.x,c.y)).rail){trains.splice(i,1);continue;}
    c.p+=dt*1.1;if(c.p<1)continue;c.p-=1;
    c.x+=DIRV[c.d][0];c.y+=DIRV[c.d][1];
    if(!inMap(c.x,c.y)||!T(idx(c.x,c.y)).rail){trains.splice(i,1);continue;}
    const ds=railDirs(c.x,c.y);if(!ds.length){trains.splice(i,1);continue;}
    const rev=(c.d+2)%4;const fwd=ds.filter(d=>d!==rev);c.d=fwd.length?fwd[ri(fwd.length)]:rev;
  }
  if(trains.length>target)trains.length=target;
}
function updTrams(dt){
  const sts=listBldK(21);
  const target=sts.length>=2?Math.min(4,sts.length):0;
  while(tramCars.length<target){
    const si=sts[ri(sts.length)],x=si%N,y=(si/N)|0;
    const ds=[];                                             // T65：仿 T63 FIX-F，站牌本身無 tram 旗標，不可用 railDirs(x,y)（其首行要求自身即帶 tram 才回傳鄰邊，站牌恆回空陣列致電車永不生成）；改為直接掃描站牌四鄰的 tram 格
    if(inMap(x,y-1)&&T(idx(x,y-1)).tram)ds.push(0);
    if(inMap(x+1,y)&&T(idx(x+1,y)).tram)ds.push(1);
    if(inMap(x,y+1)&&T(idx(x,y+1)).tram)ds.push(2);
    if(inMap(x-1,y)&&T(idx(x-1,y)).tram)ds.push(3);
    if(!ds.length)break;
    const d0=ds[ri(ds.length)];
    tramCars.push({x:x+DIRV[d0][0],y:y+DIRV[d0][1],d:d0,p:0}); // 生在鄰接的軌道格（站牌格本身不可行走）
    if(tramCars.length>=target)break;
  }
  for(let i=tramCars.length-1;i>=0;i--){
    const c=tramCars[i];
    if(!inMap(c.x,c.y)||!T(idx(c.x,c.y)).tram){tramCars.splice(i,1);continue;}
    c.p+=dt*1.3;if(c.p<1)continue;c.p-=1;
    c.x+=DIRV[c.d][0];c.y+=DIRV[c.d][1];
    if(!inMap(c.x,c.y)||!T(idx(c.x,c.y)).tram){tramCars.splice(i,1);continue;}
    const ds=railDirs(c.x,c.y);if(!ds.length){tramCars.splice(i,1);continue;}
    const rev=(c.d+2)%4;const fwd=ds.filter(d=>d!==rev);c.d=fwd.length?fwd[ri(fwd.length)]:rev;
  }
  if(tramCars.length>target)tramCars.length=target;
}
function updShips(dt){
  let ports=0;const dks=[];
  for(let i=0;i<N*N;i++){if(tiles[i].dock)dks.push(i);const b=tiles[i].bld;if(b&&!b.ref&&b.k===18)ports++;}
  const target=(ports>0&&dks.length>0)?Math.min(3,ports+1):0;
  while(cargoShips.length<target&&dks.length){ // T64：出生點改在碼頭格（dock 恆為水面，見 canPlace 'dock' 判定），符合「鄰近 dock/port」
    const di=dks[ri(dks.length)];
    cargoShips.push({x:di%N,y:(di/N)|0,d:ri(4),p:Math.random()});
  }

    const c=cargoShips[i];
    if(!inMap(c.x,c.y)||T(idx(c.x,c.y)).t!==0){cargoShips.splice(i,1);continue;}
    c.p+=dt*.35;if(c.p<1)continue;c.p-=1;
    const nx=c.x+DIRV[c.d][0],ny=c.y+DIRV[c.d][1];
    if(inMap(nx,ny)&&T(idx(nx,ny)).t===0){c.x=nx;c.y=ny;}else c.d=ri(4);
  }

}
function updAmbulances(dt){
  const sts=listBldK(28);const sick=[];
  for(let i=0;i<N*N;i++){const b=tiles[i].bld;if(b&&b.k===1&&b.sick)sick.push(i);}
  const target=sts.length&&sick.length?Math.min(2,sts.length):0;
  while(ambulances.length<target&&sick.length){
    const si=sts[ri(sts.length)],ti=sick[ri(sick.length)];
    ambulances.push({x:si%N,y:(si/N)|0,p:0,tx:ti%N,ty:(ti/N)|0});
  }
  for(let i=ambulances.length-1;i>=0;i--){
    const c=ambulances[i];c.p+=dt*2.2;if(c.p<1)continue;c.p-=1;
    if(c.x!==c.tx)c.x+=Math.sign(c.tx-c.x);else if(c.y!==c.ty)c.y+=Math.sign(c.ty-c.y);
    if(c.x===c.tx&&c.y===c.ty){const b=T(idx(c.x,c.y)).bld;if(b&&b.k===1){b.sick=0;b.sickDays=0;}ambulances.splice(i,1);}
  }
}


function draw(dt){
  const {b,dusk}=daylight();
  // 天空
  const sky=[Math.round(lerp(13,140,b)),Math.round(lerp(17,195,b)),Math.round(lerp(38,232,b))];
  ctx.fillStyle=`rgb(${sky[0]},${sky[1]},${sky[2]})`;
  ctx.fillRect(0,0,W,H);
  if(b<.62){
    ctx.fillStyle='#fff';
    for(const s of stars){
      const tw=.4+.6*Math.abs(Math.sin(visT*1.5+s[2]));
      ctx.globalAlpha=(0.62-b)/.62*tw;
      ctx.fillRect(Math.floor(s[0]*W),Math.floor(s[1]*H),2,2);
    }
    ctx.globalAlpha=1;
  }
  const z=cam.z;
  // T69 地震震動：純渲染偏移（不寫回 cam.x/y，toTile 等輸入換算不受影響）

  const shakeX=shakeAmp?Math.sin(visT*47)*shakeAmp:0;
  const shakeY=shakeAmp?Math.sin(visT*61+1.3)*shakeAmp*.6:0;

  const win=inWinter();                             // 冬季雪皮切換（T18；一次計算，draw 內零新配置）

      ctx.fillRect(sx+31*z,sy+13*z,2*z,4*z);
    }

      ctx.globalAlpha=1;

  }
  // ---- 物件層（依深度排序） ----
  const objs=[];
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){
    const t=T(idx(x,y));
    if(t.bld&&t.bld.ref)continue;                          // 多格建築只由 root 繪製（T22）
    if(!t.tree&&!t.bld&&!t.deco)continue;
    const sx=sxOf(x,y),sy=syOf(x,y);
    if(!vis(sx,sy))continue;
    const dep=(t.bld&&(t.bld.k===9||t.bld.sz>=2))?((t.bld.ref?x:(t.bld.sz?x+t.bld.sz-1:x+1))+(t.bld.ref?y:(t.bld.sz?y+t.bld.sz-1:y+1))+y*.001):x+y+y*.001; // T39-T60 多格建築深度以 SE 角計
    objs.push({dep,x,y,sx,sy,t});
  }
  for(const c of cars){
    const fx=c.x+DIRV[c.d][0]*c.p, fy=c.y+DIRV[c.d][1]*c.p;
    const wx=(fx-fy)*32, wy=(fx+fy)*16+16;
    objs.push({dep:fx+fy+.01,car:c,wx,wy});
  }
  for(const bs of buses){                                  // 公車（T26）：與小車同深度規則插入 objs
    let fx=bs.x,fy=bs.y;
    const nx=bs.path&&bs.path[bs.pi+1];
    if(nx){fx=bs.x+(nx[0]-bs.x)*bs.p;fy=bs.y+(nx[1]-bs.y)*bs.p;}
    const wx=(fx-fy)*32, wy=(fx+fy)*16+16;
    objs.push({dep:fx+fy+.01,bus:bs,wx,wy,bd:bs.d});
  }
  for(const tr of trains){                                // 火車（T63）：無 BFS 路徑，直接依 d/p 內插，同小車位置公式
    const fx=tr.x+DIRV[tr.d][0]*tr.p, fy=tr.y+DIRV[tr.d][1]*tr.p;
    const wx=(fx-fy)*32, wy=(fx+fy)*16+16;
    objs.push({dep:fx+fy+.01,train:tr,wx,wy,td:tr.d});
  }
  for(const sh of cargoShips){                            // 貨船（T64）：同小車/火車位置內插公式，沿水面 t===0 緩動
    const fx=sh.x+DIRV[sh.d][0]*sh.p, fy=sh.y+DIRV[sh.d][1]*sh.p;
    const wx=(fx-fy)*32, wy=(fx+fy)*16+16;
    objs.push({dep:fx+fy+.01,ship:sh,wx,wy,sd:sh.d});
  }
  for(const tc of tramCars){                              // 輕軌（T65）：同小車/火車位置內插公式，沿 tram 軌緩動
    const fx=tc.x+DIRV[tc.d][0]*tc.p, fy=tc.y+DIRV[tc.d][1]*tc.p;
    const wx=(fx-fy)*32, wy=(fx+fy)*16+16;
    objs.push({dep:fx+fy+.01,tram:tc,wx,wy,trd:tc.d});
  }
  for(const s of smokes)objs.push({dep:s.dep+.02,smoke:s});
  objs.sort((a,b2)=>a.dep-b2.dep);
  const nightSprites=[];
  nightSprites.push(...rdecGlow);
  const bob=Math.sin(visT*5)*2;
  for(const o of objs){
    if(o.car){
      const sx=ox+o.wx*z, sy=oy+o.wy*z;
      const spr=SPR.car[o.car.ci][(o.car.d===0||o.car.d===2)?'A':'B'];
      ctx.drawImage(spr,sx-6*z,sy-5*z,12*z,8*z);
      if(b<.55){
        const v=DIRSCR[o.car.d];
        nightSprites.push({rect:[sx+v[0]*z-z,sy+v[1]*z-z,2*z,2*z]});
      }
      continue;
    }
    if(o.bus){                                             // 公車（T26）：黃車身兩朝向，夜間頭燈同小車
      const sx=ox+o.wx*z, sy=oy+o.wy*z;
      const spr=SPR.bus[(o.bd===0||o.bd===2)?'A':'B'];
      ctx.drawImage(spr,sx-6*z,sy-6*z,12*z,9*z);
      if(b<.55){
        const v=DIRSCR[o.bd];
        nightSprites.push({rect:[sx+v[0]*z-z,sy+v[1]*z-z,2*z,2*z]});
      }
      continue;
    }
    if(o.train){                                           // 火車（T63）：仿公車配方直接 fillRect 組裝（拉長＋換色），不建 SPR、維持任務卡範圍只動 draw
      const sx=ox+o.wx*z, sy=oy+o.wy*z;
      const mir=(o.td===1||o.td===3)?-1:1;
      const pr=(lx,ly,w,h)=>{const mx=mir<0?(20-lx-w):lx;ctx.fillRect(sx-10*z+mx*z,sy-6*z+ly*z,w*z,h*z);};
      ctx.fillStyle='rgba(0,0,0,.3)';pr(2,7,16,1);                           // 落影
      ctx.fillStyle=shade('#8a3a3a',-42);pr(1,6,6,1);pr(7,5,6,1);pr(13,4,6,1); // 暗側（右下斜面）
      ctx.fillStyle='#8a3a3a';pr(1,3,6,3);pr(7,2,6,3);pr(13,1,6,3);           // 車身主色
      ctx.fillStyle='#2b3550';pr(1,4,6,1);pr(7,3,6,1);pr(13,2,6,1);           // 車窗帶
      ctx.fillStyle='#e8dcc0';pr(1,3,6,1);pr(7,2,6,1);pr(13,1,6,1);           // 車頂
      if(b<.55){
        const v=DIRSCR[o.td];
        nightSprites.push({rect:[sx+v[0]*z-z,sy+v[1]*z-z,2*z,2*z]});
      }
      continue;
    }
    if(o.ship){                                            // 貨船（T64）：仿火車配方 fillRect 組裝（船身+甲板貨櫃），不建 SPR、維持任務卡範圍只動 updShips/draw
      const sx=ox+o.wx*z, sy=oy+o.wy*z;
      const mir=(o.sd===1||o.sd===3)?-1:1;
      const pr=(lx,ly,w,h)=>{const mx=mir<0?(20-lx-w):lx;ctx.fillRect(sx-10*z+mx*z,sy-6*z+ly*z,w*z,h*z);};
      ctx.fillStyle='rgba(0,0,0,.25)';pr(1,8,18,1);                            // 落影/船艏波紋
      ctx.fillStyle=shade('#3a5a72',-38);pr(1,6,8,2);pr(9,6,10,2);              // 船體暗側（吃水線下）
      ctx.fillStyle='#3a5a72';pr(0,4,20,2);                                    // 船體主色（甲板下緣）
      ctx.fillStyle='#c8631f';pr(3,2,5,2);pr(11,2,5,2);                        // 甲板貨櫃（橙）
      ctx.fillStyle='#8a95a0';pr(3,1,5,1);pr(11,1,5,1);                        // 貨櫃頂
      if(b<.55){
        const v=DIRSCR[o.sd];
        nightSprites.push({rect:[sx+v[0]*z-z,sy+v[1]*z-z,2*z,2*z]});
      }
      continue;
    }
    if(o.tram){                                            // 輕軌（T65）：仿火車/貨船配方 fillRect 組裝（單節車廂，較火車短），不建 SPR、範圍限 updTrams/draw；核對現狀發現 updTrams 生成/移動已仿 T63 修正入庫，但 draw() 缺對應渲染分支，tramCars 會落到 t.tree 讀取而拋錯（o.t 為 undefined）——本段補齊
      const sx=ox+o.wx*z, sy=oy+o.wy*z;
      const mir=(o.trd===1||o.trd===3)?-1:1;
      const pr=(lx,ly,w,h)=>{const mx=mir<0?(14-lx-w):lx;ctx.fillRect(sx-7*z+mx*z,sy-5*z+ly*z,w*z,h*z);};
      ctx.fillStyle='rgba(0,0,0,.3)';pr(1,6,12,1);                             // 落影
      ctx.fillStyle=shade('#2f8f6f',-40);pr(1,5,5,1);pr(7,4,5,1);              // 暗側（右下斜面）
      ctx.fillStyle='#2f8f6f';pr(1,2,5,3);pr(7,1,5,3);                        // 車身主色（輕軌綠，區別火車暗紅/貨船藍）
      ctx.fillStyle='#dff0ea';pr(1,3,5,1);pr(7,2,5,1);                        // 車窗帶
      if(b<.55){
        const v=DIRSCR[o.trd];
        nightSprites.push({rect:[sx+v[0]*z-z,sy+v[1]*z-z,2*z,2*z]});
      }
      continue;
    }
    if(o.smoke){
      const s=o.smoke;
      const k=s.age/s.life;
      const sz=Math.max(z,Math.round((2+k*4.5)*z));
      ctx.globalAlpha=(1-k)*.5;
      ctx.fillStyle=s.dark?'#9aa0a8':'#d7dce2';
      ctx.fillRect(ox+s.wx*z,oy+s.wy*z,sz,sz);
      ctx.globalAlpha=1;
      continue;
    }
    const t=o.t;
    if(t.tree){
      const s=(win?SPR.treeW:SPR.tree)[(t.tree-1)&3];
      ctx.drawImage(s.img,o.sx+(32-s.ax)*z,o.sy+(32-s.ay)*z,s.w*z,s.h*z);
      continue;
    }
    if(!t.bld&&t.deco){
      const s=SPR.deco[t.deco-1];
      ctx.drawImage(s.img,o.sx+(32-s.ax)*z,o.sy+(32-s.ay)*z,s.w*z,s.h*z);
      continue;
    }
    const bd=t.bld;
    let s;
    if(bd.k===4)s=(win?SPR.parkW:SPR.park)[bd.v];
    else if(bd.k===5)s=SPR.plant;
    else if(bd.k===9)s=SPR.bld['9_1_'+bd.v];
    else if(bd.k===10)s=SPR.waterTower; // 水塔（T31）
    else if(bd.k===11)s=SPR.police; // 警察局（T32）
    else if(bd.k===12)s=SPR.hospital; // 醫院（T33）
    else if(bd.k===13)s=SPR.clinic; // 診所（T34）
    else if(bd.k===1&&bd.lv===3&&bd.den>=4)s=SPR.bld['1_3_4']; // 高密度 Lv3 住宅（T30）
    else s=SPR.bld[bd.k+'_'+bd.lv+'_'+bd.v]||SPR.bld[bd.k+'_'+bd.lv+'_0']; // 變體鍵兜底：舊檔 v 無對應 sprite 時退回 _0（FIX-D）
    let bx,by;
    if(bd.sz&&bd.sz>=2){ // T39-T60 多格建築通用定位：錨點對齊 (x+sz-1, y+sz-1) 底頂點
      const sz=bd.sz;
      bx=sxOf(o.x+sz-1,o.y+sz-1)+(32-s.ax)*z;
      by=syOf(o.x+sz-1,o.y+sz-1)+(32-s.ay)*z;
    }
    else if(bd.k===9){bx=sxOf(o.x+1,o.y+1)+(32-s.ax)*z;by=syOf(o.x+1,o.y+1)+(32-s.ay)*z;}
    else{bx=o.sx+(32-s.ax)*z;by=o.sy+(32-s.ay)*z;}
    ctx.drawImage(s.img,bx,by,s.w*z,s.h*z);
    if(s.night&&(bd.k===5||bd.pw))nightSprites.push({img:s.night,x:bx,y:by,w:s.w*z,h:s.h*z});
    if(bd.k<=3&&bd.fire){                                // 火焰疊加在建築之後，並發光
      const fr=SPR.fire[visT*6&1];
      const fx2=o.sx+(32-fr.ax)*z, fy2=o.sy+(32-fr.ay)*z;
      ctx.drawImage(fr.img,fx2,fy2,fr.w*z,fr.h*z);
      nightSprites.push({img:fr.img,x:fx2,y:fy2,w:fr.w*z,h:fr.h*z});
    }
    if(bd.k===5&&Math.sin(visT*4)>0){
      ctx.fillStyle='#ff4040';
      ctx.fillRect(o.sx+(32+s.lamp.dx)*z,o.sy+(32+s.lamp.dy)*z,2*z,2*z);
    }
    if(bd.k<=3&&!bd.pw){
      ctx.drawImage(SPR.nopow,o.sx+24*z,o.sy+(-52+bob)*z,16*z,20*z);
    }
    if(bd.k<=3&&bd.crime){                                // 犯罪標記：黃底黑驚嘆號（T32）
      ctx.fillStyle='#ffd45f';
      ctx.fillRect(o.sx+26*z,o.sy+(-58+bob)*z,6*z,14*z);
      ctx.fillStyle='#1a1a1a';
      ctx.fillRect(o.sx+28*z,o.sy+(-56+bob)*z,2*z,8*z);
      ctx.fillRect(o.sx+28*z,o.sy+(-46+bob)*z,2*z,2*z);
    }
    if(bd.k===1&&bd.sick){                                 // 生病標記：紅十字（T33）
      ctx.fillStyle='#e05252';
      ctx.fillRect(o.sx+28*z,o.sy+(-56+bob)*z,2*z,10*z);
      ctx.fillRect(o.sx+24*z,o.sy+(-52+bob)*z,10*z,2*z);
    }
    if(bd.k===1&&bd.death){                                // 死亡標記：黑色小十字架（T38）
      ctx.fillStyle='#1a1a1a';
      ctx.fillRect(o.sx+28*z,o.sy+(-58+bob)*z,2*z,12*z);
      ctx.fillRect(o.sx+24*z,o.sy+(-54+bob)*z,10*z,2*z);
    }
  }
  // ---- 天氣色調（雨天壓暗，晝夜 multiply 之前疊加；T17）----
  if(weather){
    ctx.fillStyle=win?'rgba(200,210,230,.14)':weather===2?'rgba(70,90,120,.3)':'rgba(70,90,120,.18)'; // 冬季雪天色調（T18）
    ctx.fillRect(0,0,W,H);
  }
  // ---- 晝夜色調 ----
  if(b<1){
    ctx.globalCompositeOperation='multiply';
    const nc=[110,125,190];
    const col=[0,1,2].map(i=>Math.round(lerp(nc[i],255,b)));
    ctx.fillStyle=`rgb(${col[0]},${col[1]},${col[2]})`;
    ctx.fillRect(0,0,W,H);
    ctx.globalCompositeOperation='source-over';
  }
  if(dusk>0){
    ctx.fillStyle=`rgba(255,145,60,${(dusk*.16).toFixed(3)})`;
    ctx.fillRect(0,0,W,H);
  }
  // ---- 夜間燈光 ----
  if(b<.72){
    const a=clamp((0.72-b)/.5,0,1);
    ctx.globalAlpha=a;
    ctx.globalCompositeOperation='screen';
    for(const nsp of nightSprites){
      if(nsp.img)ctx.drawImage(nsp.img,nsp.x,nsp.y,nsp.w,nsp.h);
      else if(nsp.rect){ctx.fillStyle='#ffe9a0';ctx.fillRect(...nsp.rect);}
    }
    ctx.globalCompositeOperation='source-over';
    ctx.globalAlpha=1;
  }
  // ---- 天氣：雨絲＋閃電（螢幕空間，夜燈之後、游標之前；T17）----
  if(weather)drawRain(z);
  if(flashT>0){
    ctx.fillStyle=`rgba(255,255,255,${Math.min(.85,flashT*2).toFixed(3)})`;
    ctx.fillRect(0,0,W,H);
    flashT=Math.max(0,flashT-dt);
  }
  // ---- 游標／框選預覽 ----
  drawCursor(sxOf,syOf,z);
}
function drawCursor(sxOf,syOf,z){
  if(tool==='pan')return;
  if(rect.on){
    const x0=Math.min(rect.x0,rect.x1),x1=Math.max(rect.x0,rect.x1);
    const y0=Math.min(rect.y0,rect.y1),y1=Math.max(rect.y0,rect.y1);
    let cost=0;
    for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){
      if(!inMap(x,y))continue;
      const ok=!canPlace(tool,x,y);
      ctx.drawImage(ok?SPR.cursor:SPR.cursorBad,sxOf(x,y),syOf(x,y),64*z,32*z);
      if(ok)cost+=placeCost(tool,x,y);
    }
    const dc=$('#dragcost');
    dc.style.display='block';
    dc.textContent='$'+Math.round(cost);
    dc.style.left=(pt.cx+14)+'px';dc.style.top=(pt.cy-30)+'px';
    dc.style.color=cost>money?'#ff9090':'#ffd977';
    return;
  }
  $('#dragcost').style.display='none';
  if(hover.x<0)return;
  const ok=!canPlace(tool,hover.x,hover.y)&&placeCost(tool,hover.x,hover.y)<=money;
  ctx.drawImage(ok?SPR.cursor:SPR.cursorBad,sxOf(hover.x,hover.y),syOf(hover.x,hover.y),64*z,32*z);
}

/* =====================================================================
   8. 輸入（滑鼠＋觸控）
===================================================================== */
const hover={x:-1,y:-1};
const pt={cx:0,cy:0};
const rect={on:false,x0:0,y0:0,x1:0,y1:0};
const pointers=new Map();
let panBase=null,pinchBase=null,paintLast=null,downInfo=null,firstPaint=null,dozeArm=null;
let longPressT=null;
let undoStack=[],undoGroup=null;
const openUndo=()=>{undoGroup={snaps:[],seen:{},spent:0};};
const closeUndo=()=>{if(undoGroup&&undoGroup.snaps.length){undoStack.push(undoGroup);if(undoStack.length>40)undoStack.shift();}undoGroup=null;};

function toTile(cssX,cssY){
  const mx=cssX*DPR,my=cssY*DPR;
  const wx=(mx-(W/2-cam.x*cam.z))/cam.z;
  const wy=(my-(H/2-cam.y*cam.z))/cam.z;
  const fx=(wx/32+wy/16)/2, fy=(wy/16-wx/32)/2;
  return [Math.floor(fx),Math.floor(fy)];
}
function isRectTool(id){return id==='zr'||id==='zc'||id==='zi'||id==='doze'||id==='park'||id==='tree'||id==='fill';}
function paintTo(x,y){
  if(!inMap(x,y))return;
  if(paintLast&&paintLast[0]===x&&paintLast[1]===y)return;
  if(paintLast){ // L 型補間，快速拖曳不斷路
    let[px,py]=paintLast;
    while(px!==x){px+=Math.sign(x-px);if(doPlace(tool,px,py,true))sTick();}
    while(py!==y){py+=Math.sign(y-py);if(doPlace(tool,px,py,true))sTick();}
  }else{
    if(doPlace(tool,x,y,false))sTick();
  }
  paintLast=[x,y];
}
cvs.addEventListener('pointerdown',e=>{
  try{cvs.setPointerCapture(e.pointerId);}catch(err){}
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  initAudio();
  if(pointers.size===2){
    // 進入雙指：取消畫線/框選，改為縮放平移；單指剛誤放的一格退款撤銷
    rect.on=false;paintLast=null;downInfo=null;
    if(firstPaint&&performance.now()-firstPaint.t<400&&firstPaint.spent>0)undoPlace(firstPaint);
    firstPaint=null;
    undoGroup=null;
    const ps=[...pointers.values()];
    pinchBase={d:Math.hypot(ps[0].x-ps[1].x,ps[0].y-ps[1].y),
      cx:(ps[0].x+ps[1].x)/2,cy:(ps[0].y+ps[1].y)/2,
      camX:cam.x,camY:cam.y,acc:0};
    panBase=null;
    return;
  }
  if(pointers.size>2)return;   // 第三指起不觸發任何操作
  const[x,y]=toTile(e.clientX,e.clientY);
  downInfo={x:e.clientX,y:e.clientY,tx:x,ty:y,t:performance.now(),moved:false,btn:e.button};
  if(e.button===1||e.button===2||tool==='pan'){
    panBase={x:e.clientX,y:e.clientY,camX:cam.x,camY:cam.y};
  }else if(isRectTool(tool)){
    rect.on=true;rect.x0=rect.x1=x;rect.y0=rect.y1=y;
    clearTimeout(longPressT);
    longPressT=setTimeout(()=>{           // 長按＝取消框選、改為檢視
      if(rect.on&&downInfo&&!downInfo.moved){
        rect.on=false;paintLast=null;
        inspect(x,y);sTick();
      }
    },550);
  }else{
    openUndo();
    const m0=money;
    paintLast=null;paintTo(x,y);
    firstPaint={x,y,tool,spent:m0-money,t:performance.now()};
  }
});
// 撤銷「單指誤觸、隨即進入雙指縮放」放下的那一格
function undoPlace(f){
  if(!inMap(f.x,f.y))return;
  const t=T(idx(f.x,f.y));
  if(roadToolToRc(f.tool)&&t.road){
    t.road=0;t.rc=0;t.hw=0;t.bridge=0;t.mask=0;
    recalcMask(f.x,f.y-1);recalcMask(f.x+1,f.y);recalcMask(f.x,f.y+1);recalcMask(f.x-1,f.y);
  }else if(f.tool==='plant'&&t.bld&&t.bld.k===5){
    t.bld=null;stampCov('plant',f.x,f.y,COVR.plant,-1); // T61：誤放電廠即時撤銷 → 撤印覆蓋
  }else return;
  money+=f.spent;
  computePower();
}
cvs.addEventListener('pointermove',e=>{
  pt.cx=e.clientX;pt.cy=e.clientY;
  const p=pointers.get(e.pointerId);
  if(p){p.x=e.clientX;p.y=e.clientY;}
  const[x,y]=toTile(e.clientX,e.clientY);
  hover.x=inMap(x,y)?x:-1;hover.y=inMap(x,y)?y:-1;
  if(pointers.size===2&&pinchBase){
    const ps=[...pointers.values()];
    const d=Math.hypot(ps[0].x-ps[1].x,ps[0].y-ps[1].y);
    const cx=(ps[0].x+ps[1].x)/2,cy=(ps[0].y+ps[1].y)/2;
    cam.x=pinchBase.camX-(cx-pinchBase.cx)*DPR/cam.z;
    cam.y=pinchBase.camY-(cy-pinchBase.cy)*DPR/cam.z;
    clampCam();
    pinchBase.acc+=Math.log(d/Math.max(1,pinchBase.d));
    pinchBase.d=d;
    if(pinchBase.acc>.28){zoomStep(1,cx,cy);pinchBase.acc=0;pinchBase.camX=cam.x;pinchBase.camY=cam.y;pinchBase.cx=cx;pinchBase.cy=cy;}
    if(pinchBase.acc<-.28){zoomStep(-1,cx,cy);pinchBase.acc=0;pinchBase.camX=cam.x;pinchBase.camY=cam.y;pinchBase.cx=cx;pinchBase.cy=cy;}
    return;
  }
  if(downInfo&&Math.hypot(e.clientX-downInfo.x,e.clientY-downInfo.y)>6){
    downInfo.moved=true;
    clearTimeout(longPressT);
  }
  if(panBase&&pointers.size===1){
    cam.x=panBase.camX-(e.clientX-panBase.x)*DPR/cam.z;
    cam.y=panBase.camY-(e.clientY-panBase.y)*DPR/cam.z;

  }
  if(rect.on){rect.x1=clamp(x,0,N-1);rect.y1=clamp(y,0,N-1);return;}

function zoomStep(d,cssX,cssY){
  const nz=clamp(cam.z+d,1,4);
  if(nz===cam.z)return;
  const mx=cssX*DPR,my=cssY*DPR;
  const wx=(mx-(W/2-cam.x*cam.z))/cam.z;
  const wy=(my-(H/2-cam.y*cam.z))/cam.z;
  cam.z=nz;
  cam.x=wx-(mx-W/2)/nz;
  cam.y=wy-(my-H/2)/nz;
  clampCam();
  drawMini();
}
function clampCam(){
  const m=N*32;

function commitRect(){
  const x0=Math.min(rect.x0,rect.x1),x1=Math.max(rect.x0,rect.x1);
  const y0=Math.min(rect.y0,rect.y1),y1=Math.max(rect.y0,rect.y1);
  const single=(x0===x1&&y0===y1);
  const hiBld=(x,y)=>{const b=T(idx(x,y)).bld;return !!(b&&b.k<=3&&b.lv>=2);};
  let done=0,cost=0,skippedHi=0;
  // 先估總價，一次判斷
  for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){
    if(!inMap(x,y)||canPlace(tool,x,y))continue;
    if(tool==='doze'&&hiBld(x,y)){
      if(single){
        if(!(dozeArm&&dozeArm.x===x&&dozeArm.y===y&&performance.now()-dozeArm.t<3000)){
          dozeArm={x,y,t:performance.now()};

          return;
        }
        dozeArm=null;
      }else{skippedHi++;continue;}
    }
    cost+=placeCost(tool,x,y);
  }
  if(cost>money){toast('資金不足！需要 $'+Math.round(cost),'bad');sErr();return;}
  openUndo();
  for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){
    if(!inMap(x,y))continue;
    if(tool==='doze'&&hiBld(x,y)&&!single)continue;
    if(doPlace(tool,x,y,true))done++;
  }
  if(skippedHi)toast(`已跳過 ${skippedHi} 棟 Lv2+ 建築（單獨點兩次可拆）`);
  closeUndo();
  if(done){sBuild();}
}

let AC=null;
function initAudio(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}
  if(AC&&AC.state==='suspended')AC.resume();}
function tone(f,dur,type,vol,slide){
  if(!AC||muted)return;
  const o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'square';o.frequency.value=f;
  if(slide)o.frequency.linearRampToValueAtTime(slide,AC.currentTime+dur);
  g.gain.setValueAtTime(vol||.08,AC.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+dur);
  o.connect(g).connect(AC.destination);
  o.start();o.stop(AC.currentTime+dur);
}

// 雷聲（T17）：0.5s 白噪聲 → 低通 400Hz → 音量包絡衰減；遵守 sndMode（muted 時靜音）
function sThunder(){
  if(!AC||muted)return;
  const dur=.5,len=(AC.sampleRate*dur)|0;
  const buf=AC.createBuffer(1,len,AC.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
  const src=AC.createBufferSource();src.buffer=buf;
  const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=400;
  const g=AC.createGain();
  g.gain.setValueAtTime(.4,AC.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+dur);
  src.connect(lp).connect(g).connect(AC.destination);
  src.start();src.stop(AC.currentTime+dur);
}

class AudioComposer{
  constructor(){
    this.curMood=null;     // 目前情緒標籤

  pickMood(){
    if(weather===2)return 'storm';
    if(weather===1)return 'rain';

    if(this.playing)return;

    this.out.connect(AC.destination);
    this._fade(this.out.gain,.001,.30,1.2);

  stop(){
    if(!this.playing)return;
    this.playing=false;
    this._phraseId++;
    if(this.timer){clearTimeout(this.timer);this.timer=null;}
    if(this.out){
      const old=this.out; this.out=null;
      this._fade(old.gain,old.gain.value,.001,1.5,()=>{try{old.disconnect();}catch(e){}});
    }
  }
  update(){
    if(!this.playing)return;
    const m=this.pickMood();
    if(m!==this.curMood)this._crossfadeTo(m);
  }
  _fade(gain,from,to,dur,onDone){
    if(!AC)return;
    const t0=AC.currentTime;
    gain.cancelScheduledValues(t0);
    gain.setValueAtTime(from,t0);
    gain.linearRampToValueAtTime(to,t0+dur);
    if(onDone)setTimeout(onDone,dur*1000+20);
  }
  _crossfadeTo(m){
    const old=this.out;
    this.curMood=m;
    this.out=AC.createGain(); this.out.gain.value=0;
    this.out.connect(AC.destination);
    this._fade(this.out.gain,.001,.30,1.2);
    if(old)this._fade(old.gain,old.gain.value,.001,1.5,()=>{try{old.disconnect();}catch(e){}});
  }
  _schedule(){
    if(!this.playing||!AC)return;
    const phrase=this._buildPhrase();
    const dur=phrase.dur;
    this._phraseId++;
    const pid=this._phraseId;
    this.timer=setTimeout(()=>{if(this.playing&&this._phraseId===pid)this._schedule();},Math.max(50,dur*1000-80));
  }
  _buildPhrase(){
    const m=MOODS[this.curMood]||MOODS.day;
    const scale=SCALES[m.scale];
    const chords=m.chords;
    const beat=m.tempo;
    const prog=chords;
    const now=AC.currentTime;
    const out=this.out;
    let maxT=0;
    const {type,vol,hold,arp,lp,bell}=m;
    for(let c=0;c<prog.length;c++){
      const indices=prog[c];
      const t0=now+c*beat*4;
      if(arp){
        for(let i=0;i<4;i++){
          const noteT=t0+i*beat;
          const idx=indices[i%indices.length];
          this._note(scale[idx],beat*.9,noteT,type,vol,lp,bell,out);
          maxT=Math.max(maxT,noteT+beat);
        }
      }else{
        for(const idx of indices){
          this._note(scale[idx],beat*4*hold,t0,type,vol,lp,bell,out);
          maxT=Math.max(maxT,t0+beat*4*hold);
        }
      }
    }
    // 偶爾加低音鋪底（除 winter 鐘琴外）
    if(!bell&&Math.random()<.6){
      const root=scale[prog[0][0]]/2;
      this._note(root,beat*4*1.5,now,type,vol*.7,lp,true,out);
    }
    return {dur:maxT-now+0.2};
  }
  _note(f,dur,t0,type,vol,lp,bell,out){
    if(!out||!AC)return;
    const o=AC.createOscillator();
    o.type=type; o.frequency.value=f;
    if(bell&&f>220)o.frequency.exponentialRampToValueAtTime(f*1.5,t0+dur);
    const g=AC.createGain();
    g.gain.setValueAtTime(0,t0);
    g.gain.linearRampToValueAtTime(vol,t0+0.02);
    const dec=bell?dur*.35:dur;
    g.gain.exponentialRampToValueAtTime(.001,t0+0.02+dec);
    let last=o;
    if(lp){const ftr=AC.createBiquadFilter();ftr.type='lowpass';ftr.frequency.value=lp;o.connect(ftr);last=ftr;}
    last.connect(g).connect(out);
    o.start(t0); o.stop(t0+dur+.1);
  }
}

function undo(){
  const g2=undoStack.pop();
  if(!g2){toast('沒有可撤銷的操作');return;}
  for(const sn of g2.snaps){
    tiles[sn.i]=JSON.parse(sn.s);
    const x=sn.i%N,y=(sn.i/N)|0;
    recalcMask(x,y);recalcMask(x,y-1);recalcMask(x+1,y);recalcMask(x,y+1);recalcMask(x-1,y);
  }
  money+=g2.spent;
  computePower();
  rebuildCov(); // T61：撤銷還原 tile 快照後全量重建覆蓋場最穩（只在撤銷時付費）
  recalcAllRailMasks(); // 撤銷含鋪軌/拆軌時遮罩一併補算（快照格只重算道路版，軌道走全量最穩）
  if(typeof drawMini==='function')drawMini();
  toast('↩️ 已撤銷（退還 $'+Math.round(g2.spent)+'）');sTick();
}
