// 存檔槽：SAVEKEY.s1/.s2/.s3；目前槽記在 SAVEKEY.slot（預設1）
function slotKey(n){return SAVEKEY+'.s'+n;}
function curSlot(){const n=+localStorage.getItem(SAVEKEY+'.slot');return n>=1&&n<=3?n:1;}
function setSlot(n){localStorage.setItem(SAVEKEY+'.slot',n);}
// 讀某槽概要（給槽位面板用）：{nm,pop,day} 或 null
function slotInfo(n){
  try{
    const raw=localStorage.getItem(slotKey(n));
    if(!raw)return null;
    const d=JSON.parse(raw);
    if(d.v!==1)return null;
    let p=0;for(const b of d.bl||[])if(b[1]===1)p+=POPS[b[2]]||0;
    return{nm:d.nm||'微光小鎮',pop:p,day:d.day||1};
  }catch(e){return null;}
}
function save(){
  try{
    const bl=[];
	    let ter='',tre='',rd='',zn='',dc='',rn='',rc='',rcl='',wp='',el='',bs='',cm='',sk='',dt='',skd='',dtd='';
	    let rl='',rb='',dk='',ow='',tl='',pm='',bln='',tr='',of='',fl='',le='',ab=''; // T39-T60
    for(let i=0;i<N*N;i++){
      const t=tiles[i];
      ter+=t.t;tre+=t.tree;zn+=t.zone;dc+=t.deco;rn+=t.ruin?1:0;rc+=t.rdec?1:0;rcl+=String.fromCharCode(48+(t.rc||0));wp+=t.wp?1:0;el+=t.el?1:0;bs+=t.bus?1:0; // bs：公車站（T26）
      rd+=t.road?(t.hw?(t.bridge?4:3):(t.bridge?2:1)):0; // 0無 1路 2橋 3高速 4高速橋（T21）
      cm+=t.bld&&t.bld.crime?1:0;                        // 犯罪標記（T32）
      sk+=t.bld&&t.bld.sick?1:0;                        // 生病標記（T33）
      dt+=t.bld&&t.bld.death?1:0;                       // 死亡標記（T38）
      skd+=t.bld&&t.bld.sick?(''+Math.min(9,t.bld.sickDays||0)):'0';   // 生病天數（FIX-A，上限9；舊檔缺 skd 容錯）
	      dtd+=t.bld&&t.bld.death?(''+Math.min(9,t.bld.deathAge||0)):'0';  // 死亡天數（FIX-A，上限9；舊檔缺 dtd 容錯）
	      rl+=t.rail?1:0;rb+=t.railBridge?1:0;dk+=t.dock?1:0; // T39-T40
	      ow+=t.oneway||0;tl+=t.light?1:0;pm+=t.parkMeter?1:0; // T42-T43
	      bln+=t.busLane?1:0;tr+=t.tram?1:0;of+=t.office?1:0; // T44-T45
	      fl+=t.flood?1:0;le+=t.levee?1:0;ab+=t.abandoned?1:0; // T56-T58
      if(t.bld&&!t.bld.ref){                             // 多格建築只存 root（T22）
        const e=[i,t.bld.k,t.bld.lv,t.bld.v,t.bld.age];
        if(t.bld.k===9)e.push(t.bld.sz||2);              // k=9：第 6 位存 sz（fire 永不發生在 k=9，無歧義，T22）
        else if(t.bld.fire)e.push(t.bld.fire);
        if(t.bld.k===1&&t.bld.den&&t.bld.den!==3){      // k=1：第 6/7 位存密度 den（T30）
          if(!t.bld.fire)e.push(0);                      // 無火災時補 0 占位，避免 den 誤判為 fire
          e.push(t.bld.den);
        }
        bl.push(e);
      }
    }
    const data={v:1,gameVer:GAME_VER,seed,money:Math.round(money),day,msIdx,
      cam:{x:Math.round(cam.x),y:Math.round(cam.y),z:cam.z},ter,tre,rd,zn,dc,rn,rc,rcl,wp,el,bs,cm,sk,dt,skd,dtd,bl,ach:Object.keys(ach),nm:townName,
      ln:loan?[loan.remain,loan.daily]:null,star:bestStar,
      rl,rb,dk,ow,tl,pm,bln,tr,of,fl,le,ab,pol,region}; // T39-T60 新欄位（可選）
    const key=slotKey(curSlot()),out=JSON.stringify(data);
    const prev=localStorage.getItem(key);
    if(prev)localStorage.setItem(key+'_bak',prev); // 覆寫前備份：主鍵寫毀或多分頁互蓋時可從 _bak 還原
    localStorage.setItem(key,out);
  }catch(e){console.warn('存檔失敗',e);} // 不再靜默吞錯（localStorage setItem 單鍵原子，失敗不留半寫垃圾）
}
// 軌道版全量重算（對照 §4 道路版 recalcAllMasks）：讀檔還原 rl/tr 時 railMask/tramMask 歸零，需一次性補算
function recalcAllRailMasks(){
  for(let y=0;y<N;y++)for(let x=0;x<N;x++)recalcRailMask(x,y);
}
const MSZ={19:4,20:2,22:2,23:2,24:2,25:2,31:2,32:3}; // FIX-J：多格建築 k→sz 對照（與各 doPlace 分支硬編碼一致；k9 體育場沿用存檔第 6 位 sz，不入表）
function load(slot){
  try{
    const key=slotKey(slot||curSlot());
    let d=null;
    try{const raw=localStorage.getItem(key);if(raw)d=JSON.parse(raw);}catch(e){d=null;}
    if(!d||d.v!==1||(d.ter||'').length!==N*N){ // 主鍵缺損 → 先嘗試 _bak 備份（save/import 覆寫前的保險）
      console.warn('主存檔缺損，嘗試 _bak 備份鍵');
      try{const braw=localStorage.getItem(key+'_bak');d=braw?JSON.parse(braw):null;}catch(e){d=null;}
    }
    if(!d||d.v!==1||(d.ter||'').length!==N*N)return false;
    seed=d.seed;R=mulberry32(seed^d.day);
    tiles=new Array(N*N);
    for(let i=0;i<N*N;i++){
      const rv=+d.rd[i]; // 0無 1路 2橋 3高速 4高速橋（舊檔僅 0-2，hw=0 天然相容，T21）
      tiles[i]={t:+d.ter[i],tree:+d.tre[i],gv:i&3,road:rv?1:0,bridge:(rv===2||rv===4)?1:0,hw:rv>=3?1:0,rc:d.rcl?+d.rcl[i]:0,
        mask:0,zone:+d.zn[i],bld:null,rp:false,wp:d.wp?+d.wp[i]:0,wr:false,wm:0,deco:d.dc?+d.dc[i]:0,ruin:d.rn?+d.rn[i]:0,rdec:d.rc?+d.rc[i]:0,
        el:d.el?+d.el[i]:0,em:0,bus:d.bs?+d.bs[i]:0, // bus：公車站（T26，舊檔缺 bs 容錯為 0）
        rail:d.rl?+d.rl[i]:0,railBridge:d.rb?+d.rb[i]:0,railMask:0, // T39
        dock:d.dk?+d.dk[i]:0, // T40
        oneway:d.ow?+d.ow[i]:0,light:d.tl?+d.tl[i]:0, // T42
        parkMeter:d.pm?+d.pm[i]:0,busLane:d.bln?+d.bln[i]:0, // T43-T44
        tram:d.tr?+d.tr[i]:0,tramBridge:0,tramMask:0, // T44
        office:d.of?+d.of[i]:0, // T45
        flood:d.fl?+d.fl[i]:0,levee:d.le?+d.le[i]:0, // T56-T57
        abandoned:d.ab?+d.ab[i]:0 // T58
      };
    }
    for(let i=0;i<N*N;i++)if(tiles[i].road&&!tiles[i].rc)tiles[i].rc=tiles[i].hw?5:2; // 舊檔無 rc：支路=2、原高速=5（T29）
    for(const rec of d.bl){
      const i=rec[0],k=rec[1],lv=rec[2],v=rec[3],age=rec[4];
      let vv=v;if(k!==4&&k!==5&&(k<10||k>13)&&!SPR.bld[k+'_'+lv+'_'+v])vv=0; // 變體鍵正規化：舊檔 v 無對應 SPR.bld 時歸 0（k4/5/10-13 不走 SPR.bld）
      if(k===9){                                         // 體育場：第 6 位是 sz，重建 root＋3 個 ref 格（T22）
        const rx=i%N,ry=(i/N)|0;
        tiles[i].bld={k:9,lv:1,v:vv,age,pw:true,h:1,sz:rec[5]||2};
        for(const[sx,sy]of[[rx+1,ry],[rx,ry+1],[rx+1,ry+1]])
          if(inMap(sx,sy))tiles[idx(sx,sy)].bld={k:9,ref:[rx,ry]};
      }else{
        if(k===1){
          const fireVal=rec.length>=7?rec[5]:(rec.length===6?rec[5]:0);
          const denVal=rec.length>=7?rec[6]:3;
          tiles[i].bld={k,lv,v:vv,age,pw:true,h:.6,fire:fireVal,den:denVal};
        }else tiles[i].bld={k,lv,v:vv,age,pw:true,h:.6,fire:rec[5]||0};
        if(MSZ[k]){tiles[i].bld.sz=MSZ[k];tiles[i].bld.h=1;} // FIX-J：多格建築 root 由 k 反查補 sz（存檔不存，缺 sz 時下方 T39-T60 重建塊會跳過致 ref 格全失）、h 對齊放置端
      }
    }
    if(d.cm)for(let i=0;i<N*N;i++){const b=tiles[i].bld;if(b&&b.k<=3&&+d.cm[i])b.crime=1;} // 犯罪標記（T32，舊檔無 cm 則無犯罪）
    if(d.sk)for(let i=0;i<N*N;i++){const b=tiles[i].bld;if(b&&b.k===1&&+d.sk[i])b.sick=1;} // 生病標記（T33，舊檔無 sk 則無生病）
    if(d.dt)for(let i=0;i<N*N;i++){const b=tiles[i].bld;if(b&&b.k===1&&+d.dt[i])b.death=1;} // 死亡標記（T38，舊檔無 dt 則無死亡）
    if(d.skd)for(let i=0;i<N*N;i++){const b=tiles[i].bld;if(b&&b.k===1&&b.sick){const v=+d.skd[i];if(v)b.sickDays=v;}}   // 生病天數延續（FIX-A，舊檔缺 skd 則預設 0）
    if(d.dtd)for(let i=0;i<N*N;i++){const b=tiles[i].bld;if(b&&b.k===1&&b.death){const v=+d.dtd[i];if(v)b.deathAge=v;}} // 死亡天數延續（FIX-A，舊檔缺 dtd 則預設 0）
    money=d.money;day=d.day;townName=d.nm||'微光小鎮';document.title=townName+' · 微光小鎮';msIdx=d.msIdx||0;ach={};for(const id of d.ach||[])ach[id]=1;
    loan=d.ln?{remain:d.ln[0],daily:d.ln[1]}:null;
    bestStar=d.star||0;score=-1;cityStar=-1;                 // 城市評分（T25）：bestStar 存檔可選欄位，舊檔容錯為 0；分數留待下次 tick 重算
    cam.x=d.cam.x;cam.y=d.cam.y;cam.z=clamp(d.cam.z||2,1,4);
    recalcAllMasks();
    recalcAllRailMasks(); // 軌道遮罩全量重算：rl/tr 還原時 railMask/tramMask 歸零（對照道路版）
    computeFoam();
    computeElMask();
    computeWater(); // 重建供水網路（T31）
    rebuildCov(); // T61：讀檔後全量重建服務覆蓋場（不入存檔）
    cars.length=0;smokes.length=0;buses.length=0; // 公車運行時重建不存（T26）
    trains.length=0;cargoShips.length=0;tramCars.length=0;ambulances.length=0;pol=null;region={}; // T39-T60 運行時重建；FIX-H：補清救護車（防舊圖救護車朝新圖舊目標行駛）
    if(d.pol)pol=d.pol;
    if(d.region)region=d.region;
    // T39-T60 多格建築重建
    for(let i=0;i<N*N;i++){
      const b=tiles[i].bld;
      if(!b||!b.sz||b.sz<2)continue;
      const rx=i%N,ry=(i/N)|0;
      for(let dy=0;dy<b.sz;dy++)for(let dx=0;dx<b.sz;dx++){
        if(dx===0&&dy===0)continue;
        const sx=rx+dx,sy=ry+dy;
        if(inMap(sx,sy))tiles[idx(sx,sy)].bld={k:b.k,ref:[rx,ry]};
      }
    }
    hintsOff=true;
    undoStack.length=0;undoGroup=null;
    return true;
  }catch(e){return false;}
}
setInterval(()=>{if(tiles)save();},25000); // 世界尚未建立（啟動畫面）時跳過自動存檔
document.addEventListener('visibilitychange',()=>{if(document.hidden&&tiles)save();});

/* =====================================================================
   12. 主迴圈
===================================================================== */
let lastT=performance.now(),hudT=0,running=false,lastDraw=0;
// 推進遊戲邏輯（dtReal 不截斷，動畫另外截斷）
function advance(dtReal){
  visT+=Math.min(dtReal,2);
  simAcc+=dtReal*speed;
  let steps=0;
  while(simAcc>=DAYLEN&&steps<8){simAcc-=DAYLEN;tick();steps++;}
  if(steps>=8)simAcc=0; // 落後太多就放棄追趕
  const dtA=Math.min(.05,dtReal);
  updCars(dtA);
  updTrains(dtA);updTrams(dtA);updShips(dtA);updAmbulances(dtA);
  updSmoke(dtA);
  updRain(dtA);
  updBuses(dtA);   // 公車巡迴（T26）：與 cars/smoke/rain 同為每幀動畫更新
}
function frame(ts){
  requestAnimationFrame(frame);
  if(!running){lastT=ts;return;}
  const dt=Math.max(0,Math.min(2,(ts-lastT)/1000));
  lastT=ts;
  advance(dt);
  draw(Math.min(.05,dt));
  lastDraw=performance.now();
  hudT+=dt;
  if(hudT>.25){hudT=0;updHud();}
}
requestAnimationFrame(frame);
// rAF 被瀏覽器暫停（分頁隱藏／省電）時，用計時器低頻接手，遊戲不會凍結
setInterval(()=>{
  if(!running)return;
  const now=performance.now();
  if(now-lastDraw<400)return; // rAF 正常時不介入
  const dt=Math.max(0,Math.min(2,(now-lastT)/1000));
  lastT=now;
  advance(dt);
  draw(.05);
  lastDraw=now;
  updHud();
},250);

/* =====================================================================
   13. 啟動
===================================================================== */
buildSprites();
buildToolbar();
resize();
drawLogo();
const oldMute=localStorage.getItem(SAVEKEY+'.mute');
sndMode=+(localStorage.getItem(SAVEKEY+'.snd')??(oldMute==='1'?0:1));
if(sndMode<0||sndMode>2||isNaN(sndMode))sndMode=1;
muted=sndMode===0;
$('#bSound').textContent=['🔇','🔊','🎵'][sndMode];
// 一次性遷移：舊單一鍵 SAVEKEY 若有值且槽1為空 → 搬到槽1並刪除舊鍵
const oldSave=localStorage.getItem(SAVEKEY);
if(oldSave&&!localStorage.getItem(slotKey(1))){localStorage.setItem(slotKey(1),oldSave);localStorage.removeItem(SAVEKEY);}
const hasSave=!!(localStorage.getItem(slotKey(1))||localStorage.getItem(slotKey(2))||localStorage.getItem(slotKey(3)));
if(hasSave)$('#bContinue').style.display='block';
function begin(fresh){
  try{document.title=(typeof townName==='string'?townName:'微光小鎮')+' · v'+GAME_VER;}catch(e){}
  initAudio();
  if(fresh||!load())newWorld();
  $('#start').style.display='none';
  running=true;
  $('#mini').style.display='block';drawMini();
  computePower();
  updHud();
  if(sndMode===2)composer.start();
  if(!hasSave||fresh)checkHints(0,0);
}
$('#bNewGame').onclick=()=>{challenge=null;begin(true);};
$('#bContinue').onclick=()=>begin(false);
// T88 挑戰
const startEl=$('#start');
if(startEl&&!$('#bCh1')){
  const mk=(id,label,bonus,goal)=>{const b=document.createElement('button');b.className='alt';b.id=id;b.textContent=label;b.onclick=()=>{challenge={id:goal,bonus,label};begin(true);toast('挑戰：'+label,'gold');};return b;};
  startEl.appendChild(mk('bCh1','🏁 挑戰：人口1000',1500,'pop1k'));
  startEl.appendChild(mk('bCh2','🏁 挑戰：200天$5k',2000,'day200'));
  startEl.appendChild(mk('bCh3','🏁 挑戰：三星城市',2500,'star3'));
  const row=document.createElement('div');row.className='help';row.style.marginTop='8px';
  const ds=document.createElement('button');ds.className='alt';ds.textContent=disastersOn?'🌪 災害：開':'🌪 災害：關';
  ds.onclick=()=>{disastersOn=!disastersOn;localStorage.setItem(SAVEKEY+'.ds',disastersOn?'1':'0');ds.textContent=disastersOn?'🌪 災害：開':'🌪 災害：關';sTick();};
  const q=document.createElement('button');q.className='alt';q.textContent=['效能：低','效能：中','效能：高'][quality];
  q.onclick=()=>{quality=(quality+1)%3;localStorage.setItem(SAVEKEY+'.q',quality);q.textContent=['效能：低','效能：中','效能：高'][quality];sTick();};
  row.appendChild(ds);row.appendChild(document.createTextNode(' '));row.appendChild(q);startEl.appendChild(row);
}
// title version
try{document.title=(townName||'微光小鎮')+' v'+GAME_VER;}catch(e){}

/* 除錯／測試用 API（不影響一般遊玩） */
window.GV={
  N:()=>N,
  newWorld:()=>{newWorld();return true;},
  newWorldSeeded:(sd)=>{newWorld(sd);return true;},
  save:()=>{save();return true;},
  load:()=>load(curSlot()),
  place:(t,x,y)=>doPlace(t,x,y,true),
  center:()=>toTile(cvs.clientWidth/2,cvs.clientHeight/2),
  tile:(x,y)=>inMap(x,y)?JSON.parse(JSON.stringify(T(idx(x,y)))):null,
  cov:(f,x,y)=>COV[f]?.[idx(x,y)], // T61：覆蓋場除錯鉤子（回傳該格某設施覆蓋計數）
  rebuildCov:()=>{rebuildCov();return true;}, // T61：手動重建覆蓋場（對照測試用）
  setSpeed:s=>{speed=s;},
  setDay:d=>{day=d;return day;},                                // 設模擬天數（T18 測試用；季節由 day 導出）
  ignite:(x,y)=>{if(!inMap(x,y))return false;const b=T(idx(x,y)).bld;if(b&&b.k<=3){b.fire=1;return true;}return false;},
  igniteCrime:(x,y)=>{if(!inMap(x,y))return false;const b=T(idx(x,y)).bld;if(b&&b.k<=3){b.crime=1;return true;}return false;},
  clearCrime:(x,y)=>{if(!inMap(x,y))return false;const b=T(idx(x,y)).bld;if(b&&b.k<=3){b.crime=0;return true;}return false;},
  igniteSick:(x,y)=>{if(!inMap(x,y))return false;const b=T(idx(x,y)).bld;if(b&&b.k===1){b.sick=1;return true;}return false;},
  clearSick:(x,y)=>{if(!inMap(x,y))return false;const b=T(idx(x,y)).bld;if(b&&b.k===1){b.sick=0;return true;}return false;},
  igniteDeath:(x,y)=>{if(!inMap(x,y))return false;const b=T(idx(x,y)).bld;if(b&&b.k===1){b.death=1;b.deathAge=0;b.sick=0;return true;}return false;},
  clearDeath:(x,y)=>{if(!inMap(x,y))return false;const b=T(idx(x,y)).bld;if(b&&b.k===1){b.death=0;b.deathAge=0;return true;}return false;},
  weather:(w)=>{weather=clamp(w|0,0,2);wxT=99;return weather;}, // 強制設天氣（測試用，鎖住不換態）
  flash:()=>{flashT=.4;sThunder();return true;},               // 強制觸發閃電（測試用）
  addMoney:v=>{money+=v;return Math.round(money);},            // 測試用資金調整
  canPlaceTool:(t,x,y)=>canPlace(t,x,y),                       // 測試用建造可行性
  buses:()=>buses.map(b=>({x:b.x,y:b.y,stop:[b.stop%N,(b.stop/N)|0],p:+b.p.toFixed(2),wait:+b.wait.toFixed(2),moving:!!b.path})), // 公車運行快照（T26 測試用）
  step:(n)=>{n=clamp(n|0,1,60);for(let i=0;i<n;i++)tick();return day;}, // 手動推進 n 個模擬日（測試用，同 setDay 屬 sim 鉤子）
  stats:()=>{let b=0,r=0,z=0,pw=0,f=0,ru=0;
    for(let i=0;i<N*N;i++){const t=tiles[i];
      if(t.bld){b++;if(t.bld.pw)pw++;if(t.bld.fire)f++;}
      if(t.ruin)ru++;
      if(t.road)r++;if(t.zone)z++;}
    return{money:Math.round(money),pop,jobs,day,buildings:b,poweredBld:pw,
      roads:r,zones:z,happy:+cityHappy.toFixed(2),dem:{...dem},cars:cars.length,fires:f,ruins:ru,weather,buses:buses.length};},
  composer:composer,
  npu:npuComposer,
  ver:()=>GAME_VER,
  pol:(p)=>{if(p&&typeof p==='object')pol={taxR:p.taxR??1,taxC:p.taxC??1,taxI:p.taxI??1};return pol;},
  quake:()=>{if(!disastersOn)return false;shakeT=.55;quakeRecover=20;return true;},
  flood:()=>{let n=0;for(let i=0;i<N*N&&n<12;i++){const t=tiles[i];if(t.t===2&&!t.levee&&countNear(i%N,(i/N)|0,1,tt=>tt.t===0)){t.flood=1;n++;}}return n;},
  trains:()=>trains.length,
  trams:()=>tramCars.length,
  ships:()=>cargoShips.length,
  setChallenge:(id,bonus=1000)=>{challenge={id,bonus,label:id};return challenge;},
  region:()=>({...region}),
  food:()=>foodPoints,
  tourists:()=>tourists
};

if('serviceWorker' in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
