<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d1226">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<title>微光小鎮 Glimmerville</title>
<style>
/* ============================================================
   微光小鎮 Glimmerville — 原創等距像素城市建造小遊戲
   全部美術以 Canvas 程式化手繪，無任何外部素材。
   ============================================================ */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#0d1226;
  font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",system-ui,sans-serif;
  user-select:none;-webkit-user-select:none;touch-action:none}
#game{position:absolute;inset:0;width:100%;height:100%;display:block;
  image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none;cursor:grab}
#game.build{cursor:crosshair}
/* ---------- 頂部資訊列 ---------- */
#hud{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;gap:6px;
  padding:5px 8px;background:rgba(10,14,26,.86);border-bottom:2px solid #2c3450;
  color:#dfe6f5;font-size:13px;z-index:20;flex-wrap:wrap}
.chip{display:flex;align-items:center;gap:4px;background:#181f36;border:1px solid #303a5c;
  border-radius:6px;padding:2px 8px;white-space:nowrap;line-height:20px}
.chip b{font-weight:700;color:#fff}
#money b{color:#ffd977}
#hud .spacer{flex:1}
.hbtn{background:#232c4a;border:1px solid #3a4670;color:#dfe6f5;border-radius:6px;
  padding:2px 9px;font-size:13px;line-height:22px;cursor:pointer}
.hbtn:active{background:#31407a}
.hbtn.on{background:#3a5a2f;border-color:#5f8f4a}
#bBell{position:relative}
.dot{position:absolute;top:-4px;right:-4px;background:#e05252;color:#fff;font-size:9px;
  line-height:14px;min-width:14px;height:14px;border-radius:7px;text-align:center;padding:0 2px;font-weight:700}
/* RCI 需求柱（T109：4×24px 豎條，綠正紅負，顏色由 JS 依正負動態設定） */
#rci{display:flex;align-items:flex-end;gap:3px;height:28px;padding:2px 6px;
  background:#181f36;border:1px solid #303a5c;border-radius:6px}
#rci .col{width:4px;height:24px;background:#0c1020;border-radius:2px;position:relative;overflow:hidden}
#rci .col i{position:absolute;bottom:0;left:0;right:0;height:0%;background:#58c470}
/* ---------- 工具列 ---------- */
#toolcats{position:absolute;left:50%;bottom:68px;transform:translateX(-50%);z-index:21;display:none;gap:4px;flex-wrap:wrap;justify-content:center;max-width:96vw}
#toolcats button{padding:4px 8px;border-radius:8px;border:1px solid #3a456e;background:rgba(16,22,42,.92);color:#c9d2ea;font-size:11px;cursor:pointer}
#toolcats button.on{border-color:#c9a24c;color:#ffe9ad;background:#2a3358}
#tools{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);display:flex;gap:6px;
  padding:6px;background:rgba(10,14,26,.88);border:2px solid #2c3450;border-radius:12px;
  z-index:20;max-width:96vw;overflow-x:auto}
.tool{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  width:56px;min-width:56px;height:56px;border-radius:9px;border:2px solid #303a5c;
  background:#181f36;color:#c9d2ea;font-size:10px;cursor:pointer}
.tool .ic{font-size:20px;line-height:22px}
.tool .pr{color:#8fa0c8;font-size:9px}
.tool.sel{border-color:#ffd977;background:#33395e;color:#fff}
.tool:active{transform:scale(.95)}
/* ---------- 提示橫幅 ---------- */
#hint{position:absolute;top:44px;left:50%;transform:translateX(-50%);z-index:19;
  background:rgba(20,28,52,.94);border:1px solid #46538a;color:#ffe9ad;border-radius:8px;
  padding:6px 12px;font-size:13px;display:none;max-width:92vw;align-items:center;gap:8px}
#hint button{background:none;border:none;color:#8fa0c8;font-size:14px;cursor:pointer}
/* ---------- 訊息泡 ---------- */
#toasts{position:absolute;left:50%;bottom:78px;transform:translateX(-50%);z-index:25;
  display:flex;flex-direction:column-reverse;align-items:center;gap:5px;pointer-events:none}
.toast{background:rgba(16,22,42,.94);border:1px solid #4a5788;color:#eaf0ff;border-radius:8px;
  padding:5px 14px;font-size:13px;animation:tin .25s ease-out;white-space:nowrap}
.toast.gold{border-color:#c9a84c;color:#ffe9ad}
.toast.bad{border-color:#a85050;color:#ffc4c4}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1}}
/* ---------- 檢視面板 ---------- */
#info{position:absolute;left:10px;bottom:80px;z-index:22;background:rgba(12,17,32,.94);
  border:2px solid #3a4670;border-radius:10px;padding:10px 14px;color:#dfe6f5;font-size:13px;
  display:none;min-width:180px;max-width:70vw}
#info h3{font-size:14px;color:#ffd977;margin-bottom:4px}
#info .row{margin:2px 0;color:#c9d2ea}
#info .x{position:absolute;top:4px;right:8px;color:#8fa0c8;cursor:pointer;font-size:15px}
/* ---------- 拖放成本提示 ---------- */
#dragcost{position:absolute;z-index:23;display:none;background:rgba(12,17,32,.9);
  border:1px solid #4a5788;color:#ffd977;border-radius:6px;padding:2px 8px;font-size:12px;pointer-events:none}
/* ---------- 縮放按鈕（手機友善） ---------- */
#zoomer{position:absolute;right:10px;bottom:80px;z-index:20;display:flex;flex-direction:column;gap:6px}
#zoomer button{width:40px;height:40px;font-size:20px;border-radius:9px;border:2px solid #303a5c;
  background:rgba(16,22,42,.9);color:#dfe6f5;cursor:pointer}
#zoomer button:active{background:#31407a}
/* ---------- 開始畫面 ---------- */
#start{position:absolute;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:14px;text-align:center;overflow-y:auto;padding:16px 0; /* T132：新增戰役選單後按鈕列變長，矮視窗需可捲動才不致下方按鈕被裁掉 */
  background:linear-gradient(180deg,#0d1226 0%,#1b2547 55%,#33406e 100%)}
#start h1{color:#ffe9ad;font-size:34px;letter-spacing:10px;text-shadow:0 3px 0 #7a5b1e,0 6px 14px #000}
#start .en{color:#8fa0c8;letter-spacing:6px;font-size:13px;margin-top:-8px}
#start .sub{color:#c9d2ea;font-size:14px;margin:6px 0 10px}
#start button{min-width:210px;padding:12px 22px;font-size:16px;border-radius:12px;cursor:pointer;
  border:2px solid #5f8f4a;background:#2e4a26;color:#dff5cf}
#start button.alt{border-color:#46538a;background:#1d2745;color:#c9d2ea}
#start button:active{transform:scale(.97)}
#start .help{margin-top:10px;color:#96a4c9;font-size:12px;line-height:1.9;max-width:340px}
#start .diffrow{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:340px}
#start .diffbtn{min-width:auto;padding:6px 12px;font-size:12px;border-radius:9px}
#start .diffbtn.sel{border-color:#ffd977;background:#33395e;color:#fff}
/* T132：場景戰役選單（比照 .diffrow/.diffbtn 樣式先例） */
#start .scmenu{display:none;flex-direction:column;gap:5px;max-width:340px;margin-top:6px;max-height:220px;overflow-y:auto}
#start .scmenu.show{display:flex}
#start .scbtn{min-width:auto;width:100%;padding:8px 12px;font-size:12px;border-radius:9px;text-align:left}
#start .scbtn.done{border-color:#58c470;color:#9be6ac}
#start .scbtn.locked{opacity:.45;cursor:not-allowed}
#logo{image-rendering:pixelated;width:224px;height:128px}
#mini{position:absolute;top:48px;right:10px;width:144px;height:144px;z-index:18;
  border:2px solid #2c3450;border-radius:8px;background:#0d1226;
  image-rendering:pixelated;cursor:pointer;display:none}
@media (max-width:420px){#mini{width:96px;height:96px;top:64px}}
/* T110：小地圖視圖切換鈕（普通/污染熱度/地價，T130 擴；T131 擴為六段：普通/地價/污染/壅堵/犯罪/服務覆蓋） */
#miniToggle{position:absolute;top:48px;right:160px;width:28px;height:28px;z-index:19;
  border-radius:8px;border:2px solid #303a5c;background:#181f36;color:#dfe6f5;
  font-size:14px;line-height:24px;cursor:pointer;padding:0;display:none}
@media (max-width:420px){#miniToggle{top:64px;right:112px;width:24px;height:24px;font-size:11px;line-height:20px}}
@media (max-height:520px){#logo{display:none}#start h1{font-size:26px}}
/* 窄螢幕（360~420px 手機）壓縮工具列與 HUD，八顆工具鍵可完整捲動觸及 */
@media (max-width:420px){
  .tool{width:46px;min-width:46px;height:50px;font-size:9px}
  .tool .ic{font-size:16px;line-height:18px}
  #hud{font-size:11px;gap:4px;padding:4px 6px}
  .chip{padding:2px 6px;line-height:18px}
  .hbtn{padding:2px 7px;font-size:12px}
}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud">
  <span class="chip" id="money">💰 <b>0</b></span>
  <span class="chip" id="pop">👥 <b>0</b></span>
  <span class="chip" id="jobs">💼 <b>0</b></span>
  <span class="chip" id="happy">😊 <b>--</b></span>
  <span class="chip" id="star">⭐ <b>–</b></span>
  <span class="chip" id="date">📅 第1年 第1天</span>
  <span id="rci" title="需求：住宅/商業/工業">
    <span class="col r"><i></i></span><span class="col c"><i></i></span><span class="col i"><i></i></span>
  </span>
  <span class="spacer"></span>
  <button class="hbtn" id="bStats">📊</button>
  <button class="hbtn" id="bHelp">❓</button>
  <button class="hbtn" id="bUndo">↩️</button>
  <button class="hbtn" id="bSpeed">▶ 1x</button>
  <button class="hbtn" id="bSound">🔊</button>
  <button class="hbtn" id="bSave">💾</button>
  <button class="hbtn" id="bNew">🆕</button>
  <button class="hbtn" id="bBell">🔔<span id="bellDot" class="dot" style="display:none">0</span></button>
  <button class="hbtn" id="bAch">🏆</button>
  <button class="hbtn" id="bEditor" style="display:none">🛠 目標</button>
</div>

<div id="hint"><span id="hintTxt"></span><button id="hintX">✕</button></div>

<div id="toolcats"></div>
<div id="tools"></div>
<div id="toasts"></div>
<div id="dragcost"></div>
<canvas id="mini" width="144" height="144"></canvas>
<button id="miniToggle" title="切換小地圖視圖：普通／地價／污染／壅堵／犯罪／服務覆蓋">🏭</button>
<div id="zoomer">
  <button id="zin">＋</button>
  <button id="zout">－</button>
</div>

<div id="info"><span class="x" id="infoX">✕</span><div id="infoBody"></div></div>

<div id="start">
  <canvas id="logo" width="224" height="128"></canvas>
  <h1>微光小鎮</h1>
  <div class="en">G L I M M E R V I L L E</div>
  <div class="sub">從一片荒野，點亮一座小鎮。</div>
  <button id="bContinue" style="display:none">▶ 繼續上次的小鎮</button>
  <button id="bNewGame">🌱 開拓新地圖</button>
  <button class="alt" id="bEditorMode">🛠 編輯器</button>
  <div class="help">
    🖐 拖曳平移 ・ 滾輪／雙指縮放<br>
    🛣 先鋪路 → 🏠 劃分區域 → ⚡ 蓋電廠供電<br>
    建築會沿著有電的道路自己生長、繳稅給你
  </div>
</div>

<script>
(()=>{ 'use strict';
/* =====================================================================
   0. 小工具
===================================================================== */
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const lerp=(a,b,t)=>a+(b-a)*t;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
let R=mulberry32(1); // 全域隨機（依種子重設）
const ri=n=>Math.floor(R()*n);

/* 值噪聲（地形用） */
function makeNoise(rand,G){
  const v=new Float32Array(G*G);
  for(let i=0;i<G*G;i++)v[i]=rand();
  const at=(x,y)=>{
    const xi=Math.floor(x),yi=Math.floor(y);
    const xf=x-xi,yf=y-yi,sx=xf*xf*(3-2*xf),sy=yf*yf*(3-2*yf);
    const g=(a,b)=>v[((a%G)+G)%G*G+(((b%G)+G)%G)];
    return lerp(lerp(g(xi,yi),g(xi+1,yi),sx),lerp(g(xi,yi+1),g(xi+1,yi+1),sx),sy);
  };
  return (x,y)=>.6*at(x,y)+.3*at(x*2.13+7,y*2.13+3)+.1*at(x*4.7+13,y*4.7+11);
}

/* =====================================================================
   1. 常數與狀態
===================================================================== */
const TW=64,TH=32;         // 單格像素尺寸（精細版：每格 64×32）
const N=72;                // 地圖邊長
const SAVEKEY='glimmerville.v1';
const DAYLEN=0.9;          // 一天（模擬）＝0.9 秒（1x）
const CYCLE=110;           // 日夜循環（真實秒）

// 建築種類：1住宅 2商業 3工業 4公園 5電廠
const KNAME={1:'住宅',2:'商業',3:'工業',4:'公園',5:'發電廠',6:'消防局',7:'學校',8:'垃圾場',9:'體育場',10:'水塔',11:'警察局',12:'醫院',13:'診所',14:'圖書館',15:'郵局',16:'墓園',17:'火車站',18:'港口',19:'機場',20:'停車場',21:'輕軌站',22:'農場',23:'牧場',24:'地標',25:'太陽能',26:'風力',27:'污水廠',28:'救護站',29:'回收中心',30:'高級消防',31:'監獄',32:'大學',33:'住宅摩天樓',34:'商業摩天樓',35:'博物館',36:'劇院',37:'水族館',38:'動物園',39:'遊樂園',40:'電影院',41:'圖書總館',42:'市政廳',43:'法院',44:'會展中心',45:'研究院',46:'氣象站',47:'植物園',48:'綜合醫院',49:'油井',50:'礦場',51:'太空研究中心'}; // T127：k33/34 摩天樓（2×2 合併建築）；T138：k35-41 文化娛樂建築；T139：k42-48 民生科研建築（建築型別達 48）；T140：k49油井/50礦場/51太空研究中心（資源供應鏈，建築型別達 51）
const LVNAME={
  1:['小屋','公寓','住宅大樓'],
  2:['小舖','商場','商業大樓'],
  3:['工坊','工廠','重工業區']};
const POPS =[0,8,22,54];    // 住宅各級人口
const JOBSC=[0,5,14,38];    // 商業各級就業
const JOBSI=[0,7,20,48];    // 工業各級就業
const DEN_POP=[0.70,0.85,1.00,1.25,1.60];
const DEN_NAME=['低密度','中低密度','中密度','中高密度','高密度'];
const WEALTH_NAME=['貧','中','富'];       // T123：住宅財富分級 0貧/1中/2富
const WEALTH_ICON=['🏚️','🏠','🏡'];       // T123：inspect 徽記
const WEALTH_TAX=[0.6,1,1.5];             // T124：住宅財富分級稅收係數 0貧/1中/2富
const WEALTH_PEN=[0.5,1,2];               // T124：住宅財富分級污染/犯罪幸福懲罰係數 0貧/1中/2富
const TOWER_MULT=1.15;                    // T127：摩天樓合併「四格 lv3 總和」獎勵倍率
const TOWER_POP=Math.round(POPS[3]*4*TOWER_MULT);   // T127：住宅塔（k33）人口＝四格 lv3 住宅總和×1.15＝248
const TOWER_JOBS=Math.round(JOBSC[3]*4*TOWER_MULT); // T127：商業塔（k34）就業＝四格 lv3 商業總和×1.15＝175
const PLANT_CAP=50;         // 每座電廠供電建築數
const DUMP_CAP=40;          // 每座垃圾場處理容量（T19）
const WATER_TOWER_CAP=80;   // 每座水塔供水建築數（T31）
const ROAD_CLASS={ALLEY:0,LOCAL:1,COLLECTOR:2,ARTERIAL:3,EXPRESSWAY:4};
const ROAD_NAME=['小巷','支路','次幹道','主幹道','快速路'];
const ROAD_COST=[8,15,28,55,120];
const ROAD_UPKEEP=[0.01,0.02,0.05,0.12,0.35];
const ROAD_SPEED=[0.5,1.0,1.4,2.0,3.5];
const ROAD_CAP=[1,2,4,8,16];     // T129：道路壅堵容量（依 rc 1-5 索引，同 ROAD_SPEED 慣例；小巷最低、快速路最高。
                                  // 校準依據：本作單日車流量本就小（citywide 車輛上限 32、道路速度慢，daily pass 常態為個位數），
                                  // 容量取小整數才能在合理城市規模下被實際車流觸發過載，數值本身無強制規格、屬本卡設計裁量）
const ROAD_JAM_K=1;              // T129：過載降速斜率係數，套用於 clamp(1-max(0,load-cap)/cap*k,.3,1)
const COMMUTE_PERIOD=4;          // T141：通勤叢集快取重算週期（天）——每 N 天重跑一次多源 BFS，其餘天數複用快取路徑，避免每 tick 全城 BFS
const COMMUTE_CELL=6;            // T141：叢集分塊大小（格）——塊內首個住宅格為代表，僅代表格路徑納入 commutePass 累加，控制大城逐路徑成本
const COMMUTE_FAR=20;            // T141：路距門檻（格），超過視為「過長通勤」，懲罰隨超額距離線性疊加
const COMMUTE_PEN_STEP=.012;     // T141：每超額 1 格疊加的通勤懲罰係數
const COMMUTE_PEN_MAX=.18;       // T141：「過長」通勤懲罰上限（未達不可達門檻前）

function cv(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;

// 菱形：中心 cx、頂點 y=ty、半寬 hw（偶數），高度=hw，斜率固定 2:1
function dia(g,cx,ty,hw,col){
  g.fillStyle=col;
  const hh=hw>>1;
  for(let i=0;i<hh;i++){
    const w=(i+1)*2;
    g.fillRect(cx-w,ty+i,w*2,1);
    g.fillRect(cx-w,ty+hw-1-i,w*2,1);
  }
}
// 菱形內隨機點綴
function speck(g,cx,ty,hw,cols,n,rand){
  for(let i=0;i<n;i++){
    const yy=1+Math.floor(rand()*(hw-2));
    const hr=Math.max(1,(yy<hw/2?(yy+1):(hw-yy))*2-2);
    const xx=cx-hr+Math.floor(rand()*hr*2);
    g.fillStyle=cols[Math.floor(rand()*cols.length)];
    g.fillRect(xx,ty+yy,2,1);
  }
}
// 菱形四邊描邊（bit：1上右 2下右 4下左 8上左）
function diaEdge(g,edges,col,cx=32,ty=0,hw=32){
  g.fillStyle=col;
  const hh=hw>>1;
  for(let i=0;i<hh;i++){
    const a=2*(i+1);
    if(edges&1)g.fillRect(cx+a-2,ty+i,2,1);
    if(edges&8)g.fillRect(cx-a,  ty+i,2,1);
    const b=2*(hh-i);
    if(edges&2)g.fillRect(cx+b-2,ty+hh+i,2,1);
    if(edges&4)g.fillRect(cx-b,  ty+hh+i,2,1);
  }
}
// 等距方塊：底頂點 (cx,by)、半寬 hw（偶數）、牆高 h；回傳屋頂菱形頂點 y
function isoBox(g,cx,by,hw,h,cL,cR,cTop){
  g.fillStyle=cL;
  for(let dx=1;dx<=hw;dx++){const yF=by-(dx>>1);g.fillRect(cx-dx,yF-h,1,h);}
  g.fillStyle=cR;
  for(let dx=0;dx<hw;dx++){const yF=by-((dx+1)>>1);g.fillRect(cx+dx,yF-h,1,h);}
  g.fillStyle='rgba(0,0,0,.13)';                       // 底部 AO
  for(let dx=1;dx<=hw;dx++){const yF=by-(dx>>1);g.fillRect(cx-dx,yF-3,1,3);}
  for(let dx=0;dx<hw;dx++){const yF=by-((dx+1)>>1);g.fillRect(cx+dx,yF-3,1,3);}
  g.fillStyle='rgba(0,0,0,.25)';g.fillRect(cx,by-h,1,h); // 前角線
  const rty=by-h-hw;
  dia(g,cx,rty,hw,cTop);
  diaEdge(g,6,shade(cTop,-26),cx,rty,hw);              // 簷口陰影
  diaEdge(g,9,shade(cTop,16),cx,rty,hw);               // 頂緣受光
  return rty;
}
// 牆上窗（含窗台與反光，跟著牆斜率排），同步畫到夜間圖層
function windows(g,ng,cx,by,hw,h,rand,litP,opts){
  const o=Object.assign({w:3,ht:4,gx:5,gy:7,glass:'#26314e',lit:'#ffd77a'},opts||{});
  const put=(x,y)=>{
    g.fillStyle=o.glass;g.fillRect(x,y,o.w,o.ht);
    g.fillStyle='rgba(255,255,255,.28)';g.fillRect(x,y,o.w,1);
    g.fillStyle='rgba(255,255,255,.30)';g.fillRect(x,y+o.ht,o.w,1);
    if(ng&&rand()<litP){ng.fillStyle=o.lit;ng.fillRect(x,y,o.w,o.ht);}
  };
  for(let dx=2;dx<hw-o.w-1;dx+=o.gx){                  // 右牆
    const yF=by-((dx+1)>>1);
    for(let y=yF-h+3;y<yF-o.ht-2;y+=o.gy)put(cx+dx,y);
  }
  for(let dx=4;dx<hw-1;dx+=o.gx){                      // 左牆
    const yF=by-(dx>>1);
    for(let y=yF-h+3;y<yF-o.ht-2;y+=o.gy)put(cx-dx-o.w+1,y);
  }
}
// 輪廓線後處理：透明像素貼著實體 → 描 1px 深色邊
function outlineSprite(c,r,gc,b){
  const g=c.getContext('2d');
  const w=c.width,h=c.height;
  const im=g.getImageData(0,0,w,h),a=im.data;
  const solid=(x,y)=>x>=0&&y>=0&&x<w&&y<h&&a[(y*w+x)*4+3]>40;
  const marks=[];
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const i=(y*w+x)*4;
    if(a[i+3]<=40&&(solid(x+1,y)||solid(x-1,y)||solid(x,y+1)||solid(x,y-1)))marks.push(i);
  }
  for(const i of marks){a[i]=r;a[i+1]=gc;a[i+2]=b;a[i+3]=255;}
  g.putImageData(im,0,0);
}
function shade(hex,amt){
  const n=parseInt(hex.slice(1),16);
  const r=clamp((n>>16)+amt,0,255),g=clamp(((n>>8)&255)+amt,0,255),b=clamp((n&255)+amt,0,255);
  return '#'+((r<<16|g<<8|b).toString(16).padStart(6,'0'));
}

  dia(g,ax,ay-32,32,col);

  diaEdge(g,6,shade(col,-20),ax,ay-32,32);
  diaEdge(g,9,shade(col,10),ax,ay-32,32);
}

      const[b,bg]=cv(12,8);
      bg.translate(12,0);bg.scale(-1,1);bg.drawImage(a,0,0);
      SPR[key]={A:a,B:b};
    }
  }
  /* ===== T125 住宅財富分級外觀：k=1 每個 (lv,v) 生成貧/富兩套色變（鍵名 1_lv_v_w0/w2），
     置於 buildSprites 絕對尾端（接在 T119 尾端新增之後），不位移任何既有 rand 消耗序、不重繪既有中產鍵
     （中產沿用既有 SPR.bld['k_lv_v']，像素零改動）；富＝提亮牆色＋屋頂加天線／小花圃綠化，
     貧＝降飽和牆色（略壓暗）＋牆面補丁色塊；沿用 mkBld 同款部件引擎重繪，僅色盤與收尾裝飾不同 ===== */
  {
    const desat=hex=>{ // 降飽和＋略壓暗（貧宅褪色感），沿用既有 shade() 同款十六進位色算法
      const n=parseInt(hex.slice(1),16);
      const r=(n>>16)&255,gg=(n>>8)&255,b=n&255;
      const l=Math.round(r*.3+gg*.59+b*.11);
      const mix=v=>clamp(Math.round(v*.4+l*.5-12),0,255);
      return '#'+((mix(r)<<16|mix(gg)<<8|mix(b)).toString(16).padStart(6,'0'));
    };
    const PATCHC=['#8a7050','#6b5a42','#9a8060','#7a6a58']; // 貧宅牆面補丁色票
    const mkWealthBld=(t,we)=>{
      const k=t.k,lv=t.lv,v=t.v,d=t.d,hw=d.hw,h=d.h;
      const[c,g]=cv(72,112),[nc,ng]=cv(72,112),[sc,sg]=cv(72,112);
      const ax=36,ay=110,by=ay-2;
      const wl0=PAL[k].walls[v],rf0=PAL[k].roof[v];
      const wl=we===2?[shade(wl0[0],22),shade(wl0[1],22)]:we===0?[desat(wl0[0]),desat(wl0[1])]:wl0;
      const rf=we===2?shade(rf0,14):we===0?desat(rf0):rf0;
      const smoke=[];
      plate(g,ax,ay,'#9a9484');
      const rty=isoBox(sg,ax,by,hw,h,wl[1],wl[0],rf);
      const ctx={ax,ay,by,hw,h,rty,wl,rf,v,k,lv,rand,dg:g,smoke,d};
      for(const p of d.parts)PARTS[p](sg,ng,ctx);
      if(we===2){ // 富：屋頂加件（天線＋小花圃綠化；若原本 parts 已含天線則像素疊加相同、不受影響）
        PARTS.antenna(sg,ng,ctx);
        const gx=Math.min(hw-6,8);
        sg.fillStyle='#4b8f45';sg.fillRect(ax-gx,rty+1,4,2);sg.fillRect(ax-gx+5,rty+2,3,2);
        sg.fillStyle='#63ad55';sg.fillRect(ax-gx+1,rty,2,1);
      }else if(we===0){ // 貧：牆面補丁色塊（右牆面，位置依 hw/h 夾限避免溢出畫布）
        for(let i=0;i<4;i++){
          const dx=2+Math.floor(rand()*Math.max(1,hw-6));
          const yF=by-((dx+1)>>1);
          const py=clamp(yF-3-Math.floor(rand()*Math.max(1,h-6)),0,111);
          sg.fillStyle=PATCHC[i%PATCHC.length];
          sg.fillRect(ax+dx,py,3,2);
        }
      }
      outlineSprite(sc,26,30,44);
      g.drawImage(sc,0,0);
      SPR.bld[k+'_'+lv+'_'+v+'_w'+we]={img:c,night:nc,ax,ay,w:72,h:112,smoke};
    };
    for(const t of tasks)if(t.k===1){mkWealthBld(t,0);mkWealthBld(t,2);} // 24 組 (lv,v) × 2 級 = 48 鍵
  }
  /* ===== T127 摩天樓（住宅塔 k=33／商業塔 k=34，2×2，各 2 變體）：2×2 全 lv3 同類分區建築在高需求高幸福下由 tick()
     機率合併而成（沿用多格建築先例 root+ref+sz，非 DRAFTS/mkBld 單格管線——比照機場4×4/大學3×3等既有 2×2/3×3/4×4
     建築皆為 buildSprites 內獨立區塊、不走 DRAFTS，本卡同一手法），置於 buildSprites 絕對尾端（接在 T125 尾端新增之
     後），不位移任何既有 rand 消耗序；夜窗滿版（gx4/gy5、litP.82）＋樓頂天線（含夜間警示燈）＋水塔／直升機坪細節 ===== */
  {
    const TWX=136,TWY=230,tax=68,tay=228,tby=tay-2,thw=28; // 2×2 足印同既有 136 寬，畫布加高至 230 容納 140-170px 摩天樓牆高
    const TWDEF=[ // k, 變體 v：牆左/牆右/屋頂/玻璃色＋牆高（140-170px 區間）＋屋頂細節（水塔／直升機坪，皆再疊天線警示燈）
      {k:33,v:0,wl:'#8291a3',wr:'#6c7c90',rf:'#5a6a7c',glass:'#2c3a52',h:150,roofType:'tank'}, // 住宅塔 v0：藍灰玻璃帷幕＋水塔
      {k:33,v:1,wl:'#a9836c',wr:'#8f6853',rf:'#6b4c40',glass:'#3a2c26',h:168,roofType:'pad'},  // 住宅塔 v1：磚紅色系＋直升機坪
      {k:34,v:0,wl:'#5f89b0',wr:'#4a6f92',rf:'#3a5875',glass:'#233246',h:150,roofType:'tank'}, // 商業塔 v0：藍玻璃帷幕＋水塔
      {k:34,v:1,wl:'#5aa08f',wr:'#457d70',rf:'#355f55',glass:'#1f3a34',h:168,roofType:'pad'}   // 商業塔 v1：綠玻璃帷幕＋直升機坪
    ];
    for(const d of TWDEF){
      const[c,g]=cv(TWX,TWY),[nc,ng]=cv(TWX,TWY),[sc,sg]=cv(TWX,TWY);
      plate(g,tax,tay,'#8f8a7c');
      const rty=isoBox(sg,tax,tby,thw,d.h,d.wl,d.wr,d.rf);
      windows(sg,ng,tax,tby,thw,d.h,rand,.82,{w:3,ht:4,gx:4,gy:5,glass:d.glass,lit:'#ffe9a0'}); // 夜窗滿版：窄格距＋高亮燈比例
      if(d.roofType==='tank'){ // 樓頂水塔
        sg.fillStyle='#9aa2ac';sg.fillRect(tax-8,rty+6,9,9);
        sg.fillStyle='#b7bec7';sg.fillRect(tax-8,rty+5,9,2);
        sg.fillStyle='#6d7684';sg.fillRect(tax-8,rty+14,2,3);sg.fillRect(tax,rty+14,2,3);
      }else{ // 樓頂直升機坪（黃邊扁平平台＋H標記）
        sg.fillStyle='#ffd420';sg.fillRect(tax-13,rty+2,26,13);
        sg.fillStyle='#3a3f46';sg.fillRect(tax-11,rty+3,22,11);
        sg.fillStyle='#e8e8e8';sg.fillRect(tax-1,rty+5,2,7);sg.fillRect(tax-4,rty+7,3,2);sg.fillRect(tax+2,rty+7,3,2);
      }
      sg.fillStyle='#8b95a5';sg.fillRect(tax+5,rty-16,2,18);        // 樓頂天線
      sg.fillStyle='#e05252';sg.fillRect(tax+4,rty-18,4,3);         // 警示燈（日間暗紅）
      ng.fillStyle='#ff6060';ng.fillRect(tax+4,rty-18,4,3);         // 警示燈（夜間發光）
      outlineSprite(sc,26,30,44);
      g.drawImage(sc,0,0);
      SPR.bld[d.k+'_1_'+d.v]={img:c,night:nc,ax:tax,ay:tay,w:TWX,h:TWY,smoke:[]};
    }
  }
  /* ===== T128 建築細節密度提升：屋頂雜物（空調外機/通風管/曬衣繩/儲物箱/太陽能小板）＋立面件（陽台欄杆/
     窗台花箱/店招燈箱），置於 buildSprites 絕對尾端（接在 T127 尾端新增之後）。detailPass() 遍歷 k=1/2/3
     DRAFTS 建築（含 T125 財富色變 w0/w2 鍵）與 k=33/34 摩天樓，直接讀 DRAFTS/塔樓幾何（hw/h，與 mkBld/塔樓
     生成時 isoBox 呼叫同一組 ax/by 座標系）推算屋頂菱形（roofHalfW 公式與 dia() 內部展開式一致）與牆面矩形
     （wallCol 的 yF 公式與 isoBox 逐列填色公式一致）安全範圍，只在此範圍內補畫，保證不越出建築剪影；細節色
     一律由該建築 PAL 牆/屋頂色 shade() 深淺派生，不引入新色；密度依 lv 遞增（lv1 少、lv3 密，塔樓比照最密）；
     夜光件（店招燈箱/機電指示燈）同步補進 night 圖層；純尾端疊加、不在既有序列中間消耗 rand（本段仍用同一
     buildSprites 局部 rand 做細節取色/位置的小幅變化，但因處於絕對尾端，不位移其後任何生成——已無其後生成）；
     window.__noDetail=true 時整段跳過 detailPass() 呼叫＝零位移（改動前位元一致，供除錯/回歸比對用） ===== */
  {
    // 屋頂菱形在列偏移 ry（0..hw-1，0＝頂點所在列）處的半寬，公式與 dia() 內部展開式完全一致
    const roofHalfW=(hw,ry)=>{ry=clamp(ry,0,hw-1);const hh=hw>>1;const i=ry<hh?ry:hw-1-ry;return(i+1)*2;};
    // 牆面在偏移 dx 處的列 x 座標與該列頂端 y（沿用 isoBox 逐列 yF 公式，保證落在已填實牆面矩形內）
    const wallCol=(cx,by,dx,side)=>side==='R'?{x:cx+dx,yF:by-((dx+1)>>1)}:{x:cx-dx,yF:by-(dx>>1)};
    // ---- 細節件（僅 detailPass 內部使用，不進 PARTS 註冊表）----
    const acUnit=(g,ng,x,y,tone)=>{ // 空調外機：箱體＋受光頂＋底陰影＋機電指示燈（夜光）
      g.fillStyle=shade(tone,-22);g.fillRect(x,y,4,3);
      g.fillStyle=shade(tone,14);g.fillRect(x,y,4,1);
      g.fillStyle=shade(tone,-40);g.fillRect(x,y+3,4,1);
      g.fillStyle='#7ec97a';g.fillRect(x+3,y+1,1,1);
      ng.fillStyle='#a6ffa0';ng.fillRect(x+3,y+1,1,1);
    };
    const ventPipe=(g,x,y,h2,tone)=>{ // 通風管：直立管＋管蓋
      g.fillStyle=shade(tone,-14);g.fillRect(x,y,2,h2);
      g.fillStyle=shade(tone,18);g.fillRect(x,y,1,h2);
      g.fillStyle=shade(tone,-36);g.fillRect(x-1,y,4,1);
    };
    const storageBox=(g,x,y,tone)=>{ // 儲物箱
      g.fillStyle=tone;g.fillRect(x,y,4,3);
      g.fillStyle=shade(tone,18);g.fillRect(x,y,4,1);
      g.fillStyle=shade(tone,-30);g.fillRect(x,y+2,4,1);
    };
    const solarPanel=(g,x,y,w,tone)=>{ // 太陽能小板：深藍格紋＋支架陰影
      g.fillStyle='#2a3f5c';g.fillRect(x,y,w,3);
      g.fillStyle='#3f5a80';for(let i=0;i<w;i+=2)g.fillRect(x+i,y,1,3);
      g.fillStyle=shade(tone,-24);g.fillRect(x,y+3,w,1);
    };
    const clothesline=(g,x,y,w,cols)=>{ // 曬衣繩
      g.fillStyle='rgba(0,0,0,.32)';g.fillRect(x,y,w,1);
      const step=Math.max(2,(w-2)/3|0);
      for(let i=0;i<3;i++){g.fillStyle=cols[i%cols.length];g.fillRect(x+1+i*step,y+1,2,2);}
    };
    const balconyRail=(g,x,y,w,tone)=>{ // 陽台欄杆：橫桿＋直柱
      g.fillStyle=tone;g.fillRect(x,y,w,1);
      for(let i=0;i<w;i+=2)g.fillRect(x+i,y+1,1,2);
    };
    const flowerBox=(g,x,y,tone)=>{ // 窗台花箱
      g.fillStyle=tone;g.fillRect(x,y,4,2);
      const fc=['#e8907e','#e8e070','#d9a8e8'];
      g.fillStyle=fc[(x+y)%3];g.fillRect(x+1,y-1,1,1);g.fillRect(x+3,y-1,1,1);
    };
    const signLightbox=(g,ng,x,y,w,col)=>{ // 店招燈箱（夜光）
      g.fillStyle='#20242c';g.fillRect(x,y,w,3);
      g.fillStyle=col;g.fillRect(x+1,y+1,w-2,1);
      ng.fillStyle=col;ng.fillRect(x+1,y+1,w-2,1);
    };
    const acLamp=(g,ng,x,y)=>{ // 機電指示燈（夜光小紅點）
      g.fillStyle='#c94848';g.fillRect(x,y,1,1);
      ng.fillStyle='#ff7a6a';ng.fillRect(x,y,1,1);
    };
    // 對單一 sprite 鍵疊加細節：cL/cR/rf 為該棟牆/屋頂色（與 isoBox 呼叫同一組色），ax/ay/by/hw/h 為幾何
    const applyDetail=(key,k,cL,cR,rf,ax,ay,by,hw,h,density)=>{
      const spr=SPR.bld[key];
      if(!spr)return;
      const g=spr.img.getContext('2d'),ng=spr.night.getContext('2d');
      const rty=by-h-hw; // 屋頂菱形頂點，與 isoBox 回傳值同一公式
      const roofTone=shade(rf,-16);
      const faTone=shade(cR,-18),faHi=shade(cL,16);
      const kind=(k===2||k===34)?'C':(k===3?'I':'R'); // C商業 I工業 R住宅（含住宅塔）
      // ---- 屋頂雜物：沿寬邊列挑點，x 偏移取該列安全半寬扣邊界後的一半、左右交錯，並疊加小幅 rand 位移 ----
      const roofRows=[.42,.58,.30,.68];
      for(let i=0;i<density.roof;i++){
        const ry=clamp(Math.round(hw*roofRows[i%4])+Math.floor(rand()*3)-1,2,hw-4);
        const avail=Math.max(2,Math.min(roofHalfW(hw,ry),roofHalfW(hw,clamp(ry+3,0,hw-1)))-5);
        const side=i%2===0?1:-1;
        const off=Math.min(avail,2+Math.floor(avail*.4));
        const x=ax+side*off,y=rty+ry;
        if(kind==='I'){
          if(i%2===0)ventPipe(g,x,y-3,7,roofTone);else storageBox(g,x-2,y,roofTone);
        }else if(kind==='C'){
          if(i%2===0)acUnit(g,ng,x-2,y,roofTone);else ventPipe(g,x,y-4,6,roofTone);
        }else{
          const m=i%3;
          if(m===0)solarPanel(g,x-3,y,7,roofTone);
          else if(m===1)acUnit(g,ng,x-2,y,roofTone);
          else storageBox(g,x-2,y,roofTone);
        }
      }
      // ---- 立面件：沿左右牆挑 dx 段落，y 落在該 dx 列牆面安全範圍內（yF-h+pad ~ yF-pad） ----
      const facadeSpots=[.30,.55,.15,.70];
      for(let i=0;i<density.facade;i++){
        if(h<10)break; // 牆太矮（<10px）不硬塞立面件，避免擠壓
        const side=i%2===0?'R':'L';
        const dx=clamp(Math.round(hw*facadeSpots[i%4]),1,hw-4);
        const{x:colX,yF}=wallCol(ax,by,dx,side);
        const yBase=clamp(yF-4-Math.round(h*(.22+.14*i)),yF-h+4,yF-5);
        if(kind==='C'){
          if(i%2===0)signLightbox(g,ng,colX-3,yBase,7,SIGNC[i%SIGNC.length]);
          else flowerBox(g,colX-2,yBase,faTone);
        }else if(kind==='I'){
          ventPipe(g,colX-1,yBase,4,faTone);
          if(i===0)acLamp(g,ng,colX,yBase-1);
        }else{
          if(i%2===0)balconyRail(g,colX-3,yBase,6,faHi);
          else if(i===1&&h>=20)clothesline(g,colX-4,yBase,8,['#e8e070','#e8907e','#d9a8e8','#f2f2f2']);
          else flowerBox(g,colX-2,yBase,faTone);
        }
      }
    };
    const DENS=[null,{roof:1,facade:1},{roof:2,facade:2},{roof:3,facade:2}]; // 索引=lv：1少 2中 3密
    const detailPass=()=>{
      for(const t of tasks){ // k=1/2/3 DRAFTS 建築（依 tasks 既有升序，僅讀值不影響其序）
        const wl=PAL[t.k].walls[t.v],rf=PAL[t.k].roof[t.v];
        const key=t.k+'_'+t.lv+'_'+t.v;
        applyDetail(key,t.k,wl[1],wl[0],rf,36,110,108,t.d.hw,t.d.h,DENS[t.lv]);
        if(t.k===1){ // T125 財富色變鍵沿用同一幾何，細節色改由對應色變後的牆/屋頂色派生
          applyDetail(key+'_w0',t.k,shade(wl[1],-20),shade(wl[0],-20),shade(rf,-20),36,110,108,t.d.hw,t.d.h,DENS[t.lv]);
          applyDetail(key+'_w2',t.k,shade(wl[1],20),shade(wl[0],20),shade(rf,14),36,110,108,t.d.hw,t.d.h,DENS[t.lv]);
        }
      }
      const TOWER_GEOM=[ // 對照 T127 TWDEF 幾何色值（各自獨立作用域無法共用，於此重列必要欄位；k=33/34 摩天樓吃最密 pass）
        {k:33,v:0,wl:'#8291a3',wr:'#6c7c90',rf:'#5a6a7c',h:150},
        {k:33,v:1,wl:'#a9836c',wr:'#8f6853',rf:'#6b4c40',h:168},
        {k:34,v:0,wl:'#5f89b0',wr:'#4a6f92',rf:'#3a5875',h:150},
        {k:34,v:1,wl:'#5aa08f',wr:'#457d70',rf:'#355f55',h:168}
      ];
      for(const d of TOWER_GEOM)applyDetail(d.k+'_1_'+d.v,d.k,d.wl,d.wr,d.rf,68,228,226,28,d.h,{roof:4,facade:4});
    };
    if(!window.__noDetail)detailPass();
  }
  /* ===== T136 真四季循環：夏／秋地面色與樹色調，置於 buildSprites 絕對尾端（接在 T128 detailPass 之後）。
     春（season()===0）沿用既有 SPR.grass/SPR.tree、冬沿用既有 SPR.grassW/SPR.treeW，兩者原有生成與亂數消耗序完全不動；
     本區塊純由既有已完工的 SPR.grass（4 變體）/SPR.tree（含 T104 擴充後 7 款）逐張以 tintCanvas 疊加半透明色調衍生
     SPR.grassS/grassA（長度 4）與 SPR.treeS/treeA（長度 7），陣列長度與日/冬版一致（冬季鐵律：季節切換陣列長度一致、不越界）；
     tintCanvas 用 source-atop 只在既有不透明像素上疊色，不影響剪影／輪廓，且不呼叫 rand()，故對其後（已無其後）任何生成序零位移 ===== */
  {
    const tintCanvas=(src,w,h,col,a)=>{
      const[c,g]=cv(w,h);
      g.drawImage(src,0,0);
      g.globalCompositeOperation='source-atop';
      g.globalAlpha=a;g.fillStyle=col;g.fillRect(0,0,w,h);
      g.globalAlpha=1;g.globalCompositeOperation='source-over';
      return c;
    };
    SPR.grassS=SPR.grass.map(c=>tintCanvas(c,64,32,'#a8e070',.25));  // 夏：疊加嫩黃綠，草地更飽和茂盛
    SPR.grassA=SPR.grass.map(c=>tintCanvas(c,64,32,'#b8863a',.42));  // 秋：疊加土黃橙，草地轉枯黃
    SPR.treeS=SPR.tree.map(t=>({img:tintCanvas(t.img,40,48,'#a8e070',.18),ax:t.ax,ay:t.ay,w:t.w,h:t.h})); // 夏：樹冠偏濃綠

/* =====================================================================
   3. 世界生成
===================================================================== */
function genWorld(sd){
  seed=sd;R=mulberry32(sd);
  const noi=makeNoise(mulberry32(sd^0x9e37),64);
  const noi2=makeNoise(mulberry32(sd^0x51f3),64);
  const noi3=makeNoise(mulberry32(sd^0x27b1),64);                          // 高地噪聲（T24）
  tiles=new Array(N*N);
  let water=0;
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){
    const n=noi(x*.085,y*.085);
    let t=2;
    if(n<.40)t=0; else if(n<.455)t=1;
    if(t===0)water++;
    const el=(t===2&&noi3(x*.06,y*.06)>.62)?1:0;                           // 高地：僅草地（T24）
    const tile={t,tree:0,gv:ri(4),road:0,bridge:0,hw:0,rc:0,mask:0,zone:0,bld:null,rp:false,wp:0,wr:0,wm:0,deco:0,el,em:0};
    if(t===2&&noi2(x*.13,y*.13)>.62&&R()<.8)tile.tree=1+ri(7); // T104：樹種 4→7
    else if(t===2&&R()<.015)tile.deco=1;
    tiles[idx(x,y)]=tile;
  }
  // ---- 河流：1-3 條，向噪聲遞減方向蜿蜒挖成真水域（T24） ----
  const carve=(cx,cy)=>{const tl=tiles[idx(cx,cy)];if(tl.t!==0){tl.t=0;water++;}tl.tree=0;tl.deco=0;tl.el=0;};
  const nR=1+ri(3),dirs=[[0,-1],[1,0],[0,1],[-1,0]];
  for(let r=0;r<nR;r++){
    let cx=0,cy=0,ok=false;
    for(let tr=0;tr<40&&!ok;tr++){const rx=ri(N),ry=ri(N);if(tiles[idx(rx,ry)].el===1){cx=rx;cy=ry;ok=true;}} // 優先高地起點
    if(!ok){const e=ri(4);cx=e===1?N-1:e===3?0:ri(N);cy=e===0?0:e===2?N-1:ri(N);}                              // 退化：地圖邊緣隨機點
    let px=-1,py=-1;
    for(let step=0;step<60;step++){
      const wr=1+ri(2);                                                    // 路徑及其鄰寬隨機 1-2 格
      for(let dy=-wr;dy<=wr;dy++)for(let dx=-wr;dx<=wr;dx++)
        if(Math.abs(dx)+Math.abs(dy)<=wr&&inMap(cx+dx,cy+dy))carve(cx+dx,cy+dy);
      let best=-1,bestV=1e9;
      for(let d=0;d<4;d++){const nx=cx+dirs[d][0],ny=cy+dirs[d][1];
        if(!inMap(nx,ny)||(nx===px&&ny===py))continue;
        const v=noi(nx*.085,ny*.085);if(v<bestV){bestV=v;best=d;}}         // 向鄰格中 noi 最低者
      if(best<0)break;
      if(R()<.30){const cand=[];for(let d=0;d<4;d++){const nx=cx+dirs[d][0],ny=cy+dirs[d][1];if(inMap(nx,ny)&&!(nx===px&&ny===py))cand.push(d);}if(cand.length)best=cand[ri(cand.length)];} // 30% 隨機偏折
      px=cx;py=cy;cx+=dirs[best][0];cy+=dirs[best][1];
      if(noi(cx*.085,cy*.085)<.40){carve(cx,cy);break;}                    // 觸及原生水域→匯流停止
    }
  }
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){
    const tl=tiles[idx(x,y)];
    if(tl.t===1&&!tl.deco&&R()<.25){
      for(const[dx,dy]of[[0,-1],[1,0],[0,1],[-1,0]])
        if(inMap(x+dx,y+dy)&&tiles[idx(x+dx,y+dy)].t===0){tl.deco=2;break;} // 蘆葦
    }else if(tl.t===2&&!tl.tree&&!tl.deco&&R()<.01)tl.deco=3;               // 野花叢
  }
  // ---- T105 新裝飾散布：石燈籠/小雕像/噴泉座/花壇/告示牌（v4-8）----
  // 獨立亂數流（自 sd 派生，同 noi/noi2/noi3 手法），不消耗全域 R，不干擾既有地形/樹/deco(1-3) 的既有判定與後續序列
  const decoR=mulberry32(sd^0x5b1e);
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){
    const tl=tiles[idx(x,y)];
    if(tl.t===2&&!tl.tree&&!tl.deco&&decoR()<.018)tl.deco=4+Math.floor(decoR()*5);
  }
  genResource(sd); // T140：資源層（獨立種子噪聲，不消耗全域 R()，見 genResource 定義處說明）
  return water/(N*N);
}
// 水岸泡沫遮罩（哪幾條邊鄰接陸地）
// T121：單格版抽出（逐行搬運不改邏輯，continue→return），供地形筆刷鄰域重算複用；computeFoam 逐格呼叫，全圖結果不變
function recalcFoamAt(x,y){
  if(!inMap(x,y))return;
  const t=T(idx(x,y));t.wm=0;
  if(t.t!==0)return;
  let m=0;
  if(inMap(x,y-1)&&T(idx(x,y-1)).t!==0)m|=1;
  if(inMap(x+1,y)&&T(idx(x+1,y)).t!==0)m|=2;
  if(inMap(x,y+1)&&T(idx(x,y+1)).t!==0)m|=4;
  if(inMap(x-1,y)&&T(idx(x-1,y)).t!==0)m|=8;
  t.wm=m;
}
function computeFoam(){
  for(let y=0;y<N;y++)for(let x=0;x<N;x++)recalcFoamAt(x,y);
}
// T121：地形筆刷用——僅重算操作格自己＋四鄰（對齊 recalcMask/recalcMask4 既有寫法），不做全圖校驗
function recalcFoamNear(x,y){
  recalcFoamAt(x,y);recalcFoamAt(x,y-1);recalcFoamAt(x+1,y);recalcFoamAt(x,y+1);recalcFoamAt(x-1,y);
}
// 高地內陸崖沿位罩（哪幾條邊鄰接低地；el 生成後算一次，沿用 foam 位向約定，T24）
// T121：單格版抽出（逐行搬運不改邏輯，continue→return），供地形筆刷鄰域重算複用；computeElMask 逐格呼叫，全圖結果不變
function recalcElMaskAt(x,y){
  if(!inMap(x,y))return;
  const t=T(idx(x,y));t.em=0;
  if(t.el!==1)return;
  let m=0;
  if(inMap(x,y-1)&&T(idx(x,y-1)).el===0)m|=1;
  if(inMap(x+1,y)&&T(idx(x+1,y)).el===0)m|=2;
  if(inMap(x,y+1)&&T(idx(x,y+1)).el===0)m|=4;
  if(inMap(x-1,y)&&T(idx(x-1,y)).el===0)m|=8;
  t.em=m;
}
function computeElMask(){
  for(let y=0;y<N;y++)for(let x=0;x<N;x++)recalcElMaskAt(x,y);
}
// T121：地形筆刷用——僅重算操作格自己＋四鄰
function recalcElMaskNear(x,y){
  recalcElMaskAt(x,y);recalcElMaskAt(x,y-1);recalcElMaskAt(x+1,y);recalcElMaskAt(x,y+1);recalcElMaskAt(x-1,y);

function recalcMask(x,y){
  if(!inMap(x,y))return; // 邊界防護：鄰格重算可能落在圖外
  const t=T(idx(x,y));if(!t.road)return;
  let m=0;
  if(inMap(x,y-1)&&T(idx(x,y-1)).road)m|=1;
  if(inMap(x+1,y)&&T(idx(x+1,y)).road)m|=2;
  if(inMap(x,y+1)&&T(idx(x,y+1)).road)m|=4;
  if(inMap(x-1,y)&&T(idx(x-1,y)).road)m|=8;
  t.mask=m;
}
function recalcAllMasks(){
  for(let y=0;y<N;y++)for(let x=0;x<N;x++)recalcMask(x,y);
}
function roadToolToRc(id){return {alley:1,road:2,coll:3,art:4,hwy:5}[id]||0;}
function rcToName(rc){return ROAD_NAME[rc-1]||'';}
// 鐵路/輕軌遮罩（T39/T44）
function recalcRailMask(x,y){
  if(!inMap(x,y))return;
  const t=T(idx(x,y));
  if(!t.rail&&!t.tram)return;
  let m=0;
  if(inMap(x,y-1)&&(T(idx(x,y-1)).rail||T(idx(x,y-1)).tram))m|=1;
  if(inMap(x+1,y)&&(T(idx(x+1,y)).rail||T(idx(x+1,y)).tram))m|=2;
  if(inMap(x,y+1)&&(T(idx(x,y+1)).rail||T(idx(x,y+1)).tram))m|=4;
  if(inMap(x-1,y)&&(T(idx(x-1,y)).rail||T(idx(x-1,y)).tram))m|=8;
  if(t.rail)t.railMask=m;
  if(t.tram)t.tramMask=m;
}

function recalcRailMask4(x,y){

   5. 模擬
===================================================================== */
function hasRoadNear(x,y,r,needPow,noHw){
  for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){
    const nx=x+dx,ny=y+dy;
    if(!inMap(nx,ny))continue;
    const t=T(idx(nx,ny));
    if(t.road&&(!noHw||!t.hw)&&(!needPow||t.rp))return true; // noHw：分區生長只認普通路（高速不吸引住宅，T21）
  }
  return false;
}
function computePower(){
  let plants=0,so=0,wi=0;
  for(let i=0;i<N*N;i++){tiles[i].rp=false;const b=tiles[i].bld;if(b&&!b.ref){if(b.k===5)plants++;else if(b.k===25)so++;else if(b.k===26)wi++;}}
  // T82：再生能源加容量；仍需至少一座電廠啟動路網 BFS
  if(!plants)return 0;
  const seen=new Uint8Array(N*N);
  const q=[];
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){
    const t=T(idx(x,y));
    if(!(t.bld&&t.bld.k===5))continue;
    for(const[dx,dy]of[[0,-1],[1,0],[0,1],[-1,0]]){
      const nx=x+dx,ny=y+dy;
      if(inMap(nx,ny)&&T(idx(nx,ny)).road&&!seen[idx(nx,ny)]){
        seen[idx(nx,ny)]=1;q.push([nx,ny,0]);
      }
    }
  }
  let head=0;
  while(head<q.length){
    const[x,y,d]=q[head++];
    T(idx(x,y)).rp=true;
    if(d>=90)continue;
    for(const[dx,dy]of[[0,-1],[1,0],[0,1],[-1,0]]){
      const nx=x+dx,ny=y+dy;
      if(!inMap(nx,ny))continue;
      const j=idx(nx,ny);
      if(T(j).road&&!seen[j]){seen[j]=1;q.push([nx,ny,d+1]);}
    }
  }
  return plants*(PLANT_CAP+(pol&&pol.ecoReg?5:0))+so*15+wi*20; // T82 太陽能/風力額外容量；T122 節能條例：每電廠供電棟數+5
}
function countNear(x,y,r,pred){
  let n=0;
  for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){
    const nx=x+dx,ny=y+dy;
    if(!inMap(nx,ny))continue;
    if(pred(T(idx(nx,ny))))n++;
  }
  return n;
}
// T129：鄰近道路壅堵程度（Chebyshev 半徑 r）——countNear 的 pred 只拿得到鄰格 tile 物件、查不到其 idx，
// 故仿 stampCov／stampPolSrc 手法自行逐格算 idx 查 roadLoad/ROAD_CAP；回傳半徑內「目前過載」的道路格數。
// load 全圖為 0（空車城）時任一鄰格 roadLoad[j]>ROAD_CAP 恆假、回傳 0，供 happyParts「交通壅堵」項不變量成立。
function congestNear(x,y,r){
  let n=0;
  for(let dy=-r;dy<=r;dy++){const ny=y+dy;if(ny<0||ny>=N)continue;
    for(let dx=-r;dx<=r;dx++){const nx=x+dx;if(nx<0||nx>=N)continue;
      const j=idx(nx,ny),tt=tiles[j];
      if(tt.road&&roadLoad[j]>ROAD_CAP[(tt.rc||2)-1])n++;
    }}
  return n;
}
/* T61 服務覆蓋計數場：擺放時蓋印一次，tick 內 O(1) 讀取（取代逐棟 countNear 方框掃描）。
   運行時重建、不入存檔（load/newWorld 後與 undo 後 rebuildCov 全量重建）。語義與原 countNear(...)>0／計數完全一致。*/
const COVR={park:4,plant:4,fire:9,school:8,stadium:10,police:10,hospital:12,clinic:6,library:6,post:8,cemetery:10,bus:6,rdec:2,ambulance:10,fire2:12,prison:8,university:10,parking:8,museum:8,theater:7,cinema:6,grandlib:12,court:10,institute:8,botanical:10,megahosp:18}; // T138：博物館/劇院/電影院＝觀光＋幸福半徑；圖書總館＝大範圍教育（水族館/動物園/遊樂園純觀光係數，無 COV 欄）；T139：法院＝降犯罪半徑（配合警局）；研究院＝科技升級加成半徑；植物園＝大範圍幸福半徑；綜合醫院＝超大半徑醫療（市政廳/會展中心/氣象站為全城效果，無 COV 欄）
const COV={};for(const f in COVR)COV[f]=new Uint8Array(N*N);
// T67：新服務 k 接入覆蓋場；高級消防用 fire2 更大半徑
function covFieldOfK(k){return {4:'park',5:'plant',6:'fire',7:'school',9:'stadium',11:'police',12:'hospital',13:'clinic',14:'library',15:'post',16:'cemetery',28:'ambulance',30:'fire2',31:'prison',32:'university',20:'parking',35:'museum',36:'theater',40:'cinema',41:'grandlib',43:'court',45:'institute',47:'botanical',48:'megahosp'}[k]||null;} // T138：k35/36/40/41 接入覆蓋場；T139：k43/45/47/48 接入覆蓋場（k42/44/46 市政廳/會展中心/氣象站為全城效果，無 COV 欄）
// Chebyshev 半徑 r 方框逐格 ±delta（邊界裁剪），支持重疊計數
function stampCov(field,x,y,r,delta){
  const a=COV[field];
  for(let dy=-r;dy<=r;dy++){const ny=y+dy;if(ny<0||ny>=N)continue;
    for(let dx=-r;dx<=r;dx++){const nx=x+dx;if(nx<0||nx>=N)continue;a[idx(nx,ny)]+=delta;}}
}
/* T110 污染擴散場：中心強、半徑 4-6 遞減；樹格對鄰域 −2 減免。POL 為對外曝光之最終值
   （供住宅幸福 −POL[i] 係數／小地圖熱度視圖／inspect 讀取）；POLBASE=污染源原始衰減和、
   POLTREE=樹木減免累計（皆 Uint8 內部量），POL 由兩者相減衍生重算——避免 Uint8Array 無號下溢
   （教訓見 §11-12：COV 缺蓋印會 0→255，此處改用雙陣列衍生法從根本避開，種樹/砍樹可安全對稱 ±）。
   命名地雷：勿與稅率政策全域 pol（T55，小寫）混淆。運行時重建、不入存檔（隨 rebuildCov 一併重建）。*/
const POL=new Uint8Array(N*N),POLBASE=new Uint8Array(N*N),POLTREE=new Uint8Array(N*N);
const POL_SRC={3:{r:5,p:30},5:{r:6,p:40},8:{r:5,p:26},19:{r:6,p:34}}; // 工業/電廠/垃圾場/機場：半徑4-6、中心峰值
const POL_LV3_MAX=15; // T113：lv2→3 升級要求 POL 低於此值（低污染門檻）
function recomputePol(i){const v=POLBASE[i]-POLTREE[i];POL[i]=v>0?(v<255?v:255):0;}
// 中心強、半徑遞減至0（Chebyshev，與COVR家族一致）；sign=+1放置/-1拆除，doPlace/doze成對呼叫維持±對稱
function stampPolSrc(x,y,k,sign){
  const cfg=POL_SRC[k];if(!cfg)return;const r=cfg.r,p=cfg.p;
  for(let dy=-r;dy<=r;dy++){const ny=y+dy;if(ny<0||ny>=N)continue;
    for(let dx=-r;dx<=r;dx++){const nx=x+dx;if(nx<0||nx>=N)continue;
      const d=Math.max(Math.abs(dx),Math.abs(dy));
      const v=Math.round(p*(1-d/(r+1)));if(v<=0)continue;
      const i=idx(nx,ny);
      POLBASE[i]=clamp(POLBASE[i]+sign*v,0,255);recomputePol(i);
    }}
}
// 樹格對鄰域（半徑2）固定 −2 減免；sign=+1種樹/-1砍樹，doPlace 通用 hadTree 差異偵測成對呼叫
function stampPolTree(x,y,sign){
  const r=2;
  for(let dy=-r;dy<=r;dy++){const ny=y+dy;if(ny<0||ny>=N)continue;
    for(let dx=-r;dx<=r;dx++){const nx=x+dx;if(nx<0||nx>=N)continue;
      const i=idx(nx,ny);
      POLTREE[i]=clamp(POLTREE[i]+sign*2,0,255);recomputePol(i);
    }}
}
// T137：工業洩漏——工業建築起火期間機率觸發，該格 POL 疊加尖峰並持續數日（比照 stampPolSrc 加法對稱手法＋隕石坑「持續危害」樣板，改為顯式天數倒數）
const LEAK_POL_SPIKE=60,LEAK_DURATION=6; // 洩漏 POL 疊加尖峰值與持續天數
const leakDays=new Uint8Array(N*N); // 洩漏持續天數倒數（0=無洩漏），運行時場，不入存檔；隨 rebuildCov 全量重建時尖峰同步失效，需與此陣列成對歸零（newWorld/load，鐵律7）
function startLeak(x,y){ // 供 tick() 因果觸發與 GV.leak() 手動鉤子共用，避免兩處邏輯分岔（仿 meteorStrike 慣例）
  const i=idx(x,y);
  if(leakDays[i]>0)return; // 已在洩漏中，不重複疊加尖峰
  leakDays[i]=LEAK_DURATION;
  POLBASE[i]=clamp(POLBASE[i]+LEAK_POL_SPIKE,0,255);recomputePol(i);
  toast('☣️ 工業洩漏！污染物外洩擴散','bad',x,y);sErr();
}
/* T130：地價場——服務覆蓋＋景觀（公園）－污染－犯罪 的靜態基準分，疊加（−）壅堵動態扣分，128為中性基準（0-255）。
   比照 §COV/POL 家族設計：LANDBASE=靜態基準（服務/景觀/污染/犯罪，rebuildCov 內同步全量重建，load/newWorld/undo
   自動覆蓋）；LAND=對外曝光值（LANDBASE 疊加壅堵動態扣分衍生，仿 T110 POL=POLBASE-POLTREE 手法，先夾 0 避免
   Uint8 無號下溢）。景觀項僅取玩家可控的 COV.park（不含天然樹木/水岸——newWorld 的 genWorld 恆保留 6%-42%
   水域且常伴生樹木，若計入天然地形將無法滿足「空曠新圖 LAND 恆 128」硬性不變量，故卡面「景觀（公園/樹/水岸）」
   用詞中僅落地與空曠新圖歸零相容的公園覆蓋，如實記錄此設計取捨）。不入存檔（rebuild 可重建）。*/
const LAND=new Uint8Array(N*N), LANDBASE=new Uint8Array(N*N);
// 靜態基準單格公式：服務覆蓋（警/消/校/醫/圖/郵各 COV.xxx>0 記1分，0~6）＋景觀（COV.park 封頂2分）
// －污染 POL[i]*1.2－犯罪 countNear*10；全零時 clamp(128+0,0,255) 精確回傳 128（空曠新圖不變量之根本）
function landStaticAt(x,y){
  const i=idx(x,y);
  const svc=(COV.police[i]>0?1:0)+((COV.fire[i]>0||COV.fire2[i]>0)?1:0)+(COV.school[i]>0?1:0)
    +((COV.hospital[i]>0||COV.clinic[i]>0)?1:0)+(COV.library[i]>0?1:0)+(COV.post[i]>0?1:0);
  const land=Math.min(2,COV.park[i]);
  const crime=countNear(x,y,4,tt=>tt.bld&&tt.bld.k<=3&&tt.bld.crime); // 犯罪為動態源，比照 judgeWealth 用 countNear（未蓋印）
  return clamp(128+svc*8+land*8-(POL[i]||0)*1.2-crime*10,0,255);
}
// 動態壅堵懲罰（單格，供 rebuildCov 初值與 tick 每日刷新共用）：半徑2內過載道路格數 * 12，封頂50；空車城恆為0
function landCongestAt(x,y){return Math.min(50,congestNear(x,y,2)*12);}
// 由 LANDBASE 衍生 LAND（扣壅堵懲罰後先夾0再寫回 Uint8Array，避免無號下溢）；rebuildCov 尾端與 tick() 每日皆呼叫
function recomputeLandDynamic(){
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){
    const i=idx(x,y);
    const v=LANDBASE[i]-landCongestAt(x,y);
    LAND[i]=v>0?(v<255?v:255):0;
  }
}
/* T142：教育場——依 school/university/library 覆蓋累積住宅可用之受教勞動力水準，比照 §COV/POL/LAND 家族設計
   （LAND/POL rebuildCov 先例，見上方 T130 段落）。EDU=Uint8Array(N*N)，取 0 為基準（無教育建築覆蓋時全城恆為 0，
   即「中性教育」之根本——EDU 純累加不含扣分項，異於 LAND/POL 的 128 中性基準，取 0 基準更直觀）。單格分數＝
   COV.school/COV.university/COV.library 三家族各自 >0 門檻各疊加固定權重（大學>學校>圖書館，呼應既有升級加成
   排序 uniBoost1.8>schoolBoost1.6>libraryBoost1.25），clamp 0-255。於 rebuildCov 尾端隨 COV 同步全量重建
   （load/newWorld/undo 自動覆蓋）。不入存檔（rebuild 可重建）。*/
const EDU=new Uint8Array(N*N);
const EDU_W_SCHOOL=50,EDU_W_UNI=90,EDU_W_LIB=35; // 學校/大學/圖書館覆蓋各自加分權重
function eduStaticAt(x,y){
  const i=idx(x,y);
  const v=(COV.school[i]>0?EDU_W_SCHOOL:0)+(COV.university[i]>0?EDU_W_UNI:0)+(COV.library[i]>0?EDU_W_LIB:0);
  return v<255?v:255;
}
// 全量重建（load/newWorld 後、undo 後）：清零後掃全圖蓋印每個設施（含體育場 4 格皆為 k9 覆蓋源，與 countNear 一致）
function rebuildCov(){
  for(const f in COV)COV[f].fill(0);
  POLBASE.fill(0);POLTREE.fill(0);POL.fill(0); // T110：污染場隨 COV 同步全量重建
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){
    const t=tiles[idx(x,y)],b=t.bld;
    if(b){
      if(b.ref){if(b.k===9)stampCov('stadium',x,y,COVR.stadium,1);}
      else{
        const f=covFieldOfK(b.k);if(f)stampCov(f,x,y,COVR[f],1);
        if(POL_SRC[b.k])stampPolSrc(x,y,b.k,1); // T110：污染源（工業/電廠/垃圾場/機場）
      }
    }
    if(t.rdec)stampCov('rdec',x,y,COVR.rdec,1);
    if(t.bus)stampCov('bus',x,y,COVR.bus,1);
    if(t.tree)stampPolTree(x,y,1); // T110：樹格鄰域污染減免
  }
  for(let y=0;y<N;y++)for(let x=0;x<N;x++)LANDBASE[idx(x,y)]=landStaticAt(x,y); // T130：地價靜態基準隨 COV/POL 同步全量重建
  recomputeLandDynamic(); // T130：以當下 roadLoad 疊一次壅堵初值（undo 未重置 roadLoad，newWorld/load 已於呼叫前歸零）
  for(let y=0;y<N;y++)for(let x=0;x<N;x++)EDU[idx(x,y)]=eduStaticAt(x,y); // T142：教育場隨 COV 同步全量重建
}
// T123：住宅財富分級判定——服務覆蓋數（警/校/醫/公園）－POL污染－犯罪 加權得分 → 0貧/1中/2富
// 純資料層：只在住宅新建／升級時呼叫寫入 bld.we，不參與稅收/幸福/需求任何公式（wealth 只寫不讀）
function judgeWealth(x,y){
  const i=idx(x,y);
  const cov=(COV.police[i]>0?1:0)+(COV.school[i]>0?1:0)+(COV.hospital[i]>0?1:0)+(COV.park[i]>0?1:0);
  const crime=countNear(x,y,4,tt=>tt.bld&&tt.bld.k<=3&&tt.bld.crime); // 犯罪為動態源，比照 §11-11 用 countNear（未蓋印）
  const landTerm=(LAND[i]-128)/128; // T130：地價附加項（-1~+1），附加不取代既有服務/污染/犯罪項；中性地價(128)精確貢獻0
  const commuteTerm=-(commutePenalty[i]||0)*3; // T141：通勤附加項（不可達/路徑過長拉低財富評分，叢集快取讀取），無就業區/未觸發時精確為0
  const eduTerm=(EDU[i]/255)*.6; // T142：教育附加項（受教勞動力足→易判富），附加不取代既有各項；EDU=0（無教育建築覆蓋，中性教育）時精確恆為0
  const score=cov-(POL[i]||0)*.05-crime*.4+landTerm*.5+commuteTerm+eduTerm;
  if(score>=2)return 2; // 富
  if(score>0)return 1;  // 中
  return 0;              // 貧
}
/* T140：資源供應鏈——地圖稀缺資源層（比照 §COV/POL/LAND 家族設計）。
   RESOURCE＝每格資源型別（0無/1油/2礦），僅由種子決定、地理集中（低頻值噪聲門檻，非均勻散布）；
   與 COV/POL/LAND 同款「運行時重建、不入存檔」——genWorld（新圖）與 load（讀檔）皆呼叫 genResource(seed) 用
   獨立種子化亂數（mulberry32 衍生噪聲）重建，不觸碰全域主亂數流 R()/ri()，故不影響地形/樹木/河流等既有生成序列。
   RDEP＝各資源格「累計已開採量」（Uint16Array，僅開採過的格非零），達 RESOURCE_STOCK 上限即該格停產；
   為運行時場但**內容非純衍生**（開採歷史無法從種子重建），故其存檔鏡射改走稀疏可選欄位 rdep（僅存非零格
   [i,amt] 配對，舊檔缺欄位＝未耗損，見 save()/load()），newWorld()/load() 皆 RDEP.fill(0) 後再視存檔內容還原（鐵律7）。*/
const RESOURCE=new Uint8Array(N*N), RDEP=new Uint16Array(N*N);
function genResource(sd){
  const noiOil=makeNoise(mulberry32(sd^0x7c2f19),64), noiOre=makeNoise(mulberry32(sd^0x1a4d63),64); // 獨立種子噪聲，不消耗全域 R()
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){
    const i=idx(x,y),t=tiles[i].t;
    let r=0;
    if(t===1||t===2){ // 僅陸地（沙/草）鋪資源，避開水域（呼應建築須陸地放置的通用限制）
      if(noiOil(x*.045,y*.045)>.74)r=1;        // 油：低頻噪聲門檻→地理集中斑塊（非均勻）
      else if(noiOre(x*.05+50,y*.05+50)>.74)r=2; // 礦：獨立噪聲場＋offset，避免與油田系統性重疊
    }
    RESOURCE[i]=r;
  }
}
function computeWater(){
  let towers=0;
  for(let i=0;i<N*N;i++){tiles[i].wr=false;if(tiles[i].bld&&tiles[i].bld.k===10)towers++;}
  if(!towers)return 0;
  const seen=new Uint8Array(N*N);
  const q=[];
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){
    const t=T(idx(x,y));
    if(!(t.bld&&t.bld.k===10))continue;
    for(const[dx,dy]of[[0,-1],[1,0],[0,1],[-1,0]]){
      const nx=x+dx,ny=y+dy;
      if(inMap(nx,ny)&&T(idx(nx,ny)).wp&&!seen[idx(nx,ny)]){
        seen[idx(nx,ny)]=1;q.push([nx,ny,0]);
      }
    }
  }
  let head=0;
  while(head<q.length){
    const[x,y,d]=q[head++];
    T(idx(x,y)).wr=true;
    if(d>=90)continue;
    for(const[dx,dy]of[[0,-1],[1,0],[0,1],[-1,0]]){
      const nx=x+dx,ny=y+dy;
      if(!inMap(nx,ny))continue;
      const j=idx(nx,ny);
      if(T(j).wp&&!seen[j]){seen[j]=1;q.push([nx,ny,d+1]);}
    }
  }
  return towers*WATER_TOWER_CAP;
}
function hasWaterNear(x,y,r=2){
  for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){
    const nx=x+dx,ny=y+dy;
    if(!inMap(nx,ny))continue;
    if(T(idx(nx,ny)).wr)return true;
  }
  return false;
}
// T117：隕石落點共用邏輯（tick() 自動觸發／GV.meteor(x,y) 手動鉤子共用，避免兩處邏輯分岔）
// 半徑2（Chebyshev）內建築→既有廢墟鏈、樹木清空；中心格改設隕石坑地物 crater（與 ruin 互斥，坑不再另計焦土）；
// 複用地震 shakeT 震屏＋既有 flashT 全屏閃光；toast 帶座標供 T114 通知中心跳轉。
function meteorStrike(cx,cy){
  if(!inMap(cx,cy))return false;
  for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++){
    const nx=cx+dx,ny=cy+dy;
    if(!inMap(nx,ny))continue;
    const nt=T(idx(nx,ny)),nb=nt.bld;
    if(nb&&!nb.ref&&nb.k<=3){if(nb.k===3)stampPolSrc(nx,ny,3,-1);nt.bld=null;if(!(dx===0&&dy===0))nt.ruin=1;}
    if(nt.tree)nt.tree=0;
  }
  const ct=T(idx(cx,cy));ct.ruin=0;ct.crater=1;
  shakeT=.45;flashT=.4;
  toast('☄️ 隕石墜落！留下隕石坑並持續起火，需付費剷除','bad',cx,cy);sErr();
  return true;
}
// T132：場景戰役目標評估（僅 scenario 非 null 時由 tick() 呼叫，複用既有挑戰管線與模擬狀態，不新增模擬公式、不消耗 R()）
function scenarioCoverage(field){ // 服務覆蓋率：住宅分區格中被該設施覆蓋的比例（COV 家族既有語義，T61）
  let zoned=0,covered=0;
  for(let i=0;i<N*N;i++){
    if(tiles[i].zone===1){zoned++;if(COV[field]&&COV[field][i]>0)covered++;}
  }
  return zoned?covered/zoned:0;
}
function scenarioGoalMet(sc){
  const g=sc.goal,elapsed=day-scenario.startDay;
  switch(g.type){
    case 'pop':return pop>=g.target;
    case 'cash':return money>=g.target;
    case 'star':return bestStar>=g.target;
    case 'happy':return (scenario.hold||0)>=g.hold;
    case 'debt':return elapsed>=g.byDay&&money>=0&&!loan;
    case 'disaster':return pop>=g.target;
    case 'coverage':return scenarioCoverage(g.field)>=g.target;
    default:return false;
  }
}
function scenarioFailMet(sc){
  if(sc.goal.type==='debt'&&money<0)return true; // 零負債：破產立即失敗，不待期限
  return sc.fail&&sc.fail.type==='day'&&(day-scenario.startDay)>=sc.fail.byDay;
}
// T133：城市等級點數＝人口＋幸福＋服務覆蓋率的加權和。直接讀 tiles/COV/cityHappy 現狀求值（不依賴 pop 全域是否已於本次 tick 重算），
// 故 tick()／load()／newWorld() 皆可安全呼叫；純唯讀掃描，不消耗 R()、不寫入任何模擬狀態（僅回傳數字）。
// 幸福項採「相對基準 .6」的差值（而非直接乘 cityHappy），確保零人口新城市（cityHappy 恆為預設 .6）幸福項精確為 0，不會無中生有點數。
function computeCityPoints(){
  let popN=0,zoned=0,covSum=0;
  for(let i=0;i<N*N;i++){
    const t=tiles[i],b=t.bld;
    if(t.zone===1){
      zoned++;
      let c=0;
      if(COV.police[i]>0)c++;
      if(COV.fire[i]>0||(COV.fire2&&COV.fire2[i]>0))c++;
      if(COV.school[i]>0)c++;
      if(COV.hospital[i]>0||(COV.clinic&&COV.clinic[i]>0))c++;
      if(COV.park[i]>0)c++;
      covSum+=c/5;
    }
    if(b&&!b.ref){
      if(b.k===1&&b.pw!==false&&!b.sick&&!b.death)popN+=Math.round(POPS[b.lv]*(b.den?DEN_POP[b.den-1]:1));
      else if(b.k===33)popN+=TOWER_POP; // T127：住宅摩天樓（root，人口併入城市點數的人口項）
    }
  }
  const svcCov=zoned?covSum/zoned:0;
  return Math.max(0,Math.round(popN+(cityHappy-.6)*400+svcCov*800));
}
function tick(){
  day++;
  const sea=season(); // T136：本日四季索引（0春1夏2秋3冬），供農場/電力/觀光季節係數共用，純由 day 導出不消耗 R()
  if(drought&&sea!==1)drought=false; // T137：乾旱季末（不再是夏）自動解除，純布林比較不消耗 R()
  // 季節轉換 toast（T18）：入冬／開春各一次，flag 防重複；季節由 day 導出
  {const w=inWinter()?1:0;
   if(w!==wSeason){
     if(wSeason!==-1)toast(w?'❄️ '+townName+'入冬了':'🌱 春天來了');
     wSeason=w;
   }}
  // 天氣狀態機（T17）：每天遞減，歸零擲骰換態；暴雨每天 25% 觸發閃電
  if(--wxT<=0){
    if(weather===0){if(R()<.12){weather=1;wxT=3+ri(6);}else wxT=3+ri(5);}
    else if(weather===1){
      if(R()<.20){weather=2;wxT=1+ri(2);}
      else if(R()<.35){weather=0;wxT=4+ri(6);}
      else wxT=2+ri(3);
    }else{
      if(R()<.35){weather=0;wxT=4+ri(6);}
      else{weather=1;wxT=2+ri(4);}
    }
  }
  if(weather===2&&!inWinter()&&R()<.25){flashT=.4;sThunder();} // 冬季不觸發閃電（T18）
  composer.update(); // 天氣／季節變化時背景音樂可能換情緒（T37）
  ambientBus.update(); // T144：環境音分層混音——複用同一晝夜/天氣/季節切換觸發點，依交通/人口/工業/公園指標平滑重算四層增益
  // T141：通勤/就業 agent——叢集級近似（比照 T119 computeGarbLocal／busBFS 尋路慣例）：每 COMMUTE_PERIOD 天
  // （避免每 tick 全城 BFS，控制大城效能）重算一次「住宅叢集代表→最近就業區」路徑快取；其餘天數複用快取，
  // 僅逐叢集代表沿快取路徑累加 commutePass／roadPass（純陣列走訪，不消耗 R()，與 T129 壅堵場耦合）。
  if(day%COMMUTE_PERIOD===0)computeCommute();
  for(const cl of commuteClusters)for(const j of cl.path){roadPass[j]+=COMMUTE_TRIP_W;commutePass[j]+=COMMUTE_TRIP_W;}
  // T129：道路壅堵場——用當日累計 roadPass 做衰減式移動平均，套公式後歸零累加器供下一天統計
  // （純陣列運算，不消耗 R()；空車城 roadPass 恆 0 時 load 恆 0，speed/happyParts 與改動前逐位元一致）
  for(let i=0;i<N*N;i++){roadLoad[i]=roadLoad[i]*.85+roadPass[i]*.15;roadPass[i]=0;}
  recomputeLandDynamic(); // T130：地價動態部分——每日依最新 roadLoad 疊加壅堵扣分（靜態基準 LANDBASE 不動，純陣列衍生不消耗 R()）
  // T141：通勤場獨立衰減式移動平均（純觀察用途，供 GV.commuteLoad/commuteAt 讀取，不回饋 roadLoad 避免雙重疊加；
  // 無通勤 trip 時 commutePass 恆 0，此項恆為 0，與改動前逐位元一致）
  for(let i=0;i<N*N;i++){commuteLoad[i]=commuteLoad[i]*.85+commutePass[i]*.15;commutePass[i]=0;}
  const cap=Math.floor(computePower()*POWER_SEASON_MULT[sea]); // T136：夏季冷氣／冬季暖氣抬高電力需求壓力＝有效供電容量打折；春秋 ×1 精確恆等（Math.floor 對已為整數之值原樣返回）
  const wCap=Math.floor(computeWater()*(drought?DROUGHT_WATER_MULT:1)); // T137：乾旱期間供水上限打折（非乾旱精確恆等 ×1，Math.floor 對已為整數之值原樣返回）
  // 死亡與墓園前置處理（T38）：既有死亡事件的懲罰標記與自動消退
  const deathPenalty=new Uint8Array(N*N);
  let cemCount=0;
  for(let i=0;i<N*N;i++){const b=tiles[i].bld;if(b&&b.k===16)cemCount++;}
  const cemCap=cemCount*3;
  let soothed=0;
  for(let i=0;i<N*N;i++){
    const b=tiles[i].bld;
    if(!b||b.k!==1||!b.death)continue;
    b.deathAge=(b.deathAge||0)+1;
    if(b.deathAge>=10){b.death=0;b.deathAge=0;b.sick=0;continue;}
    const x=i%N,y=(i/N)|0;
    const covered=COV.cemetery[i]>0;                    // T61：墓園半徑10覆蓋（原 countNear k===16）
    if(covered&&soothed<cemCap){soothed++;continue;}
    // 未安撫：半徑 6 內其他住宅幸福 -0.1
    for(let dy=-6;dy<=6;dy++)for(let dx=-6;dx<=6;dx++){
      const nx=x+dx,ny=y+dy;

      if(copts.length)copts[ri(copts.length)].fire=1;
    }
    // T118：暴亂——幸福過低且存在高犯罪住宅簇時低機率觸發，封鎖鄰接道路直到警局自然平息或付費鎮壓（複用既有犯罪場 countNear 判定手法，同 T111 幸福構成 crime 局部密度算式）
    if(!riot&&cityHappy<.3){
      const hot=[];
      for(let i=0;i<N*N;i++){
        const b=tiles[i].bld;
        if(!b||b.k!==1||b.ref)continue;
        const hx=i%N,hy=(i/N)|0;
        if(countNear(hx,hy,4,tt=>tt.bld&&tt.bld.k<=3&&tt.bld.crime)>=2)hot.push(i);
      }
      if(hot.length&&R()<.05*DIFF_HAZ[diff]){
        const cells=hot.slice(0,10);
        for(const ci of cells){const cb=tiles[ci].bld;if(cb)cb.riot=1;}
        riot={cells,days:10+ri(10)};
        toast('🔥 暴亂爆發！封鎖道路，警局可自然平息或付費鎮壓','bad',cells[0]%N,(cells[0]/N)|0);sErr();
      }
    }
    if(riot){
      const kept=[];
      for(const ci of riot.cells){
        const rb=tiles[ci].bld;
        if(!rb||rb.k!==1)continue;                        // 建築已消失（拆除／其他災害摧毀）：自動移出名單
        if(COV.police[ci]>0&&R()<.5){rb.riot=0;continue;}  // 警局覆蓋 → 高機率自然平息（逐格獨立判定）
        kept.push(ci);
      }
      riot.days--;
      if(!kept.length||riot.days<=0){
        for(const ci of kept){const rb=tiles[ci].bld;if(rb)rb.riot=0;}
        riot=null;
      }else{
        riot.cells=kept;
      }
    }
    // T137：瘟疫——高密度＋低診所/醫院覆蓋住宅簇間蔓延（複用上方 T118 暴亂熱點簇掃描手法：countNear 密度門檻→候選清單→機率觸發→cells/days 狀態機）
    if(!plague){
      const hot=[];
      for(let i=0;i<N*N;i++){
        const b=tiles[i].bld;
        if(!b||b.k!==1||b.ref||b.plague)continue;
        if(COV.clinic[i]>0||COV.hospital[i]>0)continue; // 已受健康設施覆蓋不列入熱點
        const hx=i%N,hy=(i/N)|0;
        if(countNear(hx,hy,3,tt=>tt.bld&&tt.bld.k===1)>=PLAGUE_DENSITY)hot.push(i);
      }
      if(hot.length&&R()<.02*DIFF_HAZ[diff]){
        const cells=hot.slice(0,10);
        for(const ci of cells){const cb=tiles[ci].bld;if(cb)cb.plague=1;}
        plague={cells,days:12+ri(10)};
        toast('🦠 瘟疫爆發！人口密集區疫情蔓延，醫院覆蓋或隔離可平息','bad',cells[0]%N,(cells[0]/N)|0);sErr();
      }
    }
    if(plague){
      const kept=[];
      for(const ci of plague.cells){
        const pb=tiles[ci].bld;
        if(!pb||pb.k!==1)continue;                          // 建築已消失（拆除／其他災害摧毀）：自動移出名單
        const covered=COV.clinic[ci]>0||COV.hospital[ci]>0;
        if(covered&&R()<.5){pb.plague=0;continue;}          // 健康設施覆蓋 → 高機率自然平息（比照警局平息暴亂）
        pb.h=clamp(pb.h-.02,.05,1);                         // 感染格持續降幸福（產能停擺另見經濟段 &&!b.plague）
        kept.push(ci);
      }
      plague.days--;
      if(!kept.length||plague.days<=0){
        for(const ci of kept){const pb=tiles[ci].bld;if(pb)pb.plague=0;}
        plague=null;
      }else{
        plague.cells=kept;
      }
    }
    // T139：氣象站——季節轉換前 WSTATION_LEAD 天預警即將到來的季節性災害風險（純由 day/season 導出，不消耗 R()，wsN=0 時本段不執行、零回歸影響，比照下方乾旱/暴風雪季節門檻慣例）
    if(wsN>0){
      const doy=(day-1)%360;
      if(doy===100-WSTATION_LEAD)toast('🌦️ 氣象站預報：'+WSTATION_LEAD+'天後入夏，乾旱／沙暴風險升高','gold',N>>1,N>>1);
      else if(doy===300-WSTATION_LEAD)toast('🌦️ 氣象站預報：'+WSTATION_LEAD+'天後入冬，暴風雪風險升高','gold',N>>1,N>>1);
    }
    // T137：乾旱——夏季低機率觸發，壓低供水上限（見上方 wCap）＋抬升火險（見下方起火機率），入秋（season 轉離夏）於本函式起手自動解除
    if(!drought&&sea===1&&R()<.003*DIFF_HAZ[diff]){
      drought=true;
      toast('☀️ 乾旱來襲！供水吃緊、火險升高，入秋自動解除','bad',N>>1,N>>1);
    }
    // T137：暴風雪/沙暴——冬季飄雪、夏季飛沙，全屏色調疊加（見 draw()）＋道路車速幾近癱瘓（見 updCars()）
    if(!blizzard&&sea===3&&R()<.004*DIFF_HAZ[diff]){
      blizzard={days:4+ri(4),type:'snow'};
      toast('🌨️ 暴風雪來襲！道路能見度驟降、車行幾近癱瘓','bad',N>>1,N>>1);
    }else if(!blizzard&&sea===1&&R()<.0015*DIFF_HAZ[diff]){
      blizzard={days:3+ri(3),type:'sand'};
      toast('🏜️ 沙暴來襲！道路能見度驟降、車行幾近癱瘓','bad',N>>1,N>>1);
    }
    if(blizzard){
      blizzard.days--;
      if(blizzard.days<=0)blizzard=null;
    }
  }
  if(shakeT>0)shakeT=Math.max(0,shakeT-0.05);
  // 需求（T109 RCI 需求模型：住宅＝就業盈餘與幸福加權；商業＝人口/商業格數比；工業＝商業貨源缺口；三值歸一化 -1~+1）
  const workers=pop*.6;
  const jobSurplus=clamp((jobs*1.2+25-workers)/70,-1,1); // 就業盈餘（沿用既有基準算式）
  const happyAdj=clamp((cityHappy-.6)*1.2,-1,1);         // 幸福加權：偏離基準幸福 .6 的正負訊號
  dem[1]=clamp(jobSurplus*.7+happyAdj*.3,-1,1);
  let czone=0;for(let i=0;i<N*N;i++)if(tiles[i].zone===2)czone++; // 商業格數（含未建成，對應「格數」字面）
  dem[2]=clamp((pop/Math.max(1,czone)-3)/6,-1,1);
  dem[3]=clamp((jobsC*.8-jobsI)/40,-1,1);
  // 生長：收集候選
  const cands=[];
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){
    const t=T(idx(x,y));
    if(t.zone&&!t.bld&&!t.ruin&&hasRoadNear(x,y,2,true,true))cands.push([x,y,t.zone]); // 生長鄰路只認通電普通路（高速不算，T21）
  }
  // 洗牌取前幾個
  for(let i=cands.length-1;i>0;i--){const j=ri(i+1);const tmp=cands[i];cands[i]=cands[j];cands[j]=tmp;}
  let spawns=0;
  for(const[x,y,z]of cands){
    if(spawns>=3)break;
    // T109：生長機率乘 (1+demand×0.6)；demand<-0.5 該類停長；住宅幸福加成沿用既有係數但只作用於需求項本身
    // （dem[z]===0 時 hf 對乘積無影響，機率精確回落 .10 基準，與改動前 dem=0 時的行為一致，回歸不變量成立）
    const hf=z===1?clamp(cityHappy+.25,.3,1):1;
    const landMul=1+(LAND[idx(x,y)]-128)/128*.4; // T130：地價驅動生長傾向，中性地價(128)精確恆等 ×1
    let p=.10*(1+dem[z]*.6*hf)*landMul;
    if(dem[z]<-.5)p=0;
    const cell=T(idx(x,y));
    if(z===1&&cityHappy<.4)p*=.5; // T72
    if(cell.office)p*=1.35; // T79
    if(R()<p){
      const den=z===1?clamp(getMaxRoadClass(x,y,3),1,5):undefined;
      const kk=cell.office?2:z;
      const we=kk===1?judgeWealth(x,y):undefined; // T123：住宅新建時判定財富級（純資料，不讀不影響經濟）
      cell.bld={k:kk,lv:1,v:(kk===1||kk===2||kk===3)?ri(8):ri(4),age:0,pw:true,h:.6,den,we}; // T101：住宅(k=1) v 擴至 ri(8)；T102：商業(k=2) v 擴至 ri(8)；T103：工業(k=3) v 擴至 ri(8)
      if(kk===3)stampPolSrc(x,y,3,1); // T110：工業新生長為污染源
      spawns++;sPop();
    }
  }
  // 升級
  for(let i=0;i<N*N;i++){
    const b=tiles[i].bld;
    if(!b||b.k>3)continue;
    b.age++;
    const x=i%N,y=(i/N)|0;
    const schoolBoost=(b.k===1&&COV.school[i]>0)?1.6:1;   // T61：學校半徑8覆蓋（原 countNear k===7）
    const libraryBoost=(b.k===1&&COV.library[i]>0)?1.25:1; // T61：圖書館半徑6覆蓋（原 countNear k===14）
    // T87：大學覆蓋升級加成 1.8（僅住宅；有大學時覆蓋學校 1.6）
    const uniBoost=(b.k===1&&COV.university&&COV.university[i]>0)?1.8:1;
    // T138：圖書總館大範圍教育加成 1.5（次於大學 1.8，優於學校 1.6 之下的一般狀況；未放置時 glBoost 恆為 1，eduBoost 精確回退舊行為）
    const glBoost=(b.k===1&&COV.grandlib&&COV.grandlib[i]>0)?1.5:1;
    const eduBoost=uniBoost>1?uniBoost:(glBoost>1?glBoost:schoolBoost);
    // T139：研究院科技加成——覆蓋半徑內「全建築類型」（不限住宅，含商業/工業）升級機率×1.4，區別於上方僅限住宅的教育加成，未放置時恆為 1
    const instituteBoost=(COV.institute&&COV.institute[i]>0)?1.4:1;
    // T113：升級多因子門檻——只擋「新升級」的 roll，已達該級的舊建築不受影響；條件全滿足時機率不變
    const lv2Gate=b.lv!==1||COV.police[i]>0; // lv1→2 需警局覆蓋（通電既有 b.pw 已要求）
    const lv3Gate=b.lv!==2||(COV.school[i]>0&&POL[i]<POL_LV3_MAX); // lv2→3 需學校覆蓋＋低污染（供水既有 b.wa 已要求）
    if(b.lv<3&&b.pw&&(b.lv!==2||b.wa)&&lv2Gate&&lv3Gate&&!b.fire&&b.age>14&&dem[b.k]>.15&&(b.k!==1||b.h>.45)&&R()<.035*eduBoost*libraryBoost*instituteBoost){ // 供水閘門僅升 Lv3 需水（FIX-A/T31）；T139：研究院科技加成疊乘
      b.lv++;b.age=0;b.v=(b.k===1||b.k===2||b.k===3)?ri(8):ri(4);if(b.den===undefined)b.den=3; // T101：住宅v擴至ri(8)；T102：商業v擴至ri(8)；T103：工業v擴至ri(8)
      if(b.k===1)b.we=judgeWealth(x,y); // T123：住宅升級時重判財富級（環境可能已改變）
    }
  }
  // T124：每 30 天重判存量住宅財富級——環境緩慢變化（新污染源/新設施覆蓋）致升降級，漸變：一次最多變一級，不驟升驟降；
  // 走 day（存讀檔本已保留，節奏自然連續不重置）、不消耗 R()，不影響既有隨機流位置與其他系統的種子化重播
  if(day%30===0){
    for(let i=0;i<N*N;i++){
      const b=tiles[i].bld;
      if(!b||b.k!==1)continue;
      const x=i%N,y=(i/N)|0;
      const cur=b.we!==undefined?b.we:1;
      const tgt=judgeWealth(x,y);
      if(tgt>cur)b.we=cur+1;
      else if(tgt<cur)b.we=cur-1;
    }
  }
  // T127：摩天樓合併（升級段後）——2×2 全 lv3 同類分區建築、四格皆通電供水、城市幸福>0.55、對應需求>0.3，機率合併
  // 為住宅塔(k33)/商業塔(k34)（root+ref+sz=2，沿用 v3.0 多格建築架構）；條件不滿足（不快樂城/無合格 2×2 簇）時
  // 外層 if 短路，整段迴圈連掃描都不跑、R() 零消耗，位元回歸不變量成立
  if(cityHappy>.55){
    const mgDone=new Uint8Array(N*N); // 本輪已合併/佔用格，避免相鄰候選重疊消耗同一格
    for(let y=0;y<N-1;y++)for(let x=0;x<N-1;x++){
      const i0=idx(x,y);
      if(mgDone[i0])continue;
      const b0=tiles[i0].bld;
      if(!b0||b0.ref||(b0.k!==1&&b0.k!==2)||b0.lv!==3)continue;
      const kk=b0.k;
      if(dem[kk]<=.3)continue;
      const quad=[[x,y],[x+1,y],[x,y+1],[x+1,y+1]];
      let ok=true;
      for(const[qx,qy]of quad){
        const qi=idx(qx,qy);
        if(mgDone[qi]){ok=false;break;}
        const qb=tiles[qi].bld;
        if(!qb||qb.ref||qb.k!==kk||qb.lv!==3||!qb.pw||!qb.wa||qb.fire){ok=false;break;}
      }
      if(!ok)continue;
      if(R()<.02){ // T127：每合格 2×2 簇每天 2% 機率合併
        for(const[qx,qy]of quad)mgDone[idx(qx,qy)]=1;
        const tk=kk===1?33:34;
        for(const[qx,qy]of quad){
          const qt=T(idx(qx,qy));
          qt.bld=(qx===x&&qy===y)?{k:tk,lv:1,v:ri(2),age:0,pw:true,wa:true,h:1,sz:2}:{k:tk,ref:[x,y]};
        }
        toast((kk===1?'🏙️ 住宅摩天樓落成！':'🏙️ 商業摩天樓落成！'),'gold',x,y);sFanfare();
      }
    }
  }
  // 火災（升級段之後）：起火→蔓延→推進燃燒/燒毀成焦土
  const burning=[];
  for(let i=0;i<N*N;i++){const b=tiles[i].bld;if(b&&b.k<=3&&b.fire)burning.push(i);}
  let fireAlert=false;
  for(let i=0;i<N*N;i++){                                // 起火擲骰（未燃 k≤3）
    const b=tiles[i].bld;
    if(!b||b.k>3||b.fire)continue;
    let p=.0005*(b.k===3?3:1)*b.lv;
    if(drought)p*=DROUGHT_FIRE_MULT;                     // T137：乾旱期間起火機率×2.5（非乾旱精確恆等 ×1）
    const x=i%N,y=(i/N)|0;                               // 消防局半徑 9 覆蓋 → 起火率 -85%
    if((COV.fire[i]>0||(COV.fire2&&COV.fire2[i]>0)))p*=.15;                             // T61：消防局半徑9覆蓋（原 countNear k===6）
    if(R()<p){
      b.fire=1;
      if(!fireAlert){toast('🔥 '+townName+'發生火災！點擊燃燒的建築滅火','bad',x,y);sErr();fireAlert=true;}
    }
  }
  for(const i of burning){                               // 蔓延：20% 點燃 Chebyshev 1 內未燃建築
    if(R()<.20){
      const x=i%N,y=(i/N)|0,opts=[];
      for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
        if(!dx&&!dy)continue;
        const nx=x+dx,ny=y+dy;
        if(!inMap(nx,ny))continue;
        const nb=T(idx(nx,ny)).bld;
        if(nb&&nb.k<=3&&!nb.fire)opts.push(nb);
      }
      if(opts.length)opts[ri(opts.length)].fire=1;
    }
  }
  for(const i of burning){                               // 推進燃燒天數；fire>=5 燒毀成焦土（T119：覆蓋內撲滅改由消防車抵達執行，見 updFireTrucks，不再次日瞬滅）
    const t=tiles[i],b=t.bld;
    if(!b||!b.fire)continue;
    const x=i%N,y=(i/N)|0;
    b.fire++;
    if(b.fire>=5){if(b.k===3)stampPolSrc(x,y,3,-1);t.bld=null;t.ruin=1;} // zone 保留；T110：工業燒毀→撤銷污染源
  }
  if(disastersOn){ // T137：工業洩漏——工業建築正在燃燒且該格尚無洩漏時機率觸發（因果緊扣起火，非獨立隨機事件；置於火災段之後才能捕捉本日新起火與既有延燒/災害引燃）
    for(let i=0;i<N*N;i++){
      const b=tiles[i].bld;
      if(b&&b.k===3&&b.fire&&!leakDays[i]&&R()<.5*DIFF_HAZ[diff])startLeak(i%N,(i/N)|0);
    }
    for(let i=0;i<N*N;i++){ // 尖峰持續天數倒數，期滿撤回（複製 stampPolSrc 加法對稱手法）
      if(leakDays[i]>0){
        leakDays[i]--;
        if(!leakDays[i]){POLBASE[i]=clamp(POLBASE[i]-LEAK_POL_SPIKE,0,255);recomputePol(i);}
      }
    }
  }
  // 犯罪（T32）：未受警察局半徑10覆蓋的 k≤3 建築每天小機率發生犯罪
  let crimeAlert=false;
  for(let i=0;i<N*N;i++){
    const b=tiles[i].bld;
    if(!b||b.k>3||b.crime)continue;
    const x=i%N,y=(i/N)|0;
    if(COV.police[i]>0)continue; // T61：警察局半徑10覆蓋則受保護（原 countNear k===11）
    if(!(COV.prison&&COV.prison[i]>0)&&R()<.001*(b.k===2?2:1)*b.lv*(pol&&pol.curfew?.6:1)*((COV.court&&COV.court[i]>0)?.5:1)){ // T67：監獄半徑8覆蓋則防犯罪（原 countNear k===31，O(N)→O(1)）；T122 宵禁：犯罪率×0.6；T139：法院半徑10覆蓋配合警局再降犯罪率×0.5（未放置時恆×1）
      b.crime=1;
      if(!crimeAlert){toast('🚓 '+townName+'發生犯罪！點擊受害建築處理','bad',x,y);sErr();crimeAlert=true;}
    }
  }
  // 廢棄（T71）：犯罪持續未被玩家處理（crimeBtn/GV.clearCrime）滿 15 天後每天 5% 機率轉為廢棄；
  // 廢棄建築的停稅由既有經濟段 `!b.abandoned` 判定（原已預留，本卡補上唯一賦值來源）
  let abandonAlert=false;
  for(let i=0;i<N*N;i++){
    const b=tiles[i].bld;
    if(!b||b.k>3||!b.crime||b.abandoned)continue;
    b.crimeDays=(b.crimeDays||0)+1;
    if(b.crimeDays>=15&&R()<.05){
      b.abandoned=1;
      if(!abandonAlert){toast('🏚️ '+townName+'有建築因長期犯罪而廢棄，已停止繳稅','bad',i%N,(i/N)|0);sErr();abandonAlert=true;}
    }
  }
  // 生病（T33/T34）：未受健康設施覆蓋的住宅每天小機率生病；醫院覆蓋內次日康復，診所覆蓋內每天50%機率康復
  let sickAlert=false;
  for(let i=0;i<N*N;i++){
    const b=tiles[i].bld;

/* ---------- 公車系統（T26；獨立於 cars 隨機遊走，站點間 BFS 巡迴）---------- */
const buses=[];
const rbuses=[]; // T120：路線公車（依 busRoutes 各配 1 輛，沿路線站序 BFS 往返）；不進存檔，讀檔重新派車
let busList=[];                                    // 站點 tile idx 升序表（每次 updBuses 重建）
function rebuildBusList(){
  busList.length=0;
  for(let i=0;i<N*N;i++)if(tiles[i].bus)busList.push(i);
}
function busNextStop(fromIdx){                      // 環狀輪詢：fromIdx 之後的下一站
  if(!busList.length)return -1;
  for(const s of busList)if(s>fromIdx)return s;
  return busList[0];
}
function busDir(x0,y0,x1,y1){
  const dx=x1-x0,dy=y1-y0;
  for(let d=0;d<4;d++)if(DIRV[d][0]===dx&&DIRV[d][1]===dy)return d;
  return 0;
}
// 沿道路 BFS 最短路（含高速）；回傳 [[x,y]...] 起→迄（含端點），無路回 null
function busBFS(sx,sy,gx,gy){
  if(!inMap(sx,sy)||!inMap(gx,gy))return null;
  if(!T(idx(sx,sy)).road||!T(idx(gx,gy)).road)return null;
  const start=idx(sx,sy),goal=idx(gx,gy);
  if(start===goal)return[[sx,sy]];
  const prev=new Int32Array(N*N).fill(-1);
  const seen=new Uint8Array(N*N);
  const q=[start];seen[start]=1;
  let head=0,found=false;
  while(head<q.length){
    const cur=q[head++];
    if(cur===goal){found=true;break;}
    const cx=cur%N,cy=(cur/N)|0;
    for(const[dx,dy]of DIRV){
      const nx=cx+dx,ny=cy+dy;
      if(!inMap(nx,ny))continue;
      const j=idx(nx,ny);
      if(seen[j]||!T(j).road)continue;
      seen[j]=1;prev[j]=cur;q.push(j);
    }
  }
  if(!found)return null;
  const path=[];
  for(let c=goal;c!==-1;c=prev[c])path.push([c%N,(c/N)|0]);
  path.reverse();
  return path;
}
function busPlanNext(bus){                          // 由目標站起連續嘗試，跳過不可達站；成功回 true
  let g=busNextStop(bus.stop),tries=0;
  while(g>=0&&tries<busList.length){
    if(tiles[g]&&tiles[g].bus){
      const path=busBFS(bus.x,bus.y,g%N,(g/N)|0);
      if(path&&path.length>1){bus.path=path;bus.pi=0;bus.p=0;bus.stop=g;return true;}
    }
    g=busNextStop(g);tries++;
  }
  return false;
}
function busReplan(bus){                            // 目標不變、路斷重算；失敗回 false
  if(!(tiles[bus.stop]&&tiles[bus.stop].bus))return false;
  const path=busBFS(bus.x,bus.y,bus.stop%N,(bus.stop/N)|0);
  if(path&&path.length>1){bus.path=path;bus.pi=0;bus.p=0;return true;}
  return false;
}
function updBuses(dt){
  rebuildBusList();
  const nStop=busList.length;
  const target=nStop>=2?Math.min(nStop-1,4):0;       // ≥2 站才發車，最多 4 輛
  while(buses.length<target){
    const s=busList[ri(busList.length)];
    buses.push({x:s%N,y:(s/N)|0,stop:s,path:null,pi:0,p:0,d:0,wait:1});
  }
  if(buses.length>target)buses.length=target;
  if(!target)return;
  for(const bus of buses){
    if(!inMap(bus.x,bus.y)||!T(idx(bus.x,bus.y)).road){ // 所在路被拆→重生於某站
      const s=busList[ri(busList.length)];
      bus.x=s%N;bus.y=(s/N)|0;bus.stop=s;bus.path=null;bus.pi=0;bus.p=0;bus.wait=1;bus.d=0;
      continue;
    }
    if(bus.wait>0){bus.wait-=dt;continue;}            // 到站停 1s
    if(bus.path&&!(tiles[bus.stop]&&tiles[bus.stop].bus)){bus.path=null;bus.p=0;} // 目標站被拆→改選
    if(!bus.path){
      if(!busPlanNext(bus))bus.wait=1;                // 全站不可達→稍後再試
      continue;
    }
    const ct=T(idx(bus.x,bus.y));
    bus.p+=dt*1.1*(ct&&ct.hw?1.6:1)*(ct&&ct.busLane?1.3:1); // 1.1 格/s，高速×1.6，公車道×1.3（T76）
    let guard=0;
    while(bus.p>=1&&guard++<64){
      const nxt=bus.path[bus.pi+1];
      if(!nxt||!inMap(nxt[0],nxt[1])||!T(idx(nxt[0],nxt[1])).road){ // 下一格不可走→重算
        bus.p=0;
        if(!busReplan(bus))bus.path=null;
        break;
      }
      bus.p-=1;
      bus.d=busDir(bus.x,bus.y,nxt[0],nxt[1]);
      bus.x=nxt[0];bus.y=nxt[1];bus.pi++;
      if(bus.pi>=bus.path.length-1){                 // 抵達目標站→停靠
        bus.path=null;bus.p=0;bus.wait=1;
        break;
      }
    }
  }
}
/* ---------- T120：公車路線——玩家自訂站序（busRoutes），公車沿路線站序 BFS 往返（ping-pong）
   複用 busBFS/busDir；斷路（中途道路被拆／規劃失敗）就地折返（反轉方向）不崩潰；
   路線不足 2 個可用站時該路線不派車（拆站已由 removeBusStopFromRoutes 自動剔除失效站）---------- */
function removeBusStopFromRoutes(i){ // 拆站時自動從所有路線剔除該站
  for(const rt of busRoutes){const p=rt.stops.indexOf(i);if(p>=0)rt.stops.splice(p,1);}
}
function updRouteBuses(dt){
  for(let r=0;r<3;r++){ // 依需要為每條可行路線補派 1 輛車
    const rt=busRoutes[r];
    const validStops=rt.stops.filter(si=>tiles[si]&&tiles[si].bus);
    let bus=rbuses.find(b=>b.r===r);
    if(validStops.length<2){if(bus)rbuses.splice(rbuses.indexOf(bus),1);continue;}
    if(!bus){
      const s0=validStops[0];
      rbuses.push({r,x:s0%N,y:(s0/N)|0,si:0,dir:1,path:null,pi:0,p:0,d:0,wait:.5});
    }
  }
  for(let i=rbuses.length-1;i>=0;i--){
    const bus=rbuses[i];
    const rt=busRoutes[bus.r];
    const validStops=rt?rt.stops.filter(si=>tiles[si]&&tiles[si].bus):[];
    if(!rt||validStops.length<2){rbuses.splice(i,1);continue;} // 路線被清空/剩不足 2 站→撤車
    if(bus.si>=validStops.length)bus.si=0;                     // 拆站導致索引越界→安全歸零
    if(!inMap(bus.x,bus.y)||!T(idx(bus.x,bus.y)).road){        // 所在路被拆→重生於路線起點
      const s0=validStops[0];bus.x=s0%N;bus.y=(s0/N)|0;bus.si=0;bus.dir=1;bus.path=null;bus.pi=0;bus.p=0;bus.wait=.5;
      continue;
    }
    if(bus.wait>0){bus.wait-=dt;continue;}                     // 到站停 .5s
    if(!bus.path){
      let nsi=bus.si+bus.dir;
      if(nsi<0||nsi>=validStops.length){bus.dir*=-1;nsi=bus.si+bus.dir;} // 到端點→折返
      const gi=validStops[nsi];
      const path=busBFS(bus.x,bus.y,gi%N,(gi/N)|0);
      if(path&&path.length>1){bus.path=path;bus.pi=0;bus.p=0;bus.nsi=nsi;}
      else{bus.dir*=-1;bus.wait=.5;}                            // 斷路無法規劃→就地折返，不崩潰
      continue;
    }
    const ct=T(idx(bus.x,bus.y));
    bus.p+=dt*1.1*(ct&&ct.hw?1.6:1)*(ct&&ct.busLane?1.3:1);
    let guard=0;
    while(bus.p>=1&&guard++<64){
      const nxt=bus.path[bus.pi+1];
      if(!nxt||!inMap(nxt[0],nxt[1])||!T(idx(nxt[0],nxt[1])).road){ // 中途斷路→就地折返，不崩潰
        bus.p=0;bus.path=null;bus.dir*=-1;bus.wait=.5;break;
      }
      bus.p-=1;
      bus.d=busDir(bus.x,bus.y,nxt[0],nxt[1]);
      bus.x=nxt[0];bus.y=nxt[1];bus.pi++;
      if(bus.pi>=bus.path.length-1){                 // 抵達目標站→停靠
        bus.si=bus.nsi;bus.path=null;bus.p=0;bus.wait=.5;
        break;
      }
    }
  }
}

function railDirs(x,y){

  if(inMap(x,y-1)&&(T(idx(x,y-1)).rail||T(idx(x,y-1)).tram))ds.push(0);
  if(inMap(x+1,y)&&(T(idx(x+1,y)).rail||T(idx(x+1,y)).tram))ds.push(1);
  if(inMap(x,y+1)&&(T(idx(x,y+1)).rail||T(idx(x,y+1)).tram))ds.push(2);
  if(inMap(x-1,y)&&(T(idx(x-1,y)).rail||T(idx(x-1,y)).tram))ds.push(3);

}
function listBldK(k){

  for(let i=0;i<N*N;i++){if(tiles[i].dock)dks.push(i);const b=tiles[i].bld;if(b&&!b.ref&&b.k===18)ports++;}
  const target=(ports>0&&dks.length>0)?Math.min(3,ports+1):0;
  while(cargoShips.length<target&&dks.length){ // T64：出生點改在碼頭格（dock 恆為水面，見 canPlace 'dock' 判定），符合「鄰近 dock/port」
    const di=dks[ri(dks.length)];
    cargoShips.push({x:di%N,y:(di/N)|0,d:ri(4),p:Math.random()});
  }
  for(let i=cargoShips.length-1;i>=0;i--){
    const c=cargoShips[i];
    if(!inMap(c.x,c.y)||T(idx(c.x,c.y)).t!==0){cargoShips.splice(i,1);continue;}
    c.p+=dt*.35;if(c.p<1)continue;c.p-=1;
    const nx=c.x+DIRV[c.d][0],ny=c.y+DIRV[c.d][1];
    if(inMap(nx,ny)&&T(idx(nx,ny)).t===0){c.x=nx;c.y=ny;}else c.d=ri(4);
  }
  if(cargoShips.length>target)cargoShips.length=target;
}
/* ---------- T119：服務車輛出勤框架——from（可出車站 sts）/target（候選格 cand）/onArrive（抵達效果）
   三段抽象；救護車邏輯原樣搬入，行為位元不變（同一組 ri() 呼叫順序/次數、同一套移動公式、同一個抵達效果）：
   onArrive 回傳 [tx,ty] 則車輛換下一個目標繼續出勤（垃圾車巡迴用）；回傳假值則車輛消失（救護車/消防車原行為）---------- */
function updDispatch(arr,dt,speed,cap,sts,cand,onArrive){
  const target=sts.length&&cand.length?Math.min(cap,sts.length):0;
  while(arr.length<target&&cand.length){
    const si=sts[ri(sts.length)],ti=cand[ri(cand.length)];
    arr.push({x:si%N,y:(si/N)|0,p:0,tx:ti%N,ty:(ti/N)|0,ticks:0}); // T145：ticks 純觀測計數（到場所需更新次數），未動 si/ti 選擇邏輯本身，RNG 消耗序列不變
  }
  for(let i=arr.length-1;i>=0;i--){
    const c=arr[i];c.ticks++; // T145：每次派遣更新累計 tick 數，供 GV.svcResponseSample 觀測到場延遲差異（純觀測，不消耗 R()）
    let sp=speed;
    const st=T(idx(c.x,c.y));
    if(st&&st.road){ // T145：服務車輛所在格若為道路，比照 T129 過載降速公式同樣折減（load≤cap 時 clamp 內恆為 1，無壅堵逐位元不變）；非道路格（多數行程）不受影響
      const capT=ROAD_CAP[(st.rc||2)-1];
      if(capT>0)sp*=clamp(1-Math.max(0,roadLoad[idx(c.x,c.y)]-capT)/capT*ROAD_JAM_K,.3,1);
    }
    c.p+=dt*sp;if(c.p<1)continue;c.p-=1;
    if(c.x!==c.tx)c.x+=Math.sign(c.tx-c.x);else if(c.y!==c.ty)c.y+=Math.sign(c.ty-c.y);
    if(c.x===c.tx&&c.y===c.ty){
      const nt=onArrive(c);
      if(nt){c.tx=nt[0];c.ty=nt[1];}else arr.splice(i,1);
    }
  }
}
function updAmbulances(dt){
  const sts=listBldK(28);const sick=[];

  updDispatch(ambulances,dt,2.2,2,sts,sick,c=>{

  });
}
// T119：消防車——起火格在消防局(k6)/高級消防(k30)覆蓋內時不再次日瞬滅，改由消防車趕到才撲滅（延遲＝出勤路距，覆蓋外不出車）

// T119：垃圾車——從垃圾場(k8)沿路巡迴（抵達即挑下一個路面點繼續走，持續出勤不消失）
function updGarbageTrucks(dt){
  const sts=listBldK(8);
  const roads=[];
  for(let i=0;i<N*N;i++)if(tiles[i].road)roads.push(i);
  updDispatch(recycleTrucks,dt,1.6,3,sts,roads,()=>{

// T119：住宅沿路距垃圾場(k8)>18 的局部垃圾係數上升——BFS 比照 busBFS 走道路網，每天（tick）重算一次
function computeGarbLocal(){
  const dsrc=[];
  for(let i=0;i<N*N;i++){const b=tiles[i].bld;if(b&&!b.ref&&b.k===8)dsrc.push(i);}
  const dist=new Uint16Array(N*N).fill(9999);
  const q=[];
  for(const di of dsrc){
    const dx0=di%N,dy0=(di/N)|0;
    for(const[dx,dy]of DIRV){
      const nx=dx0+dx,ny=dy0+dy;
      if(inMap(nx,ny)){const j=idx(nx,ny);if(T(j).road&&dist[j]>0){dist[j]=0;q.push(j);}}
    }
  }
  let head=0;
  while(head<q.length){
    const cur=q[head++],d=dist[cur],cx=cur%N,cy=(cur/N)|0;
    for(const[dx,dy]of DIRV){
      const nx=cx+dx,ny=cy+dy;
      if(!inMap(nx,ny))continue;
      const j=idx(nx,ny);
      if(T(j).road&&dist[j]>d+1){dist[j]=d+1;q.push(j);}
    }
  }
  for(let i=0;i<N*N;i++){
    const b=tiles[i].bld;
    if(!b||b.k!==1){garbLocal[i]=0;continue;}
    const x=i%N,y=(i/N)|0;let bd=9999;
    for(const[dx,dy]of DIRV){const nx=x+dx,ny=y+dy;if(inMap(nx,ny)){const j=idx(nx,ny);if(T(j).road)bd=Math.min(bd,dist[j]);}}
    if(bd>18){
      garbLocal[i]=clamp(garbRatio+.3,0,2);
      b.h=clamp(b.h-.045,.05,1);
    }else{
      garbLocal[i]=garbRatio;
    }
  }
}
/* T141：通勤/就業 agent——叢集級近似（比照上方 computeGarbLocal／busBFS 尋路慣例）。tick() 於 day%COMMUTE_PERIOD===0
   時呼叫本函式（其餘天數複用上次快取，避免每 tick 全城 BFS）：
   ①多源 BFS——源＝已完工商業/工業分區建築（k===2 含辦公區/k===3），沿道路網算每一道路格到最近就業區的最短路距
     dist（含 prev 回溯指標），純陣列/佇列運算不消耗 R()；
   ②住宅依 COMMUTE_CELL×COMMUTE_CELL 網格分「叢集」，每叢集僅取首個住宅格為代表，沿 prev 回溯出代表→最近就業區
     的路徑並快取進 commuteClusters（供 tick() 每日複用貢獻 roadPass/commutePass，避免逐棟尋路控制大城效能）；
   ③每格住宅（非僅代表格）依同一 dist 場查最近路口距離，寫入 commutePenalty／commuteUnreach 供 happyParts「通勤」項
     與 judgeWealth 全日讀取（叢集內住宅共用同一批距離場，僅路徑追蹤動作只做一次，非「逐人尋路」）。
   無就業區（dsrc 為空）時提前 return，commutePenalty/commuteUnreach/commuteClusters 皆維持全零／空陣列，
   通勤零效果（硬性不變量：無道路/無就業區時通勤恆零，同種子 30 天位元回歸與基準一致）。*/
function computeCommute(){
  commutePenalty.fill(0);
  commuteUnreach.fill(0);
  commuteClusters.length=0;
  const dsrc=[];
  for(let i=0;i<N*N;i++){const b=tiles[i].bld;if(b&&!b.ref&&(b.k===2||b.k===3))dsrc.push(i);}
  if(!dsrc.length)return; // 無就業區：全部維持零（不變量）
  const dist=new Uint16Array(N*N).fill(9999);
  const prev=new Int32Array(N*N).fill(-1);
  const q=[];
  for(const si of dsrc){
    const sx0=si%N,sy0=(si/N)|0;
    for(const[dx,dy]of DIRV){
      const nx=sx0+dx,ny=sy0+dy;
      if(inMap(nx,ny)){const j=idx(nx,ny);if(T(j).road&&dist[j]>0){dist[j]=0;q.push(j);}}
    }
  }
  let head=0;
  while(head<q.length){
    const cur=q[head++],d=dist[cur],cx=cur%N,cy=(cur/N)|0;
    for(const[dx,dy]of DIRV){
      const nx=cx+dx,ny=cy+dy;
      if(!inMap(nx,ny))continue;
      const j=idx(nx,ny);
      if(T(j).road&&dist[j]>d+1){dist[j]=d+1;prev[j]=cur;q.push(j);}
    }
  }
  const blkPerRow=Math.ceil(N/COMMUTE_CELL);
  const blkSeen=new Uint8Array(blkPerRow*blkPerRow);
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){
    const i=idx(x,y),b=tiles[i].bld;
    if(!b||b.k!==1)continue;
    let bd=9999,broad=-1;
    for(const[dx,dy]of DIRV){
      const nx=x+dx,ny=y+dy;
      if(!inMap(nx,ny))continue;
      const j=idx(nx,ny);
      if(T(j).road&&dist[j]<bd){bd=dist[j];broad=j;}
    }
    if(broad<0||bd>=9999){commuteUnreach[i]=1;commutePenalty[i]=COMMUTE_PEN_UNREACH;}
    else if(bd>COMMUTE_FAR){commutePenalty[i]=Math.min(COMMUTE_PEN_MAX,(bd-COMMUTE_FAR)*COMMUTE_PEN_STEP);}
    const blk=((x/COMMUTE_CELL)|0)*blkPerRow+((y/COMMUTE_CELL)|0); // 叢集鍵：粗網格分塊，塊內首個住宅格為代表
    if(blkSeen[blk])continue;
    blkSeen[blk]=1;
    if(broad<0||bd>=9999)continue; // 代表格本身不可達，該叢集無路徑可貢獻 load（不進 commuteClusters）
    const path=[];
    let c=broad,steps=0;
    while(c!==-1&&steps<600){path.push(c);c=prev[c];steps++;}
    commuteClusters.push({path});
  }
}
// T120：路線覆蓋（半徑3內、多路線不疊加，二值化覆蓋後加總人口）住宅人口——供 updCars 小車生成率折抵；每天（tick）重算一次，不進存檔
function computeBusRtCovPop(){
  if(!busRoutes.some(rt=>rt.stops.length)){busRtCovPop=0;return;}
  const cov=new Uint8Array(N*N);
  for(const rt of busRoutes)for(const si of rt.stops){
    if(!(tiles[si]&&tiles[si].bus))continue;
    const sx=si%N,sy=(si/N)|0;
    for(let dy=-3;dy<=3;dy++){const ny=sy+dy;if(ny<0||ny>=N)continue;
      for(let dx=-3;dx<=3;dx++){const nx=sx+dx;if(nx<0||nx>=N)continue;cov[idx(nx,ny)]=1;}}
  }
  let p=0;
  for(let i=0;i<N*N;i++){
    if(!cov[i])continue;
    const b=tiles[i].bld;
    if(b&&!b.ref&&b.k===1&&b.pw&&!b.sick&&!b.death)p+=Math.round(POPS[b.lv]*(b.den?DEN_POP[b.den-1]:1));
  }
  busRtCovPop=p;
}


// T146：座標決定性雜湊（純函式，不讀寫任何全域狀態、不消耗共用 rand()/R()/ri()，同一 (x,y,salt) 恆回傳同值）——
// 供街道級細節層（人行道邊石/斑馬線/標線/街道小件/停放車/行人）挑選用，避免逐幀重骰造成畫面抖動，也避免污染模擬用的全域亂數流。
function streetHash(x,y,salt){
  let h=(x*374761393+y*668265263+salt*2246822519)|0;
  h=Math.imul(h^(h>>>15),2246822519);
  h=Math.imul(h^(h>>>13),3266489917);
  h^=h>>>16;
  return(h>>>0)/4294967296;
}
const STREET_POPCOUNT=[0,1,1,2,1,2,2,3,1,2,2,3,2,3,3,4]; // T146：road mask（0-15）位元數查表，供判斷路口(>=3)/端點(<=1)/直行段(===2)
// T96：地面層離屏快取。地面層（地形/水/道路/分區覆蓋等）逐格重繪成本最高，但其外觀只取決於
